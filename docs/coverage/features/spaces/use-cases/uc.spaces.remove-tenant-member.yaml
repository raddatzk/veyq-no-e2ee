useCase: uc.spaces.remove-tenant-member
feature: spaces
title: Remove a member from a tenant (with the group orphan rule)
# cr-0091 delivers the removal cascade end-to-end: backend (the removeTenantMember handler + store cascade —
# enumerate the target's tenant footprint, delete shared, orphan transfer-else-tombstone, soft-delete their own
# scopes with membership kept, the tenant last-owner guard) + the web remove action/data layer. Reuses the
# cr-0090 soft-delete/grace/ScopePurge for the target's own scopes. The two-account LIVE smoke (the removed
# member's read-only grace on their own space across two accounts) is tracked in the CR; the owner→member
# remove→drop-out round-trip was verified live (web → real backend → MariaDB).
# cr-0092 closes A4 (the co-shared-group forward-secrecy half): the removal originates a SCOPE_ROTATION job on
# the operator-blind task queue (backend origination + coalescing slice tests) that a remaining key-holder
# completes on-device via the cr-0089 rotation crypto (web scopeRotationWorker + its polling). The three-actor
# forward-secrecy flow (owner-A cuts a member of group G that A doesn't hold → key-holder-B online rotates G
# forward epoch 0→1 → ex-member gone, survivor re-granted) is verified LIVE against a real backend + MariaDB with
# real crypto by scopeRotation.e2e.test.ts (VEYQ_E2E). The SCOPE_ROTATION unauth/non-key-holder boundary used to
# be noted here as covered by ijhttp; http/ was hand-fired IDE tooling that no CI ran and has been deleted
# (ADR 0040) — that boundary is a backend concern and is proven by the backend slice tests.
acceptanceCriteria:
  - id: remove-shared-access
    text: A TenantOwner removes a member → their tenant-scope + co-shared group memberships are deleted (instant 403 on shared content); the tenant content key is NOT rotated (ADR 0025). Owner-gated (403 not_tenant_owner), 404 for a non-member.
    coverage:
      backend: { integration: [MemberRemoveSliceTest.ownerRemovesMemberCutsSharedButKeepsOwnScopeReadable, MemberRemoveSliceTest.nonOwnerForbiddenAndUnknownMemberNotFound, TenantOwnerGateTest.ordinaryMemberWhoOwnsScopesIsRefusedAtEveryOwnerGatedEndpoint, TenantOwnerGateTest.realRootScopeOwnerStillPasses] }
      web: { unit: [src/features/spaces/members.test.ts] }
  - id: orphan-transfer
    text: A group the removed member solely owned that still has other members auto-transfers OWNER to the oldest remaining member (earliest createdAt); the group carries on, the tenant owner never gains access.
    coverage:
      backend: { integration: [MemberRemoveSliceTest.soleOwnedGroupWithMembersTransfersToOldestRemaining] }
  - id: orphan-tombstone
    text: A group the removed member was the only member of is grace-tombstoned (cr-0090 soft-delete → scheduled purge), like a deleted group.
    coverage:
      backend: { integration: [MemberRemoveSliceTest.soloGroupIsGraceTombstonedWithMembershipKept] }
  - id: own-scope-grace-read
    text: The removed member's personal scope (and any solo group) is grace-tombstoned but their membership is KEPT — they retain read-only access to read/export their own memories for the grace window, then ScopePurge erases them.
    coverage:
      backend: { integration: [MemberRemoveSliceTest.ownerRemovesMemberCutsSharedButKeepsOwnScopeReadable, MemberRemoveSliceTest.scopePurgeErasesTheGraceTombstonedOwnScope] }
  - id: last-owner-guard
    text: The last tenant OWNER cannot be removed (a tenant keeps ≥1 owner); the action is rejected (409 last_owner).
    coverage:
      backend: { integration: [MemberRemoveSliceTest.lastTenantOwnerCannotBeRemoved] }
  - id: coshared-group-rotation
    text: >
      A removed member's co-shared GROUPs each queue a SCOPE_ROTATION job on the operator-blind task queue (the
      removing owner isn't necessarily a key-holder there, so can't rotate synchronously — cr-0092); the next online
      remaining key-holder mints E_{n+1} + re-grants the survivors on-device and completes it, restoring forward
      secrecy for new content. Idempotent + coalescing (one live job per scope); NO job for the tenant scope
      (ADR 0025 — ACL-revoke) or the member's own/soft-deleted scopes; a non-key-holder cannot claim it. Closes A4.
    coverage:
      backend: { integration: [MemberRemoveSliceTest.removalQueuesRotationOnlyForCoSharedGroupsNotOwnScopesOrTenant, MemberRemoveSliceTest.queuedRotationClaimableByRemainingKeyHolderOnlyThenCompletionClearsIt, MemberRemoveSliceTest.secondRemovalCoalescesIntoTheOneLiveRotationJob] }
      web: { unit: [src/features/tasks/scopeRotationWorker.test.ts], e2e: [src/features/tasks/scopeRotation.e2e.test.ts] }
  - id: operator-blind
    text: The server only deletes/soft-deletes opaque rows + flips a lifecycle timestamp — never a key or a name; the tenant key is not rotated.
    coverage:
      backend: { integration: [MemberRemoveSliceTest.ownerRemovesMemberCutsSharedButKeepsOwnScopeReadable, MemberRemoveSliceTest.scopePurgeErasesTheGraceTombstonedOwnScope] }
