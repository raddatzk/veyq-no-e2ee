useCase: uc.spaces.manage-group-members
feature: spaces
title: Manage a group's members (promote / demote / remove)
# cr-0088 delivers roles (promote/demote) end-to-end + the remove/rotation backend + slice tests. The web remove
# UI + the client-side rotation crypto (epoch-aware scope open + tree seal) land in cr-0089 ("remove ships with
# rotation"), which fills the web/live side of the remove + rotation criteria.
acceptanceCriteria:
  - id: promote-demote
    text: A GroupOwner promotes a member to co-owner (OWNER) or demotes a co-owner to MEMBER — a pure role change, no key move.
    coverage:
      backend: { integration: [ScopesSliceTest.promoteDemoteAndLastOwnerGuard] }
      web: { unit: [src/features/spaces/members.test.ts] }
      http: { e2e: [http/spaces/scopes.http] }
  - id: last-owner-guard
    text: The last remaining OWNER cannot be demoted or removed; the action is rejected (a group needs ≥1 owner).
    coverage:
      backend: { integration: [ScopesSliceTest.promoteDemoteAndLastOwnerGuard, ScopesSliceTest.removeMemberThenLastOwnerGuard] }
  - id: remove-member
    text: A GroupOwner removes a member → the membership is deleted (instant 403). A non-owner caller is rejected.
    coverage:
      backend: { integration: [ScopesSliceTest.removeMemberThenLastOwnerGuard] }
      http: { e2e: [http/spaces/scopes.http] }
  - id: remove-rotates-forward
    text: Removal rotates the scope content key forward into a new epoch, re-granted only to the remaining members; new content seals under it, so the removed member reads pre-removal content but never post-removal content (even against a malicious operator). (Server side; the client rotation crypto is cr-0089.)
    coverage:
      backend: { integration: [ScopesSliceTest.rotateBumpsEpochAndReGrantsRemaining] }
  - id: operator-blind-rotation
    text: The server sees only role/membership metadata + opaque epoch-chain links, per-member grants, and per-node epoch indices — never a key or a name.
    coverage:
      backend: { integration: [ScopesSliceTest.rotateBumpsEpochAndReGrantsRemaining] }
gaps:
  web: "cr-0088 delivers promote/demote; the remove UI + the client-side rotation crypto (epoch-aware scope open + tree seal, the two-account forward-secrecy smoke) land in cr-0089."
  apple: "Group member management is web-first — not built natively (own CR later), like the rest of the groups epic."
  android: "Group member management is web-first — not built natively (own CR later), like the rest of the groups epic."
