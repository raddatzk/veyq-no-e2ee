useCase: uc.spaces.manage-member-invites
feature: spaces
title: Manage pending member invites (list, re-issue link, revoke)
# Built cr-0082 (backend → http → web) — the management companion to uc.spaces.add-member. add-member is
# additive (ADR 0020), so tracking/re-issuing/revoking the member INVITES it mints lives here, mirroring the
# owner-invite management the Server Owner already has (uc.admin.create-tenant: resend/reassign/revoke, cr-0009).
# Owner-gated throughout; operator-blind (invite metadata only, the secret only re-returned on re-issue, cr-0080).
# Removing a joined member + key rotation are explicitly NOT here (a later slice, ADR 0020/0014).
# The owner-gated happy-path (list/reissue/revoke) needs a
# signed member/owner session not reproducible from a bare .http, so it is proven at the integration layer
# (MemberInviteManagementSliceTest); the .http covers the anonymous-401 boundary/authz.
acceptanceCriteria:
  - id: list-pending-member-invites
    text: The tenant owner lists the tenant's pending (ACTIVE, unexpired) MEMBER invites — each an email + invite status + expiry — beside the joined-member directory. Owner-gated (a non-owner gets 403); operator-blind (only invite metadata the server already stores; never the secret). Consumed/expired invites are not listed.
    coverage:
      backend:
        integration: [MemberInviteManagementSliceTest.ownerListsPendingMemberInvitesOutsiderIs404, MemberInviteManagementSliceTest.manageOnAnUnknownTenantIs404NotFound, TenantOwnerGateTest.ordinaryMemberWhoOwnsScopesIsRefusedAtEveryOwnerGatedEndpoint, TenantOwnerGateTest.realRootScopeOwnerStillPasses]
      web:
        unit: [src/features/spaces/TenantMembersPanel.test.ts]
  - id: reissue-invite-link
    text: The owner re-issues a pending member invite — the server supersedes the current one and mints a fresh single-use secret (the old link dies), returning the new copyable invite link (cr-0080) to the owner-gated caller. Same email, new secret + expiry; works without any mailer.
    coverage:
      backend:
        integration: [MemberInviteManagementSliceTest.reissueSupersedesOldSecretAndMintsAUsableFreshLink, MemberInviteManagementSliceTest.reissueAndRevokeOfAnUnknownInviteAre404]
      web:
        unit: [src/features/spaces/TenantMembersPanel.test.ts]
  - id: revoke-member-invite
    text: The owner revokes a pending member invite — it is soft-transitioned to a terminal state so a later replay of its secret at accept is rejected (invite_no_longer_valid). Additive-safe — it touches no grant and no already-joined member; the reserved email is freed to re-invite. A non-owner is 403.
    coverage:
      backend:
        integration: [MemberInviteManagementSliceTest.revokeMakesTheSecretNoLongerAcceptableAndDropsItFromTheList, MemberInviteManagementSliceTest.reissueAndRevokeOfAnUnknownInviteAre404]
      web:
        unit: [src/features/spaces/TenantMembersPanel.test.ts]
  - id: reissue-delivery-and-rate-limit
    # cr-email-invite-send-hardening: the re-issue path gains the same two hardenings as the initial mint. It
    # reports a first-class delivery result (SENT / FALLBACK_COPYLINK / FAILED, sent after the tx commits, never
    # persisted → operator-blind untouched), and it is rate-limited per-(tenant,recipient) + per-tenant — re-issue
    # is the SHARPEST bombing vector (repeated fresh links to one address), so over the limit is 429 + Retry-After
    # before any fresh mint. The limiter core is the shared, mutation-verified RateLimitWindow (unit-tested in
    # InviteMailRateLimiterTest, listed under uc.spaces.add-member's member-invite-rate-limited).
    text: A re-issue reports its delivery result inline (SENT / FALLBACK_COPYLINK / FAILED) and is rate-limited per-(tenant,recipient) + per-tenant; over the limit it is refused with 429 + Retry-After before any fresh secret is minted, and the web surfaces the sent/copy-link/failed states and the throttle message.
    coverage:
      backend:
        integration: [MemberInviteManagementSliceTest.reissueReportsTheDeliveryResult, MemberInviteManagementSliceTest.reissuingOneRecipientPastTheLimitIs429WithRetryAfter]
      web:
        unit: [src/features/spaces/TenantMembersPanel.test.ts]
  - id: invite-secret-never-logged
    text: The raw invite bootstrap token — a redeemable secret — is never emitted to a log, in any launch mode. Every invite the shared delivery mailer sends (mint, resend, re-issue) logs only non-secret metadata (email + expiry); the secret reaches the invitee via the API response or the opt-in dev-file only. A production runtime logs a secret-free "not delivered" warning instead of the link.
    coverage:
      backend:
        integration: [TenantInviteMailerDevFileTest.neverLogsTheRawBootstrapToken]
