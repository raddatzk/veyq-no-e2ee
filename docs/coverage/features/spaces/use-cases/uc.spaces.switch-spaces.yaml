useCase: uc.spaces.switch-spaces
feature: spaces
title: List & switch spaces
acceptanceCriteria:
  - id: list-tenants
    text: The member's tenants are listed (name + domain + role); someone who belongs to none gets an empty list.
    coverage:
      backend: { integration: [ScopesSliceTest.listMyTenantsReturnsTheCallersTenants] }
      web: { unit: [src/features/spaces/scopes.test.ts] }
      http: { e2e: [http/spaces/scopes.http] }
  - id: list-spaces
    text: GET /api/scopes lists the member's scopes in the active tenant (the TENANT root + their PERSONAL scope).
    coverage:
      backend: { integration: [ScopesSliceTest.createPersonalScopeThenListReturnsBoth] }
      web: { unit: [src/features/spaces/scopes.test.ts] }
      apple: { unit: [apple/Tests/VeyqKitTests/ScopesTests.swift] }
      android: { unit: [android/client/src/test/kotlin/com/veyq/client/ScopesTest.kt] }
  - id: switch-space-by-fragment
    text: A space's position is encoded in + resolved from the URL #fragment client-side (the blind server resolves no path).
    coverage:
      web: { unit: [src/features/memory/location.test.ts] }
  - id: token-less-tenant-default
    text: The token-less fragment (empty/#) resolves to the shared TENANT scope — the default home — and a granted member entering it opens the tenant key (ADR 0019).
    coverage:
      web: { unit: [src/features/memory/location.test.ts, src/app/activeSpace.test.ts, src/components/app/AppSidebar.test.ts] }
  - id: personal-tenant-switch-resets
    text: Flipping the leading fragment token (Personal ↔ Tenant) re-enters the scope — opening its key and resetting the tree + favorites so no stale per-scope state bleeds; the active space is highlighted in the sidebar.
    coverage:
      web: { unit: [src/app/activeSpace.test.ts, src/components/app/AppSidebar.test.ts] }
  - id: no-tenant-grant-fallback
    text: A member holding no TENANT grant falls back to Personal as the effective token-less home (the tenant scope is open-only, never minted client-side), and the tenant entry is flagged unavailable.
    coverage:
      web: { unit: [src/features/spaces/scopes.test.ts, src/app/activeSpace.test.ts] }
  - id: operator-blind-listing
    text: The tenant list exposes only membership metadata (name/domain/role); group names stay sealed and are decrypted on device.
    coverage:
      backend: { integration: [ScopesSliceTest.listMyTenantsReturnsTheCallersTenants] }
  - id: boundary-unauthenticated
    text: The scope endpoints reject an unauthenticated caller with a generic 401.
    coverage:
      backend: { integration: [ScopesSliceTest.unauthenticatedIs401] }
      http: { e2e: [http/spaces/scopes.http] }
  - id: mobile-nav-sheet
    # cr-0084: below the compact threshold the inline nav is CSS-hidden, so a hamburger opens a bottom sheet with
    # the full navigation (ported from the design source; CSS already vendored). Keeps Personal reachable on a phone.
    text: On a narrow viewport a hamburger opens a bottom-sheet with the full navigation — the tenant switch, the Shared + Personal spaces, and favorites; each item navigates and closes the sheet.
    coverage:
      web: { unit: [src/components/app/AppSidebar.test.ts] }
gaps:
  apple: "Scope data layer covered (ScopesTests); the tenant switcher (my-tenants), per-space UI switching, and the token-less tenant home + Personal ↔ Tenant switching (cr-0075) are web-first — not built natively."
  android: "Scope data layer covered (ScopesTest); the tenant switcher (my-tenants), per-space UI switching, and the token-less tenant home + Personal ↔ Tenant switching (cr-0075) are web-first — not built natively."
