useCase: uc.sharing.share-public-viewer
feature: sharing
title: Share a Memory as a public viewer link (web)
# Built (web vertical, cr-0100 + ADR 0029): a public VIEWER share of one personal-scope Memory —
# symWrap(K_share, K_mem), the key in the URL fragment, an unguessable 256-bit shareId, an unauthenticated
# resolve + gated presigned blob reads, soft (L1) revoke/expiry, and the operator-served-viewer trust-tier
# honesty carried by a footer link. The six criteria are covered by the backend slice (create -> anonymous
# resolve -> gated blob -> revoke/expiry -> subtree isolation), the http guest-boundary assertions, and the web
# unit round-trip of the operator-blind decrypt path. apple/android stay gaps — sharing is web-first, native is
# parity (a later CR), so it is not a criterion of this use-case. v1 scope is deliberately narrow: personal-scope
# Memories, VIEWER role only; contributor/uploader, password protection, group/tenant sharing, persisted-shares
# and notices are separate later slices.
acceptanceCriteria:
  - id: create-public-share
    text: A curator turns one of their personal-scope Memories into a public share — the client generates a random K_share, computes symWrap(K_share, K_mem), re-seals the Memory name under K_share, and POSTs { nodeId, role VIEWER, wrap, sealedName, expiresAt? }. The server mints a 256-bit unguessable shareId and stores the record opaquely; it never sees K_share, K_mem, or the name. The link is /s/{shareId}#k=base64url(K_share) with the key in the fragment.
    coverage:
      backend:
        integration: [ShareSliceTest.createThenAnonymousResolveReturnsSealedSubtree, ShareSliceTest.listReturnsCallersSharesForTheMemory]
      http:
        e2e: [http/sharing/sharing.http]
      web:
        unit: [src/features/memory/share.test.ts]
  - id: anonymous-resolve-decrypt
    text: GET /api/shares/{shareId} is unauthenticated and returns the record plus the sealed subtree (Memory node + chapters + media metadata, all under K_mem). The viewer unwraps K_mem with the fragment key and decrypts names/layout/metadata locally, rendering the Memory read-only. The shareId alone is inert — without the fragment key nothing decrypts; both halves are required.
    coverage:
      backend:
        integration: [ShareSliceTest.createThenAnonymousResolveReturnsSealedSubtree, ShareSliceTest.unknownShareResolves404]
      web:
        unit: [src/features/memory/share.test.ts]
  - id: gated-blob-read
    text: A share-scoped blob endpoint authorizes a read iff the blob is attached under the shared subtree (a structural check on opaque ids), returns a presigned store URL, and the viewer fetches bytes directly from the object store. The operator never learns which media a viewer opens. A cross-share/out-of-subtree blob id is 404.
    coverage:
      backend:
        integration: [ShareSliceTest.gatedBlobAllowsInSubtreeAnd404sOutOfSubtree]
      http:
        e2e: [http/sharing/sharing.http]
  - id: soft-revoke-and-expiry
    text: enabled=false or a passed expiresAt makes the resolve AND the gated blob endpoint 404 (same shape as an unknown id — non-enumerable). There is no content-key rotation for a viewer share; content a visitor already downloaded is not retractable (stated limitation).
    coverage:
      backend:
        integration: [ShareSliceTest.revokeMakesGuestPaths404, ShareSliceTest.expiredShareResolves404]
      web:
        unit: [src/features/memory/share.test.ts]
  - id: least-privilege-personal-only
    text: A share exposes only that one Memory subtree — K_mem is random and independently wrapped, so the link reveals neither K_SC (the rest of the scope) nor any sibling Memory's K_mem (crypto-enforced least privilege, ADR 0012). Only a MEMORY node is shareable (a folder is rejected 422). This use-case's v1 was personal-scope only; group/tenant Memories became shareable in cr-0104 (uc.sharing.share-shared-scope), gated on scope membership.
    coverage:
      backend:
        integration: [ShareSliceTest.resolveLeaksNothingOutsideTheSubtree, ShareSliceTest.folderNodeIsRejected]
      web:
        unit: [src/features/memory/share.test.ts]
  - id: operator-blind-and-tier-honesty
    text: The server stores only shareId, the wrap, the plaintext role, the K_share-sealed name, and nodeId — never K_share/K_mem/names/viewer/which-media. The no-install viewer is operator-served web (passive-operator-safe, not operator-proof against an active foreign operator); this is surfaced honestly via a footer link to veyq's security documentation, not an explicit in-viewer warning. Self-hosted (operator = curator) makes the gap moot.
    coverage:
      backend:
        integration: [ShareSliceTest.createThenAnonymousResolveReturnsSealedSubtree, ShareSliceTest.createRequiresAuth]
      http:
        e2e: [http/sharing/sharing.http]
      web:
        unit: [src/features/memory/share.test.ts]
gaps:
  apple: "Sharing is web-first — a later native CR, like the rest of the feature epics. (A native curator can create/list/revoke; the anonymous viewer is inherently the no-install web page.)"
  android: "Sharing is web-first — a later native CR, like the rest of the feature epics."
