useCase: uc.sharing.share-note
feature: sharing
title: Share note — a curator attaches an editable message to a share
# cr-0115 (ADR 0036) delivers it end-to-end: contracts (sealedNote + sealedShareKey on create, sealedNote on
# resolve/summary, a new owner-gated updateShare) → backend (two nullable TEXT columns on veyq_share, updateNote
# owner-gated) → web (share.ts seal/recover/read + updateShareNote, the ShareDialog note field + in-place editor,
# the ShareView note banner reusing the cr-0114 markdown renderer). The note seals under K_share (AAD share-note);
# a K_mem-recoverable sealed_share_key lets the curator edit it in place — operator-blind (K_share never in the
# clear). Backend slice tests run over the full HTTP stack; the note lifecycle is hermetic there (it needs the
# grant flow + client crypto), and sharing.http asserts the updateShare auth wall. Native is web-first (later CR).
acceptanceCriteria:
  - id: curator-sets-note-at-creation
    text: When creating a share, the curator may attach an optional note; the client seals it under K_share (AAD share-note) and stores it alongside sealed_share_key = symWrap(K_mem, K_share). A share with no note stores nothing and shows no banner.
    coverage:
      backend: { integration: [ShareNoteSliceTest.createWithNoteThenAnonymousResolveReturnsIt, ShareNoteSliceTest.createWithoutNoteResolvesNullAndTheManageListCarriesTheRecoverableKey] }
      web: { unit: [src/features/memory/share.test.ts] }
  - id: note-shown-and-rendered-on-share-page
    text: The anonymous resolveShare returns sealedNote; the share page unwraps it with the fragment K_share and renders it as markdown (safe subset) — a banner for VIEWER/CONTRIBUTOR, the instruction above the name field for UPLOADER.
    coverage:
      backend: { integration: [ShareNoteSliceTest.createWithNoteThenAnonymousResolveReturnsIt] }
      web: { unit: [src/features/memory/share.test.ts] }
  - id: note-editable-in-place
    text: The curator edits an existing share's note without a new link — recover K_share from sealed_share_key, re-seal, call the owner-gated updateShare (PATCH); the same shareId then shows the new note. A non-owner edit is a 404; a blank clears it.
    coverage:
      backend: { integration: [ShareNoteSliceTest.ownerEditsTheNoteInPlaceAtTheSameShareId, ShareNoteSliceTest.editingWithNullClearsTheNote, ShareNoteSliceTest.aNonOwnerEditIs404AndLeavesTheNoteUnchanged] }
      web: { unit: [src/features/memory/share.test.ts] }
      http: { e2e: [http/sharing/sharing.http] }
  - id: operator-blind
    text: The server stores only ciphertext — sealed_note (opaque) + sealed_share_key (openable only with K_mem, which the operator lacks); K_share is never stored in the clear, and updateShare swaps one ciphertext for another. No key or plaintext crosses the boundary (ADR 0036).
    coverage:
      backend: { integration: [ShareNoteSliceTest.createWithoutNoteResolvesNullAndTheManageListCarriesTheRecoverableKey] }
      web: { unit: [src/features/memory/share.test.ts] }
gaps:
  apple: "Not built. The share note (editor + share-page render) is Apple's own later CR (web-first, ADR 0010); the generated data layer carries the fields after regen."
  android: "Not built. The share note (editor + share-page render) is Android's own later CR (web-first, ADR 0010); the generated data layer carries the fields after regen."
