useCase: uc.sharing.share-password
feature: sharing
title: Password-protect a share (a leaked link alone isn't enough)
# Built (web, cr-0118 + ADR 0037): an optional password as an operator-blind ACCESS-CONTROL gate (not a crypto
# gate) — the content stays E2EE under the unchanged K_share fragment; the password gates what the server serves,
# reusing the contributorToken shape. Client derives pwToken = Argon2id(pw, pw_salt) and pw_verifier =
# SHA-256(pwToken); the server stores password_required + pw_salt + pw_verifier + sealed_password
# (= symWrap(K_share, pw), management-only reveal) and never the raw password. A locked resolve (no token) serves
# only { passwordRequired, pw_salt }; a valid token serves the full share; a wrong token is 403. Set/change/remove
# in place via updateShare (tri-state), same link. Honest limit: defends a leaked link against an HONEST operator,
# not a malicious one (documented, matches the passive-operator-safe web viewer).
acceptanceCriteria:
  - id: create-and-locked-resolve
    text: A curator sets a password on a share (at create, or added later). The client derives pwToken = Argon2id(pw, pw_salt) + pw_verifier = SHA-256(pwToken) and seals sealed_password = symWrap(K_share, pw); it POSTs password_required + pw_salt + pw_verifier + sealed_password — never the raw password. A guest GET with NO token returns a LOCKED PublicShare carrying only passwordRequired + pw_salt; wrap / sealedName / sealedNote / nodes / media / identities are omitted — nothing readable without the password.
    coverage:
      backend:
        integration: [SharePasswordSliceTest.createThenLockedResolveHidesTheContent]
      web:
        unit: [src/features/memory/share.test.ts]
  - id: unlock-and-gate-endpoints
    text: A guest presents X-Share-Password base64(pwToken); the server checks SHA-256(pwToken) == pw_verifier -> the full share (valid) or 403 share_password_incorrect (wrong). The gate fronts every guest endpoint - the gated blob GET requires the token when password_required (404/403 without it), and so do the four guest WRITE endpoints (create-identity, blob-uploads, complete-media, delete-media - cr-0164), each before its role/token check so no token -> non-enumerable 404, wrong token -> 403; an UPLOADER drop-box (whose only capability is writing) is therefore password-protected too.
    coverage:
      backend:
        integration: [SharePasswordSliceTest.validTokenUnlocksAndWrongTokenIs403, SharePasswordSliceTest.blobGetRequiresThePasswordToken, SharePasswordWriteGateTest.contributorWritePathIsPasswordGated, SharePasswordWriteGateTest.uploaderWritePathIsPasswordGated]
  - id: brute-force-bound
    text: Online password guessing is bounded per share on WRONG attempts (cr-0165, ADR 0037) - not per IP, since a proxy collapses a share's anonymous guests to one address. Each wrong token spends one token of a per-shareId bucket (ADR 0052); over the cap the guest gets 429 rate_limited instead of the 403 oracle. Guess throughput is what bounds the attack, so gradual refill costs nothing there. A correct password is admitted before the bucket is touched (a legitimate guest is never locked out) and a tokenless challenge-fetch never spends budget; one share's exhausted budget does not block another; the bound rides all six passwordCheck sites, so a guest WRITE op inherits it too. The blind server cannot verify password strength (it sees only SHA-256(pwToken)), so this per-share bound is the guarantee it can make on its own; the 10-char minimum is a client-side convention.
    coverage:
      backend:
        integration: [SharePasswordAttemptBoundTest.nWrongAttemptsThen429_perShare, SharePasswordAttemptBoundTest.missingTokenNeverConsumesBudget, SharePasswordAttemptBoundTest.perShareAxis_oneExhaustedShareDoesNotBlockAnother, SharePasswordAttemptBoundTest.writePathInheritsTheBound]
  - id: edit-and-reveal-in-place
    text: The password is set / changed / removed in place via owner-gated updateShare (tri-state passwordRequired - true sets/changes with a fresh salt+verifier+sealed copy, false removes and clears the fields, omitted leaves it untouched) - the same link keeps working (K_share/the fragment untouched). The curator reveals the current password by recovering K_share via K_mem and opening sealed_password, which the manage list carries (never served to a guest).
    coverage:
      backend:
        integration: [SharePasswordSliceTest.setChangeRemoveViaUpdateShareKeepsTheLink, SharePasswordSliceTest.manageListCarriesSealedPasswordForReveal]
      web:
        unit: [src/features/memory/share.test.ts]
  - id: operator-blind
    text: The server stores only password_required (coarse metadata) + pw_salt + pw_verifier (a SHA-256 of the client-side Argon2id token, so a DB leak still costs an Argon2id-per-guess) + sealed_password (ciphertext under K_share); it never sees the raw password (the client sends Argon2id(pw), not pw) or content. It is an ACCESS-CONTROL gate, not cryptographic - it defends a leaked link against an honest operator, not a malicious one (who could bypass the check and serve ciphertext to a colluder holding the fragment) - the same posture as the passive-operator-safe web viewer (ADR 0026). Stated honestly.
    coverage:
      backend:
        integration: [SharePasswordSliceTest.createThenLockedResolveHidesTheContent, SharePasswordSliceTest.manageListCarriesSealedPasswordForReveal]
      web:
        unit: [src/features/memory/share.test.ts]
