useCase: uc.admin.tenant-mail-settings
feature: admin
title: Tenant mail settings — the owner configures per-tenant SMTP + the invite template
# cr-email-smtp-transport (ADR 0048/0049/0050) delivers the owner-config half: contracts
# (getTenantMailSettings/updateTenantMailSettings on the tenants spec) → backend (veyq_tenant_mail_settings +
# an owner-gated CRUD that seals the SMTP password at rest, an InviteMailRenderer over a closed variable set, and
# an SmtpTenantInviteMailer behind the existing TenantInviteMailer port) → infra (a Mailpit dev container under
# the opt-in `mail` profile). Backend slice tests run over the full HTTP stack (H2); the real SMTP send is proven
# hermetically against an in-JVM GreenMail server. The web settings UI (SMTP + the template editor) is a deferred
# follow-up slice — a tenant owner configures via the API/seed for now — so `web` stays a gap.
acceptanceCriteria:
  - id: owner-configures-per-tenant-smtp
    text: The tenant owner sets SMTP host/port/from/username/password/TLS + enabled as runtime settings, owner-gated (isOwner) — a non-owner member is refused (403 not_tenant_owner), a non-member is 404 (indistinguishable, ADR 0042). The password is write-only (a read exposes only passwordSet; it is never returned or logged).
    coverage:
      backend:
        integration: [TenantMailSettingsSliceTest.ownerConfiguresSmtpAndThePasswordIsWriteOnly, TenantMailSettingsSliceTest.nonOwnerMemberIsForbidden, TenantMailSettingsSliceTest.aNonMemberIs404]
  - id: password-sealed-at-rest
    text: The SMTP password is sealed at rest under the operator env KEK (AES-256-GCM, ADR 0050) — the stored columns hold only ciphertext + nonce, never the plaintext input; omitting the password on a later update keeps the stored one rather than clearing it.
    coverage:
      backend:
        integration: [TenantMailSettingsSliceTest.theSmtpPasswordIsSealedAtRestNotPlaintext, TenantMailSettingsSliceTest.omittingThePasswordOnUpdateKeepsTheStoredOne]
  - id: invite-template-closed-variable-set
    text: The owner-authored subject/body template is rendered over a closed, non-secret variable set ({{link}}/{{domain}}/{{expiry}} only); veyq's machinery interpolates nothing sealed, and a template referencing any other {{tag}} is rejected at write time (400 invalid_mail_template) and never stored (ADR 0048 §6, ADR 0049).
    coverage:
      backend:
        unit: [InviteMailRendererTest.theRenderContextIsClosedToExactlyThreeNonSecretFields, InviteMailRendererTest.rejectsTagsOutsideTheClosedSet, InviteMailRendererTest.theShippedDefaultsAreContentFreeAndValid]
        integration: [TenantMailSettingsSliceTest.aTemplateOutsideTheClosedVariableSetIsRejectedAndNotStored, SmtpInviteMailSendTest.aConfiguredTenantSendsARenderedInviteCarryingOnlyTheClosedSet]
  - id: unconfigured-falls-back-to-copy-link
    text: With no SMTP configured, sending disabled, or the KEK absent, a member invite falls back to today's copy-link + dev-file path unchanged — member-add works without any mail infrastructure (self-hostable by default).
    coverage:
      backend:
        integration: [SmtpInviteMailSendTest.anUnconfiguredTenantSendsNoSmtpAndFallsBack]
        unit: [TenantInviteMailerDevFileTest.appendsOneJsonLinePerInviteWhenDevFileSet]
gaps:
  web: "Deferred: a web settings UI for SMTP + the invite-template editor is a follow-up slice (a tenant owner configures via the API/seed for now). No web coverage claim yet."
