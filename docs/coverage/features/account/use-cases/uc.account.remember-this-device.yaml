useCase: uc.account.remember-this-device
feature: account
title: Sign in & remember this device (web — one screen, one toggle)
# Implemented on web by cr-0054 (ADR 0005 §17-21): the combined login/unlock screen, the single "remember me"
# toggle, auto-enrol, and the password-less DEVICE_KEY wrap — superseding cr-0052's two overlapping checkboxes +
# local Master-Key cache. Criteria carry the module/backend test refs that exercise each mechanism; the
# end-to-end three-state screen adaptivity is confirmed by the live browser smoke recorded in cr-0054.
acceptanceCriteria:
  - id: one-screen-adaptive
    text: Web shows one screen that asks only what the device still needs — email+password+Secret Key on the first sign-in, email+password once a wrap exists, and nothing on a remembered device.
    coverage:
      web:
        unit:
          - src/features/account/unlock/unlock.test.ts
          - src/features/account/unlock/unlock.device.test.ts
          - src/features/account/rememberMe/deviceKeyWrap.test.ts
  - id: remember-off-enrols-device-wrap
    text: With "remember me" off, a successful first unlock auto-enrols a password-bound DEVICE wrap; the next launch unlocks with the password only (no Secret Key).
    coverage:
      web:
        unit:
          - src/features/account/trustDevice/trustDevice.test.ts
          - src/features/account/unlock/unlock.device.test.ts
  - id: remember-on-enrols-passwordless-wrap
    text: With "remember me" on, first unlock auto-enrols a password-less device-key wrap + a persisted session cookie; the next launch opens straight in.
    coverage:
      backend:
        integration: [LoginSliceTest.rememberLoginSetsHttpOnlyRefreshCookieAndOmitsBodyToken, LoginSliceTest.refreshViaCookieRotatesAndOmitsBodyToken]
      web:
        unit:
          - src/features/account/rememberMe/deviceKeyWrap.test.ts
          - src/features/account/login/login.test.ts
  - id: secret-key-once-per-device
    text: The Secret Key is read only on the first unlock per device (to create the wrap) and never stored.
    coverage:
      web:
        unit:
          - src/features/account/unlock/unlock.device.test.ts
          - src/features/account/rememberMe/deviceKeyWrap.test.ts
  - id: no-public-device-level
    text: There is no "remember nothing" level on web; a genuinely untrusted machine uses a private/incognito window. A stolen device + its password DEVICE wrap is useless without the password.
    coverage:
      web:
        unit:
          - src/features/account/trustDevice/trustDevice.test.ts
          - src/features/account/unlock/unlock.device.test.ts
  - id: new-passwordless-wrap-method
    text: The password-less wrap uses a NEW MasterKeyWrap.Method (DEVICE_KEY — device key alone, no password/KDF, iv in kdfParams), distinct from the password-mixing DEVICE method, served like any interactive wrap and removable so re-enrol replaces.
    coverage:
      backend:
        integration: [AccountWrapsSliceTest.addDeviceKeyWrapRidesNormalKeyMaterial, AccountWrapsSliceTest.deleteRemovesDeviceKeyWrap]
      web:
        unit: [src/features/account/rememberMe/deviceKeyWrap.test.ts]
  - id: operator-blind-unchanged
    text: The server holds only ciphertext wraps + an opaque cookie token; it never gains the KEK, Master Key, Secret Key, or password.
    coverage:
      backend:
        integration: [AccountKeyMaterialSliceTest.validTokenReturnsCallersMaterial, AccountWrapsSliceTest.addDeviceKeyWrapRidesNormalKeyMaterial]
      web:
        unit: [src/features/account/rememberMe/deviceKeyWrap.test.ts]
gaps:
  apple: N/A — web-only flow; native keeps the uc.account.set-device-security chooser (richer — password-less or
    biometric). Whether native also collapses to a single toggle is ADR 0005 §21 "to be worked out".
  android: N/A — web-only flow; native keeps the uc.account.set-device-security chooser.
