useCase: uc.memory.live-updates
feature: memory
title: Live media updates — others' adds/removes surface into the open gallery
status: planned
# Refined (ADR 0033): an open Memory gallery reflects other members'/contributors' media adds + removes live, and
# re-opens are cheap. Mechanism: a per-node media_revision counter (bumped on attach/meta-edit/delete, NOT cover)
# → an ETag conditional GET on listNodeMedia (304 when unchanged); on change a keyset delta (media newer than the
# client's (updatedAt,id) cursor, so an active upload streams new items, never a full re-list) + the current
# mediaId set for delete-reconcile. Short-poll, tab-visibility-gated, only while a Memory is open. Operator-blind
# (opaque counter + opaque ids). NOT BUILT — pending cr-0107.
acceptanceCriteria:
  - id: cheap-unchanged-check
    text: listNodeMedia is a conditional GET keyed on the node's media_revision (an opaque counter, bumped on every gallery-media mutation but NOT on a cover change); a poll/re-open whose revision matches gets a 304 with no body and no media query server-side — so an unchanged gallery costs an O(1) counter compare, not a full list.
  - id: keyset-delta-on-change
    text: On a revision change the server returns only media with updated_at past the client's (updatedAt, mediaId) cursor — a keyset delta, not the whole list — so an active upload by another member streams the few new items each poll. The client upserts by mediaId and advances the cursor. Requires a new veyq_media.updated_at (= created_at at attach, bumped on meta edit).
  - id: delete-reconcile
    text: A change response also carries the node's current mediaId set; the client drops any cached id no longer present. Because it is the set (not a count), a removal AND a net-zero delete+add are both caught. The id-set is returned only on a revision change, never scanned per idle poll.
  - id: live-auto-insert
    text: While a Memory is open, the client short-polls (visibility-gated — pauses when the tab is hidden, ticks once immediately on return, stops on close); new media auto-inserts as tiles into the open grid and removed media drops out, with no manual reload, reusing the optimistic-tile grid + mergeItems reconcile.
  - id: operator-blind-live
    text: The server sees only an opaque revision counter, opaque mediaIds, coarse timestamps, and the poll access-pattern it already sees on reads — never content, never a key. No new operator-visible signal; K_mem/K_share never touch the server.
gaps:
  backend: "Not built — pending cr-0107. New node.media_revision column + media.updated_at; bump on attach/meta-edit/delete (exclude cover); listNodeMedia gains If-None-Match/304, a since-cursor keyset delta, and the current-id-set on 200; slice tests."
  web: "Not built — pending cr-0107. A mediaRevisionPolling loop (mirroring grantDeliveryPolling: interval + visibility gate) wired into MemoryDetail; cache the revision + cursor; on 304 skip, on delta upsert + drop reconciled removals; unit tests + a live smoke."
  http: "Not built — pending cr-0107. ijhttp coverage for the conditional GET (304 vs 200 + delta)."
  apple: "Live updates are web-first — native parity is a deferred catch-up (platform-parity)."
  android: "Live updates are web-first — native parity is a deferred catch-up (platform-parity)."
