useCase: uc.memory.browse
feature: memory
title: Browse & organize the Memory tree (shell)
acceptanceCriteria:
  - id: open-personal-scope
    text: After unlock the client opens (auto-births if absent) the personal scope → the scope content key K_SC.
    coverage:
      backend: { integration: [ScopesSliceTest.createPersonalScopeThenListReturnsBoth] }
      web: { unit: [src/features/spaces/scopes.test.ts] }
      apple: { unit: [apple/Tests/VeyqKitTests/ScopesTests.swift] }
      android: { unit: [android/client/src/test/kotlin/com/veyq/client/ScopesTest.kt] }
  - id: list-and-decrypt-tree
    text: The whole tree is listed as opaque rows and names are decrypted on device under K_SC; the level is assembled client-side.
    coverage:
      backend: { integration: [NodesSliceTest.createTreeThenList] }
      web: { unit: [src/features/memory/tree.test.ts, src/features/memory/browse.test.ts] }
      apple: { unit: [apple/Tests/VeyqKitTests/ContentTreeTests.swift] }
      android: { unit: [android/client/src/test/kotlin/com/veyq/client/ContentTreeTest.kt] }
  - id: client-side-breadcrumb
    text: The breadcrumb + current level are derived client-side from the local tree (the blind server computes no navigation).
    coverage:
      web: { unit: [src/features/memory/browse.test.ts, src/features/memory/location.test.ts] }
      apple: { unit: [apple/Tests/VeyqKitTests/MemoryBrowseTests.swift] }
  - id: create-folder-and-memory
    text: Creating a folder/Memory seals the name + blinded slug under K_SC and POSTs only ciphertext (a Memory births its random K_mem).
    coverage:
      backend: { integration: [NodesSliceTest.createTreeThenList] }
      web: { unit: [src/features/memory/tree.test.ts, src/features/memory/components/MemoryBrowse.test.ts, src/features/memory/components/NodeMutationDialog.test.ts] }
      apple: { unit: [apple/Tests/VeyqKitTests/ContentTreeTests.swift] }
      android: { unit: [android/client/src/test/kotlin/com/veyq/client/ContentTreeTest.kt] }
  - id: rename-and-delete-subtree
    text: Rename re-seals the name + recomputes the slug; delete removes the node and its whole subtree.
    coverage:
      backend: { integration: [NodesSliceTest.renameThenDeleteSubtree] }
      web: { unit: [src/features/memory/tree.test.ts] }
      apple: { unit: [apple/Tests/VeyqKitTests/ContentTreeTests.swift] }
      android: { unit: [android/client/src/test/kotlin/com/veyq/client/ContentTreeTest.kt] }
  - id: slug-collision-rejected
    text: A name whose blinded slug already exists under the parent is rejected (UNIQUE(parentId, slugToken), 409) — deterministic slug.
    coverage:
      backend: { integration: [NodesSliceTest.slugCollisionPerParentIs409] }
      web: { unit: [src/features/memory/slugify.test.ts] }
  - id: illegal-structure-rejected
    text: A CHAPTER cannot live at a folder level (it belongs inside a Memory); the server rejects it (422).
    coverage:
      backend: { integration: [NodesSliceTest.chapterAtRootIs422] }
  - id: authz-boundary
    text: A non-member of the scope gets 404; an unauthenticated caller gets a generic 401.
    coverage:
      backend: { integration: [NodesSliceTest.nonMemberIs404, NodesSliceTest.unauthenticatedIs401] }
      http: { e2e: [http/content/content.http] }
gaps:
  apple: "Shell UI built (cr-0034, compiles on iOS + macOS) over the covered data layer; browse logic is unit-covered (MemoryBrowseTests). A live UITest round-trip + favorites/settings/switcher are pending."
  android: "Native data layer covered (ContentTreeTest/ScopesTest); the shell UI (breadcrumb, cards, dialogs) is web-first (cr-0030) — not built natively yet."
