useCase: uc.memory.buckets
feature: memory
title: Buckets — group a Memory's media by who contributed it
# Built by cr-0113 (contracts → backend → http → web), oriented on legacy ADR 0023. A bucket = a per-uploader
# container within one Memory, the attribution axis orthogonal to Chapters: a real veyq_bucket table keyed by an
# opaque owner_key ("user:{id}" | "share:{shareIdentityId}"), a lazy virtual primary + one-level sub-buckets,
# K_mem-sealed names, media linked via a nullable bucket_id + a denormalized created_by; reparent-on-delete +
# own-bucket authz (the deliberate reversals of the pre-E2EE code). The web ships the read-only "Beiträge" primary-
# grouping tab; the sub-bucket MANAGEMENT UI, a camera filter, and batch selection are later slices. Native is
# web-first (ADR 0010). A full live "Beiträge"-tab click-through is pending a session with the dev backend up.
acceptanceCriteria:
  - id: uploader-stamp-on-media
    text: Every uploaded medium carries an operator-visible uploader stamp — a member's created_by = owner_key "user:{id}" XOR a contributor's "share:{shareIdentityId}" — set at attach and returned by the per-node media list (ownerKey/bucketId), so a client can group. A medium with no member stamp (a pre-cr0113 owner upload) is lazily backfilled to the owner's primary at list time.
    coverage:
      backend:
        integration: [MediaBucketsSliceTest.uploadStampsOwnerKeyAndMaterializesPrimary]
      http:
        e2e: [http/media/buckets.http]
      web:
        unit: [src/features/memory/media.buckets.test.ts]
  - id: derived-primary-buckets
    text: A Memory's buckets are materialized lazily via find-or-create on (node_id, owner_key) — exactly one primary per uploader, virtual until that uploader has at least one medium. Primary uniqueness is enforced procedurally under the transaction (no DB partial index in the H2 ∩ MariaDB subset).
    coverage:
      backend:
        integration: [MediaBucketsSliceTest.uploadStampsOwnerKeyAndMaterializesPrimary, MediaBucketsSliceTest.createSubBucketMoveThenDeleteReparents]
  - id: sub-bucket-endpoints
    text: Sub-buckets sit one level under a primary (parent must be primary), owner inherited, K_mem-sealed name; the backend exposes create/rename/delete/move endpoints; delete reparents the sub-bucket's media to the owner's primary and never deletes media, primaries are not deletable; all of create/rename/delete/move are server-gated to owner_key == caller.
    coverage:
      backend:
        integration: [MediaBucketsSliceTest.createSubBucketMoveThenDeleteReparents, MediaBucketsSliceTest.renameSubBucketUpdatesSealedName, MediaBucketsSliceTest.ownBucketAuthzRejectsForeignRenameAndDelete, MediaBucketsSliceTest.primaryBucketNotRenameableNorDeletable]
      web:
        unit: [src/features/memory/media.buckets.test.ts]
  - id: contributions-tab-primary-grouping
    text: A "Beiträge" tab lists the Memory's uploaders by their primary bucket (with per-bucket counts); selecting one filters the existing MediaGrid + lightbox to that uploader. Bucket names are unsealed under K_mem client-side (a contributor's sealed name; a member's the per-tenant username), an unsealable name falling back to a neutral placeholder. Read-only grouping; the sub-bucket management UI is deferred.
    coverage:
      web:
        unit: [src/features/memory/media.buckets.test.ts]
  - id: operator-blind-buckets
    text: Grouping and ownership run over the opaque owner_key + the bucket structure (node, parentage, is_primary, counts) the operator already relays; names are unsealed client-side and a wrong AAD context can never open one. The operator never learns a cleartext bucket/uploader name nor any content, and a personal Memory with no share exposes only the account owner's owner_key.
    coverage:
      backend:
        integration: [MediaBucketsSliceTest.listBucketsByNonMemberIs404]
      web:
        unit: [src/features/memory/media.buckets.test.ts]
gaps:
  backend: "Built (cr-0113). V35 veyq_bucket + veyq_media.bucket_id/created_by; BucketEntity; store ensurePrimaryBucket/listBuckets/createSubBucket/renameBucket/deleteBucketReparent/moveMedia; attach stamps created_by/bucket_id; BucketsResource with own-bucket authz + reparent-on-delete; MediaBucketsSliceTest (6). media.share_identity_id left untouched (redundant with created_by for contributors)."
  http: "Built (cr-0113). buckets.http asserts the 401 auth boundary of the five endpoints; the authenticated happy-path + own-bucket authz are at MediaBucketsSliceTest (the scope-grant flow isn't reproducible from a bare .http, per trash.http)."
  web: "Built (cr-0113). media.ts bucket wrappers (listBuckets/createBucket/renameBucket/deleteBucket/moveBucketMedia) + openBucketName unseal; the MediaItem gained ownerKey/bucketId; the read-only Beiträge tab in MemoryDetail.vue (uploader picker → client-side grouping/unseal → the filtered MediaGrid/lightbox). media.buckets.test.ts unit-tests the unseal + wrappers; a full live Beiträge-tab click-through is pending the dev backend. The sub-bucket management UI is the next slice."
  apple: "Not built. Native buckets are Apple's own later CR (web-first, ADR 0010); the data layer carries ownerKey/bucketId + the bucket endpoints after regen."
  android: "Not built. Native buckets are Android's own later CR (web-first, ADR 0010); the data layer carries ownerKey/bucketId + the bucket endpoints after regen."
