useCase: uc.memory.place
feature: memory
title: Curate a Memory's place — one sealed, named location
# Web-complete. Place reuses the node's `wrappedMeta` blob (shipped for the date, cr-0067) and adds a `location`
# sub-object `{ name, nameSource, derived (medoid), derivedMode, nameAnchor{lat,lng,level} }` — sealed under K_mem,
# set via the same partial updateNode, returned on listNodes. Deliberate set-up (never silent), a mandatory name,
# position = the MEDOID of the media GPS, reverse-only opt-in geocoding (client-direct, Nominatim reference, ADR
# 0016), and a per-folder-subtree "Karte" view plotting every located Memory/Chapter from listNodes without loading
# media (cr-0071). Native place/map UI is each platform's own later CR (web-first, ADR 0010); the group consent
# state-machine + a blind gazetteer remain prose gaps (own CRs), not unref'd criteria.
acceptanceCriteria:
  - id: sealed-location-on-node
    text: A MEMORY/CHAPTER node's `wrappedMeta.location` carries ONE named place — name (mandatory, except a pending auto place) + nameSource (geocoded|manual) + derived {lat,lng} + derivedMode (fixed|auto) + nameAnchor {lat,lng,level} — sealed under K_mem in the same client-versioned blob as the date (no contract change), set via the partial updateNode and returned on listNodes. The operator-blind server never sees a coordinate or a place name.
    coverage:
      backend: { integration: [NodesSliceTest.wrappedMetaRoundTripsAndPartialUpdateLeavesItUnchanged] }
      web:
        unit:
          - src/features/memory/memoryLocation.test.ts
          - src/features/memory/memoryDate.test.ts
          - src/features/memory/components/MemoryDetail.test.ts
  - id: deliberate-set-location
    text: A location is created only by a deliberate "set location" act (on Memory open, or pre-armed at Memory creation with a mandatory fallback name + derivedMode auto); there is no empty-name / unnamed-pin state (no name ⇒ no location). Setup never happens silently on upload.
    coverage:
      web:
        unit:
          - src/features/memory/components/MemoryLocationEditor.test.ts
          - src/features/memory/components/NodeMutationDialog.test.ts
          - src/features/memory/components/MemoryDetail.test.ts
  - id: medoid-position
    text: The position `derived` is the MEDOID of the Memory's media GPS — the actual photo minimizing the summed Haversine distance to the others (robust to an outlier), never the arithmetic mean — so it never lands in the sea and barely moves as media are added. `derivedMode` defaults to auto on set-with-media (re-medoids as media are added) and flips to fixed when the user moves the MAP by hand (the centre crosshair becomes the position — "Karte verschieben"); fixed is a frozen snapshot. GPS is read from the always-listed capture tier (promoted alongside `capturedAt`, like cr-0066), so the medoid and every auto re-medoid are list-level — no per-item EXIF fetch; no backfill, so legacy media without the tier do not contribute.
    coverage:
      web:
        unit:
          - src/features/memory/memoryLocation.test.ts
          - src/features/memory/components/MemoryDetail.test.ts
  - id: name-manual-or-reverse-geocoded
    text: The name is independent of the position — either typed by hand (nameSource manual, frozen) or picked from the reverse-geocoded ADDRESS HIERARCHY (road…country; the user chooses the granularity `level`, e.g. Straße › Viertel › Stadt › Land; nameSource geocoded, may refresh at the stored level when the auto medoid moves). Position (move the map) and granularity (pick the level) are separate levers; a pending auto place gets both from the first geotagged media; if geocoding stays off the name is typed, blind.
    coverage:
      web:
        unit:
          - src/features/memory/geocode.test.ts
          - src/features/memory/memoryLocation.test.ts
          - src/features/memory/components/MemoryLocationEditor.test.ts
  - id: reverse-only-veyq-blind-geocoding
    text: Geocoding is reverse-only and opt-in; the request goes client-direct to the provider (never through the veyq backend), carries no veyq identity (a bare coordinate), and sits behind a provider-neutral seam reverse(lat,lng,lang)->level[] (the address hierarchy; reference Nominatim, operator-configurable, off-until-configured — ADR 0016). Opt-in is standing consent (may auto-resolve on the first geotagged media at a default level); it never fires without opt-in, and a member who declined sees a name another member resolved without any request.
    coverage:
      web:
        unit:
          - src/features/memory/geocode.test.ts
          - src/shared/state/useMapConfig.test.ts
          - src/features/memory/components/MemoryLocationEditor.test.ts
  - id: tenant-map-via-listnodes
    text: A "Karte" browse view mode shows every located Memory/Chapter in the current folder's subtree (the whole space at the scope root) as a clickable pin, read from each node's sealed `location` via listNodes (unsealed client-side under its own K_mem, no media load, no locations endpoint — a location endpoint would leak coordinates to the operator). On the map ⟺ a coordinate; a location ⟺ a name; a pending auto place (no `derived`) is not pinned; a pin click opens that Memory. Each pin shows the node's explicit `cover` (uc.memory.cover, cr-0072) cropped by the shared display formula — no cover ⇒ the placeholder (retiring the cr-0071 nearest-media stopgap). Map tiles are a separate opt-in/self-host seam (ADR 0018), reused from the editor. (cr-0071; per-folder-subtree, more contextual than always space-wide. Native map parity is a separate later CR.)
    coverage:
      web:
        unit:
          - src/features/memory/spaceMap.test.ts
          - src/features/memory/memoryCover.test.ts
          - src/features/memory/components/SpaceMap.test.ts
          - src/features/memory/components/MemoryBrowse.test.ts
          - src/features/memory/components/ViewModeToggle.test.ts
gaps:
  backend: "Slice 2a done (cr-0068): GPS is promoted into the always-listed media metadata tier — the two listed tiers (`wrappedLayout` + `wrappedCapturedAt`) are consolidated into one `wrapped_meta` blob (geometry + capture time + GPS) sealed under K_mem (migration V18, no backfill), so the medoid can read GPS list-level without a per-item fetch; round-tripped by MediaSliceTest (complete→list + PUT `/meta`→list). The node's `location` itself round-trips inside the opaque node `wrappedMeta` (cr-0067) — no further backend change. Remaining: nothing at the backend level; the medoid + name are client-side (slice 2b)."
  web: "Slice 2b done (cr-0069): the node-meta seal is now read-modify-write (shared `nodeMeta.ts` over `{v,date?,location?}`), so setting a location preserves the sibling date (and vice-versa). `memoryLocation.ts` adds the `location` model + the medoid (min summed Haversine, sea-outlier-resistant), `geocode.ts` the reverse-only client-direct seam (off-until-configured), `useMapConfig.ts` the coupled two-stage tiles+geocoding opt-in (ADR 0016/0018, public OSM/Nominatim default, env/localStorage override). UI is intent-first: a Leaflet `MemoryMap` (fixed centre crosshair — move the map, the centre is the place — + faint photo dots), a `MemoryLocationEditor` (opens on the medoid with a follows-your-photos pill; moving the map by hand flips to fixed with a one-tap follow-again; the name is picked from the reverse-geocoded address-hierarchy `level` or typed; quiet remove), a detail-header location chip + open-time/post-upload self-heal (re-medoid + refresh the geocoded name at the stored level), and a create-dialog single opt-in (follows-your-photos toggle arming a pending auto place). All unit-tested with real v1 crypto + a stubbed map/geocode. Slice 2c done (cr-0071): a third **Karte** browse view mode (`useViewMode` gains `map`, `ViewModeToggle` a browse-only third button) renders a read-only `SpaceMap` (Leaflet, N clickable pins, `fitBounds`, name tooltips) fed by `spaceMap.collectLocatedPins` — every located MEMORY/CHAPTER in the current folder's subtree (whole space at root), unsealed on device from the `wrappedMeta` listNodes already returns (no locations API), behind the same ADR 0018 tiles opt-in; a pin click opens that Memory. cr-0072 retired the `pinCover` nearest-media stopgap: each pin's cover source is now the node's explicit `cover.mediaId` (uc.memory.cover), resolved via `loadNodeCover` + cropped by the shared `coverImageStyle` formula, so the pin matches the card. Remaining (deferred, own CRs, web-first per ADR 0010): native map parity; the group consent state-machine + tenant language (ADR 0016); an on-device blind gazetteer."
  apple: "Not built. Data layer carries `wrappedMeta` after regen; native place/map UI is Apple's own later CR (web-first, ADR 0010). The OS geocoder is not a blind option."
  android: "Not built. Data layer carries `wrappedMeta` after regen; native place/map UI is Android's own later CR (web-first, ADR 0010). The OS geocoder is not a blind option."
  http: "The `location` folds into the existing createNode / updateNode / listNodes (an extra opaque field in the same node `wrappedMeta`). The listed media metadata tier gaining GPS landed with cr-0068 (the `wrappedMeta` merge; no dedicated http media file exists — the media contract is exercised at the backend integration + web levels). Covered at the contract level once the set-location CR (2b) lands."
