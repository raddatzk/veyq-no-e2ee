useCase: uc.memory.gallery
feature: memory
title: Open a Memory & browse its gallery
# The web gallery UI is built (cr-0049): MemoryDetail (grid + header) + MediaLightbox (preview, prev/next,
# download) over the ready three-tier data layer (en.memory.derivatives). The data-path criteria carry refs on
# every surface (the cr-0045/0047/0048 data layer) plus the web render tests; the apple/android gallery UI
# render stays a gap (web-first, ADR 0010 — their galleries are their own later CRs).
acceptanceCriteria:
  - id: thumbnail-grid
    text: Opening a Memory lists its media and renders a thumbnail grid (each thumbnail fetched as ciphertext and decrypted on device under K_mem). The grid is the Gallery tab of a tabbed detail view (Gallery / Chapters, cr-0061).
    coverage:
      backend: { integration: [MediaSliceTest.derivativesRoundTripWithOwnWraps] }
      web: { unit: [src/features/memory/media.test.ts, src/features/memory/components/MemoryDetail.test.ts] }
      apple: { unit: [apple/Tests/VeyqKitTests/MediaTests.swift, apple/Tests/VeyqKitTests/NativeMediaDeriverTests.swift] }
      android: { unit: [android/client/src/test/kotlin/com/veyq/client/MediaTest.kt, android/app/src/androidTest/kotlin/com/veyq/app/media/AndroidMediaDeriverTest.kt] }
  - id: lightbox-preview
    text: Opening an item shows its preview (not the multi-MB original) full-view, with prev/next paging the grid order.
    coverage:
      backend: { integration: [MediaSliceTest.derivativesRoundTripWithOwnWraps] }
      web: { unit: [src/features/memory/media.test.ts, src/features/memory/components/MediaLightbox.test.ts] }
      apple: { unit: [apple/Tests/VeyqKitTests/MediaTests.swift, apple/Tests/VeyqKitTests/NativeMediaDeriverTests.swift] }
      android: { unit: [android/client/src/test/kotlin/com/veyq/client/MediaTest.kt, android/app/src/androidTest/kotlin/com/veyq/app/media/AndroidMediaDeriverTest.kt] }
  - id: download-original
    text: An explicit download fetches the pristine, full-resolution original (the only byte-identical copy).
    coverage:
      backend: { integration: [MediaSliceTest.startCompleteListRoundTrip], e2e: [BlobBatchE2ETest.uploadThenDownloadRoundTripsBytes] }
      web: { unit: [src/features/memory/media.test.ts, src/features/memory/components/MediaLightbox.test.ts, src/features/memory/download.test.ts] }
      apple: { unit: [apple/Tests/VeyqKitTests/MediaTests.swift] }
      android: { unit: [android/client/src/test/kotlin/com/veyq/client/MediaTest.kt] }
  - id: favorite-toggle
    text: The header toggle pins/unpins the Memory (operator-blind, via en.memory.favorites).
    coverage:
      web: { unit: [src/app/favoritesStore.test.ts, src/features/memory/favorites.test.ts] }
  - id: operator-blind-fetch
    text: Every tier (thumbnail/preview/original) is fetched as ciphertext via presigned GET and decrypted on device; the server sees no pixel, filename, or content key.
    coverage:
      backend: { integration: [MediaSliceTest.derivativesRoundTripWithOwnWraps, MediaSliceTest.mediaWithoutDerivativesListsEmptyTiers] }
      web: { unit: [src/features/memory/media.test.ts, src/features/memory/components/MemoryDetail.test.ts, src/features/memory/components/MediaLightbox.test.ts] }
      apple: { unit: [apple/Tests/VeyqKitTests/MediaTests.swift] }
      android: { unit: [android/client/src/test/kotlin/com/veyq/client/MediaTest.kt] }
  - id: justified-grid-sealed-dimensions
    text: The web grid is laid out justified (aspect-preserving rows that fill the width); each media's layout tier (wrappedLayout {v,w,h} geometry, cr-0064 generalizing cr-0059's dimensions) is sealed under K_mem at upload and unwrapped on device to drive the layout, so the blind server never sees pixel dimensions. Media without a sealed layout fall back to a default aspect.
    coverage:
      backend: { integration: [MediaSliceTest.startCompleteListRoundTrip, MediaSliceTest.mediaWithoutDerivativesListsEmptyTiers] }
      web:
        unit:
          - src/features/memory/mediaGridLayout.test.ts
          - src/features/memory/media.test.ts
          - src/features/memory/components/MemoryDetail.test.ts
  - id: lightbox-exif-detail
    text: Opening an item lazily fetches its sealed EXIF tier (wrappedExif) via the meta endpoint — kept out of the list so it stays constant-small — and unwraps it on device under K_mem to show the detail (capture date, camera, lens, focal length, aperture, exposure, ISO, dimensions, coordinates). The blind server never sees any EXIF field; an item without sealed EXIF shows a no-detail message (cr-0064).
    coverage:
      backend: { integration: [MediaSliceTest.startCompleteListRoundTrip, MediaSliceTest.mediaMetaWithoutExifIsNull, MediaSliceTest.mediaMetaForUnknownMediaIs404] }
      web:
        unit:
          - src/features/memory/media.test.ts
          - src/features/memory/components/MediaLightbox.test.ts
  - id: date-sorted-grid
    text: The gallery sorts tiles by effective capture time (newest first by default, a header toggle for oldest first; undated media last). Each media's capturedAt is sealed under K_mem in its own always-listed tier (wrappedCapturedAt {v,capturedAt,capturedAtOverride}, cr-0066) — the derived original is the EXIF DateTimeOriginal or the file's creation date, so the blind server never sees a timestamp yet the grid can order client-side. A lightbox correction re-sorts without a refetch.
    coverage:
      backend: { integration: [MediaSliceTest.startCompleteListRoundTrip, MediaSliceTest.updateCapturedAtOverwritesSealedTierAndLists] }
      web:
        unit:
          - src/features/memory/media.test.ts
          - src/features/memory/components/MemoryDetail.test.ts
  - id: lightbox-correct-capturedat
    text: From the lightbox a user can correct (or set) a media's capture time; the correction is sealed under K_mem inside wrappedExif as capturedAtOverride alongside the immutable extracted original, re-sealed client-side and PUT verbatim (updateMediaMeta) — the blind server never sees the date. The panel shows the effective time (override ?? original) with a "corrected" indicator and can reset to the original; a media with no EXIF can have a date set (cr-0065).
    coverage:
      backend: { integration: [MediaSliceTest.updateCapturedAtOverwritesSealedTierAndLists, MediaSliceTest.updateCapturedAtForUnknownMediaIs404] }
      web:
        unit:
          - src/features/memory/media.test.ts
          - src/features/memory/components/MediaLightbox.test.ts
gaps:
  web: "Gallery UI built (cr-0049): MemoryDetail (grid + header: decrypted title, item count, favorite toggle; thumbnail tile per item; E1 icon tile for a non-derivable item; E3 empty state; E2 unavailable when K_mem is absent) + MediaLightbox (preview tier, prev/next clamped at the ends, Esc/close, download the original under a derived operator-blind name) over the covered data layer (cr-0045). cr-0059 replaced the uniform square grid with the design source's justified-rows layout (mediaGridLayout) driven by each media's E2EE-sealed dimensions (sealed under K_mem at upload, unwrapped on device); dimensionless media fall back to a default aspect. Component tests round-trip a listed Memory → grid + lightbox + download with real v1 crypto and a mocked mediaApi/blob transport. The remaining gap is the live browser smoke (Canvas/<video> decode + presigned store) — driven manually per the CR done-gate."
  apple: "Data layer covered (cr-0047): on-device tier generation + role-tagged read-back, unit-tested with a stubbed deriver, plus a manual live ImageIO/AVFoundation round-trip. The gallery grid/lightbox detail UI is not built yet (cr-0034 shell open-hook exists; the native gallery is its own later CR)."
  android: "Data layer covered (cr-0048): on-device tier generation via the `:app` deriver behind the `:client` MediaDeriver seam + role-tagged read-back, unit-tested in `:client:test` with a stubbed deriver, plus an on-emulator property test of the real deriver and a manual live round-trip. The gallery grid/lightbox detail UI is not built yet (cr-0039 shell open-hook exists; the native gallery is its own later CR)."
