useCase: uc.memory.cover
feature: memory
title: Memory cover — a chosen, cropped cover shown everywhere
# Built web-first across two slices. The cover reuses the node's `wrappedMeta` blob (date cr-0067, location cr-0069)
# and adds a `cover` sub-object `{ source (media mediaId | upload blob ref), crop{x,y,width,height} 0..1 }`, sealed
# under K_mem, set via the same partial updateNode, returned on listNodes. Deliberate pick (no auto-cover), one
# normalized crop shown identically on the browse card, the detail header, and the map pin. cr-0072 built the
# existing-media source (web, no backend); cr-0073 added the new-upload source — a standalone cover blob
# (contract + backend + web) committed with no `veyq_media` row. Native cover parity is a later per-surface CR.
acceptanceCriteria:
  - id: sealed-cover-on-node
    text: A MEMORY/CHAPTER node's `wrappedMeta.cover` carries ONE cover — a source (an existing media `mediaId`, or a standalone uploaded blob ref) + a `crop {x,y,width,height}` normalized to 0..1 of the source image — sealed under K_mem in the same client-versioned blob as the date + location (no contract change for the media source), set via the partial updateNode and returned on listNodes. The operator-blind server never sees which image or the crop.
    coverage:
      web:
        unit:
          - src/features/memory/memoryCover.test.ts
        e2e:
          - src/features/memory/memoryCover.e2e.test.ts
  - id: deliberate-no-auto-cover
    text: A cover exists only by a deliberate pick (choose a media, or upload a cover image); there is no auto-cover. Unset ⇒ the placeholder (the soft-accent images tile) shows on every surface. A dangling source (the chosen media was deleted) falls back to the placeholder, never a broken card/pin.
    coverage:
      web:
        unit:
          - src/features/memory/memoryCover.test.ts
          - src/features/memory/components/MemoryCoverImage.test.ts
          - src/features/memory/components/MemoryCard.test.ts
  - id: one-crop-everywhere
    text: One stored normalized crop renders identically at any container size — the browse card, the detail header, and the map pin — via one shared display formula (expand the decrypted thumbnail inside an overflow-hidden box + offset by the crop). No per-surface crop, no cropped-image upload for the existing-media source.
    coverage:
      web:
        unit:
          - src/features/memory/memoryCover.test.ts
          - src/features/memory/components/MemoryCoverImage.test.ts
          - src/features/memory/components/MemoryCard.test.ts
    text: A Memory photo becomes the cover in ONE click from the gallery lightbox ("Set as cover") — a default centre-crop (full-frame → object-fit cover, never distorted), the lightbox staying OPEN so the user keeps browsing, the button marking the current cover; browsing existing media stays in the gallery (scales to any count), never a modal grid. The crop EDITOR (header) crops one source — an uploaded image OR the current cover re-framed — in a fixed 16:9 viewport with drag-to-pan + zoom (1–3×), hand-rolled (no crop library); Save normalizes the pan/zoom back to the 0..1 crop and seals it; Remove clears the cover; reopening an existing cover restores its pan/zoom.
    coverage:
      web:
        unit:
          - src/features/memory/components/MemoryCoverDialog.test.ts
          - src/features/memory/components/MediaLightbox.test.ts
  - id: cover-from-standalone-upload
    text: The cover may be a brand-new uploaded image that is NOT registered as a Memory media — a standalone cover blob committed to the node (no `veyq_media` row), sealed under a K_blob wrapped by K_mem, served + garbage-collected via the blob transport; operator-blind (the server holds ciphertext + an opaque blob id for retention/authz only). (cr-0073.)
    coverage:
      backend:
        integration: [NodeCoverSliceTest.commitAttachesCoverBlobWithNoMediaRow, NodeCoverSliceTest.replaceReclaimsPriorCoverBlob, NodeCoverSliceTest.deleteCoverBlobDetachesAndReclaims, NodeCoverSliceTest.deleteNodeReclaimsCoverBlob, NodeCoverSliceTest.coverOnFolderIsIllegalTarget, NodeCoverSliceTest.crossScopeUploadIs404, NodeCoverSliceTest.nonMemberIs404]
      http:
        e2e: [http/media/cover.http]
      web:
        unit: [src/features/memory/media.test.ts, src/features/memory/memoryCover.test.ts, src/features/memory/components/MemoryCoverDialog.test.ts]
        # live smoke DONE (cr-0073, not scripted): re-seeded 127.0.0.1 instance + Garage --profile s3, browse origin
        # 127.0.0.1:8089 = store public endpoint. Uploaded a new image into a media-less Memory → blob-uploads-batch
        # → PUT /veyq → commitCoverBlob → downloaded back; cropped cover rendered on the detail header + browse card;
        # DB: node cover_blob_id + cover_byte_size (downscaled), wrapped_meta ciphertext (no plaintext leak), 0
        # veyq_media rows, 1 veyq_blob; remove reclaimed it (cover_blob_id NULL, veyq_blob 0).
gaps:
  backend: "Built (cr-0073). The existing-media cover (cr-0072) rides the opaque node `wrappedMeta` (`updateNode`/`listNodes`) with no backend change; cr-0073 added the standalone **cover blob** — `commitCoverBlob`/`deleteCoverBlob` + a `cover_blob_id`/`cover_byte_size` column on `veyq_node` (V19), committed with no `veyq_media` row, served over the existing ADR 0013 presigned transport, reclaimed on replace + `deleteCoverBlob` + node-delete cascade. Operator-blind: the node row holds only the opaque blob id + size, never the crop/key. `NodeCoverSliceTest` green. The deferred unreferenced-blob sweep (ADR 0013 §3) widens to cover blobs (crash-safety backstop, not built here)."
  http: "Boundary built (cr-0073): `http/media/cover.http` asserts the 401 unauthenticated boundary of both cover-blob endpoints. The authenticated round-trip (upload → commit → download), replace/delete reclaim, node-delete cascade and authz negatives are not reproducible from a bare `.http` (they need client-side AEAD sealing + presigned direct-to-store + the scope-grant flow) — covered at the integration layer (`NodeCoverSliceTest`), exactly as the media transport (en.memory.media) and `content.http` split responsibilities."
  web: "Built (cr-0072 media + cr-0073 upload). `memoryCover.ts` — the sealed `{ source (media|upload), crop }` model (`normalizeMemoryCover` backward-compatible with the cr-0072 flat `{mediaId}` seal, `unsealMemoryCover`, `setMemoryCover` read-modify-write beside the date/location, `sameMemoryCover`, the pure `coverImageStyle` formula, `loadNodeCover` branching media→`openGrid` / upload→`openBlob`); `media.ts` `uploadCoverBlob` (downscale → seal → `startBlobUploads` → PUT → `commitCoverBlob`) + `deleteCoverBlob`; `MemoryCoverImage.vue` (one crop at any size, or the placeholder); `MemoryCoverDialog.vue` (crops an upload OR the current cover to re-frame, in a hand-rolled 16:9 pan/zoom viewport filling the dialog width; **no in-modal media picker**). A Memory photo becomes the cover in one click via the lightbox's **\"Set as cover\"** (`MediaLightbox` `setCover` → `MemoryDetail.onCoverSave` sets it with a full-frame centre-crop; the lightbox stays open + marks the current cover), so it scales to any photo count; `coverImageStyle` renders a full-frame crop as `object-fit: cover` (no distortion). Wired into the detail header, the browse card, and the map pin (retiring the cr-0071 `pinCover` stopgap). MemoryDetail reclaims a superseded upload blob when switching away."
  apple: "Not built. Native cover picker/crop + display (incl. the upload source) is Apple's own later CR (web-first, ADR 0010). The data layer carries `wrappedMeta.cover` + the cover-blob endpoints after regen."
  android: "Not built. Native cover picker/crop + display (incl. the upload source) is Android's own later CR (web-first, ADR 0010). The data layer carries `wrappedMeta.cover` + the cover-blob endpoints after regen."
