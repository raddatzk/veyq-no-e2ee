useCase: uc.memory.cover
feature: memory
title: Memory cover — a chosen, cropped cover shown everywhere
status: planned
# Refined, not yet built. The cover reuses the node's `wrappedMeta` blob (date cr-0067, location cr-0069) and adds a
# `cover` sub-object `{ source (mediaId | standalone blob), crop{x,y,width,height} 0..1 }`, sealed under K_mem, set
# via the same partial updateNode, returned on listNodes. Deliberate pick (no auto-cover), one normalized crop shown
# identically on the browse card, the detail header, and the map pin. cr-0072 builds the existing-media source
# (web, no backend); the new-upload source (a standalone cover blob — contract + backend) is cr-0073. The acceptance
# criteria pin what each slice must satisfy; every surface is a gap until they land.
acceptanceCriteria:
  - id: sealed-cover-on-node
    text: A MEMORY/CHAPTER node's `wrappedMeta.cover` carries ONE cover — a source (an existing media `mediaId`, or a standalone uploaded blob ref) + a `crop {x,y,width,height}` normalized to 0..1 of the source image — sealed under K_mem in the same client-versioned blob as the date + location (no contract change for the media source), set via the partial updateNode and returned on listNodes. The operator-blind server never sees which image or the crop.
    coverage:
      web:
        unit:
          - src/features/memory/memoryCover.test.ts
        e2e:
          - src/features/memory/memoryCover.e2e.test.ts
  - id: deliberate-no-auto-cover
    text: A cover exists only by a deliberate pick (choose a media, or upload a cover image); there is no auto-cover. Unset ⇒ the placeholder (the soft-accent images tile) shows on every surface. A dangling source (the chosen media was deleted) falls back to the placeholder, never a broken card/pin.
    coverage:
      web:
        unit:
          - src/features/memory/memoryCover.test.ts
          - src/features/memory/components/MemoryCoverImage.test.ts
          - src/features/memory/components/MemoryCard.test.ts
  - id: one-crop-everywhere
    text: One stored normalized crop renders identically at any container size — the browse card, the detail header, and the map pin — via one shared display formula (expand the decrypted thumbnail inside an overflow-hidden box + offset by the crop). No per-surface crop, no cropped-image upload for the existing-media source.
    coverage:
      web:
        unit:
          - src/features/memory/memoryCover.test.ts
          - src/features/memory/components/MemoryCoverImage.test.ts
          - src/features/memory/components/MemoryCard.test.ts
  - id: pick-and-crop-editor
    text: The cover editor picks one image (a Memory media, or an upload) and crops it in a fixed 16:9 viewport with drag-to-pan + zoom (1–3×), hand-rolled (no crop library); Save normalizes the pan/zoom back to the 0..1 crop and seals it; Remove clears the cover; reopening an existing cover restores its pan/zoom.
    coverage:
      web:
        unit:
          - src/features/memory/components/MemoryCoverDialog.test.ts
  - id: cover-from-standalone-upload
    text: The cover may be a brand-new uploaded image that is NOT registered as a Memory media — a standalone cover blob committed to the node (no `veyq_media` row), sealed under a K_blob wrapped by K_mem, served + garbage-collected via the blob transport; operator-blind (the server holds ciphertext + an opaque blob id for retention/authz only). (cr-0073.)
gaps:
  web: "Existing-media cover built (cr-0072): `memoryCover.ts` (the sealed `{mediaId, crop}` model — `normalizeCoverCrop`/`normalizeMemoryCover` clamp-on-image, `unsealMemoryCover`, `setMemoryCover` read-modify-write beside the date/location, `sameMemoryCover`, the pure `coverImageStyle` display formula, and `loadNodeCover` on-device thumbnail resolve), `MemoryCoverImage.vue` (one crop rendered at any container size, or the placeholder), `MemoryCoverDialog.vue` (media picker + hand-rolled 16:9 pan/zoom crop, ported from `legacy/frontend-noe2ee`), wired into the detail header (a preview + `Cover festlegen`/`bearbeiten` button), the browse card, and the map pin — retiring the cr-0071 `pinCover` nearest-media stopgap. The new-upload source (`cover-from-standalone-upload`) is cr-0073 (a standalone cover blob — contract + backend + web), still a gap; hence `status: planned` stays until that slice lands."
  apple: "Not built. Native cover picker/crop + display is Apple's own later CR (web-first, ADR 0010). The data layer carries `wrappedMeta.cover` after regen."
  android: "Not built. Native cover picker/crop + display is Android's own later CR (web-first, ADR 0010). The data layer carries `wrappedMeta.cover` after regen."
