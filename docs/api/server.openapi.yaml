---
openapi: 3.1.0
info:
  title: veyq Server API
  version: 0.2.0
  description: API-first target contract for server-level settings and administration metadata.
servers:
- url: "/"
security:
- accessTokenCookie: []
tags:
- name: Server
paths:
  "/api/settings/server":
    get:
      tags:
      - Server
      summary: Server-Einstellungen abrufen
      description: |-
        Liefert serverweite Einstellungen und Feature-Schalter fuer den Administrationsbereich.

        Vorbedingungen:
        - Ein gueltiger VEYQ_ACCESS_TOKEN Cookie muss vorhanden sein.
        - Das initiale Setup muss abgeschlossen sein.
        - Der aktuelle Benutzer muss ServerOwner sein.

        Implementierungsstatus: partial.
      operationId: getServerSettings
      x-implementation-status: partial
      x-preconditions:
      - Ein gueltiger VEYQ_ACCESS_TOKEN Cookie muss vorhanden sein.
      - Das initiale Setup muss abgeschlossen sein.
      - Der aktuelle Benutzer muss ServerOwner sein.
      x-required-role: ServerOwner
      responses:
        '200':
          "$ref": "#/components/responses/ServerSettings"
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
        '403':
          "$ref": "./common.openapi.yaml#/components/responses/403"
components:
  securitySchemes:
    accessTokenCookie:
      type: apiKey
      in: cookie
      name: VEYQ_ACCESS_TOKEN

  responses:
    ServerSettings:
      description: Server settings
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ServerSettingsResponse"
          example:
            displayName: veyq
            userManagementAvailable: true
            license:
              edition: COMMUNITY
              license: AGPL-3.0-only
              sourceUrl: https://github.com/raddatzk/veyq
              noticeUrl: https://github.com/raddatzk/veyq/blob/main/NOTICE
              trademarkPolicyUrl: https://github.com/raddatzk/veyq/blob/main/docs/legal/trademark-policy.md
              commercialBoundaryUrl: https://github.com/raddatzk/veyq/blob/main/docs/legal/commercial-boundary.md
              version: 0.1.0
              revision: sha-unknown

  schemas:
    ServerSettingsResponse:
      type: object
      additionalProperties: false
      required:
      - displayName
      - userManagementAvailable
      - license
      properties:
        displayName:
          type: string
          description: Anzeigename des Servers.
          examples:
          - veyq
        userManagementAvailable:
          type: boolean
          description: Gibt an, ob die Benutzerverwaltung fuer den aktuellen Server verfuegbar ist.
          examples:
          - true
        license:
          "$ref": "#/components/schemas/ServerLicenseSummary"
        support:
          "$ref": "#/components/schemas/ServerSupportSummary"
      example:
        displayName: veyq
        userManagementAvailable: true
        license:
          edition: COMMUNITY
          license: AGPL-3.0-only
          sourceUrl: https://github.com/raddatzk/veyq
          noticeUrl: https://github.com/raddatzk/veyq/blob/main/NOTICE
          trademarkPolicyUrl: https://github.com/raddatzk/veyq/blob/main/docs/legal/trademark-policy.md
          commercialBoundaryUrl: https://github.com/raddatzk/veyq/blob/main/docs/legal/commercial-boundary.md
          version: 0.1.0
          revision: sha-unknown

    ServerLicenseSummary:
      type: object
      additionalProperties: false
      required:
      - edition
      - license
      - sourceUrl
      - noticeUrl
      - trademarkPolicyUrl
      - commercialBoundaryUrl
      properties:
        edition:
          type: string
          enum:
          - COMMUNITY
          description: Edition der laufenden veyq-Instanz.
        license:
          type: string
          description: SPDX-Lizenzkennung der Community Edition.
          examples:
          - AGPL-3.0-only
        sourceUrl:
          type: string
          format: uri
          description: Link zum passenden Quellcode der laufenden Instanz.
        noticeUrl:
          type: string
          format: uri
          description: Link zu Projekt- und Markenhinweisen.
        trademarkPolicyUrl:
          type: string
          format: uri
          description: Link zur veyq Trademark Policy.
        commercialBoundaryUrl:
          type: string
          format: uri
          description: Link zur Community-/Commercial-Grenze.
        version:
          type: string
          description: Optional gesetzte veyq-Version.
        revision:
          type: string
          description: Optional gesetzte Build- oder Commit-Revision.

    ServerSupportSummary:
      type: object
      additionalProperties: false
      required:
      - url
      properties:
        url:
          type: string
          format: uri
          description: Freiwilliger Spenden- oder Support-Link fuer veyq.
