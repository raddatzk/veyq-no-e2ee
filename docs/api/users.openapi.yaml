---
openapi: 3.1.0
info:
  title: Lunva Users API
  version: 0.1.0
  description: >-
    API-first Zielvertrag fuer Lunva Users API. Operationen enthalten Beispiele, Vorbedingungen und den aktuellen Implementierungsstatus.
servers:
- url: "/"
security:
- accessTokenCookie: []
tags:
- name: Users
paths:
  "/api/users/me":
    get:
      tags:
      - Users
      operationId: me
      responses:
        '200':
          "$ref": "#/components/responses/SimpleUser"
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
      summary: Aktuellen Benutzer abrufen
      x-implementation-status: partial
      x-preconditions:
      - Ein gueltiger LUNVA_ACCESS_TOKEN Cookie muss vorhanden sein.
      - Das initiale Setup muss abgeschlossen sein.
      description: |-
        Aktuellen Benutzer abrufen.

        Vorbedingungen:
        - Ein gueltiger LUNVA_ACCESS_TOKEN Cookie muss vorhanden sein.
        - Das initiale Setup muss abgeschlossen sein.

        Implementierungsstatus: partial.
    put:
      tags:
      - Users
      operationId: updateMySettings
      requestBody:
        "$ref": "#/components/requestBodies/UpdateUserSettings"
      responses:
        '200':
          "$ref": "#/components/responses/SimpleUser"
        '400':
          "$ref": "./common.openapi.yaml#/components/responses/400"
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
        '409':
          "$ref": "./common.openapi.yaml#/components/responses/409"
      summary: Eigene Benutzer-Einstellungen aktualisieren
      x-implementation-status: partial
      x-preconditions:
      - Ein gueltiger LUNVA_ACCESS_TOKEN Cookie muss vorhanden sein.
      - Das initiale Setup muss abgeschlossen sein.
      description: |-
        Eigene Benutzer-Einstellungen aktualisieren.

        Vorbedingungen:
        - Ein gueltiger LUNVA_ACCESS_TOKEN Cookie muss vorhanden sein.
        - Das initiale Setup muss abgeschlossen sein.

        Implementierungsstatus: partial.
  "/api/users/me/email/confirm":
    post:
      tags:
      - Users
      operationId: confirmMyEmailChange
      requestBody:
        "$ref": "#/components/requestBodies/ConfirmEmailChange"
      responses:
        '200':
          "$ref": "#/components/responses/SimpleUser"
        '400':
          "$ref": "./common.openapi.yaml#/components/responses/400"
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
        '403':
          "$ref": "./common.openapi.yaml#/components/responses/403"
        '409':
          "$ref": "./common.openapi.yaml#/components/responses/409"
      summary: Neue eigene E-Mail-Adresse bestaetigen
      x-implementation-status: implemented
      x-preconditions:
      - Ein gueltiger LUNVA_ACCESS_TOKEN Cookie muss vorhanden sein.
      - Das initiale Setup muss abgeschlossen sein.
      - Der Token muss zu einer offenen E-Mail-Aenderung des aktuellen Benutzers gehoeren.
      description: |-
        Neue eigene E-Mail-Adresse bestaetigen.

        Vorbedingungen:
        - Ein gueltiger LUNVA_ACCESS_TOKEN Cookie muss vorhanden sein.
        - Das initiale Setup muss abgeschlossen sein.
        - Der Token muss zu einer offenen E-Mail-Aenderung des aktuellen Benutzers gehoeren.

        Implementierungsstatus: implemented.
  "/api/users/me/password/change":
    post:
      tags:
      - Users
      operationId: changeMyPassword
      requestBody:
        "$ref": "#/components/requestBodies/ChangePassword"
      responses:
        '204':
          description: Password changed.
        '400':
          "$ref": "./common.openapi.yaml#/components/responses/400"
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
      summary: Eigenes Passwort ändern
      x-implementation-status: implemented
      x-preconditions:
      - Ein gueltiger LUNVA_ACCESS_TOKEN Cookie muss vorhanden sein.
      - Das initiale Setup muss abgeschlossen sein.
      description: |-
        Eigenes Passwort ändern.

        Vorbedingungen:
        - Ein gueltiger LUNVA_ACCESS_TOKEN Cookie muss vorhanden sein.
        - Das initiale Setup muss abgeschlossen sein.

        Implementierungsstatus: implemented.
  "/api/users/password/forgot":
    post:
      tags:
        - Users
      operationId: forgotPassword
      security: []
      requestBody:
        "$ref": "#/components/requestBodies/ForgotPassword"
      responses:
        '204':
          description: Email sent.
        '400':
          "$ref": "./common.openapi.yaml#/components/responses/400"
      summary: Passwort-Reset anfordern
      x-implementation-status: implemented
      x-preconditions:
        - Der Endpunkt ist ohne Access-Token erreichbar.
        - Das initiale Setup muss abgeschlossen sein.
      description: |-
        Passwort-Reset anfordern.

        Vorbedingungen:
        - Der Endpunkt ist ohne Access-Token erreichbar.
        - Das initiale Setup muss abgeschlossen sein.

        Implementierungsstatus: implemented.
  "/api/users/{userId}/password/reset":
    post:
      tags:
        - Users
      operationId: resetMyPassword
      security: []
      parameters:
        - "$ref": "#/components/parameters/UserId"
      requestBody:
        "$ref": "#/components/requestBodies/ResetPassword"
      responses:
        '204':
          description: Password reset.
        '400':
          "$ref": "./common.openapi.yaml#/components/responses/400"
        '403':
          "$ref": "./common.openapi.yaml#/components/responses/403"
      summary: Passwort zuruecksetzen
      x-implementation-status: implemented
      x-preconditions:
        - Der Endpunkt ist ohne Access-Token erreichbar.
        - Das initiale Setup muss abgeschlossen sein.
        - Der Reset-Token muss existieren, nicht abgelaufen, nicht widerrufen und noch nicht akzeptiert sein.
      description: |-
        Passwort zuruecksetzen.

        Vorbedingungen:
        - Der Endpunkt ist ohne Access-Token erreichbar.
        - Das initiale Setup muss abgeschlossen sein.
        - Der Reset-Token muss existieren, nicht abgelaufen, nicht widerrufen und noch nicht akzeptiert sein.

        Implementierungsstatus: implemented.
  "/api/users":
    get:
      tags:
      - Users
      operationId: getAllUsers
      responses:
        '200':
          "$ref": "#/components/responses/ManagedUsers"
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
        '403':
          "$ref": "./common.openapi.yaml#/components/responses/403"
      summary: Verwaltete Benutzer auflisten
      x-implementation-status: partial
      x-preconditions:
      - Ein gueltiger LUNVA_ACCESS_TOKEN Cookie muss vorhanden sein.
      - Das initiale Setup muss abgeschlossen sein.
      - Der aktuelle Benutzer muss ServerOwner sein.
      x-required-role: ServerOwner
      description: |-
        Verwaltete Benutzer auflisten.

        Vorbedingungen:
        - Ein gueltiger LUNVA_ACCESS_TOKEN Cookie muss vorhanden sein.
        - Das initiale Setup muss abgeschlossen sein.
        - Der aktuelle Benutzer muss ServerOwner sein.

        Implementierungsstatus: partial.
    post:
      tags:
      - Users
      operationId: createManagedUser
      requestBody:
        "$ref": "#/components/requestBodies/CreateManagedUser"
      responses:
        '200':
          "$ref": "#/components/responses/ManagedUser"
        '400':
          "$ref": "./common.openapi.yaml#/components/responses/400"
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
        '403':
          "$ref": "./common.openapi.yaml#/components/responses/403"
        '409':
          "$ref": "./common.openapi.yaml#/components/responses/409"
      summary: Globalen Pending-User anlegen
      x-implementation-status: partial
      x-preconditions:
      - Ein gueltiger LUNVA_ACCESS_TOKEN Cookie muss vorhanden sein.
      - Das initiale Setup muss abgeschlossen sein.
      - Der aktuelle Benutzer muss ServerOwner sein.
      x-required-role: ServerOwner
      description: |-
        Globalen Pending-User anlegen.

        Vorbedingungen:
        - Ein gueltiger LUNVA_ACCESS_TOKEN Cookie muss vorhanden sein.
        - Das initiale Setup muss abgeschlossen sein.
        - Der aktuelle Benutzer muss ServerOwner sein.

        Implementierungsstatus: partial.
  "/api/users/{userId}/role":
    put:
      tags:
      - Users
      operationId: updateManagedUser
      parameters:
      - "$ref": "#/components/parameters/UserId"
      requestBody:
        "$ref": "#/components/requestBodies/UpdateManagedUserRole"
      responses:
        '200':
          "$ref": "#/components/responses/ManagedUsers"
        '400':
          "$ref": "./common.openapi.yaml#/components/responses/400"
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
        '403':
          "$ref": "./common.openapi.yaml#/components/responses/403"
        '404':
          "$ref": "./common.openapi.yaml#/components/responses/401"
        '409':
          "$ref": "./common.openapi.yaml#/components/responses/409"
      summary: Server-Rolle eines Benutzers ändern
      x-implementation-status: partial
      x-preconditions:
      - Ein gueltiger LUNVA_ACCESS_TOKEN Cookie muss vorhanden sein.
      - Das initiale Setup muss abgeschlossen sein.
      - Der aktuelle Benutzer muss ServerOwner sein.
      x-required-role: ServerOwner
      description: |-
        Server-Rolle eines Benutzers ändern.

        Vorbedingungen:
        - Ein gueltiger LUNVA_ACCESS_TOKEN Cookie muss vorhanden sein.
        - Das initiale Setup muss abgeschlossen sein.
        - Der aktuelle Benutzer muss ServerOwner sein.

        Implementierungsstatus: partial.
  "/api/users/{userId}/invite/accept":
    post:
      tags:
      - Users
      operationId: acceptInvitation
      security: []
      parameters:
      - "$ref": "#/components/parameters/UserId"
      requestBody:
        "$ref": "#/components/requestBodies/AcceptInvitation"
      responses:
        '200':
          "$ref": "./common.openapi.yaml#/components/responses/LoginSession"
        '400':
          "$ref": "./common.openapi.yaml#/components/responses/400"
        '404':
          "$ref": "./common.openapi.yaml#/components/responses/404"
      summary: Einladung annehmen und Passwort setzen
      x-implementation-status: partial
      x-preconditions:
      - Der Endpunkt ist ohne Access-Token erreichbar.
      - Das initiale Setup muss abgeschlossen sein.
      - Die Invitation muss existieren, nicht abgelaufen, nicht widerrufen und noch nicht akzeptiert sein.
      description: |-
        Einladung annehmen und Passwort setzen.

        Vorbedingungen:
        - Der Endpunkt ist ohne Access-Token erreichbar.
        - Das initiale Setup muss abgeschlossen sein.
        - Die Invitation muss existieren, nicht abgelaufen, nicht widerrufen und noch nicht akzeptiert sein.

        Implementierungsstatus: partial.
components:
  securitySchemes:
    accessTokenCookie:
      type: apiKey
      in: cookie
      name: LUNVA_ACCESS_TOKEN
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Internal ID of the current user
      example: 12345

  requestBodies:
    UpdateUserSettings:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/UpdateUserSettingsRequest"
          example:
            displayName: Kevin Raddatz
            email: kevin@example.test

    ChangePassword:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ChangePasswordRequest"
          example:
            currentPassword: admin1234567
            newPassword: new-admin1234567

    ConfirmEmailChange:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ConfirmEmailChangeRequest"
          example:
            token: email-change-token

    ResetPassword:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ResetPasswordRequest"
          example:
            password: welcome123456
            token: reset-token

    ForgotPassword:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ForgotPasswordRequest"
          example:
            email: kevin@example.test

    CreateManagedUser:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/CreateManagedUserRequest"
          example:
            email: invitee@example.test

    UpdateManagedUserRole:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/UpdateManagedUserRoleRequest"
          example:
            serverRole: ServerMember

    AcceptInvitation:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/AcceptInvitationRequest"
          example:
            displayName: Invitee
            password: welcome123456
            token: invitation-token

  responses:
    ManagedUsers:
      description: Managed users.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ManagedUsersSummary"
          example:
            users:
            - userId: 2
              email: invitee@example.test
              displayName: Invitee
              serverRole: ServerMember
              status: Pending
              tenants:
              - tenantId: 42
                name: friends
                displayName: Friends

    ManagedUser:
      description: Managed user.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ManagedUserSummary"
          example:
            userId: 2
            email: invitee@example.test
            displayName: Invitee
            serverRole: ServerMember
            status: Pending
            tenants:
            - tenantId: 42
              name: friends
              displayName: Friends

    SimpleUser:
      description: Simple user
      content:
        application/json:
          schema:
            "$ref": "./common.openapi.yaml#/components/schemas/UserSummary"
          example:
            userId: 1
            email: kevin@example.test
            displayName: Kevin
            serverRole: ServerOwner

  schemas:
    UserStatus:
      type: string
      enum:
        - Pending
        - Active

    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required:
        - password
        - token
      properties:
        password:
          "$ref": "./common.openapi.yaml#/components/schemas/Password"
        token:
          type: string
      example:
        password: welcome123456

    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          "$ref": "./common.openapi.yaml#/components/schemas/EmailAddress"
      example:
        email: kevin@example.test

    UpdateUserSettingsRequest:
      type: object
      additionalProperties: false
      required:
        - displayName
        - email
      properties:
        displayName:
          "$ref": "./common.openapi.yaml#/components/schemas/DisplayName"
        email:
          "$ref": "./common.openapi.yaml#/components/schemas/EmailAddress"
      example:
        displayName: Kevin Raddatz
        email: kevin@example.test

    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
        newPassword:
          "$ref": "./common.openapi.yaml#/components/schemas/Password"
      example:
        currentPassword: admin1234567
        newPassword: new-admin1234567

    ConfirmEmailChangeRequest:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
      example:
        token: email-change-token

    ManagedUserTenantSummary:
      type: object
      additionalProperties: false
      required:
        - tenantId
        - name
        - displayName
      properties:
        tenantId:
          type: integer
          format: int64
        name:
          "$ref": "./common.openapi.yaml#/components/schemas/Name"
        displayName:
          "$ref": "./common.openapi.yaml#/components/schemas/DisplayName"

    ManagedUsersSummary:
      type: object
      additionalProperties: false
      required:
        - users
      properties:
        users:
          type: array
          items:
            "$ref": "#/components/schemas/ManagedUserSummary"
      example:
        users:
          - userId: 2
            email: invitee@example.test
            displayName: Invitee
            serverRole: ServerMember
            status: Pending
            tenants:
              - tenantId: 42
                name: friends
                displayName: Friends

    ManagedUserSummary:
      type: object
      additionalProperties: false
      required:
        - userId
        - email
        - displayName
        - serverRole
        - status
        - tenants
      properties:
        userId:
          type: integer
          format: int64
        email:
          "$ref": "./common.openapi.yaml#/components/schemas/EmailAddress"
        displayName:
          "$ref": "./common.openapi.yaml#/components/schemas/DisplayName"
        serverRole:
          "$ref": "./common.openapi.yaml#/components/schemas/ServerRole"
        status:
          "$ref": "#/components/schemas/UserStatus"
        tenants:
          type: array
          items:
            "$ref": "#/components/schemas/ManagedUserTenantSummary"
      example:
        userId: 2
        email: invitee@example.test
        displayName: Invitee
        serverRole: ServerMember
        status: Pending
        tenants:
          - tenantId: 42
            name: friends
            displayName: Friends

    CreateManagedUserRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          "$ref": "./common.openapi.yaml#/components/schemas/EmailAddress"
      example:
        email: invitee@example.test

    UpdateManagedUserRoleRequest:
      type: object
      additionalProperties: false
      required:
        - serverRole
      properties:
        serverRole:
          "$ref": "./common.openapi.yaml#/components/schemas/ServerRole"
      example:
        serverRole: ServerMember

    AcceptInvitationRequest:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        displayName:
          "$ref": "./common.openapi.yaml#/components/schemas/DisplayName"
        password:
          "$ref": "./common.openapi.yaml#/components/schemas/Password"
        token:
          type: string
      example:
        displayName: Invitee
        password: welcome123456
        token: invitation-token
