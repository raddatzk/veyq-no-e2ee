---
openapi: 3.1.0
info:
  title: Lunva Users API
  version: 0.1.0
  description: >-
    API-first Zielvertrag fuer Lunva Users API. Operationen enthalten Beispiele, Vorbedingungen und den aktuellen Implementierungsstatus.
servers:
- url: "/"
security:
- accessTokenCookie: []
tags:
- name: Users
paths:
  "/api/users/me":
    get:
      tags:
      - Users
      operationId: me
      responses:
        '200':
          description: Current authenticated user.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserSummary"
              example:
                userId: 1
                email: kevin@example.test
                displayName: Kevin
                serverRole: ServerOwner
        '401':
          "$ref": "#/components/responses/Error"
          description: Der Request ist nicht authentifiziert.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
              example:
                error: Authentication required
      summary: Aktuellen Benutzer abrufen
      x-implementation-status: partial
      x-preconditions:
      - Ein gueltiger LUNVA_ACCESS_TOKEN Cookie muss vorhanden sein.
      - Das initiale Setup muss abgeschlossen sein.
      description: |-
        Aktuellen Benutzer abrufen.

        Vorbedingungen:
        - Ein gueltiger LUNVA_ACCESS_TOKEN Cookie muss vorhanden sein.
        - Das initiale Setup muss abgeschlossen sein.

        Implementierungsstatus: partial.
    put:
      tags:
      - Users
      operationId: updateMySettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateUserSettingsRequest"
            example:
              displayName: Kevin Raddatz
              email: kevin@example.test
      responses:
        '200':
          description: Updated current user.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserSummary"
              example:
                userId: 1
                email: kevin@example.test
                displayName: Kevin Raddatz
                serverRole: ServerOwner
        '400':
          "$ref": "#/components/responses/Error"
          description: Der Request ist syntaktisch oder fachlich ungueltig.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
              example:
                error: Invalid request
        '409':
          "$ref": "#/components/responses/Error"
        '401':
          description: Der Request ist nicht authentifiziert.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
              example:
                error: Authentication required
      summary: Eigene Benutzer-Einstellungen aktualisieren
      x-implementation-status: partial
      x-preconditions:
      - Ein gueltiger LUNVA_ACCESS_TOKEN Cookie muss vorhanden sein.
      - Das initiale Setup muss abgeschlossen sein.
      description: |-
        Eigene Benutzer-Einstellungen aktualisieren.

        Vorbedingungen:
        - Ein gueltiger LUNVA_ACCESS_TOKEN Cookie muss vorhanden sein.
        - Das initiale Setup muss abgeschlossen sein.

        Implementierungsstatus: partial.
  "/api/users/me/password":
    post:
      tags:
      - Users
      operationId: changeMyPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ChangePasswordRequest"
            example:
              currentPassword: admin1234
              newPassword: new-admin1234
      responses:
        '204':
          description: Password changed.
        '400':
          "$ref": "#/components/responses/Error"
          description: Der Request ist syntaktisch oder fachlich ungueltig.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
              example:
                error: Invalid request
        '401':
          "$ref": "#/components/responses/Error"
          description: Der Request ist nicht authentifiziert.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
              example:
                error: Authentication required
      summary: Eigenes Passwort ändern
      x-implementation-status: partial
      x-preconditions:
      - Ein gueltiger LUNVA_ACCESS_TOKEN Cookie muss vorhanden sein.
      - Das initiale Setup muss abgeschlossen sein.
      description: |-
        Eigenes Passwort ändern.

        Vorbedingungen:
        - Ein gueltiger LUNVA_ACCESS_TOKEN Cookie muss vorhanden sein.
        - Das initiale Setup muss abgeschlossen sein.

        Implementierungsstatus: partial.
  "/api/users":
    get:
      tags:
      - Users
      operationId: getAllUsers
      responses:
        '200':
          description: Managed users.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ManagedUsersResponse"
              example:
                users:
                - userId: 2
                  email: invitee@example.test
                  displayName: Invitee
                  serverRole: ServerMember
                  status: Pending
                  tenants:
                  - tenantId: 42
                    name: friends
                    displayName: Friends
        '403':
          "$ref": "#/components/responses/Error"
          description: Der Benutzer erfuellt die benoetigte Rolle oder Mitgliedschaft nicht.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
              example:
                error: Insufficient permissions
        '401':
          description: Der Request ist nicht authentifiziert.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
              example:
                error: Authentication required
      summary: Verwaltete Benutzer auflisten
      x-implementation-status: partial
      x-preconditions:
      - Ein gueltiger LUNVA_ACCESS_TOKEN Cookie muss vorhanden sein.
      - Das initiale Setup muss abgeschlossen sein.
      - Der aktuelle Benutzer muss ServerOwner sein.
      x-required-role: ServerOwner
      description: |-
        Verwaltete Benutzer auflisten.

        Vorbedingungen:
        - Ein gueltiger LUNVA_ACCESS_TOKEN Cookie muss vorhanden sein.
        - Das initiale Setup muss abgeschlossen sein.
        - Der aktuelle Benutzer muss ServerOwner sein.

        Implementierungsstatus: partial.
    post:
      tags:
      - Users
      operationId: createManagedUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateManagedUserRequest"
            example:
              email: invitee@example.test
              displayName: Invitee
              serverRole: ServerMember
              tenantId: 42
      responses:
        '200':
          description: Created pending managed user.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ManagedUserSummary"
              example:
                userId: 2
                email: invitee@example.test
                displayName: Invitee
                serverRole: ServerMember
                status: Pending
                tenants:
                - tenantId: 42
                  name: friends
                  displayName: Friends
        '400':
          "$ref": "#/components/responses/Error"
          description: Der Request ist syntaktisch oder fachlich ungueltig.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
              example:
                error: Invalid request
        '403':
          "$ref": "#/components/responses/Error"
          description: Der Benutzer erfuellt die benoetigte Rolle oder Mitgliedschaft nicht.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
              example:
                error: Insufficient permissions
        '401':
          description: Der Request ist nicht authentifiziert.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
              example:
                error: Authentication required
        '409':
          description: Der Request verletzt einen Eindeutigkeits- oder Zustandskonflikt.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
              example:
                error: Resource conflict
      summary: Verwalteten Benutzer einladen
      x-implementation-status: partial
      x-preconditions:
      - Ein gueltiger LUNVA_ACCESS_TOKEN Cookie muss vorhanden sein.
      - Das initiale Setup muss abgeschlossen sein.
      - Der aktuelle Benutzer muss ServerOwner sein.
      x-required-role: ServerOwner
      description: |-
        Verwalteten Benutzer einladen.

        Vorbedingungen:
        - Ein gueltiger LUNVA_ACCESS_TOKEN Cookie muss vorhanden sein.
        - Das initiale Setup muss abgeschlossen sein.
        - Der aktuelle Benutzer muss ServerOwner sein.

        Implementierungsstatus: partial.
  "/api/users/{userId}/role":
    put:
      tags:
      - Users
      operationId: updateManagedUser
      parameters:
      - "$ref": "#/components/parameters/UserId"
        description:
        example:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateManagedUserRequest"
            example:
              serverRole: ServerMember
      responses:
        '200':
          description: Updated managed user.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ManagedUserSummary"
              example:
                userId: 2
                email: invitee@example.test
                displayName: Invitee
                serverRole: ServerMember
                status: Pending
                tenants:
                - tenantId: 42
                  name: friends
                  displayName: Friends
        '403':
          "$ref": "#/components/responses/Error"
          description: Der Benutzer erfuellt die benoetigte Rolle oder Mitgliedschaft nicht.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
              example:
                error: Insufficient permissions
        '404':
          "$ref": "#/components/responses/Error"
          description: Die angeforderte Ressource existiert nicht oder ist fuer den Benutzer nicht sichtbar.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
              example:
                error: Resource not found
        '409':
          "$ref": "#/components/responses/Error"
          description: Der Request verletzt einen Eindeutigkeits- oder Zustandskonflikt.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
              example:
                error: Resource conflict
        '401':
          description: Der Request ist nicht authentifiziert.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
              example:
                error: Authentication required
        '400':
          description: Der Request ist syntaktisch oder fachlich ungueltig.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
              example:
                error: Invalid request
      summary: Server-Rolle eines Benutzers ändern
      x-implementation-status: partial
      x-preconditions:
      - Ein gueltiger LUNVA_ACCESS_TOKEN Cookie muss vorhanden sein.
      - Das initiale Setup muss abgeschlossen sein.
      - Der aktuelle Benutzer muss ServerOwner sein.
      x-required-role: ServerOwner
      description: |-
        Server-Rolle eines Benutzers ändern.

        Vorbedingungen:
        - Ein gueltiger LUNVA_ACCESS_TOKEN Cookie muss vorhanden sein.
        - Das initiale Setup muss abgeschlossen sein.
        - Der aktuelle Benutzer muss ServerOwner sein.

        Implementierungsstatus: partial.
  "/api/users/{userId}/invite":
    post:
      tags:
      - Users
      operationId: sendManagedUserInvitation
      parameters:
      - "$ref": "#/components/parameters/UserId"
        description:
        example:
      responses:
        '200':
          description: Invitation resent.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ManagedUserSummary"
              example:
                userId: 2
                email: invitee@example.test
                displayName: Invitee
                serverRole: ServerMember
                status: Pending
                tenants:
                - tenantId: 42
                  name: friends
                  displayName: Friends
        '403':
          "$ref": "#/components/responses/Error"
          description: Der Benutzer erfuellt die benoetigte Rolle oder Mitgliedschaft nicht.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
              example:
                error: Insufficient permissions
        '404':
          "$ref": "#/components/responses/Error"
          description: Die angeforderte Ressource existiert nicht oder ist fuer den Benutzer nicht sichtbar.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
              example:
                error: Resource not found
        '409':
          "$ref": "#/components/responses/Error"
        '401':
          description: Der Request ist nicht authentifiziert.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
              example:
                error: Authentication required
        '400':
          description: Der Request ist syntaktisch oder fachlich ungueltig.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
              example:
                error: Invalid request
      summary: Einladung erneut senden
      x-implementation-status: partial
      x-preconditions:
      - Ein gueltiger LUNVA_ACCESS_TOKEN Cookie muss vorhanden sein.
      - Das initiale Setup muss abgeschlossen sein.
      - Der aktuelle Benutzer muss ServerOwner sein.
      x-required-role: ServerOwner
      description: |-
        Einladung erneut senden.

        Vorbedingungen:
        - Ein gueltiger LUNVA_ACCESS_TOKEN Cookie muss vorhanden sein.
        - Das initiale Setup muss abgeschlossen sein.
        - Der aktuelle Benutzer muss ServerOwner sein.

        Implementierungsstatus: partial.
  "/api/users/{userId}/invite/accept":
    post:
      tags:
      - Users
      operationId: acceptInvitation
      security: []
      parameters:
      - "$ref": "#/components/parameters/UserId"
        description:
        example:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AcceptInvitationRequest"
            example:
              password: welcome123
              token: invitation-token
      responses:
        '200':
          description: Invitation accepted and auth cookies were set.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LoginResponse"
              example:
                userId: 2
                email: invitee@example.test
                displayName: Invitee
                serverRole: ServerMember
        '400':
          "$ref": "#/components/responses/Error"
          description: Der Request ist syntaktisch oder fachlich ungueltig.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
              example:
                error: Invalid request
        '404':
          "$ref": "#/components/responses/Error"
          description: Die angeforderte Ressource existiert nicht oder ist fuer den Benutzer nicht sichtbar.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
              example:
                error: Resource not found
      summary: Einladung annehmen und Passwort setzen
      x-implementation-status: partial
      x-preconditions:
      - Der Endpunkt ist ohne Access-Token erreichbar.
      - Das initiale Setup muss abgeschlossen sein.
      - Die Invitation muss existieren, nicht abgelaufen, nicht widerrufen und noch nicht akzeptiert sein.
      description: |-
        Einladung annehmen und Passwort setzen.

        Vorbedingungen:
        - Der Endpunkt ist ohne Access-Token erreichbar.
        - Das initiale Setup muss abgeschlossen sein.
        - Die Invitation muss existieren, nicht abgelaufen, nicht widerrufen und noch nicht akzeptiert sein.

        Implementierungsstatus: partial.
components:
  securitySchemes:
    accessTokenCookie:
      type: apiKey
      in: cookie
      name: LUNVA_ACCESS_TOKEN
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    Error:
      description: Request failed.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
          example:
            message: example
  schemas:
    ServerRole:
      type: string
      enum:
      - ServerOwner
      - ServerMember
    UserStatus:
      type: string
      enum:
      - Pending
      - Active
    UserSummary:
      type: object
      additionalProperties: false
      required:
      - userId
      - email
      - displayName
      - serverRole
      properties:
        userId:
          type: integer
          format: int64
        email:
          type: string
          format: email
        displayName:
          type: string
        serverRole:
          "$ref": "#/components/schemas/ServerRole"
    LoginResponse:
      type: object
      additionalProperties: false
      required:
      - userId
      - email
      - displayName
      - serverRole
      properties:
        userId:
          type: integer
          format: int64
        email:
          type: string
          format: email
        displayName:
          type: string
        serverRole:
          "$ref": "#/components/schemas/ServerRole"
    UpdateUserSettingsRequest:
      type: object
      additionalProperties: false
      required:
      - displayName
      - email
      properties:
        displayName:
          type: string
        email:
          type: string
          format: email
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required:
      - currentPassword
      - newPassword
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
    ManagedUserTenantSummary:
      type: object
      additionalProperties: false
      required:
      - tenantId
      - name
      - displayName
      properties:
        tenantId:
          type: integer
          format: int64
        name:
          type: string
        displayName:
          type: string
    ManagedUserSummary:
      type: object
      additionalProperties: false
      required:
      - userId
      - email
      - displayName
      - serverRole
      - status
      - tenants
      properties:
        userId:
          type: integer
          format: int64
        email:
          type: string
          format: email
        displayName:
          type: string
        serverRole:
          "$ref": "#/components/schemas/ServerRole"
        status:
          "$ref": "#/components/schemas/UserStatus"
        tenants:
          type: array
          items:
            "$ref": "#/components/schemas/ManagedUserTenantSummary"
    ManagedUsersResponse:
      type: object
      additionalProperties: false
      required:
      - users
      properties:
        users:
          type: array
          items:
            "$ref": "#/components/schemas/ManagedUserSummary"
    CreateManagedUserRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - displayName
      - serverRole
      - tenantId
      properties:
        email:
          type: string
          format: email
        displayName:
          type: string
        serverRole:
          "$ref": "#/components/schemas/ServerRole"
        tenantId:
          type: integer
          format: int64
    UpdateManagedUserRequest:
      type: object
      additionalProperties: false
      required:
      - serverRole
      properties:
        serverRole:
          "$ref": "#/components/schemas/ServerRole"
    AcceptInvitationRequest:
      type: object
      additionalProperties: false
      required:
      - password
      - token
      properties:
        password:
          type: string
          minLength: 8
        token:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
      - message
      properties:
        message:
          type: string
