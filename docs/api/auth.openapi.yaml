openapi: 3.1.0
info:
  title: veyq auth
  version: 0.1.0
paths:
  /api/login:
    post:
      tags: [Login]
      operationId: login
      summary: Authenticate (password) and receive a session + the wrapped key bag.
      description: >
        The server verifies the password against the stored Argon2id auth verifier, issues a session
        token and returns the wrapped key bag (ciphertext only). The master key is never sent — unlock
        happens client-side from the returned blobs (auth != unlock).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Session token + wrapped key bag.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
  /api/me:
    get:
      tags: [Login]
      operationId: getCurrentUser
      summary: The authenticated user for a session token (proves the session resolves).
      parameters:
        - name: Authorization
          in: header
          required: true
          description: 'Bearer <sessionToken>'
          schema: { type: string }
      responses:
        '200':
          description: The current user.
          content:
            application/json:
              schema: { $ref: './common.openapi.yaml#/components/schemas/UserSummary' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
  /api/me/session:
    delete:
      tags: [Login]
      operationId: logout
      summary: Invalidate the caller's current session token (logout).
      description: >
        Deletes the session row for the presented bearer token so it can never resolve again. Idempotent —
        an unknown or already-expired token still returns 204. Holds no key material; unlock state is local.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
      responses:
        '204': { description: The session was invalidated (or did not exist). }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
  /api/me/personal-scope:
    get:
      tags: [Login]
      operationId: getPersonalScope
      summary: Return the authenticated user's personal root scope grant.
      description: >
        The personal scope is self-owned and unshared. The server returns only the public scope key and
        the scope private key wrapped to the authenticated user's identity key.
      parameters:
        - name: Authorization
          in: header
          required: true
          description: 'Bearer <sessionToken>'
          schema: { type: string }
      responses:
        '200':
          description: The user's personal root scope grant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalScopeGrant' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
components:
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    LoginResponse:
      type: object
      required: [sessionToken, user, keyBag]
      properties:
        sessionToken: { type: string }
        user: { $ref: './common.openapi.yaml#/components/schemas/UserSummary' }
        keyBag: { $ref: '#/components/schemas/KeyBag' }
    KeyBag:
      type: object
      description: The wrapped key material needed to unlock the master key client-side.
      required: [identityPublicKey, wrappedIdentityPrivateKey, masterKeyWraps]
      properties:
        identityPublicKey: { $ref: './common.openapi.yaml#/components/schemas/IdentityPublicKey' }
        wrappedIdentityPrivateKey: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
        masterKeyWraps:
          type: array
          items: { $ref: './common.openapi.yaml#/components/schemas/MasterKeyWrap' }
    PersonalScopeGrant:
      type: object
      required: [scopeId, scopePublicKey, wrappedScopePrivateKey]
      properties:
        scopeId: { type: string }
        scopePublicKey: { $ref: './common.openapi.yaml#/components/schemas/KemPublicKey' }
        wrappedScopePrivateKey: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
