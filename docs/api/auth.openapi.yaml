openapi: 3.1.0
info:
  title: veyq auth
  version: 0.1.0
paths:
  /api/login:
    post:
      tags: [Login]
      operationId: login
      summary: Authenticate (password) and receive a session + the wrapped key bag.
      description: >
        The server verifies the password against the stored Argon2id auth verifier, issues a session
        token and returns the wrapped key bag (ciphertext only). The master key is never sent — unlock
        happens client-side from the returned blobs (auth != unlock).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Session token + wrapped key bag.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
  /api/me:
    get:
      tags: [Login]
      operationId: getCurrentUser
      summary: The authenticated user for a session token (proves the session resolves).
      parameters:
        - name: Authorization
          in: header
          required: true
          description: 'Bearer <sessionToken>'
          schema: { type: string }
      responses:
        '200':
          description: The current user.
          content:
            application/json:
              schema: { $ref: './common.openapi.yaml#/components/schemas/UserSummary' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
  /api/me/profile:
    patch:
      tags: [Login]
      operationId: updateCurrentProfile
      summary: Update low-sensitivity profile fields for the authenticated user.
      description: >
        Updates server-visible identity metadata. This endpoint intentionally does not change email,
        credentials or device wraps; those require their own verification/key-wrap flows.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: The updated current user.
          content:
            application/json:
              schema: { $ref: './common.openapi.yaml#/components/schemas/UserSummary' }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
  /api/me/session:
    delete:
      tags: [Login]
      operationId: logout
      summary: Invalidate the caller's current session token (logout).
      description: >
        Deletes the session row for the presented bearer token so it can never resolve again. Idempotent —
        an unknown or already-expired token still returns 204. Holds no key material; unlock state is local.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
      responses:
        '204': { description: The session was invalidated (or did not exist). }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
  /api/me/personal-scope:
    get:
      tags: [Login]
      operationId: getPersonalScope
      summary: Return the authenticated user's personal root scope grant.
      description: >
        The personal scope is self-owned and unshared. The server returns only the public scope key and
        the scope private key wrapped to the authenticated user's identity key.
      parameters:
        - name: Authorization
          in: header
          required: true
          description: 'Bearer <sessionToken>'
          schema: { type: string }
      responses:
        '200':
          description: The user's personal root scope grant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalScopeGrant' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  # --- Password reset (Secret Key + email). One tag per op so the jaxrs-spec greedy class-@Path on the
  # shared /api/account/password-reset prefix can't shadow sibling routes (see the codegen gotcha doc).
  /api/account/password-reset/request:
    post:
      tags: [PasswordResetRequest]
      operationId: requestPasswordReset
      summary: Request a password reset — email a one-time token to the address (if an account exists).
      description: >
        Always returns 204 (never reveals whether an account exists). If the email maps to an account with a
        RECOVERY wrap, the server emails a one-time reset link. The token is the email second factor; the
        Secret Key (entered later) is the crypto factor.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequestRequest' }
      responses:
        '204': { description: Accepted (an email was sent iff the account exists). }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
  /api/account/password-reset/material:
    post:
      tags: [PasswordResetMaterial]
      operationId: getPasswordResetMaterial
      summary: Exchange a valid reset token for the account's RECOVERY master-key wrap.
      description: >
        Gated by the email-delivered token (proves email control). Returns the RECOVERY wrap (master key
        wrapped under the Secret Key) so the client can unwrap the master key with the Secret Key. Invalid,
        expired or consumed tokens — or an account without a recovery wrap — return 400.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetTokenRequest' }
      responses:
        '200':
          description: The recovery wrap + the account email (for display).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordResetMaterial' }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
  /api/account/password-reset/confirm:
    post:
      tags: [PasswordResetConfirm]
      operationId: confirmPasswordReset
      summary: Complete a reset — swap the PASSWORD master-key wrap + auth verifier, invalidate sessions.
      description: >
        Gated by the same token. The client has unwrapped the master key with the Secret Key and re-wrapped
        it under the new password; this submits the new PASSWORD wrap + auth verifier. The server replaces
        them, consumes the token and invalidates all of the user's sessions. The RECOVERY wrap is untouched.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetConfirmRequest' }
      responses:
        '204': { description: The password was reset. }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
  # --- Email change (authenticated request → token emailed to the NEW address → token-gated confirm).
  # One tag per op (greedy class-@Path gotcha). Email is NOT part of key derivation, so this is a pure
  # identifier swap — no re-wrap. Confirm is token-only (control of the new inbox is the proof), like reset.
  /api/account/email-change/request:
    post:
      tags: [EmailChangeRequest]
      operationId: requestEmailChange
      summary: Request an email change — emails a one-time confirmation token to the NEW address.
      description: >
        Authenticated. Starts a change to the caller's account email. The new address must be free. A
        one-time token is emailed to the NEW address; confirming it (separately) commits the change.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailChangeRequestRequest' }
      responses:
        '204': { description: A confirmation email was sent to the new address. }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '409': { description: The requested email address is already in use. }
  /api/account/email-change/confirm:
    post:
      tags: [EmailChangeConfirm]
      operationId: confirmEmailChange
      summary: Confirm an email change with the token emailed to the new address.
      description: >
        Token-gated (no session required): control of the new inbox is the proof, so the link works on any
        device. Consumes the token and swaps the account email. Returns the updated user.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailChangeConfirmRequest' }
      responses:
        '200':
          description: The updated current user.
          content:
            application/json:
              schema: { $ref: './common.openapi.yaml#/components/schemas/UserSummary' }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '409': { description: The requested email address is already in use. }
components:
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, x-field-extra-annotation: ['@field:com.veyq.app.shared.validation.Email'] }
        password: { type: string, x-field-extra-annotation: ['@field:jakarta.validation.constraints.Size(max = 1024)'] }
    LoginResponse:
      type: object
      required: [sessionToken, user, keyBag]
      properties:
        sessionToken: { type: string }
        user: { $ref: './common.openapi.yaml#/components/schemas/UserSummary' }
        keyBag: { $ref: '#/components/schemas/KeyBag' }
    UpdateProfileRequest:
      type: object
      required: [displayName]
      properties:
        displayName: { type: string, x-field-extra-annotation: ['@field:com.veyq.app.shared.validation.DisplayName'] }
    KeyBag:
      type: object
      description: The wrapped key material needed to unlock the master key client-side.
      required: [identityPublicKey, wrappedIdentityPrivateKey, masterKeyWraps]
      properties:
        identityPublicKey: { $ref: './common.openapi.yaml#/components/schemas/IdentityPublicKey' }
        wrappedIdentityPrivateKey: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
        masterKeyWraps:
          type: array
          items: { $ref: './common.openapi.yaml#/components/schemas/MasterKeyWrap' }
    PersonalScopeGrant:
      type: object
      required: [scopeId, scopePublicKey, wrappedScopePrivateKey]
      properties:
        scopeId: { type: string }
        scopePublicKey: { $ref: './common.openapi.yaml#/components/schemas/KemPublicKey' }
        wrappedScopePrivateKey: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
    PasswordResetRequestRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, x-field-extra-annotation: ['@field:com.veyq.app.shared.validation.Email'] }
    PasswordResetTokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, x-field-extra-annotation: ['@field:jakarta.validation.constraints.Size(max = 512)'] }
    PasswordResetMaterial:
      type: object
      required: [email, recoveryWrap]
      properties:
        email: { type: string, description: 'The account email (so the reset screen can show whose account).', x-field-extra-annotation: ['@field:com.veyq.app.shared.validation.Email'] }
        recoveryWrap: { $ref: './common.openapi.yaml#/components/schemas/MasterKeyWrap' }
    PasswordResetConfirmRequest:
      type: object
      required: [token, masterKeyWrap, authVerifier, recoveryAuthTag]
      properties:
        token: { type: string, x-field-extra-annotation: ['@field:jakarta.validation.constraints.Size(max = 512)'] }
        masterKeyWrap: { $ref: './common.openapi.yaml#/components/schemas/MasterKeyWrap' }
        authVerifier: { $ref: './common.openapi.yaml#/components/schemas/AuthVerifier' }
        # SHA-256("veyq/v1/recovery-auth" || masterKey), base64url. Must match the commitment stored at
        # registration — proves the client recovered the real master key with the Secret Key. Without it,
        # an email-token-only attacker could reset the password verifier and hijack the server account.
        recoveryAuthTag: { type: string, x-field-extra-annotation: ['@field:jakarta.validation.constraints.Size(max = 128)'] }
    EmailChangeRequestRequest:
      type: object
      required: [newEmail]
      properties:
        newEmail: { type: string, x-field-extra-annotation: ['@field:com.veyq.app.shared.validation.Email'] }
    EmailChangeConfirmRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, x-field-extra-annotation: ['@field:jakarta.validation.constraints.Size(max = 512)'] }
