---
openapi: 3.1.0
info:
  title: Veyq Auth API
  version: 0.1.0
  description: >-
    API-first Zielvertrag fuer Veyq Auth API. Operationen enthalten Beispiele, Vorbedingungen und den aktuellen Implementierungsstatus.
servers:
- url: "/"
tags:
- name: Auth
paths:
  "/api/auth/login":
    post:
      tags:
      - Auth
      operationId: login
      requestBody:
        "$ref": "#/components/requestBodies/Login"
      responses:
        '200':
          "$ref": "./common.openapi.yaml#/components/responses/LoginSession"
        '400':
          "$ref": "./common.openapi.yaml#/components/responses/400"
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
      summary: Anmelden und Auth-Cookies setzen
      x-implementation-status: partial
      x-preconditions:
      - Der Endpunkt ist ohne Access-Token erreichbar.
      - Das initiale Setup muss abgeschlossen sein.
      description: |-
        Anmelden und Auth-Cookies setzen.

        Vorbedingungen:
        - Der Endpunkt ist ohne Access-Token erreichbar.
        - Das initiale Setup muss abgeschlossen sein.

        Implementierungsstatus: partial.
  "/api/auth/passkeys/login/options":
    post:
      tags:
      - Auth
      operationId: passkeyLoginOptions
      security: []
      responses:
        '200':
          "$ref": "#/components/responses/PasskeyLoginOptions"
        '400':
          "$ref": "./common.openapi.yaml#/components/responses/400"
      summary: Passkey-Login-Challenge erzeugen
      x-implementation-status: implemented
      x-preconditions:
      - Der Endpunkt ist ohne Access-Token erreichbar.
      - Das initiale Setup muss abgeschlossen sein.
      description: |-
        Passkey-Login-Challenge erzeugen.

        Vorbedingungen:
        - Der Endpunkt ist ohne Access-Token erreichbar.
        - Das initiale Setup muss abgeschlossen sein.

        Implementierungsstatus: implemented.
  "/api/auth/passkeys/login":
    post:
      tags:
      - Auth
      operationId: passkeyLogin
      security: []
      requestBody:
        "$ref": "#/components/requestBodies/PasskeyLogin"
      responses:
        '200':
          "$ref": "./common.openapi.yaml#/components/responses/LoginSession"
        '400':
          "$ref": "./common.openapi.yaml#/components/responses/400"
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
      summary: Mit Passkey anmelden und Auth-Cookies setzen
      x-implementation-status: implemented
      x-preconditions:
      - Der Endpunkt ist ohne Access-Token erreichbar.
      - Das initiale Setup muss abgeschlossen sein.
      description: |-
        Mit Passkey anmelden und Auth-Cookies setzen.

        Vorbedingungen:
        - Der Endpunkt ist ohne Access-Token erreichbar.
        - Das initiale Setup muss abgeschlossen sein.

        Implementierungsstatus: implemented.
  "/api/auth/logout":
    post:
      tags:
      - Auth
      operationId: logout
      security:
      - accessTokenCookie: []
      responses:
        '204':
          description: Current auth cookies were cleared.
        '400':
          "$ref": "./common.openapi.yaml#/components/responses/400"
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
      summary: Aktuelle Sitzung abmelden
      x-implementation-status: partial
      x-preconditions:
      - Ein gueltiger VEYQ_ACCESS_TOKEN Cookie muss vorhanden sein.
      - Das initiale Setup muss abgeschlossen sein.
      description: |-
        Aktuelle Sitzung abmelden.

        Vorbedingungen:
        - Ein gueltiger VEYQ_ACCESS_TOKEN Cookie muss vorhanden sein.
        - Das initiale Setup muss abgeschlossen sein.

        Implementierungsstatus: partial.
  "/api/auth/refresh":
    post:
      tags:
      - Auth
      operationId: refresh
      security:
      - refreshTokenCookie: []
      responses:
        '200':
          "$ref": "./common.openapi.yaml#/components/responses/LoginSession"
        '400':
          "$ref": "./common.openapi.yaml#/components/responses/400"
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
      summary: Refresh-Token rotieren und neue Cookies setzen
      x-implementation-status: partial
      x-preconditions:
      - Ein gueltiger VEYQ_ACCESS_TOKEN Cookie muss vorhanden sein.
      - Das initiale Setup muss abgeschlossen sein.
      description: |-
        Refresh-Token rotieren und neue Cookies setzen.

        Vorbedingungen:
        - Ein gueltiger VEYQ_ACCESS_TOKEN Cookie muss vorhanden sein.
        - Das initiale Setup muss abgeschlossen sein.

        Implementierungsstatus: partial.
components:
  securitySchemes:
    accessTokenCookie:
      type: apiKey
      in: cookie
      name: VEYQ_ACCESS_TOKEN
    refreshTokenCookie:
      type: apiKey
      in: cookie
      name: VEYQ_REFRESH_TOKEN

  requestBodies:
    Login:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/LoginRequest"
          example:
            email: kevin@example.test
            password: correct horse battery staple
    PasskeyLogin:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/PasskeyLoginRequest"
          example:
            id: credential-id
            rawId: credential-id
            type: public-key
            response:
              clientDataJSON: client-data
              authenticatorData: authenticator-data
              signature: signature

  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          "$ref": "./common.openapi.yaml#/components/schemas/EmailAddress"
        password:
          type: string
      example:
        email: kevin@example.test
        password: correct horse battery staple
    PasskeyLoginOptionsResponse:
      type: object
      additionalProperties: true
      description: PublicKeyCredentialRequestOptions encoded for browser WebAuthn APIs.
      example:
        challenge: challenge
        timeout: 300000
        userVerification: required
        allowCredentials:
          - type: public-key
            id: credential-id
    PasskeyLoginRequest:
      type: object
      additionalProperties: false
      required:
        - id
        - rawId
        - type
        - response
      properties:
        id:
          type: string
        rawId:
          type: string
        type:
          type: string
        response:
          "$ref": "#/components/schemas/PasskeyAssertionResponse"
      example:
        id: credential-id
        rawId: credential-id
        type: public-key
        response:
          clientDataJSON: client-data
          authenticatorData: authenticator-data
          signature: signature
    PasskeyAssertionResponse:
      type: object
      additionalProperties: false
      required:
        - clientDataJSON
        - authenticatorData
        - signature
      properties:
        clientDataJSON:
          type: string
        authenticatorData:
          type: string
        signature:
          type: string
        userHandle:
          type: string
      example:
        clientDataJSON: client-data
        authenticatorData: authenticator-data
        signature: signature
  responses:
    PasskeyLoginOptions:
      description: Passkey login options.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/PasskeyLoginOptionsResponse"
          example:
            challenge: challenge
            timeout: 300000
            userVerification: required
