openapi: 3.1.0
info:
  title: veyq authentication
  version: 0.1.0
paths:
  /api/login:
    post:
      tags:
        - Session
      operationId: login
      summary: Authenticate (password) and receive a session + the wrapped key bag.
      description: |
        The server verifies the password against the stored Argon2id auth verifier, issues a session token and returns the wrapped key bag (ciphertext only). The master key is never sent — unlock happens client-side from the returned blobs (auth != unlock).
        If the client already knows a stable deviceRef for this browser/login identity it may send it; otherwise the server generates one and returns it in the login response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        '200':
          description: Session token + wrapped key bag.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        '400':
          $ref: "./common.openapi.yaml#/components/responses/BadRequest"
        '401':
          $ref: "./common.openapi.yaml#/components/responses/Unauthorized"
  /api/auth/refresh:
    post:
      tags:
        - Session
      operationId: refreshSession
      summary: Rotate the HttpOnly refresh cookie and receive a fresh access session token.
      description: |
        Refresh restores server authentication only. It never returns key material; a client that wants to continue decrypting after reload must also have a local device-unlock state for the E2EE keys. The refresh token is held in an HttpOnly SameSite=Lax cookie and stored server-side only as a hash.
      responses:
        '200':
          description: Fresh access session token; the refresh cookie is rotated in Set-Cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshSessionResponse"
        '401':
          $ref: "./common.openapi.yaml#/components/responses/Unauthorized"
  /api/me/session:
    delete:
      tags:
        - Session
      operationId: logout
      summary: Invalidate the caller's current session token (logout).
      description: |
        Deletes the session row for the presented bearer token so it can never resolve again. Idempotent — an unknown or already-expired token still returns 204. Holds no key material; unlock state is local.
      parameters:
        - $ref: "./common.openapi.yaml#/components/parameters/AuthHeader"
      responses:
        '204':
          description: The session was invalidated (or did not exist).
        '401':
          $ref: "./common.openapi.yaml#/components/responses/Unauthorized"
components:
  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          x-field-extra-annotation:
            - '@field:com.veyq.app.shared.validation.Email'
        password:
          type: string
          x-field-extra-annotation:
            - '@field:jakarta.validation.constraints.Size(max = 1024)'
        deviceRef:
          type: string
          maxLength: 255
          description: Optional stable client-generated login device identifier to attach to the issued session.
          x-field-extra-annotation:
            - '@field:jakarta.validation.constraints.Size(max = 255)'
    LoginResponse:
      type: object
      required:
        - sessionToken
        - deviceRef
        - user
        - keyBag
      properties:
        sessionToken:
          type: string
        deviceRef:
          type: string
          description: Stable opaque login-device identifier attached to the issued session.
        user:
          $ref: "./common.openapi.yaml#/components/schemas/UserSummary"
        keyBag:
          $ref: "#/components/schemas/KeyBag"
    RefreshSessionResponse:
      type: object
      required:
        - sessionToken
      properties:
        sessionToken:
          type: string
          description: Fresh opaque bearer access token.
    KeyBag:
      type: object
      description: The wrapped key material needed to unlock the master key client-side.
      required:
        - identityPublicKey
        - wrappedIdentityPrivateKey
        - masterKeyWraps
      properties:
        identityPublicKey:
          $ref: "./common.openapi.yaml#/components/schemas/IdentityPublicKey"
        wrappedIdentityPrivateKey:
          $ref: "./common.openapi.yaml#/components/schemas/Blob"
        masterKeyWraps:
          type: array
          items:
            $ref: "./common.openapi.yaml#/components/schemas/MasterKeyWrap"
