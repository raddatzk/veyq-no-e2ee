openapi: 3.1.0
info:
  title: veyq auth
  version: 0.1.0
paths:
  /api/login:
    post:
      tags: [Login]
      operationId: login
      summary: Authenticate (password) and receive a session + the wrapped key bag.
      description: >
        The server verifies the password against the stored Argon2id auth verifier, issues a session
        token and returns the wrapped key bag (ciphertext only). The master key is never sent — unlock
        happens client-side from the returned blobs (auth != unlock).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Session token + wrapped key bag.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
  /api/me:
    get:
      tags: [Login]
      operationId: getCurrentUser
      summary: The authenticated user for a session token (proves the session resolves).
      parameters:
        - name: Authorization
          in: header
          required: true
          description: 'Bearer <sessionToken>'
          schema: { type: string }
      responses:
        '200':
          description: The current user.
          content:
            application/json:
              schema: { $ref: './common.openapi.yaml#/components/schemas/UserSummary' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
  /api/me/session:
    delete:
      tags: [Login]
      operationId: logout
      summary: Invalidate the caller's current session token (logout).
      description: >
        Deletes the session row for the presented bearer token so it can never resolve again. Idempotent —
        an unknown or already-expired token still returns 204. Holds no key material; unlock state is local.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
      responses:
        '204': { description: The session was invalidated (or did not exist). }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
  /api/me/personal-scope:
    get:
      tags: [Login]
      operationId: getPersonalScope
      summary: Return the authenticated user's personal root scope grant.
      description: >
        The personal scope is self-owned and unshared. The server returns only the public scope key and
        the scope private key wrapped to the authenticated user's identity key.
      parameters:
        - name: Authorization
          in: header
          required: true
          description: 'Bearer <sessionToken>'
          schema: { type: string }
      responses:
        '200':
          description: The user's personal root scope grant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalScopeGrant' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  # --- Password reset (Secret Key + email). One tag per op so the jaxrs-spec greedy class-@Path on the
  # shared /api/account/password-reset prefix can't shadow sibling routes (see the codegen gotcha doc).
  /api/account/password-reset/request:
    post:
      tags: [PasswordResetRequest]
      operationId: requestPasswordReset
      summary: Request a password reset — email a one-time token to the address (if an account exists).
      description: >
        Always returns 204 (never reveals whether an account exists). If the email maps to an account with a
        RECOVERY wrap, the server emails a one-time reset link. The token is the email second factor; the
        Secret Key (entered later) is the crypto factor.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequestRequest' }
      responses:
        '204': { description: Accepted (an email was sent iff the account exists). }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
  /api/account/password-reset/material:
    post:
      tags: [PasswordResetMaterial]
      operationId: getPasswordResetMaterial
      summary: Exchange a valid reset token for the account's RECOVERY master-key wrap.
      description: >
        Gated by the email-delivered token (proves email control). Returns the RECOVERY wrap (master key
        wrapped under the Secret Key) so the client can unwrap the master key with the Secret Key. Invalid,
        expired or consumed tokens — or an account without a recovery wrap — return 400.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetTokenRequest' }
      responses:
        '200':
          description: The recovery wrap + the account email (for display).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordResetMaterial' }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
  /api/account/password-reset/confirm:
    post:
      tags: [PasswordResetConfirm]
      operationId: confirmPasswordReset
      summary: Complete a reset — swap the PASSWORD master-key wrap + auth verifier, invalidate sessions.
      description: >
        Gated by the same token. The client has unwrapped the master key with the Secret Key and re-wrapped
        it under the new password; this submits the new PASSWORD wrap + auth verifier. The server replaces
        them, consumes the token and invalidates all of the user's sessions. The RECOVERY wrap is untouched.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetConfirmRequest' }
      responses:
        '204': { description: The password was reset. }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
components:
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    LoginResponse:
      type: object
      required: [sessionToken, user, keyBag]
      properties:
        sessionToken: { type: string }
        user: { $ref: './common.openapi.yaml#/components/schemas/UserSummary' }
        keyBag: { $ref: '#/components/schemas/KeyBag' }
    KeyBag:
      type: object
      description: The wrapped key material needed to unlock the master key client-side.
      required: [identityPublicKey, wrappedIdentityPrivateKey, masterKeyWraps]
      properties:
        identityPublicKey: { $ref: './common.openapi.yaml#/components/schemas/IdentityPublicKey' }
        wrappedIdentityPrivateKey: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
        masterKeyWraps:
          type: array
          items: { $ref: './common.openapi.yaml#/components/schemas/MasterKeyWrap' }
    PersonalScopeGrant:
      type: object
      required: [scopeId, scopePublicKey, wrappedScopePrivateKey]
      properties:
        scopeId: { type: string }
        scopePublicKey: { $ref: './common.openapi.yaml#/components/schemas/KemPublicKey' }
        wrappedScopePrivateKey: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
    PasswordResetRequestRequest:
      type: object
      required: [email]
      properties:
        email: { type: string }
    PasswordResetTokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
    PasswordResetMaterial:
      type: object
      required: [email, recoveryWrap]
      properties:
        email: { type: string, description: 'The account email (so the reset screen can show whose account).' }
        recoveryWrap: { $ref: './common.openapi.yaml#/components/schemas/MasterKeyWrap' }
    PasswordResetConfirmRequest:
      type: object
      required: [token, masterKeyWrap, authVerifier]
      properties:
        token: { type: string }
        masterKeyWrap: { $ref: './common.openapi.yaml#/components/schemas/MasterKeyWrap' }
        authVerifier: { $ref: './common.openapi.yaml#/components/schemas/AuthVerifier' }
