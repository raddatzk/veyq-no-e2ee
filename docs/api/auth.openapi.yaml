openapi: 3.1.0
info:
  title: veyq auth
  version: 0.1.0
paths:
  /api/login:
    post:
      tags: [Login]
      operationId: login
      summary: Authenticate (password) and receive a session + the wrapped key bag.
      description: >
        The server verifies the password against the stored Argon2id auth verifier, issues a session
        token and returns the wrapped key bag (ciphertext only). The master key is never sent — unlock
        happens client-side from the returned blobs (auth != unlock).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Session token + wrapped key bag.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
  /api/auth/refresh:
    post:
      tags: [Login]
      operationId: refreshSession
      summary: Rotate the HttpOnly refresh cookie and receive a fresh access session token.
      description: >
        Refresh restores server authentication only. It never returns key material; a client that wants to
        continue decrypting after reload must also have a local device-unlock state for the E2EE keys.
        The refresh token is held in an HttpOnly SameSite=Lax cookie and stored server-side only as a hash.
      responses:
        '200':
          description: Fresh access session token; the refresh cookie is rotated in Set-Cookie.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefreshSessionResponse' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
  /api/me:
    get:
      tags: [Login]
      operationId: getCurrentUser
      summary: The authenticated user for a session token (proves the session resolves).
      parameters:
        - name: Authorization
          in: header
          required: true
          description: 'Bearer <sessionToken>'
          schema: { type: string }
      responses:
        '200':
          description: The current user.
          content:
            application/json:
              schema: { $ref: './common.openapi.yaml#/components/schemas/UserSummary' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
  /api/me/profile:
    patch:
      tags: [Login]
      operationId: updateCurrentProfile
      summary: Update low-sensitivity profile fields for the authenticated user.
      description: >
        Updates server-visible identity metadata. This endpoint intentionally does not change email,
        credentials or device wraps; those require their own verification/key-wrap flows.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: The updated current user.
          content:
            application/json:
              schema: { $ref: './common.openapi.yaml#/components/schemas/UserSummary' }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
  /api/me/avatar:
    get:
      tags: [Login]
      operationId: getCurrentAvatar
      summary: Read the authenticated user's profile image bytes.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
      responses:
        '200':
          description: Profile image bytes.
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
    put:
      tags: [Login]
      operationId: updateCurrentAvatar
      summary: Upload profile image bytes for the authenticated user.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAvatarRequest' }
      responses:
        '200':
          description: The updated current user.
          content:
            application/json:
              schema: { $ref: './common.openapi.yaml#/components/schemas/UserSummary' }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
    delete:
      tags: [Login]
      operationId: deleteCurrentAvatar
      summary: Remove the authenticated user's profile image.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
      responses:
        '200':
          description: The updated current user.
          content:
            application/json:
              schema: { $ref: './common.openapi.yaml#/components/schemas/UserSummary' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
  /api/me/password:
    post:
      tags: [Login]
      operationId: changeCurrentPassword
      summary: Change the password and replace the PASSWORD master-key wrap.
      description: >
        Authenticated and re-authenticated with the current password. The client keeps the Master Key
        unchanged, submits a new PASSWORD wrap and auth verifier, and the server invalidates all sessions.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204': { description: Password changed; sessions invalidated. }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
  /api/me/account:
    delete:
      tags: [Login]
      operationId: deleteCurrentAccount
      summary: Delete the current account by credential and key erasure.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteAccountRequest' }
      responses:
        '204': { description: Account credentials/key material were erased and the profile anonymized. }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '409': { $ref: './common.openapi.yaml#/components/responses/Conflict' }
  /api/me/session:
    delete:
      tags: [Login]
      operationId: logout
      summary: Invalidate the caller's current session token (logout).
      description: >
        Deletes the session row for the presented bearer token so it can never resolve again. Idempotent —
        an unknown or already-expired token still returns 204. Holds no key material; unlock state is local.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
      responses:
        '204': { description: The session was invalidated (or did not exist). }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
  /api/me/devices:
    get:
      tags: [LoginDevices]
      operationId: listLoginDevices
      summary: List active login devices for the authenticated user.
      description: >
        Groups active server sessions by the client-generated device identifier. The human-readable device
        name is stored as client-encrypted opaque text; the server can invalidate sessions for a device
        without learning the name or any key material.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
      responses:
        '200':
          description: Active login devices.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginDeviceList' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
  /api/me/devices/current:
    put:
      tags: [LoginDevices]
      operationId: registerCurrentLoginDevice
      summary: Attach a client device identifier and encrypted name to the current session.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterLoginDeviceRequest' }
      responses:
        '204': { description: The current session was associated with the login device. }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
  /api/me/devices/{deviceRef}:
    put:
      tags: [LoginDevices]
      operationId: renameLoginDevice
      summary: Update the encrypted display name for one login device.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - name: deviceRef
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenameLoginDeviceRequest' }
      responses:
        '204': { description: The encrypted device name was updated. }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
    delete:
      tags: [LoginDevices]
      operationId: removeLoginDevice
      summary: Sign out all active sessions for one login device.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - name: deviceRef
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: All sessions for that device identifier were invalidated. }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
  /api/me/personal-scope:
    get:
      tags: [Login]
      operationId: getPersonalScope
      summary: Return the authenticated user's personal root scope grant.
      description: >
        The personal scope is self-owned and unshared. The server returns only the public scope key and
        the scope private key wrapped to the authenticated user's identity key.
      parameters:
        - name: Authorization
          in: header
          required: true
          description: 'Bearer <sessionToken>'
          schema: { type: string }
      responses:
        '200':
          description: The user's personal root scope grant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalScopeGrant' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/{tenantName}/profiles/{userPermalink}:
    get:
      tags: [Profiles]
      operationId: getUserProfile
      summary: Read a tenant-visible user profile by profile address.
      description: >
        Returns server-visible identity metadata for a user visible in the tenant. It deliberately does not
        expose a server-side participant-to-Memory graph; clients aggregate person-centric memories from
        decrypted participant payloads they already can access.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: tenantName, in: path, required: true, schema: { type: string } }
        - { name: userPermalink, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Tenant-visible profile metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfileSummary' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/{tenantName}/profiles/{userPermalink}/avatar:
    get:
      tags: [Profiles]
      operationId: getUserProfileAvatar
      summary: Read a tenant-visible profile image.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: tenantName, in: path, required: true, schema: { type: string } }
        - { name: userPermalink, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Profile image bytes.
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  # --- Password reset (Secret Key + email). One tag per op so the jaxrs-spec greedy class-@Path on the
  # shared /api/account/password-reset prefix can't shadow sibling routes (see the codegen gotcha doc).
  /api/account/password-reset/request:
    post:
      tags: [PasswordResetRequest]
      operationId: requestPasswordReset
      summary: Request a password reset — email a one-time token to the address (if an account exists).
      description: >
        Always returns 204 (never reveals whether an account exists). If the email maps to an account with a
        RECOVERY wrap, the server emails a one-time reset link. The token is the email second factor; the
        Secret Key (entered later) is the crypto factor.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequestRequest' }
      responses:
        '204': { description: Accepted (an email was sent iff the account exists). }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
  /api/account/password-reset/material:
    post:
      tags: [PasswordResetMaterial]
      operationId: getPasswordResetMaterial
      summary: Exchange a valid reset token for the account's RECOVERY master-key wrap.
      description: >
        Gated by the email-delivered token (proves email control). Returns the RECOVERY wrap (master key
        wrapped under the Secret Key) so the client can unwrap the master key with the Secret Key. Invalid,
        expired or consumed tokens — or an account without a recovery wrap — return 400.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetTokenRequest' }
      responses:
        '200':
          description: The recovery wrap + the account email (for display).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordResetMaterial' }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
  /api/account/password-reset/confirm:
    post:
      tags: [PasswordResetConfirm]
      operationId: confirmPasswordReset
      summary: Complete a reset — swap the PASSWORD master-key wrap + auth verifier, invalidate sessions.
      description: >
        Gated by the same token. The client has unwrapped the master key with the Secret Key and re-wrapped
        it under the new password; this submits the new PASSWORD wrap + auth verifier. The server replaces
        them, consumes the token and invalidates all of the user's sessions. The RECOVERY wrap is untouched.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetConfirmRequest' }
      responses:
        '204': { description: The password was reset. }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
  # --- Email change (authenticated request → token emailed to the NEW address → token-gated confirm).
  # One tag per op (greedy class-@Path gotcha). Email is NOT part of key derivation, so this is a pure
  # identifier swap — no re-wrap. Confirm is token-only (control of the new inbox is the proof), like reset.
  /api/account/email-change/request:
    post:
      tags: [EmailChangeRequest]
      operationId: requestEmailChange
      summary: Request an email change — emails a one-time confirmation token to the NEW address.
      description: >
        Authenticated. Starts a change to the caller's account email. The new address must be free. A
        one-time token is emailed to the NEW address; confirming it (separately) commits the change.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailChangeRequestRequest' }
      responses:
        '204': { description: A confirmation email was sent to the new address. }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '409': { description: The requested email address is already in use. }
  /api/account/email-change/confirm:
    post:
      tags: [EmailChangeConfirm]
      operationId: confirmEmailChange
      summary: Confirm an email change with the token emailed to the new address.
      description: >
        Token-gated (no session required): control of the new inbox is the proof, so the link works on any
        device. Consumes the token and swaps the account email. Returns the updated user.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailChangeConfirmRequest' }
      responses:
        '200':
          description: The updated current user.
          content:
            application/json:
              schema: { $ref: './common.openapi.yaml#/components/schemas/UserSummary' }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '409': { description: The requested email address is already in use. }
components:
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, x-field-extra-annotation: ['@field:com.veyq.app.shared.validation.Email'] }
        password: { type: string, x-field-extra-annotation: ['@field:jakarta.validation.constraints.Size(max = 1024)'] }
    LoginResponse:
      type: object
      required: [sessionToken, user, keyBag]
      properties:
        sessionToken: { type: string }
        user: { $ref: './common.openapi.yaml#/components/schemas/UserSummary' }
        keyBag: { $ref: '#/components/schemas/KeyBag' }
    RefreshSessionResponse:
      type: object
      required: [sessionToken]
      properties:
        sessionToken: { type: string, description: Fresh opaque bearer access token. }
    RegisterLoginDeviceRequest:
      type: object
      required: [deviceRef, encryptedName]
      properties:
        deviceRef: { type: string, maxLength: 255, x-field-extra-annotation: ['@field:jakarta.validation.constraints.Size(max = 255)'] }
        encryptedName: { type: string, maxLength: 16384, x-field-extra-annotation: ['@field:jakarta.validation.constraints.Size(max = 16384)'] }
    RenameLoginDeviceRequest:
      type: object
      required: [encryptedName]
      properties:
        encryptedName: { type: string, maxLength: 16384, x-field-extra-annotation: ['@field:jakarta.validation.constraints.Size(max = 16384)'] }
    LoginDeviceSummary:
      type: object
      required: [deviceRef, encryptedName, lastLoginAt]
      properties:
        deviceRef: { type: string }
        encryptedName: { type: string, description: Client-encrypted human-readable device/login name. }
        lastLoginAt: { type: string, format: date-time }
    LoginDeviceList:
      type: object
      required: [devices]
      properties:
        devices:
          type: array
          items: { $ref: '#/components/schemas/LoginDeviceSummary' }
    UpdateProfileRequest:
      type: object
      required: [displayName, permalink]
      properties:
        displayName: { type: string, x-field-extra-annotation: ['@field:com.veyq.app.shared.validation.DisplayName'] }
        permalink:
          type: string
          maxLength: 80
          pattern: '^[a-z0-9](?:[a-z0-9-]{0,78}[a-z0-9])?$'
          x-field-extra-annotation: ['@field:jakarta.validation.constraints.Size(max = 80)']
    UpdateAvatarRequest:
      type: object
      required: [contentType, bytes]
      properties:
        contentType: { type: string, enum: [image/png, image/jpeg, image/webp] }
        bytes:
          type: string
          format: byte
          maxLength: 700000
          x-field-extra-annotation: ['@field:jakarta.validation.constraints.Size(max = 700000)']
    ChangePasswordRequest:
      type: object
      required: [currentPassword, masterKeyWrap, authVerifier]
      properties:
        currentPassword: { type: string, x-field-extra-annotation: ['@field:jakarta.validation.constraints.Size(max = 1024)'] }
        masterKeyWrap: { $ref: './common.openapi.yaml#/components/schemas/MasterKeyWrap' }
        authVerifier: { $ref: './common.openapi.yaml#/components/schemas/AuthVerifier' }
    DeleteAccountRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, x-field-extra-annotation: ['@field:jakarta.validation.constraints.Size(max = 1024)'] }
    UserProfileSummary:
      type: object
      required: [id, displayName, permalink, initials, memories]
      properties:
        id: { type: string }
        displayName: { type: string }
        permalink: { type: string }
        initials: { type: string }
        avatarUrl: { type: string }
        memories:
          type: array
          # Person-centric memory aggregation is client-side from decrypted participant payloads. The backend
          # returns an empty list for now to avoid exposing a plaintext Memory-person graph.
          items: { type: object }
    KeyBag:
      type: object
      description: The wrapped key material needed to unlock the master key client-side.
      required: [identityPublicKey, wrappedIdentityPrivateKey, masterKeyWraps]
      properties:
        identityPublicKey: { $ref: './common.openapi.yaml#/components/schemas/IdentityPublicKey' }
        wrappedIdentityPrivateKey: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
        masterKeyWraps:
          type: array
          items: { $ref: './common.openapi.yaml#/components/schemas/MasterKeyWrap' }
    PersonalScopeGrant:
      type: object
      required: [scopeId, scopePublicKey, wrappedScopePrivateKey]
      properties:
        scopeId: { type: string }
        scopePublicKey: { $ref: './common.openapi.yaml#/components/schemas/KemPublicKey' }
        wrappedScopePrivateKey: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
    PasswordResetRequestRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, x-field-extra-annotation: ['@field:com.veyq.app.shared.validation.Email'] }
    PasswordResetTokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, x-field-extra-annotation: ['@field:jakarta.validation.constraints.Size(max = 512)'] }
    PasswordResetMaterial:
      type: object
      required: [email, recoveryWrap]
      properties:
        email: { type: string, description: 'The account email (so the reset screen can show whose account).', x-field-extra-annotation: ['@field:com.veyq.app.shared.validation.Email'] }
        recoveryWrap: { $ref: './common.openapi.yaml#/components/schemas/MasterKeyWrap' }
    PasswordResetConfirmRequest:
      type: object
      required: [token, masterKeyWrap, authVerifier, recoveryAuthTag]
      properties:
        token: { type: string, x-field-extra-annotation: ['@field:jakarta.validation.constraints.Size(max = 512)'] }
        masterKeyWrap: { $ref: './common.openapi.yaml#/components/schemas/MasterKeyWrap' }
        authVerifier: { $ref: './common.openapi.yaml#/components/schemas/AuthVerifier' }
        # SHA-256("veyq/v1/recovery-auth" || masterKey), base64url. Must match the commitment stored at
        # registration — proves the client recovered the real master key with the Secret Key. Without it,
        # an email-token-only attacker could reset the password verifier and hijack the server account.
        recoveryAuthTag: { type: string, x-field-extra-annotation: ['@field:jakarta.validation.constraints.Size(max = 128)'] }
    EmailChangeRequestRequest:
      type: object
      required: [newEmail]
      properties:
        newEmail: { type: string, x-field-extra-annotation: ['@field:com.veyq.app.shared.validation.Email'] }
    EmailChangeConfirmRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, x-field-extra-annotation: ['@field:jakarta.validation.constraints.Size(max = 512)'] }
