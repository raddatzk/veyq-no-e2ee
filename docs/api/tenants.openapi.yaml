            userId: 2
            email: invitee@example.test
            displayName: Invitee
            role: TenantMember
            status: Pending
  schemas:
    TenantRole:
      type: string
      enum:
      - TenantOwner
      - TenantMember
    TenantUserStatus:
      type: string
      enum:
      - Pending
      - Active
    CreateTenantRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - displayName
      - domain
      properties:
        name:
          type: string
          x-field-extra-annotation:
            - '@field:com.veyq.api.common.validation.Normalize'
        displayName:
          "$ref": "./common.openapi.yaml#/components/schemas/DisplayName"
        domain:
          type: string
          x-field-extra-annotation:
            - '@field:com.veyq.api.common.validation.Host'
      example:
        name: friends
        displayName: Friends
        domain: friends.example.test
    TenantSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - displayName
      - domain
      - role
      - admins
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        displayName:
          type: string
        domain:
          type: string
        logoUrl:
          type: string
        role:
          "$ref": "#/components/schemas/TenantRole"
        admins:
          type: array
          items:
            "$ref": "./common.openapi.yaml#/components/schemas/UserSummary"
      example:
        id: 42
        name: friends
        displayName: Friends
        domain: friends.example.test
        logoUrl: /api/tenants/friends/logo?v=2026-05-27T10%3A00%3A00Z
        role: TenantOwner
        admins:
          - userId: 1
            email: kevin@example.test
            displayName: Kevin
            permalink: kevin
            serverRole: ServerOwner
            passkeyCount: 1
            hasPassword: true
    TenantsSummary:
      type: object
      additionalProperties: false
      required:
      - tenants
      properties:
        tenants:
          type: array
          items:
            "$ref": "#/components/schemas/TenantSummary"
      example:
        tenants:
          - id: 42
            name: friends
            displayName: Friends
            domain: friends.example.test
            logoUrl: /api/tenants/friends/logo?v=2026-05-27T10%3A00%3A00Z
            role: TenantOwner
            admins:
              - userId: 1
                email: kevin@example.test
                displayName: Kevin
                permalink: kevin
                serverRole: ServerOwner
                passkeyCount: 1
                hasPassword: true
    TenantSettingsResponse:
      type: object
      additionalProperties: false
      required:
      - tenantId
      - name
      - displayName
      - termsVersion
      properties:
        tenantId:
          type: integer
          format: int64
        name:
          type: string
        displayName:
          type: string
        logoUrl:
          type: string
        termsVersion:
          type: integer
          format: int32
          minimum: 0
        termsMarkdownByLocale:
          "$ref": "#/components/schemas/MarkdownByLocale"
      example:
        tenantId: 42
        name: friends
        displayName: Friends
        logoUrl: /api/tenants/friends/logo?v=2026-05-27T10%3A00%3A00Z
        termsVersion: 1
        termsMarkdownByLocale:
          en: |-
            # Terms for this area

            Contact: Tenant Owner
    TenantUserSettingsResponse:
      type: object
      additionalProperties: false
      required:
      - tenantId
      - tenantName
      - userId
      - displayName
      properties:
        tenantId:
          type: integer
          format: int64
        tenantName:
          type: string
        userId:
          type: integer
          format: int64
        displayName:
          type: string
      example:
        tenantId: 42
        tenantName: friends
        userId: 1
        displayName: Kevin
    TenantGroupSettingsResponse:
      type: object
      additionalProperties: false
      required:
      - groupId
      - name
      - displayName
      properties:
        groupId:
          type: integer
          format: int64
        name:
          type: string
        displayName:
          type: string
