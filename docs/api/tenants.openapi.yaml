openapi: 3.1.0
info:
  title: veyq tenant provisioning
  version: 0.1.0
paths:
  /api/tenants:
    post:
      tags: [TenantProvisioning]
      operationId: createTenant
      summary: Create a tenant shell (metadata only — no content keys). Server Owner only.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTenantRequest' }
      responses:
        '200':
          description: The created (PENDING) tenant shell.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantSummary' }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '409': { $ref: './common.openapi.yaml#/components/responses/Conflict' }
  /api/tenants/{tenantId}/owner-invite:
    post:
      tags: [TenantProvisioning]
      operationId: issueOwnerInvite
      summary: Issue a single-use owner-claim invitation. Server Owner only.
      description: >
        Returns a one-time bootstrap secret; the client places it in the invite URL fragment. The server
        stores only its hash. Claiming the (empty) tenant is an ownership claim — there are no scope keys
        to temp-wrap; the claimer's client mints the tenant scope keypair.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: tenantId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The owner invitation (bootstrap secret shown once).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerInvite' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/tenants/{tenantId}/member-invites:
    post:
      tags: [MemberInvites]
      operationId: issueMemberInvite
      summary: Issue a temp-wrap member invite carrying the scope keys wrapped to a one-time temp key.
      description: >
        A key-holding Tenant Owner wraps the tenant scope private key to a one-time temp public key and
        issues an invite. The temp private key travels in the invite URL fragment (never to the server);
        a new user unwraps with it and re-wraps the scope to their own identity during
        register-via-invitation. The server stores only the temp public key + ciphertext.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: tenantId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssueMemberInviteRequest' }
      responses:
        '200':
          description: The member invitation (bootstrap secret shown once).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerInvite' }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/tenant-invites/{inviteId}:
    get:
      tags: [TenantProvisioning]
      operationId: getTenantInvite
      summary: Public invite metadata (the bootstrap secret is never sent to the server here).
      parameters:
        - { name: inviteId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Public invite metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantInviteInfo' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/tenant-invites/{inviteId}/claim:
    post:
      tags: [TenantProvisioning]
      operationId: claimTenantOwnership
      summary: Claim ownership of an empty tenant; the caller becomes its first key-holder.
      description: >
        The authenticated existing user presents the bootstrap secret, the freshly minted tenant scope
        public key and the scope private key wrapped to their own identity public key (a self scope
        grant). The server activates the tenant + membership and stores ciphertext only.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: inviteId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimTenantOwnershipRequest' }
      responses:
        '200':
          description: The activated tenant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantSummary' }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.openapi.yaml#/components/responses/Conflict' }
  /api/tenant-invites/{inviteId}/register:
    post:
      tags: [RegisterViaInvitation]
      operationId: registerViaInvitation
      summary: Register a brand-new account from an owner invite and claim the tenant in one step.
      description: >
        The invitee (not yet authenticated) presents the bootstrap secret together with all freshly
        generated key material — identity public key, the wrapped identity private key, master-key
        unlock wraps and an auth verifier — plus the minted tenant scope public key and the scope
        private key wrapped to their own identity (a self scope grant). The server creates the account,
        activates the tenant + Owner membership, consumes the invite and issues a session. It stores
        ciphertext + public material only; it never sees a private key.
      parameters:
        - { name: inviteId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterViaInvitationRequest' }
      responses:
        '200':
          description: The new account's session + the activated tenant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterViaInvitationResponse' }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.openapi.yaml#/components/responses/Conflict' }
  /api/tenants/{tenantId}/scope:
    get:
      tags: [TenantProvisioning]
      operationId: getMyScopeGrant
      summary: The caller's scope grant for a tenant (wrapped scope private key + scope public key).
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: tenantId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The caller's scope grant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyScopeGrant' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/tenants/{tenantId}/members/{userId}:
    delete:
      tags: [MemberRemoval]
      operationId: removeMember
      summary: Remove a member — revoke their scope grant + sessions (the instant layer of AD-24).
      description: >
        A Tenant Owner soft-removes a member: the membership becomes REMOVED (rejoinable), the member's
        scope grant is deleted and their sessions are invalidated, so the server immediately stops
        handing them keys or resolving their tokens. Eventual scope-key rotation is a separate step —
        already-downloaded content cannot be retracted (AD-24).
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: tenantId, in: path, required: true, schema: { type: string } }
        - { name: userId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The removed membership.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MembershipSummary' }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/tenants/{tenantId}/grants:
    post:
      tags: [TenantMembers]
      operationId: grantScopeAccess
      summary: Grant an existing user access to the tenant scope and assign a role (direct wrap).
      description: >
        A Tenant Owner who holds the tenant scope re-wraps its private key to an existing user's
        published identity public key (from the key directory) and assigns a role. The server verifies
        the caller is an Owner holding the scope (you can only grant what you can read), then stores the
        recipient's grant (ciphertext only) and their membership. No temp-wrap: the recipient already
        has an identity, so their client unwraps the grant directly.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: tenantId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrantScopeAccessRequest' }
      responses:
        '200':
          description: The recipient's membership.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MembershipSummary' }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
components:
  schemas:
    CreateTenantRequest:
      type: object
      required: [name, displayName]
      properties:
        name: { type: string, description: Unique slug-like tenant name. }
        displayName: { type: string }
        domain: { type: string }
    TenantSummary:
      type: object
      required: [id, name, displayName, status]
      properties:
        id: { type: string }
        name: { type: string }
        displayName: { type: string }
        domain: { type: string }
        status: { type: string, enum: [PENDING, ACTIVE] }
    OwnerInvite:
      type: object
      required: [inviteId, bootstrapSecret, expiresAt]
      properties:
        inviteId: { type: string }
        bootstrapSecret: { type: string, description: One-time secret (base64url); goes in the URL fragment. }
        expiresAt: { type: string, format: date-time }
    GrantScopeAccessRequest:
      type: object
      required: [recipientUserId, role, wrappedScopePrivateKey]
      properties:
        recipientUserId: { type: string }
        role: { type: string, enum: [Owner, Member] }
        wrappedScopePrivateKey:
          $ref: './common.openapi.yaml#/components/schemas/Blob'
          description: The tenant scope private key wrapped to the recipient's identity public key.
    MembershipSummary:
      type: object
      required: [tenantId, userId, role, status]
      properties:
        tenantId: { type: string }
        userId: { type: string }
        role: { type: string }
        status: { type: string }
    TenantInviteInfo:
      type: object
      required: [inviteId, tenant, role, status, kind]
      properties:
        inviteId: { type: string }
        tenant: { $ref: '#/components/schemas/TenantSummary' }
        role: { type: string }
        status: { type: string, enum: [PENDING, CONSUMED, REVOKED] }
        kind: { type: string, enum: [OWNER, MEMBER] }
        scopePublicKey:
          $ref: './common.openapi.yaml#/components/schemas/KemPublicKey'
          description: MEMBER invites only — the existing scope's public key.
        tempPublicKey:
          $ref: './common.openapi.yaml#/components/schemas/KemPublicKey'
          description: MEMBER invites only — the onboarding temp keypair public key.
        tempWrappedScopePrivateKey:
          $ref: './common.openapi.yaml#/components/schemas/Blob'
          description: MEMBER invites only — the scope private key wrapped to the temp public key.
    IssueMemberInviteRequest:
      type: object
      required: [role, tempPublicKey, tempWrappedScopePrivateKey]
      properties:
        role: { type: string, enum: [Owner, Member] }
        tempPublicKey: { $ref: './common.openapi.yaml#/components/schemas/KemPublicKey' }
        tempWrappedScopePrivateKey: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
    ClaimTenantOwnershipRequest:
      type: object
      required: [bootstrapSecret, scopePublicKey, wrappedScopePrivateKey]
      properties:
        bootstrapSecret: { type: string }
        scopePublicKey: { $ref: './common.openapi.yaml#/components/schemas/KemPublicKey' }
        wrappedScopePrivateKey: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
    MyScopeGrant:
      type: object
      required: [scopeId, scopePublicKey, wrappedScopePrivateKey]
      properties:
        scopeId: { type: string }
        scopePublicKey: { $ref: './common.openapi.yaml#/components/schemas/KemPublicKey' }
        wrappedScopePrivateKey: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
    RegisterViaInvitationRequest:
      type: object
      required:
        [bootstrapSecret, email, displayName, identityPublicKey, wrappedIdentityPrivateKey,
         masterKeyWraps, authVerifier, personalScopePublicKey, wrappedPersonalScopePrivateKey,
         scopePublicKey, wrappedScopePrivateKey]
      properties:
        bootstrapSecret: { type: string }
        email: { type: string }
        displayName: { type: string }
        identityPublicKey: { $ref: './common.openapi.yaml#/components/schemas/IdentityPublicKey' }
        wrappedIdentityPrivateKey: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
        masterKeyWraps:
          type: array
          minItems: 1
          items: { $ref: './common.openapi.yaml#/components/schemas/MasterKeyWrap' }
        authVerifier: { $ref: './common.openapi.yaml#/components/schemas/AuthVerifier' }
        personalScopePublicKey: { $ref: './common.openapi.yaml#/components/schemas/KemPublicKey' }
        wrappedPersonalScopePrivateKey: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
        scopePublicKey: { $ref: './common.openapi.yaml#/components/schemas/KemPublicKey' }
        wrappedScopePrivateKey: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
    RegisterViaInvitationResponse:
      type: object
      required: [sessionToken, user, tenant]
      properties:
        sessionToken: { type: string }
        user: { $ref: './common.openapi.yaml#/components/schemas/UserSummary' }
        tenant: { $ref: '#/components/schemas/TenantSummary' }
