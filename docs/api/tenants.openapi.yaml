components:
  securitySchemes:
    accessTokenCookie:
      type: apiKey
      in: cookie
      name: LUNVA_ACCESS_TOKEN
  parameters:
    TenantName:
      name: tenantName
      in: path
      required: true
      schema:
        type: string
    GroupName:
      name: groupName
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Request failed.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
          example:
            message: example
  schemas:
    TenantRole:
      type: string
      enum:
      - TenantOwner
      - TenantMember
    CreateTenantRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - displayName
      - domain
      properties:
        name:
          type: string
        displayName:
          type: string
        domain:
          type: string
    TenantSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - displayName
      - domain
      - role
      - admins
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        displayName:
          type: string
        domain:
          type: string
        role:
          "$ref": "#/components/schemas/TenantRole"
        admins:
          type: array
          items:
            "$ref": "./users.openapi.yaml#/components/schemas/UserSummary"
    TenantsSummary:
      type: object
      additionalProperties: false
      required:
      - tenants
      properties:
        tenants:
          type: array
          items:
            "$ref": "#/components/schemas/TenantSummary"
    TenantSettingsResponse:
      type: object
      additionalProperties: false
      required:
      - tenantId
      - name
      - displayName
      properties:
        tenantId:
          type: integer
          format: int64
        name:
          type: string
        displayName:
          type: string
    TenantUserSettingsResponse:
      type: object
      additionalProperties: false
      required:
      - tenantId
      - tenantName
      - userId
      - displayName
      properties:
        tenantId:
          type: integer
          format: int64
        tenantName:
          type: string
        userId:
          type: integer
          format: int64
        displayName:
          type: string
    GroupSettingsResponse:
      type: object
      additionalProperties: false
      required:
      - groupId
      - name
      - displayName
      properties:
        groupId:
          type: integer
          format: int64
        name:
          type: string
        displayName:
          type: string
    UpdateNamedSettingsRequest:
      type: object
      additionalProperties: false
      required:
      - displayName
      properties:
        displayName:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
      - message
      properties:
        message:
          type: string
