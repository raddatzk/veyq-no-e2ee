---
openapi: 3.1.0
info:
  title: Lunva Tenants API
  version: 0.1.0
  description: >-
    API-first Zielvertrag fuer Lunva Tenants API. Operationen enthalten Beispiele, Vorbedingungen und den aktuellen Implementierungsstatus.
servers:
- url: "/"
security:
- accessTokenCookie: []
tags:
- name: Tenants
paths:
  "/api/tenants":
    get:
      tags:
      - Tenants
      operationId: myTenants
      responses:
        '200':
          "$ref": "#/components/responses/Tenants"
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
      summary: Eigene Tenants auflisten
      x-implementation-status: partial
      x-preconditions:
      - Ein gueltiger LUNVA_ACCESS_TOKEN Cookie muss vorhanden sein.
      - Das initiale Setup muss abgeschlossen sein.
      description: |-
        Eigene Tenants auflisten.

        Vorbedingungen:
        - Ein gueltiger LUNVA_ACCESS_TOKEN Cookie muss vorhanden sein.
        - Das initiale Setup muss abgeschlossen sein.

        Implementierungsstatus: partial.
    post:
      tags:
      - Tenants
      operationId: createTenant
      requestBody:
        "$ref": "#/components/requestBodies/CreateTenant"
      responses:
        '200':
          "$ref": "#/components/responses/Tenant"
        '400':
          "$ref": "./common.openapi.yaml#/components/responses/400"
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
        '403':
          "$ref": "./common.openapi.yaml#/components/responses/403"
        '409':
          "$ref": "./common.openapi.yaml#/components/responses/409"
      summary: Tenant anlegen
      x-implementation-status: partial
      x-preconditions:
      - Ein gueltiger LUNVA_ACCESS_TOKEN Cookie muss vorhanden sein.
      - Das initiale Setup muss abgeschlossen sein.
      - Der aktuelle Benutzer muss ServerOwner sein.
      x-required-role: ServerOwner
      description: |-
        Tenant anlegen.

        Vorbedingungen:
        - Ein gueltiger LUNVA_ACCESS_TOKEN Cookie muss vorhanden sein.
        - Das initiale Setup muss abgeschlossen sein.
        - Der aktuelle Benutzer muss ServerOwner sein.

        Implementierungsstatus: partial.
  "/api/tenants/{tenantName}/settings":
    get:
      tags:
      - Tenants
      operationId: getTenantSettings
      parameters:
      - "$ref": "./common.openapi.yaml#/components/parameters/TenantName"
      responses:
        '200':
          "$ref": "#/components/responses/TenantSettings"
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
        '403':
          "$ref": "./common.openapi.yaml#/components/responses/403"
        '404':
          "$ref": "./common.openapi.yaml#/components/responses/404"
      summary: Tenant-Einstellungen abrufen
      x-implementation-status: partial
      x-preconditions:
      - Ein gueltiger LUNVA_ACCESS_TOKEN Cookie muss vorhanden sein.
      - Das initiale Setup muss abgeschlossen sein.
      - Der aktuelle Benutzer muss Mitglied des Tenant-Pfads sein.
      x-required-membership: TenantMember
      description: |-
        Tenant-Einstellungen abrufen.

        Vorbedingungen:
        - Ein gueltiger LUNVA_ACCESS_TOKEN Cookie muss vorhanden sein.
        - Das initiale Setup muss abgeschlossen sein.
        - Der aktuelle Benutzer muss Mitglied des Tenant-Pfads sein.

        Implementierungsstatus: partial.
    put:
      tags:
      - Tenants
      operationId: updateTenantSettings
      parameters:
      - "$ref": "./common.openapi.yaml#/components/parameters/TenantName"
      requestBody:
        "$ref": "#/components/requestBodies/UpdateTenantSettings"
      responses:
        '200':
          "$ref": "#/components/responses/TenantSettings"
        '400':
          "$ref": "./common.openapi.yaml#/components/responses/400"
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
        '403':
          "$ref": "./common.openapi.yaml#/components/responses/403"
        '404':
          "$ref": "./common.openapi.yaml#/components/responses/404"
      summary: Tenant-Einstellungen aktualisieren
      x-implementation-status: partial
      x-preconditions:
      - Ein gueltiger LUNVA_ACCESS_TOKEN Cookie muss vorhanden sein.
      - Das initiale Setup muss abgeschlossen sein.
      - Der aktuelle Benutzer muss Mitglied des Tenant-Pfads sein.
      - Der aktuelle Benutzer muss TenantOwner sein.
      x-required-membership: TenantMember
      description: |-
        Tenant-Einstellungen aktualisieren.

        Vorbedingungen:
        - Ein gueltiger LUNVA_ACCESS_TOKEN Cookie muss vorhanden sein.
        - Das initiale Setup muss abgeschlossen sein.
        - Der aktuelle Benutzer muss Mitglied des Tenant-Pfads sein.
        - Der aktuelle Benutzer muss TenantOwner sein.

        Implementierungsstatus: partial.
  "/api/tenants/{tenantName}/me":
    get:
      tags:
      - Tenants
      operationId: getTenantUserSettings
      parameters:
      - "$ref": "#/components/parameters/TenantName"
      responses:
        '200':
          "$ref": "#/components/responses/TenantUserSettings"
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
        '403':
          "$ref": "./common.openapi.yaml#/components/responses/403"
        '404':
          "$ref": "./common.openapi.yaml#/components/responses/404"
      summary: Benutzereinstellungen im Tenant abrufen
      x-implementation-status: partial
      x-preconditions:
      - Ein gueltiger LUNVA_ACCESS_TOKEN Cookie muss vorhanden sein.
      - Das initiale Setup muss abgeschlossen sein.
      - Der aktuelle Benutzer muss Mitglied des Tenant-Pfads sein.
      x-required-membership: TenantMember
      description: |-
        Benutzereinstellungen im Tenant abrufen.

        Vorbedingungen:
        - Ein gueltiger LUNVA_ACCESS_TOKEN Cookie muss vorhanden sein.
        - Das initiale Setup muss abgeschlossen sein.
        - Der aktuelle Benutzer muss Mitglied des Tenant-Pfads sein.

        Implementierungsstatus: partial.
    put:
      tags:
      - Tenants
      operationId: updateTenantUserSettings
      parameters:
      - "$ref": "./common.openapi.yaml#/components/parameters/TenantName"
      responses:
        '200':
          "$ref": "#/components/responses/TenantUserSettings"
        '400':
          "$ref": "./common.openapi.yaml#/components/responses/400"
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
        '403':
          "$ref": "./common.openapi.yaml#/components/responses/403"
        '404':
          "$ref": "./common.openapi.yaml#/components/responses/404"
      summary: Benutzereinstellungen im Tenant aktualisieren
      x-implementation-status: partial
      x-preconditions:
      - Ein gueltiger LUNVA_ACCESS_TOKEN Cookie muss vorhanden sein.
      - Das initiale Setup muss abgeschlossen sein.
      - Der aktuelle Benutzer muss Mitglied des Tenant-Pfads sein.
      x-required-membership: TenantMember
      description: |-
        Benutzereinstellungen im Tenant aktualisieren.

        Vorbedingungen:
        - Ein gueltiger LUNVA_ACCESS_TOKEN Cookie muss vorhanden sein.
        - Das initiale Setup muss abgeschlossen sein.
        - Der aktuelle Benutzer muss Mitglied des Tenant-Pfads sein.

        Implementierungsstatus: partial.
  "/api/tenants/{tenantName}/{groupName}":
    get:
      tags:
      - Tenants
      operationId: getGroupSettings
      parameters:
      - "$ref": "./common.openapi.yaml#/components/parameters/TenantName"
      - "$ref": "./common.openapi.yaml#/components/parameters/GroupName"
      responses:
        '200':
          "$ref": "#/components/responses/TenantGroupSettings"
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
        '403':
          "$ref": "./common.openapi.yaml#/components/responses/403"
        '404':
          "$ref": "./common.openapi.yaml#/components/responses/404"
      summary: Gruppen-Einstellungen abrufen
      x-implementation-status: partial
      x-preconditions:
      - Ein gueltiger LUNVA_ACCESS_TOKEN Cookie muss vorhanden sein.
      - Das initiale Setup muss abgeschlossen sein.
      - Der aktuelle Benutzer muss Mitglied des Tenant-Pfads sein.
      x-required-membership: TenantMember
      description: |-
        Gruppen-Einstellungen abrufen.

        Vorbedingungen:
        - Ein gueltiger LUNVA_ACCESS_TOKEN Cookie muss vorhanden sein.
        - Das initiale Setup muss abgeschlossen sein.
        - Der aktuelle Benutzer muss Mitglied des Tenant-Pfads sein.

        Implementierungsstatus: partial.
    put:
      tags:
      - Tenants
      operationId: updateGroupSettings
      parameters:
        - "$ref": "./common.openapi.yaml#/components/parameters/TenantName"
        - "$ref": "./common.openapi.yaml#/components/parameters/GroupName"
      requestBody:
        "$ref": "#/components/requestBodies/UpdateGroupSettings"
      responses:
        '200':
          "$ref": "#/components/responses/TenantGroupSettings"
        '400':
          "$ref": "./common.openapi.yaml#/components/responses/400"
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
        '403':
          "$ref": "./common.openapi.yaml#/components/responses/403"
        '404':
          "$ref": "./common.openapi.yaml#/components/responses/404"
      summary: Gruppen-Einstellungen aktualisieren
      x-implementation-status: partial
      x-preconditions:
      - Ein gueltiger LUNVA_ACCESS_TOKEN Cookie muss vorhanden sein.
      - Das initiale Setup muss abgeschlossen sein.
      - Der aktuelle Benutzer muss Mitglied des Tenant-Pfads sein.
      - Der aktuelle Benutzer muss GroupOwner der Zielgruppe sein.
      x-required-membership: TenantMember
      description: |-
        Gruppen-Einstellungen aktualisieren.

        Vorbedingungen:
        - Ein gueltiger LUNVA_ACCESS_TOKEN Cookie muss vorhanden sein.
        - Das initiale Setup muss abgeschlossen sein.
        - Der aktuelle Benutzer muss Mitglied des Tenant-Pfads sein.
        - Der aktuelle Benutzer muss GroupOwner der Zielgruppe sein.

        Implementierungsstatus: partial.
components:
  securitySchemes:
    accessTokenCookie:
      type: apiKey
      in: cookie
      name: LUNVA_ACCESS_TOKEN
  parameters:
    TenantName:
      name: tenantName
      in: path
      required: true
      schema:
        type: string
    GroupName:
      name: groupName
      in: path
      required: true
      schema:
        type: string
  requestBodies:
    CreateTenant:
      required: true
      description: New tenant
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/CreateTenantRequest"
          example:
            name: friends
            displayName: Friends
            domain: friends.example.test

    UpdateTenantSettings:
      required: true
      description: Update Tenant settings
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/UpdateTenantSettingsRequest"
          example:
            displayName: Friends & Family

    UpdateGroupSettings:
      required: true
      description: Update group settings
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/UpdateGroupSettingsRequest"
          example:
            displayName: Friends & Family

  responses:
    Tenants:
      description: Tenants visible to the current user.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/TenantsSummary"
          example:
            tenants:
              - id: 42
                name: friends
                displayName: Friends
                domain: friends.example.test
                role: TenantOwner
                admins:
                  - userId: 1
                    email: kevin@example.test
                    displayName: Kevin
                    serverRole: ServerOwner

    Tenant:
      description: Created tenant.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/TenantSummary"
          example:
            id: 42
            name: friends
            displayName: Friends
            domain: friends.example.test
            role: TenantOwner
            admins:
              - userId: 1
                email: kevin@example.test
                displayName: Kevin
                serverRole: ServerOwner

    TenantSettings:
      description: Tenant settings.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/TenantSettingsResponse"
          example:
            tenantId: 42
            name: friends
            displayName: Friends

    TenantUserSettings:
      description: Current settings for a user in a tenant.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/TenantUserSettingsResponse"
          example:
            tenantId: 42
            tenantName: friends
            userId: 1
            displayName: Kevin

    TenantGroupSettings:
      description: Current settings for a group in a tenant.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/TenantGroupSettingsResponse"
          example:
            groupId: 99
            name: family
            displayName: Family
  schemas:
    TenantRole:
      type: string
      enum:
      - TenantOwner
      - TenantMember
    CreateTenantRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - displayName
      - domain
      properties:
        name:
          type: string
        displayName:
          type: string
        domain:
          type: string
      example:
        name: friends
        displayName: Friends
        domain: friends.example.test
    TenantSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - displayName
      - domain
      - role
      - admins
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        displayName:
          type: string
        domain:
          type: string
        role:
          "$ref": "#/components/schemas/TenantRole"
        admins:
          type: array
          items:
            "$ref": "./common.openapi.yaml#/components/schemas/UserSummary"
      example:
        id: 42
        name: friends
        displayName: Friends
        domain: friends.example.test
        role: TenantOwner
        admins:
          - userId: 1
            email: kevin@example.test
            displayName: Kevin
            serverRole: ServerOwner
    TenantsSummary:
      type: object
      additionalProperties: false
      required:
      - tenants
      properties:
        tenants:
          type: array
          items:
            "$ref": "#/components/schemas/TenantSummary"
      example:
        tenants:
          - id: 42
            name: friends
            displayName: Friends
            domain: friends.example.test
            role: TenantOwner
            admins:
              - userId: 1
                email: kevin@example.test
                displayName: Kevin
                serverRole: ServerOwner
    TenantSettingsResponse:
      type: object
      additionalProperties: false
      required:
      - tenantId
      - name
      - displayName
      properties:
        tenantId:
          type: integer
          format: int64
        name:
          type: string
        displayName:
          type: string
      example:
        tenantId: 42
        name: friends
        displayName: Friends
    TenantUserSettingsResponse:
      type: object
      additionalProperties: false
      required:
      - tenantId
      - tenantName
      - userId
      - displayName
      properties:
        tenantId:
          type: integer
          format: int64
        tenantName:
          type: string
        userId:
          type: integer
          format: int64
        displayName:
          type: string
      example:
        tenantId: 42
        tenantName: friends
        userId: 1
        displayName: Kevin
    TenantGroupSettingsResponse:
      type: object
      additionalProperties: false
      required:
      - groupId
      - name
      - displayName
      properties:
        groupId:
          type: integer
          format: int64
        name:
          type: string
        displayName:
          type: string
      example:
        groupId: 99
        name: family
        displayName: Family
    UpdateTenantSettingsRequest:
      type: object
      additionalProperties: false
      required:
      - displayName
      properties:
        displayName:
          type: string
      example:
        displayName: Friends & Family
    UpdateGroupSettingsRequest:
      type: object
      additionalProperties: false
      required:
        - displayName
      properties:
        displayName:
          type: string
      example:
        displayName: Friends & Family
