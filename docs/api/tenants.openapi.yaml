        users:
          - user:
              userId: 2
              displayName: Invitee
              permalink: invitee
            email: invitee@example.test
            role: TenantMember
            status: Pending
    TenantUserSummary:
      type: object
      additionalProperties: false
      required:
      - user
      properties:
        user:
          "$ref": "./common.openapi.yaml#/components/schemas/PublicUserSummary"
        email:
          description: Present only for tenant owners and server owners.
          "$ref": "./common.openapi.yaml#/components/schemas/EmailAddress"
        role:
          description: Present only for tenant owners and server owners.
          "$ref": "#/components/schemas/TenantRole"
        status:
          description: Present only for tenant owners and server owners.
          "$ref": "#/components/schemas/TenantUserStatus"
      example:
        user:
          userId: 2
          displayName: Invitee
          permalink: invitee
        email: invitee@example.test
        role: TenantMember
        status: Pending
    UpdateTenantSettingsRequest:
      type: object
      additionalProperties: false
      required:
      - displayName
      properties:
        displayName:
          "$ref": "./common.openapi.yaml#/components/schemas/DisplayName"
        termsMarkdownByLocale:
          "$ref": "#/components/schemas/MarkdownByLocale"
      example:
        displayName: Friends & Family
        termsMarkdownByLocale:
          en: |-
            # Terms for this area

            Contact: Tenant Owner
    MarkdownByLocale:
      type: object
      additionalProperties:
        type: string
        maxLength: 20000
      example:
        de: |-
          # Hinweise

          Kontakt: Tenant Owner
        en: |-
          # Terms

          Contact: Tenant Owner
    UpdateGroupSettingsRequest:
      type: object
      additionalProperties: false
      required:
        - displayName
      properties:
        displayName:
          "$ref": "./common.openapi.yaml#/components/schemas/DisplayName"
      example:
        displayName: Friends & Family
    UpdateTenantUserRoleRequest:
      type: object
      additionalProperties: false
      required:
      - role
      properties:
        role:
          "$ref": "#/components/schemas/TenantRole"
      example:
        role: TenantMember
    InviteTenantUserRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - role
      properties:
        email:
          "$ref": "./common.openapi.yaml#/components/schemas/EmailAddress"
