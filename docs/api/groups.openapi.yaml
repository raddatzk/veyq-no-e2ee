openapi: 3.1.0
info:
  title: veyq groups
  version: 0.1.0
paths:
  /api/groups:
    get:
      tags: [GroupLifecycle]
      operationId: listGroups
      summary: List the groups in the current host tenant the caller can enter (holds the group scope grant).
      parameters:
        - $ref: "./common.openapi.yaml#/components/parameters/AuthHeader"
      responses:
        '200': { description: The caller's groups in this tenant., content: { application/json: { schema: { $ref: "#/components/schemas/GroupList" } } } }
        '401':
          $ref: "./common.openapi.yaml#/components/responses/Unauthorized"
        '403':
          $ref: "./common.openapi.yaml#/components/responses/Forbidden"
        '404':
          $ref: "./common.openapi.yaml#/components/responses/NotFound"
    post:
      tags: [GroupLifecycle]
      operationId: createGroup
      summary: Create a group (a sub-space within a tenant). Any active tenant member may; they become GroupOwner.
      description: >
        Mints a GROUP_ROOT scope inside the tenant. The caller supplies the scope public key, the scope
        private key wrapped to their own identity (self-grant), the content key wrapped to the scope public
        key, and the group name sealed under that content key (operator-blind). The creator becomes the
        first GroupOwner. The server stays blind to the group name and content.
      parameters:
        - $ref: "./common.openapi.yaml#/components/parameters/AuthHeader"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateGroupRequest" } } }
      responses:
        '200': { description: The created group., content: { application/json: { schema: { $ref: "#/components/schemas/GroupSummary" } } } }
        '400':
          $ref: "./common.openapi.yaml#/components/responses/BadRequest"
        '401':
          $ref: "./common.openapi.yaml#/components/responses/Unauthorized"
        '403':
          $ref: "./common.openapi.yaml#/components/responses/Forbidden"
        '404':
          $ref: "./common.openapi.yaml#/components/responses/NotFound"
  /api/groups/{groupId}:
    delete:
      tags: [GroupLifecycle]
      operationId: deleteGroup
      summary: Delete a group and all its content (GroupOwner only).
      description: >
        Cascades the group scope — all nodes + their media/journal/tracks/shares, the content key, items,
        and every member's grant + group membership. Only a GroupOwner may; the client gates it behind a
        confirm-by-name dialog. The tenant and other groups are untouched. Irreversible.
      parameters:
        - $ref: "./common.openapi.yaml#/components/parameters/AuthHeader"
        - { name: groupId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Deleted. }
        '401':
          $ref: "./common.openapi.yaml#/components/responses/Unauthorized"
        '403':
          $ref: "./common.openapi.yaml#/components/responses/Forbidden"
        '404':
          $ref: "./common.openapi.yaml#/components/responses/NotFound"
  /api/groups/{groupId}/members:
    get:
      tags: [GroupMembers]
      operationId: listGroupMembers
      summary: List the members of a group (any group member may).
      parameters:
        - $ref: "./common.openapi.yaml#/components/parameters/AuthHeader"
        - { name: groupId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The group's members., content: { application/json: { schema: { $ref: "#/components/schemas/GroupMemberList" } } } }
        '401':
          $ref: "./common.openapi.yaml#/components/responses/Unauthorized"
        '403':
          $ref: "./common.openapi.yaml#/components/responses/Forbidden"
        '404':
          $ref: "./common.openapi.yaml#/components/responses/NotFound"
    post:
      tags: [GroupMembers]
      operationId: addGroupMember
      summary: Add a tenant member to the group (GroupOwner only).
      description: >
        The GroupOwner wraps the group scope private key to the target member's identity and posts it as a
        grant. The target must already be an active member of the tenant; this endpoint does not invite
        external users into the tenant. Defaults to the GroupMember role.
      parameters:
        - $ref: "./common.openapi.yaml#/components/parameters/AuthHeader"
        - { name: groupId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AddGroupMemberRequest" } } }
      responses:
        '200': { description: The added member., content: { application/json: { schema: { $ref: "#/components/schemas/GroupMember" } } } }
        '400':
          $ref: "./common.openapi.yaml#/components/responses/BadRequest"
        '401':
          $ref: "./common.openapi.yaml#/components/responses/Unauthorized"
        '403':
          $ref: "./common.openapi.yaml#/components/responses/Forbidden"
        '404':
          $ref: "./common.openapi.yaml#/components/responses/NotFound"
        '409':
          $ref: "./common.openapi.yaml#/components/responses/Conflict"
  /api/groups/{groupId}/members/{userId}/role:
    put:
      tags: [GroupMembers]
      operationId: setGroupMemberRole
      summary: Change a group member's role (GroupOwner only). Cannot demote the last GroupOwner.
      parameters:
        - $ref: "./common.openapi.yaml#/components/parameters/AuthHeader"
        - { name: groupId, in: path, required: true, schema: { type: string } }
        - { name: userId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SetGroupRoleRequest" } } }
      responses:
        '200': { description: The updated member., content: { application/json: { schema: { $ref: "#/components/schemas/GroupMember" } } } }
        '400':
          $ref: "./common.openapi.yaml#/components/responses/BadRequest"
        '401':
          $ref: "./common.openapi.yaml#/components/responses/Unauthorized"
        '403':
          $ref: "./common.openapi.yaml#/components/responses/Forbidden"
        '404':
          $ref: "./common.openapi.yaml#/components/responses/NotFound"
        '409':
          $ref: "./common.openapi.yaml#/components/responses/Conflict"
  /api/groups/{groupId}/members/{userId}:
    delete:
      tags: [GroupMembers]
      operationId: removeGroupMember
      summary: Remove a member from the group (GroupOwner only). Cannot remove the last GroupOwner.
      description: Drops the member's group scope grant + membership. Already-downloaded content cannot be retracted.
      parameters:
        - $ref: "./common.openapi.yaml#/components/parameters/AuthHeader"
        - { name: groupId, in: path, required: true, schema: { type: string } }
        - { name: userId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Removed. }
        '401':
          $ref: "./common.openapi.yaml#/components/responses/Unauthorized"
        '403':
          $ref: "./common.openapi.yaml#/components/responses/Forbidden"
        '404':
          $ref: "./common.openapi.yaml#/components/responses/NotFound"
        '409':
          $ref: "./common.openapi.yaml#/components/responses/Conflict"
components:
  schemas:
    CreateGroupRequest:
      type: object
      required: [scopePublicKey, wrappedScopePrivateKey, wrappedContentKey, sealedName]
      properties:
        scopePublicKey: { $ref: "./common.openapi.yaml#/components/schemas/KemPublicKey" }
        wrappedScopePrivateKey: { $ref: "./common.openapi.yaml#/components/schemas/Blob", description: 'Group scope private key wrapped to the creator''s identity (self-grant).' }
        wrappedContentKey: { $ref: "./common.openapi.yaml#/components/schemas/Blob", description: 'Content key wrapped to the group scope public key.' }
        sealedName: { $ref: "./common.openapi.yaml#/components/schemas/Blob", description: 'Group name sealed under the content key (operator-blind).' }
    GroupSummary:
      type: object
      required: [groupId, scopeId, tenantId, role, scopePublicKey, sealedName]
      properties:
        groupId: { type: string, description: 'The group identifier for group management APIs. Currently equal to scopeId internally.' }
        scopeId: { type: string }
        tenantId: { type: string }
        role: { type: string, description: 'The caller''s group role (GroupOwner | GroupMember).' }
        scopePublicKey: { $ref: "./common.openapi.yaml#/components/schemas/KemPublicKey" }
        sealedName: { $ref: "./common.openapi.yaml#/components/schemas/Blob" }
    GroupList:
      type: object
      required: [groups]
      properties:
        groups: { type: array, items: { $ref: "#/components/schemas/GroupSummary" } }
    AddGroupMemberRequest:
      type: object
      required: [userId, wrappedScopePrivateKey]
      properties:
        userId: { type: string }
        wrappedScopePrivateKey: { $ref: "./common.openapi.yaml#/components/schemas/Blob", description: 'Group scope private key wrapped to the target member''s identity.' }
        role: { type: string, description: 'GroupOwner | GroupMember (defaults to GroupMember).' }
    SetGroupRoleRequest:
      type: object
      required: [role]
      properties:
        role: { type: string, description: 'GroupOwner | GroupMember.' }
    GroupMember:
      type: object
      required: [userId, displayName, role]
      properties:
        userId: { type: string }
        displayName: { type: string, x-field-extra-annotation: ['@field:com.veyq.app.shared.validation.DisplayName'] }
        role: { type: string }
    GroupMemberList:
      type: object
      required: [members]
      properties:
        members: { type: array, items: { $ref: "#/components/schemas/GroupMember" } }
