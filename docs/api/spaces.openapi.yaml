openapi: 3.1.0
info:
  title: veyq spaces
  version: 0.1.0
paths:
  /api/me/groups:
    get:
      tags: [Spaces]
      operationId: listMyGroups
      summary: List the group spaces the caller can enter (active member + holds the scope key).
      description: >
        A group space is a tenant the caller is an ACTIVE member of AND holds the tenant-root scope grant
        for (access = the wrap, ADR 0005 — no separate per-action permission). Returns human context
        (tenant name + role) plus the scope id + public key so the client can open it and decrypt content.
        Personal scopes are excluded (that is uc.spaces.use-personal).
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
      responses:
        '200':
          description: The caller's group spaces.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyGroupList' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
  # NB: own tag (SpaceRoster) — keeping one operation per tag avoids the jaxrs-spec greedy class-@Path that
  # would otherwise shadow sibling /api/me/* routes (see docs note on the codegen gotcha).
  /api/me/spaces:
    get:
      tags: [SpaceRoster]
      operationId: listMySpaces
      summary: The unified space switcher — every space the caller can enter (personal + groups).
      description: >
        One list backing the space switcher: the caller's personal space plus every group they are an
        active member of AND hold the scope key for (access = the wrap, ADR 0005 — a space appears only if
        its scope key is actually held). Switching between them is pure client-side context; this fetches no
        secrets, only the public scope material the client already holds wraps for.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
      responses:
        '200':
          description: The caller's spaces.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MySpaceList' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
components:
  schemas:
    GroupSpace:
      type: object
      required: [tenantId, name, displayName, role, scopeId, scopePublicKey]
      properties:
        tenantId: { type: string }
        name: { type: string }
        displayName: { type: string }
        role: { type: string, description: 'The caller''s role in the tenant (membership authority, not content access).' }
        scopeId: { type: string }
        scopePublicKey: { $ref: './common.openapi.yaml#/components/schemas/KemPublicKey' }
    MyGroupList:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items: { $ref: '#/components/schemas/GroupSpace' }
    SpaceEntry:
      type: object
      description: >
        One entry in the space switcher. PERSONAL = the user's private scope. TENANT = a tenant-wide space
        (every active tenant member). GROUP = a sub-space within a tenant (a subset of members); its name is
        sealed under the group content key, so the client decrypts sealedName rather than reading displayName.
      required: [kind, scopeId, scopePublicKey]
      properties:
        kind: { type: string, enum: [PERSONAL, TENANT, GROUP] }
        tenantId: { type: string, description: 'TENANT/GROUP — the backing tenant.' }
        name: { type: string, description: 'TENANT — the tenant name (slug).' }
        displayName: { type: string, description: 'PERSONAL: the user''s display name; TENANT: the tenant display name; GROUP: empty (use sealedName).' }
        role: { type: string, description: 'TENANT: tenant role; GROUP: group role; absent for PERSONAL.' }
        sealedName: { $ref: './common.openapi.yaml#/components/schemas/Blob', description: 'GROUP only — the group name sealed under its content key.' }
        scopeId: { type: string }
        scopePublicKey: { $ref: './common.openapi.yaml#/components/schemas/KemPublicKey' }
    MySpaceList:
      type: object
      required: [spaces]
      properties:
        spaces:
          type: array
          items: { $ref: '#/components/schemas/SpaceEntry' }
