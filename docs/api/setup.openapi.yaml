openapi: 3.1.0
info:
  title: veyq setup
  version: 0.1.0
paths:
  /api/setup:
    get:
      tags: [SetupServer]
      operationId: getSetupStatus
      summary: Setup status and advertised crypto suites.
      responses:
        '200':
          description: Setup status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupStatus' }
  /api/setup/owner:
    post:
      tags: [SetupServer]
      operationId: createServerOwner
      summary: Create the first Server Owner (cold E2EE registration).
      description: >
        The client generates all key material; the server stores opaque ciphertext + public keys + an
        auth verifier and flips the setup gate. The server never sees a private key, the master key,
        a KEK, the secret key or the recovery code.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateServerOwnerRequest' }
      responses:
        '200':
          description: The created Server Owner.
          content:
            application/json:
              schema: { $ref: './common.openapi.yaml#/components/schemas/UserSummary' }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '409': { $ref: './common.openapi.yaml#/components/responses/Conflict' }
components:
  schemas:
    SetupStatus:
      type: object
      required: [setupRequired, suites]
      properties:
        setupRequired: { type: boolean }
        suites:
          type: array
          items: { $ref: './common.openapi.yaml#/components/schemas/CryptoSuiteId' }
        appBaseUrl:
          type: string
          description: >
            This instance's public app origin (the web client base URL). Clients that assemble invite links
            (e.g. mobile owners emailing an invite) build them against this so the server's anti-abuse origin
            check passes. Low-sensitivity config — same value the web app is served from.
    CreateServerOwnerRequest:
      type: object
      required:
        [email, displayName, identityPublicKey, wrappedIdentityPrivateKey, masterKeyWraps,
         authVerifier, personalScopePublicKey, wrappedPersonalScopePrivateKey]
      properties:
        email: { type: string }
        displayName: { type: string }
        identityPublicKey: { $ref: './common.openapi.yaml#/components/schemas/IdentityPublicKey' }
        wrappedIdentityPrivateKey: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
        masterKeyWraps:
          type: array
          minItems: 1
          items: { $ref: './common.openapi.yaml#/components/schemas/MasterKeyWrap' }
        authVerifier: { $ref: './common.openapi.yaml#/components/schemas/AuthVerifier' }
        personalScopePublicKey: { $ref: './common.openapi.yaml#/components/schemas/KemPublicKey' }
        wrappedPersonalScopePrivateKey: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
