---
openapi: 3.1.0
info:
  title: Lunva Setup API
  version: 0.1.0
  description: >-
    API-first Zielvertrag fuer Lunva Setup API. Operationen enthalten Beispiele, Vorbedingungen und den aktuellen Implementierungsstatus.
servers:
- url: "/"
tags:
- name: Setup
paths:
  "/api/setup":
    get:
      tags:
      - Setup
      operationId: status
      responses:
        '200':
          description: Current setup status.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SetupStatusSummary"
              example:
                setupRequired: false
      summary: Setup-Status abrufen
      x-implementation-status: partial
      x-preconditions:
      - Der Endpunkt ist ohne Access-Token erreichbar.
      description: |-
        Setup-Status abrufen.

        Vorbedingungen:
        - Der Endpunkt ist ohne Access-Token erreichbar.

        Implementierungsstatus: partial.
  "/api/setup/admin":
    post:
      tags:
      - Setup
      operationId: createAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AdminSetupRequest"
            example:
              email: admin@example.test
              displayName: Administrator
              password: admin1234
      responses:
        '200':
          description: Created initial server owner.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserSummary"
              example:
                userId: 1
                email: admin@example.test
                displayName: Administrator
                serverRole: ServerOwner
        '400':
          "$ref": "#/components/responses/Error"
          description: Der Request ist syntaktisch oder fachlich ungueltig.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
              example:
                error: Invalid request
        '409':
          "$ref": "#/components/responses/Error"
      summary: Initialen Server-Owner anlegen
      x-implementation-status: partial
      x-preconditions:
      - Der Endpunkt ist ohne Access-Token erreichbar.
      - Das initiale Setup darf noch nicht abgeschlossen sein.
      description: |-
        Initialen Server-Owner anlegen.

        Vorbedingungen:
        - Der Endpunkt ist ohne Access-Token erreichbar.
        - Das initiale Setup darf noch nicht abgeschlossen sein.

        Implementierungsstatus: partial.
components:
  responses:
    Error:
      description: Request failed.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
          example:
            message: example
  schemas:
    SetupStatusSummary:
      type: object
      additionalProperties: false
      required:
      - setupRequired
      properties:
        setupRequired:
          type: boolean
    AdminSetupRequest:
      type: object
      additionalProperties: false
      required:
      - password
      - displayName
      - email
      properties:
        password:
          type: string
          minLength: 8
        displayName:
          type: string
        email:
          type: string
          format: email
    UserSummary:
      "$ref": "./users.openapi.yaml#/components/schemas/UserSummary"
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
      - message
      properties:
        message:
          type: string
