---
openapi: 3.1.0
info:
  title: veyq Tenant Registration Invites API
  version: 0.1.0
  description: >-
    API-first Zielvertrag fuer tenantweite Registrierungslinks. Operationen enthalten Beispiele, Vorbedingungen und den aktuellen Implementierungsstatus.
servers:
- url: "/"
security:
- accessTokenCookie: []
tags:
- name: TenantRegistrationInvites
paths:
  "/api/tenants/{tenantName}/registration-invites":
    post:
      tags:
      - TenantRegistrationInvites
      operationId: createTenantRegistrationInvite
      parameters:
      - "$ref": "./common.openapi.yaml#/components/parameters/TenantName"
      requestBody:
        "$ref": "#/components/requestBodies/CreateTenantRegistrationInvite"
      responses:
        '200':
          "$ref": "#/components/responses/TenantRegistrationInviteCreated"
        '400':
          "$ref": "./common.openapi.yaml#/components/responses/400"
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
        '403':
          "$ref": "./common.openapi.yaml#/components/responses/403"
      summary: Tenant-Registrierungslink erstellen
      x-implementation-status: implemented
      x-preconditions:
      - Ein gueltiger VEYQ_ACCESS_TOKEN Cookie muss vorhanden sein.
      - Das initiale Setup muss abgeschlossen sein.
      - Der aktuelle Benutzer muss TenantOwner im Tenant-Pfad sein.
      description: |-
        Erstellt einen tenantweiten Registrierungslink. Der Link laeuft ab, kann widerrufen werden
        und fuegt neue oder bestehende Benutzer ausschliesslich als TenantMember hinzu.

        Vorbedingungen:
        - Ein gueltiger VEYQ_ACCESS_TOKEN Cookie muss vorhanden sein.
        - Das initiale Setup muss abgeschlossen sein.
        - Der aktuelle Benutzer muss TenantOwner im Tenant-Pfad sein.

        Implementierungsstatus: implemented.
    get:
      tags:
      - TenantRegistrationInvites
      operationId: listTenantRegistrationInvites
      parameters:
      - "$ref": "./common.openapi.yaml#/components/parameters/TenantName"
      responses:
        '200':
          "$ref": "#/components/responses/TenantRegistrationInvites"
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
        '403':
          "$ref": "./common.openapi.yaml#/components/responses/403"
      summary: Tenant-Registrierungslinks auflisten
      x-implementation-status: implemented
      x-preconditions:
      - Ein gueltiger VEYQ_ACCESS_TOKEN Cookie muss vorhanden sein.
      - Das initiale Setup muss abgeschlossen sein.
      - Der aktuelle Benutzer muss TenantOwner im Tenant-Pfad sein.
      description: |-
        Listet tenantweite Registrierungslinks mit kopierbarer Join-URL fuer Tenant-Admins auf.

        Vorbedingungen:
        - Ein gueltiger VEYQ_ACCESS_TOKEN Cookie muss vorhanden sein.
        - Das initiale Setup muss abgeschlossen sein.
        - Der aktuelle Benutzer muss TenantOwner im Tenant-Pfad sein.

        Implementierungsstatus: implemented.
  "/api/tenants/{tenantName}/registration-invites/{inviteId}/revoke":
    post:
      tags:
      - TenantRegistrationInvites
      operationId: revokeTenantRegistrationInvite
      parameters:
      - "$ref": "./common.openapi.yaml#/components/parameters/TenantName"
      - "$ref": "#/components/parameters/InviteId"
      responses:
        '200':
          "$ref": "#/components/responses/TenantRegistrationInvite"
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
        '403':
          "$ref": "./common.openapi.yaml#/components/responses/403"
        '404':
          "$ref": "./common.openapi.yaml#/components/responses/404"
      summary: Tenant-Registrierungslink widerrufen
      x-implementation-status: implemented
      x-preconditions:
      - Ein gueltiger VEYQ_ACCESS_TOKEN Cookie muss vorhanden sein.
      - Das initiale Setup muss abgeschlossen sein.
      - Der aktuelle Benutzer muss TenantOwner im Tenant-Pfad sein.
      - Der Registrierungslink muss zum Tenant gehoeren.
      description: |-
        Widerruft einen tenantweiten Registrierungslink. Bereits registrierte Benutzer behalten
        ihre Tenant-Mitgliedschaft.

        Vorbedingungen:
        - Ein gueltiger VEYQ_ACCESS_TOKEN Cookie muss vorhanden sein.
        - Das initiale Setup muss abgeschlossen sein.
        - Der aktuelle Benutzer muss TenantOwner im Tenant-Pfad sein.
        - Der Registrierungslink muss zum Tenant gehoeren.

        Implementierungsstatus: implemented.
  "/api/tenant-registration-invites/{token}":
    get:
      tags:
      - TenantRegistrationInvites
      operationId: getTenantRegistrationInvite
      security: []
      parameters:
      - "$ref": "#/components/parameters/InviteToken"
      responses:
        '200':
          "$ref": "#/components/responses/TenantRegistrationInviteMetadata"
        '400':
          "$ref": "./common.openapi.yaml#/components/responses/400"
        '403':
          "$ref": "./common.openapi.yaml#/components/responses/403"
        '404':
          "$ref": "./common.openapi.yaml#/components/responses/404"
      summary: Tenant-Registrierungslink pruefen
      x-implementation-status: implemented
      x-preconditions:
      - Der Endpunkt ist ohne Access-Token erreichbar.
      - Das initiale Setup muss abgeschlossen sein.
      - Der aktuelle Request-Host muss die Tenant-Domain des Links sein.
      - Der Link muss gueltig, nicht abgelaufen und nicht widerrufen sein.
      description: |-
        Prueft einen tenantweiten Registrierungslink auf der Tenant-Domain und liefert die
        anzuzeigenden Tenant-Metadaten fuer die Join-Seite.

        Vorbedingungen:
        - Der Endpunkt ist ohne Access-Token erreichbar.
        - Das initiale Setup muss abgeschlossen sein.
        - Der aktuelle Request-Host muss die Tenant-Domain des Links sein.
        - Der Link muss gueltig, nicht abgelaufen und nicht widerrufen sein.

        Implementierungsstatus: implemented.
  "/api/tenant-registration-invites/{token}/logo":
    get:
      tags:
      - TenantRegistrationInvites
      operationId: getTenantRegistrationInviteLogo
      security: []
      parameters:
      - "$ref": "#/components/parameters/InviteToken"
      responses:
        '200':
          description: Tenant logo image for a valid registration invite.
          content:
            image/png:
              schema:
                type: string
                format: binary
              example: "<binary png logo>"
            image/jpeg:
              schema:
                type: string
                format: binary
              example: "<binary jpeg logo>"
        '400':
          "$ref": "./common.openapi.yaml#/components/responses/400"
        '403':
          "$ref": "./common.openapi.yaml#/components/responses/403"
        '404':
          "$ref": "./common.openapi.yaml#/components/responses/404"
      summary: Tenant-Logo fuer Registrierungslink laden
      x-implementation-status: implemented
      x-preconditions:
      - Der Endpunkt ist ohne Access-Token erreichbar.
      - Das initiale Setup muss abgeschlossen sein.
      - Der aktuelle Request-Host muss die Tenant-Domain des Links sein.
      - Der Link muss gueltig, nicht abgelaufen und nicht widerrufen sein.
      - Der Tenant muss ein Logo haben.
      description: |-
        Liefert das Tenant-Logo fuer die Join-Seite ueber einen gueltigen
        Registrierungslink. Der bestehende Tenant-Logo-Endpunkt bleibt auf
        Tenant-Mitglieder begrenzt.

        Vorbedingungen:
        - Der Endpunkt ist ohne Access-Token erreichbar.
        - Das initiale Setup muss abgeschlossen sein.
        - Der aktuelle Request-Host muss die Tenant-Domain des Links sein.
        - Der Link muss gueltig, nicht abgelaufen und nicht widerrufen sein.
        - Der Tenant muss ein Logo haben.

        Implementierungsstatus: implemented.
  "/api/tenant-registration-invites/{token}/join":
    post:
      tags:
      - TenantRegistrationInvites
      operationId: joinTenantRegistrationInvite
      security: []
      parameters:
      - "$ref": "#/components/parameters/InviteToken"
      requestBody:
        "$ref": "#/components/requestBodies/JoinTenantRegistrationInvite"
      responses:
        '200':
          "$ref": "./common.openapi.yaml#/components/responses/LoginSession"
        '400':
          "$ref": "./common.openapi.yaml#/components/responses/400"
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
        '403':
          "$ref": "./common.openapi.yaml#/components/responses/403"
        '404':
          "$ref": "./common.openapi.yaml#/components/responses/404"
        '409':
          "$ref": "./common.openapi.yaml#/components/responses/409"
      summary: Tenant per Registrierungslink beitreten
      x-implementation-status: implemented
      x-preconditions:
      - Der Endpunkt ist ohne Access-Token erreichbar.
      - Das initiale Setup muss abgeschlossen sein.
      - Der aktuelle Request-Host muss die Tenant-Domain des Links sein.
      - Neue Benutzer muessen E-Mail und Anzeigenamen angeben.
      - Neue Benutzer koennen per Passwort oder Passkey beitreten.
      - Bestehende Benutzer muessen mit demselben Account angemeldet sein.
      description: |-
        Registriert einen neuen Benutzer oder fuegt einen bereits angemeldeten bestehenden
        Benutzer dem Tenant hinzu. Der Link vergibt immer nur die TenantMember-Rolle und
        funktioniert ausschliesslich auf der Domain des Tenants.

        Vorbedingungen:
        - Der Endpunkt ist ohne Access-Token erreichbar.
        - Das initiale Setup muss abgeschlossen sein.
        - Der aktuelle Request-Host muss die Tenant-Domain des Links sein.
        - Neue Benutzer muessen E-Mail und Anzeigenamen angeben.
        - Neue Benutzer koennen per Passwort oder Passkey beitreten.
        - Bestehende Benutzer muessen mit demselben Account angemeldet sein.

        Implementierungsstatus: implemented.
  "/api/tenant-registration-invites/{token}/passkey-options":
    post:
      tags:
      - TenantRegistrationInvites
      operationId: createTenantRegistrationInvitePasskeyOptions
      security: []
      parameters:
      - "$ref": "#/components/parameters/InviteToken"
      requestBody:
        "$ref": "#/components/requestBodies/TenantRegistrationInvitePasskeyOptions"
      responses:
        '200':
          "$ref": "./users.openapi.yaml#/components/responses/PasskeyRegistrationOptions"
        '400':
          "$ref": "./common.openapi.yaml#/components/responses/400"
        '403':
          "$ref": "./common.openapi.yaml#/components/responses/403"
        '404':
          "$ref": "./common.openapi.yaml#/components/responses/404"
        '409':
          "$ref": "./common.openapi.yaml#/components/responses/409"
      summary: Passkey-Optionen fuer Tenant-Registrierungslink erzeugen
      x-implementation-status: implemented
      x-preconditions:
      - Der Endpunkt ist ohne Access-Token erreichbar.
      - Das initiale Setup muss abgeschlossen sein.
      - Der aktuelle Request-Host muss die Tenant-Domain des Links sein.
      - Neue Benutzer muessen E-Mail und Anzeigenamen angeben.
      description: |-
        Erzeugt WebAuthn-Optionen, damit ein neuer Benutzer einem Tenant per
        Registrierungslink mit Passkey beitreten kann.

        Vorbedingungen:
        - Der Endpunkt ist ohne Access-Token erreichbar.
        - Das initiale Setup muss abgeschlossen sein.
        - Der aktuelle Request-Host muss die Tenant-Domain des Links sein.
        - Neue Benutzer muessen E-Mail und Anzeigenamen angeben.

        Implementierungsstatus: implemented.
  "/api/tenant-registration-invites/{token}/join/passkey":
    post:
      tags:
      - TenantRegistrationInvites
      operationId: joinTenantRegistrationInviteWithPasskey
      security: []
      parameters:
      - "$ref": "#/components/parameters/InviteToken"
      requestBody:
        "$ref": "#/components/requestBodies/JoinTenantRegistrationInviteWithPasskey"
      responses:
        '200':
          "$ref": "./common.openapi.yaml#/components/responses/LoginSession"
        '400':
          "$ref": "./common.openapi.yaml#/components/responses/400"
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
        '403':
          "$ref": "./common.openapi.yaml#/components/responses/403"
        '404':
          "$ref": "./common.openapi.yaml#/components/responses/404"
        '409':
          "$ref": "./common.openapi.yaml#/components/responses/409"
      summary: Tenant per Registrierungslink mit Passkey beitreten
      x-implementation-status: implemented
      x-preconditions:
      - Der Endpunkt ist ohne Access-Token erreichbar.
      - Das initiale Setup muss abgeschlossen sein.
      - Der aktuelle Request-Host muss die Tenant-Domain des Links sein.
      - Neue Benutzer muessen E-Mail, Anzeigenamen und Passkey-Credential angeben.
      description: |-
        Erstellt den Passkey fuer einen neuen Benutzer und aktiviert die Tenant-Mitgliedschaft
        ausschliesslich als TenantMember.

        Vorbedingungen:
        - Der Endpunkt ist ohne Access-Token erreichbar.
        - Das initiale Setup muss abgeschlossen sein.
        - Der aktuelle Request-Host muss die Tenant-Domain des Links sein.
        - Neue Benutzer muessen E-Mail, Anzeigenamen und Passkey-Credential angeben.

        Implementierungsstatus: implemented.
components:
  securitySchemes:
    accessTokenCookie:
      type: apiKey
      in: cookie
      name: VEYQ_ACCESS_TOKEN
  parameters:
    InviteId:
      name: inviteId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    InviteToken:
      name: token
      in: path
      required: true
      schema:
        type: string
  requestBodies:
    CreateTenantRegistrationInvite:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/CreateTenantRegistrationInviteRequest"
          example:
            expiresInDays: 14
            maxRegistrations: 100
    JoinTenantRegistrationInvite:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/JoinTenantRegistrationInviteRequest"
          example:
            email: invitee@example.test
            displayName: Invitee
            password: welcome123456
    TenantRegistrationInvitePasskeyOptions:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/TenantRegistrationInvitePasskeyOptionsRequest"
          example:
            email: invitee@example.test
            displayName: Invitee
    JoinTenantRegistrationInviteWithPasskey:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/JoinTenantRegistrationInviteWithPasskeyRequest"
          example:
            email: invitee@example.test
            displayName: Invitee
            credential:
              id: credential-id
              rawId: credential-id
              type: public-key
              response:
                clientDataJSON: client-data
                attestationObject: attestation-object
  responses:
    TenantRegistrationInviteCreated:
      description: Created tenant registration invite with one-time token link.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/TenantRegistrationInviteCreatedResponse"
          example:
            invite:
              id: 12
              tenantId: 42
              tenantName: friends
              createdByUserId: 1
              joinUrl: https://friends.example.test/join/HrUI1ioJ6P
              expiresAt: "2026-06-15T12:00:00Z"
              revokedAt: null
              maxRegistrations: 100
              registrationCount: 0
              createdAt: "2026-06-01T12:00:00Z"
              status: Active
            joinUrl: https://friends.example.test/join/HrUI1ioJ6P
            token: HrUI1ioJ6P
    TenantRegistrationInvites:
      description: Tenant registration invites.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/TenantRegistrationInvitesResponse"
          example:
            invites:
              - id: 12
                tenantId: 42
                tenantName: friends
                createdByUserId: 1
                expiresAt: "2026-06-15T12:00:00Z"
                revokedAt: null
                maxRegistrations: 100
                registrationCount: 0
                createdAt: "2026-06-01T12:00:00Z"
                status: Active
    TenantRegistrationInvite:
      description: Tenant registration invite.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/TenantRegistrationInviteSummary"
          example:
            id: 12
            tenantId: 42
            tenantName: friends
            createdByUserId: 1
            joinUrl: https://friends.example.test/join/HrUI1ioJ6P
            expiresAt: "2026-06-15T12:00:00Z"
            revokedAt: "2026-06-02T12:00:00Z"
            maxRegistrations: 100
            registrationCount: 0
            createdAt: "2026-06-01T12:00:00Z"
            status: Revoked
    TenantRegistrationInviteMetadata:
      description: Public metadata for a valid tenant registration invite.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/TenantRegistrationInviteMetadataResponse"
          example:
            tenantId: 42
            tenantName: friends
            tenantDisplayName: Friends
            tenantDomain: friends.example.test
            tenantLogoUrl: /api/tenant-registration-invites/HrUI1ioJ6P/logo?v=2026-06-01T12%3A00%3A00Z
            expiresAt: "2026-06-15T12:00:00Z"
            requiresLogin: false
  schemas:
    TenantRegistrationInviteStatus:
      type: string
      enum:
      - Active
      - Expired
      - Revoked
      - Exhausted
    CreateTenantRegistrationInviteRequest:
      type: object
      additionalProperties: false
      required:
      - expiresInDays
      properties:
        expiresInDays:
          type: integer
          format: int32
          minimum: 1
          maximum: 365
        maxRegistrations:
          type: integer
          format: int32
          minimum: 1
      example:
        expiresInDays: 14
        maxRegistrations: 100
    JoinTenantRegistrationInviteRequest:
      type: object
      additionalProperties: false
      required:
      - email
      properties:
        email:
          "$ref": "./common.openapi.yaml#/components/schemas/EmailAddress"
        displayName:
          "$ref": "./common.openapi.yaml#/components/schemas/DisplayName"
        password:
          "$ref": "./common.openapi.yaml#/components/schemas/Password"
      example:
        email: invitee@example.test
        displayName: Invitee
        password: welcome123456
    TenantRegistrationInvitePasskeyOptionsRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - displayName
      properties:
        email:
          "$ref": "./common.openapi.yaml#/components/schemas/EmailAddress"
        displayName:
          "$ref": "./common.openapi.yaml#/components/schemas/DisplayName"
      example:
        email: invitee@example.test
        displayName: Invitee
    JoinTenantRegistrationInviteWithPasskeyRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - displayName
      - credential
      properties:
        email:
          "$ref": "./common.openapi.yaml#/components/schemas/EmailAddress"
        displayName:
          "$ref": "./common.openapi.yaml#/components/schemas/DisplayName"
        passkeyDisplayName:
          "$ref": "./common.openapi.yaml#/components/schemas/DisplayName"
        credential:
          "$ref": "./users.openapi.yaml#/components/schemas/PasskeyRegistrationRequest"
      example:
        email: invitee@example.test
        displayName: Invitee
        credential:
          id: credential-id
          rawId: credential-id
          type: public-key
          response:
            clientDataJSON: client-data
            attestationObject: attestation-object
    TenantRegistrationInviteSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - tenantId
      - tenantName
      - createdByUserId
      - joinUrl
      - expiresAt
      - registrationCount
      - createdAt
      - status
      properties:
        id:
          type: integer
          format: int64
        tenantId:
          type: integer
          format: int64
        tenantName:
          type: string
        createdByUserId:
          type: integer
          format: int64
        joinUrl:
          type: string
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
        maxRegistrations:
          type: integer
          format: int32
        registrationCount:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        status:
          "$ref": "#/components/schemas/TenantRegistrationInviteStatus"
      example:
        id: 12
        tenantId: 42
        tenantName: friends
        createdByUserId: 1
        joinUrl: https://friends.example.test/join/HrUI1ioJ6P
        expiresAt: "2026-06-15T12:00:00Z"
        revokedAt: null
        maxRegistrations: 100
        registrationCount: 0
        createdAt: "2026-06-01T12:00:00Z"
        status: Active
    TenantRegistrationInviteCreatedResponse:
      type: object
      additionalProperties: false
      required:
      - invite
      - joinUrl
      - token
      properties:
        invite:
          "$ref": "#/components/schemas/TenantRegistrationInviteSummary"
        joinUrl:
          type: string
        token:
          type: string
      example:
        invite:
          id: 12
          tenantId: 42
          tenantName: friends
          createdByUserId: 1
          joinUrl: https://friends.example.test/join/HrUI1ioJ6P
          expiresAt: "2026-06-15T12:00:00Z"
          registrationCount: 0
          createdAt: "2026-06-01T12:00:00Z"
          status: Active
        joinUrl: https://friends.example.test/join/HrUI1ioJ6P
        token: HrUI1ioJ6P
    TenantRegistrationInvitesResponse:
      type: object
      additionalProperties: false
      required:
      - invites
      properties:
        invites:
          type: array
          items:
            "$ref": "#/components/schemas/TenantRegistrationInviteSummary"
      example:
        invites:
          - id: 12
            tenantId: 42
            tenantName: friends
            createdByUserId: 1
            expiresAt: "2026-06-15T12:00:00Z"
            registrationCount: 0
            createdAt: "2026-06-01T12:00:00Z"
            status: Active
    TenantRegistrationInviteMetadataResponse:
      type: object
      additionalProperties: false
      required:
      - tenantId
      - tenantName
      - tenantDisplayName
      - tenantDomain
      - expiresAt
      - requiresLogin
      properties:
        tenantId:
          type: integer
          format: int64
        tenantName:
          type: string
        tenantDisplayName:
          type: string
        tenantDomain:
          type: string
        tenantLogoUrl:
          type: string
        expiresAt:
          type: string
          format: date-time
        requiresLogin:
          type: boolean
      example:
        tenantId: 42
        tenantName: friends
        tenantDisplayName: Friends
        tenantDomain: friends.example.test
        tenantLogoUrl: /api/tenant-registration-invites/HrUI1ioJ6P/logo?v=2026-06-01T12%3A00%3A00Z
        expiresAt: "2026-06-15T12:00:00Z"
        requiresLogin: false
