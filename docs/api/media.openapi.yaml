openapi: 3.1.0
info:
  title: veyq unified media
  version: 0.1.0
# One upload/download path for all bytes. A blob is deduplicated content (a chunk-set; small file = 1 chunk).
# A media attaches a blob to a Memory/Chapter with typed derivatives (thumbnail/preview, themselves blobs).
# NB: one operation per tag for the /blobs and /blob-uploads/{id} families (greedy class-@Path codegen gotcha).
paths:
  /api/scopes/{scopeId}/blobs:
    post:
      tags: [BlobStart]
      operationId: startBlob
      summary: Begin (or dedup) storing a content blob. If the scope already has it, no upload is needed.
      description: >
        The client computes the dedup token over the whole plaintext and declares the chunk count + size.
        If a blob with that token already exists in the scope → READY with its blobId (skip the upload
        entirely, even for a huge file). Otherwise → UPLOADING with an uploadId to push the frames to.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StartBlobRequest' } } }
      responses:
        '200': { description: A dedup hit (READY) or a new upload (UPLOADING)., content: { application/json: { schema: { $ref: '#/components/schemas/BlobTicket' } } } }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.openapi.yaml#/components/responses/Conflict' }
        '429': { $ref: './common.openapi.yaml#/components/responses/TooManyRequests' }
  /api/scopes/{scopeId}/blob-uploads/{uploadId}:
    get:
      tags: [BlobUploadStatus]
      operationId: getBlobUpload
      summary: Upload progress — which chunk indices have landed (drives resume).
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: uploadId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The upload progress., content: { application/json: { schema: { $ref: '#/components/schemas/BlobUploadProgress' } } } }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/scopes/{scopeId}/blob-uploads/{uploadId}/complete:
    post:
      tags: [BlobComplete]
      operationId: completeBlobUpload
      summary: Finalize the upload once every chunk has landed; promotes the chunks to a content blob.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: uploadId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The finalized blob., content: { application/json: { schema: { $ref: '#/components/schemas/CompleteBlobResponse' } } } }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.openapi.yaml#/components/responses/Conflict' }
  /api/scopes/{scopeId}/blobs/{blobId}/presigned-chunks:
    get:
      tags: [BlobChunkPresign]
      operationId: getBlobPresignedChunks
      summary: Short-lived presigned GET URLs for a finalized blob's frames (direct-from-store download, ADR 0021).
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: blobId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Per-chunk presigned GET URLs (empty when the store can't presign)., content: { application/json: { schema: { $ref: '#/components/schemas/PresignedChunks' } } } }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/scopes/{scopeId}/nodes/{nodeId}/media:
    get:
      tags: [Media]
      operationId: listMedia
      summary: A Memory's media (original + typed derivatives), in upload order.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The node's media., content: { application/json: { schema: { $ref: '#/components/schemas/MediaList' } } } }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
    post:
      tags: [Media]
      operationId: createMedia
      summary: Attach a stored blob (+ derivatives) to a Memory/Chapter node.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateMediaRequest' } } }
      responses:
        '200': { description: The created media., content: { application/json: { schema: { $ref: '#/components/schemas/MediaItem' } } } }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/scopes/{scopeId}/nodes/{nodeId}/media/{mediaId}:
    patch:
      tags: [Media]
      operationId: updateMedia
      summary: Update a medium's highlight flag and/or its sealed metadata (e.g. an edited capture date).
      description: >
        Toggle the server-visible `highlighted` flag (a favourite/star, filterable; never content) and/or
        replace the sealed metadata blob (the client re-seals {takenAt, lat?, lng?} under the content key to
        edit, say, the capture date — the server stays blind to the values). Any scope key holder may update.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
        - { name: mediaId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateMediaRequest' } } }
      responses:
        '200': { description: The updated media., content: { application/json: { schema: { $ref: '#/components/schemas/MediaItem' } } } }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
    delete:
      tags: [Media]
      operationId: deleteMedia
      summary: Delete a single medium (and its derivatives) from a Memory/Chapter.
      description: >
        Removes the media row + its derivative rows and un-pins it as a cover wherever used. Any key holder
        of the scope may delete; the client gates it behind a confirm dialog. Blob chunks are left for a
        separate GC pass. Irreversible.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
        - { name: mediaId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Deleted. }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/scopes/{scopeId}/blob-uploads-batch:
    post:
      tags: [BlobBatchStart]
      operationId: batchStartBlobs
      summary: Begin (or dedup/resume) many blob uploads in one round-trip; returns a presigned PUT URL per missing chunk.
      description: >
        The batched, direct-to-store upload entry point (ADR 0021): for each descriptor, dedup (READY) or open
        an upload and return presigned PUT URLs for the still-missing chunks (the client PUTs frames straight to
        the store). Pass an existing `uploadId` to RESUME (re-presign only the chunks not yet in the store).
        Per-item best-effort — a failing descriptor yields an ERROR result without sinking the batch.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BatchStartBlobsRequest' } } }
      responses:
        '200': { description: Per-descriptor start results., content: { application/json: { schema: { $ref: '#/components/schemas/BatchStartBlobsResponse' } } } }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
        '429': { $ref: './common.openapi.yaml#/components/responses/TooManyRequests' }
  /api/scopes/{scopeId}/blob-downloads-batch:
    post:
      tags: [BlobBatchDownload]
      operationId: batchPresignGet
      summary: Presigned GET URLs for many finalized blobs in one round-trip (direct-from-store download, ADR 0021).
      description: >
        The batched download entry point: given many blob ids (e.g. a gallery page's thumbnails), returns a
        short-lived presigned GET URL per chunk so the client fetches every frame straight from the store. A
        blob the caller can't access (or absent) is simply omitted from the results.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BatchPresignGetRequest' } } }
      responses:
        '200': { description: Per-blob presigned GET URLs., content: { application/json: { schema: { $ref: '#/components/schemas/BatchPresignGetResponse' } } } }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/scopes/{scopeId}/nodes/{nodeId}/media-batch:
    post:
      tags: [MediaBatch]
      operationId: batchFinalizeMedia
      summary: Finalize many uploads and attach them as media in one round-trip (complete + createMedia, batched).
      description: >
        The batched finalize: for each item, complete its blob uploads (original + derivatives) and attach the
        resulting media to the node. A blob reference is either an `uploadId` (completed here) or a `blobId` (a
        dedup hit). Per-item best-effort — each item is atomic; a failure yields an ERROR result and the rest
        still land (the client's upload queue retries only the failures).
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BatchFinalizeMediaRequest' } } }
      responses:
        '200': { description: Per-item finalize results., content: { application/json: { schema: { $ref: '#/components/schemas/BatchFinalizeMediaResponse' } } } }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/scopes/{scopeId}/nodes/{nodeId}/buckets:
    get:
      tags: [MemoryBucket]
      operationId: listBuckets
      summary: List a Memory's contribution buckets (per-contributor primary + sub-buckets) with media counts.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The buckets., content: { application/json: { schema: { $ref: '#/components/schemas/MediaBucketList' } } } }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
    post:
      tags: [MemoryBucket]
      operationId: createBucket
      summary: Create a sub-bucket under the caller's own primary bucket (sealed name); persists the primary.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateBucketRequest' } } }
      responses:
        '200': { description: The created bucket., content: { application/json: { schema: { $ref: '#/components/schemas/MediaBucket' } } } }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/scopes/{scopeId}/nodes/{nodeId}/buckets/{bucketId}:
    patch:
      tags: [MemoryBucket]
      operationId: renameBucket
      summary: Rename one of the caller's own buckets (re-seal the name).
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
        - { name: bucketId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateBucketRequest' } } }
      responses:
        '200': { description: The updated bucket., content: { application/json: { schema: { $ref: '#/components/schemas/MediaBucket' } } } }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
    delete:
      tags: [MemoryBucket]
      operationId: deleteBucket
      summary: Delete one of the caller's own sub-buckets; its media fall back to the owner's primary bucket.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
        - { name: bucketId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Deleted. }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/public/shares/{shareId}/nodes/{nodeId}/media:
    get:
      tags: [PublicShareMedia]
      operationId: listShareMedia
      summary: A shared node's media (ciphertext, no auth — gated to the share's subtree).
      parameters:
        - { name: shareId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The node's media., content: { application/json: { schema: { $ref: '#/components/schemas/MediaList' } } } }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/public/shares/{shareId}/blobs:
    post:
      tags: [PublicShareContribute]
      operationId: startShareBlob
      summary: Begin (or dedup) a guest blob upload (no auth — CONTRIBUTOR/UPLOADER shares only).
      parameters:
        - { name: shareId, in: path, required: true, schema: { type: string } }
        - { name: X-Veyq-Share-Upload-Token, in: header, required: false, schema: { type: string }, description: 'Base64url upload-capability token derived client-side from the share unwrap key; the handler returns 403 when absent or invalid.' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StartBlobRequest' } } }
      responses:
        '200': { description: A blob ticket., content: { application/json: { schema: { $ref: '#/components/schemas/BlobTicket' } } } }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/public/shares/{shareId}/blob-uploads/{uploadId}:
    get:
      tags: [PublicShareContribute]
      operationId: getShareUpload
      summary: A guest blob upload's progress (no auth — CONTRIBUTOR/UPLOADER shares only).
      parameters:
        - { name: shareId, in: path, required: true, schema: { type: string } }
        - { name: uploadId, in: path, required: true, schema: { type: string } }
        - { name: X-Veyq-Share-Upload-Token, in: header, required: false, schema: { type: string }, description: 'Base64url upload-capability token derived client-side from the share unwrap key; the handler returns 403 when absent or invalid.' }
      responses:
        '200': { description: Upload progress., content: { application/json: { schema: { $ref: '#/components/schemas/BlobUploadProgress' } } } }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/public/shares/{shareId}/blob-uploads/{uploadId}/complete:
    post:
      tags: [PublicShareContribute]
      operationId: completeShareBlob
      summary: Finalize a guest blob upload (no auth — CONTRIBUTOR/UPLOADER shares only).
      parameters:
        - { name: shareId, in: path, required: true, schema: { type: string } }
        - { name: uploadId, in: path, required: true, schema: { type: string } }
        - { name: X-Veyq-Share-Upload-Token, in: header, required: false, schema: { type: string }, description: 'Base64url upload-capability token derived client-side from the share unwrap key; the handler returns 403 when absent or invalid.' }
      responses:
        '200': { description: The finalized blob., content: { application/json: { schema: { $ref: '#/components/schemas/CompleteBlobResponse' } } } }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/public/shares/{shareId}/nodes/{nodeId}/contributed-media:
    post:
      tags: [PublicShareContribute]
      operationId: createShareMedia
      summary: Attach a guest-uploaded blob as media on a shared node (no auth — CONTRIBUTOR/UPLOADER shares only).
      parameters:
        - { name: shareId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
        - { name: X-Veyq-Share-Upload-Token, in: header, required: false, schema: { type: string }, description: 'Base64url upload-capability token derived client-side from the share unwrap key; the handler returns 403 when absent or invalid.' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateMediaRequest' } } }
      responses:
        '200': { description: The created media., content: { application/json: { schema: { $ref: '#/components/schemas/MediaItem' } } } }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/public/shares/{shareId}/blob-uploads-batch:
    post:
      tags: [PublicShareContribute]
      operationId: batchStartShareBlobs
      summary: Begin (or dedup/resume) many guest blob uploads in one round-trip (no auth — CONTRIBUTOR/UPLOADER shares).
      parameters:
        - { name: shareId, in: path, required: true, schema: { type: string } }
        - { name: X-Veyq-Share-Upload-Token, in: header, required: false, schema: { type: string }, description: 'Base64url upload-capability token derived client-side from the share unwrap key; the handler returns 403 when absent or invalid.' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BatchStartBlobsRequest' } } }
      responses:
        '200': { description: Per-descriptor start results., content: { application/json: { schema: { $ref: '#/components/schemas/BatchStartBlobsResponse' } } } }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/public/shares/{shareId}/nodes/{nodeId}/contributed-media-batch:
    post:
      tags: [PublicShareContribute]
      operationId: batchFinalizeShareMedia
      summary: Finalize many guest uploads and attach them as media in one round-trip (no auth — CONTRIBUTOR/UPLOADER shares).
      parameters:
        - { name: shareId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
        - { name: X-Veyq-Share-Upload-Token, in: header, required: false, schema: { type: string }, description: 'Base64url upload-capability token derived client-side from the share unwrap key; the handler returns 403 when absent or invalid.' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BatchFinalizeMediaRequest' } } }
      responses:
        '200': { description: Per-item finalize results., content: { application/json: { schema: { $ref: '#/components/schemas/BatchFinalizeMediaResponse' } } } }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/public/shares/{shareId}/blob-downloads-batch:
    post:
      tags: [PublicShareMedia]
      operationId: batchPresignShareGet
      summary: Presigned GET URLs for many shared blobs in one round-trip (ciphertext, no auth — gated to the share's subtree).
      parameters:
        - { name: shareId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BatchPresignGetRequest' } } }
      responses:
        '200': { description: Per-blob presigned GET URLs., content: { application/json: { schema: { $ref: '#/components/schemas/BatchPresignGetResponse' } } } }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
components:
  schemas:
    StartBlobRequest:
      type: object
      required: [dedupToken, totalChunks, byteSize]
      properties:
        dedupToken: { type: string, x-field-extra-annotation: ['@field:jakarta.validation.constraints.Size(max = 128)'] }
        totalChunks: { type: integer, minimum: 1, maximum: 10000 }
        byteSize: { type: integer, format: int64, minimum: 0, maximum: 10737418240 }
        # Declared up front for the direct-to-store upload: raw frames PUT straight to the store carry no
        # per-frame suite metadata, so the client states the frames' crypto suite here.
        suiteId: { type: string, x-field-extra-annotation: ['@field:jakarta.validation.constraints.Size(max = 32)'] }
    BlobTicket:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [READY, UPLOADING] }
        blobId: { type: string, description: 'Set when READY (dedup hit) — attach this blob directly.' }
        uploadId: { type: string, description: 'Set when UPLOADING — push the frames here, then complete.' }
        totalChunks: { type: integer }
    BlobUploadProgress:
      type: object
      required: [uploadId, totalChunks, receivedChunks, status]
      properties:
        uploadId: { type: string }
        totalChunks: { type: integer }
        receivedChunks: { type: array, items: { type: integer } }
        status: { type: string, enum: [OPEN, COMPLETED] }
        # Direct-to-store (ADR 0021): a short-lived PUT URL per still-missing chunk; the client PUTs the raw
        # sealed frame straight to the store. Empty only when the store can't presign (dev/test in-memory), where
        # there is no media-transport path. (Batched callers use blob-uploads-batch, which carries the same URLs.)
        presignedPuts: { type: array, items: { $ref: '#/components/schemas/PresignedPut' } }
    PresignedPut:
      type: object
      required: [index, url]
      properties:
        index: { type: integer }
        url: { type: string }
    PresignedChunks:
      type: object
      required: [suiteId, chunks]
      properties:
        suiteId: { type: string }
        # Direct-from-store download (ADR 0021): a short-lived GET URL per chunk; the client GETs the raw sealed
        # frame straight from the store and opens it with openFrame. Empty only when the store can't presign
        # (dev/test in-memory). (Batched callers use blob-downloads-batch, which returns the same URLs.)
        chunks: { type: array, items: { $ref: '#/components/schemas/PresignedPut' } }
    CompleteBlobResponse:
      type: object
      required: [blobId, totalChunks, byteSize]
      properties:
        blobId: { type: string }
        totalChunks: { type: integer }
        byteSize: { type: integer, format: int64 }
    # ---- Batched, direct-to-store transport (ADR 0021) ----
    BatchStartItem:
      type: object
      required: [dedupToken, totalChunks, byteSize]
      properties:
        dedupToken: { type: string, x-field-extra-annotation: ['@field:jakarta.validation.constraints.Size(max = 128)'] }
        totalChunks: { type: integer, minimum: 1, maximum: 10000 }
        byteSize: { type: integer, format: int64, minimum: 0, maximum: 10737418240 }
        suiteId: { type: string, x-field-extra-annotation: ['@field:jakarta.validation.constraints.Size(max = 32)'] }
        # Resume: re-presign only the still-missing chunks of this existing open upload (the server stats the
        # store to count chunks already PUT directly). Omit for a fresh start.
        uploadId: { type: string }
    BatchStartBlobsRequest:
      type: object
      required: [items]
      properties:
        items: { type: array, maxItems: 64, items: { $ref: '#/components/schemas/BatchStartItem' } }
    BatchBlobStart:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [READY, UPLOADING, ERROR] }
        blobId: { type: string, description: 'Set when READY (dedup hit) — reference this blob directly at finalize.' }
        uploadId: { type: string, description: 'Set when UPLOADING — PUT the frames to presignedPuts, then finalize.' }
        totalChunks: { type: integer }
        receivedChunks: { type: array, items: { type: integer }, description: 'Already-stored chunk indices (resume).' }
        presignedPuts: { type: array, items: { $ref: '#/components/schemas/PresignedPut' } }
        errorCode: { type: string, description: 'Set when ERROR — the stable error code for this descriptor.' }
    BatchStartBlobsResponse:
      type: object
      required: [results]
      properties:
        results: { type: array, items: { $ref: '#/components/schemas/BatchBlobStart' } }
    BatchPresignGetRequest:
      type: object
      required: [blobIds]
      properties:
        blobIds: { type: array, maxItems: 256, items: { type: string } }
    BatchPresignGetItem:
      type: object
      required: [blobId, suiteId, chunks]
      properties:
        blobId: { type: string }
        suiteId: { type: string }
        chunks: { type: array, items: { $ref: '#/components/schemas/PresignedPut' } }
    BatchPresignGetResponse:
      type: object
      required: [results]
      properties:
        results: { type: array, items: { $ref: '#/components/schemas/BatchPresignGetItem' } }
    BlobRefInput:
      type: object
      description: 'A blob to attach: exactly one of uploadId (completed at finalize) or blobId (a dedup hit, already a blob).'
      properties:
        uploadId: { type: string }
        blobId: { type: string }
    FinalizeDerivativeInput:
      type: object
      required: [kind, blob]
      properties:
        kind: { type: string, enum: [THUMBNAIL, PREVIEW] }
        blob: { $ref: '#/components/schemas/BlobRefInput' }
    FinalizeMediaItem:
      type: object
      required: [original, sealedMeta, mimeType]
      properties:
        original: { $ref: '#/components/schemas/BlobRefInput' }
        sealedMeta: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
        mimeType: { type: string, x-field-extra-annotation: ['@field:jakarta.validation.constraints.Size(max = 255)'] }
        bucketId: { type: string }
        contributorId: { type: string }
        contributorName: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
        derivatives:
          type: array
          items: { $ref: '#/components/schemas/FinalizeDerivativeInput' }
    BatchFinalizeMediaRequest:
      type: object
      required: [items]
      properties:
        items: { type: array, maxItems: 64, items: { $ref: '#/components/schemas/FinalizeMediaItem' } }
    FinalizeMediaResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        media: { $ref: '#/components/schemas/MediaItem' }
        errorCode: { type: string, description: 'Set when ok=false — the stable error code for this item.' }
    BatchFinalizeMediaResponse:
      type: object
      required: [results]
      properties:
        results: { type: array, items: { $ref: '#/components/schemas/FinalizeMediaResult' } }
    BlobRef:
      type: object
      required: [blobId, totalChunks, byteSize]
      properties:
        blobId: { type: string }
        totalChunks: { type: integer }
        byteSize: { type: integer, format: int64 }
    MediaDerivativeInput:
      type: object
      required: [kind, blobId]
      properties:
        kind: { type: string, enum: [THUMBNAIL, PREVIEW] }
        blobId: { type: string }
    MediaDerivativeOut:
      type: object
      required: [kind, blob]
      properties:
        kind: { type: string, enum: [THUMBNAIL, PREVIEW] }
        blob: { $ref: '#/components/schemas/BlobRef' }
    CreateMediaRequest:
      type: object
      required: [originalBlobId, sealedMeta, mimeType]
      properties:
        originalBlobId: { type: string }
        sealedMeta: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
        mimeType: { type: string, x-field-extra-annotation: ['@field:jakarta.validation.constraints.Size(max = 255)'] }
        # Optional target bucket (ADR 0023). Omitted → the contributor's primary bucket.
        bucketId: { type: string }
        # Share-guest self-naming (ADR 0023): a stable per-guest id + their sealed display name. The guest's
        # uploads group under "share:<shareId>:<contributorId>" and persist a named primary bucket. Ignored for
        # authenticated member uploads (attributed to "user:<id>").
        contributorId: { type: string }
        contributorName: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
        derivatives:
          type: array
          items: { $ref: '#/components/schemas/MediaDerivativeInput' }
    UpdateMediaRequest:
      type: object
      properties:
        highlighted: { type: boolean }
        sealedMeta: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
        # Move the medium to another of the CALLER'S OWN buckets (ADR 0023). Server rejects cross-owner moves.
        bucketId: { type: string }
    MediaItem:
      type: object
      required: [id, scopeId, nodeId, sealedMeta, mimeType, original, derivatives, highlighted, createdBy, createdAt]
      properties:
        id: { type: string }
        scopeId: { type: string }
        nodeId: { type: string }
        sealedMeta: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
        mimeType: { type: string, x-field-extra-annotation: ['@field:jakarta.validation.constraints.Size(max = 255)'] }
        original: { $ref: '#/components/schemas/BlobRef' }
        derivatives:
          type: array
          items: { $ref: '#/components/schemas/MediaDerivativeOut' }
        highlighted: { type: boolean }
        # Contribution attribution (ADR 0023): who added this medium + which bucket it sits in (null = primary).
        createdBy: { type: string }
        bucketId: { type: string }
        createdAt: { type: string, format: date-time }
    MediaList:
      type: object
      required: [media]
      properties:
        media: { type: array, items: { $ref: '#/components/schemas/MediaItem' } }
    MediaBucket:
      type: object
      required: [id, ownerKey, primary, mediaCount]
      properties:
        id: { type: string }
        ownerKey: { type: string }                               # "user:<id>" or "share:<shareId>:<contributorId>"
        parentBucketId: { type: string }                         # absent ⇒ primary/user bucket
        # Sealed bucket name (AEAD under the content key). Absent for a synthesized member primary bucket —
        # the client resolves the member's display name from the membership list (ADR 0023).
        sealedName: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
        primary: { type: boolean }
        mediaCount: { type: integer }
    MediaBucketList:
      type: object
      required: [buckets]
      properties:
        buckets: { type: array, items: { $ref: '#/components/schemas/MediaBucket' } }
    CreateBucketRequest:
      type: object
      required: [sealedName]
      properties:
        sealedName: { $ref: './common.openapi.yaml#/components/schemas/Blob' }   # sealed sub-bucket name
        parentBucketId: { type: string }                         # the caller's primary bucket id (omit ⇒ own primary)
    UpdateBucketRequest:
      type: object
      required: [sealedName]
      properties:
        sealedName: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
