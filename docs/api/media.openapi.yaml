openapi: 3.1.0
info:
  title: veyq unified media
  version: 0.1.0
# One upload/download path for all bytes. A blob is deduplicated content (a chunk-set; small file = 1 chunk).
# A media attaches a blob to a Memory/Chapter with typed derivatives (thumbnail/preview, themselves blobs).
# NB: one operation per tag for the /blobs and /blob-uploads/{id} families (greedy class-@Path codegen gotcha).
paths:
  /api/scopes/{scopeId}/blobs:
    post:
      tags: [BlobStart]
      operationId: startBlob
      summary: Begin (or dedup) storing a content blob. If the scope already has it, no upload is needed.
      description: >
        The client computes the dedup token over the whole plaintext and declares the chunk count + size.
        If a blob with that token already exists in the scope → READY with its blobId (skip the upload
        entirely, even for a huge file). Otherwise → UPLOADING with an uploadId to push the frames to.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StartBlobRequest' } } }
      responses:
        '200': { description: A dedup hit (READY) or a new upload (UPLOADING)., content: { application/json: { schema: { $ref: '#/components/schemas/BlobTicket' } } } }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.openapi.yaml#/components/responses/Conflict' }
        '429': { $ref: './common.openapi.yaml#/components/responses/TooManyRequests' }
  /api/scopes/{scopeId}/blob-uploads/{uploadId}:
    get:
      tags: [BlobUploadStatus]
      operationId: getBlobUpload
      summary: Upload progress — which chunk indices have landed (drives resume).
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: uploadId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The upload progress., content: { application/json: { schema: { $ref: '#/components/schemas/BlobUploadProgress' } } } }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/scopes/{scopeId}/blob-uploads/{uploadId}/complete:
    post:
      tags: [BlobComplete]
      operationId: completeBlobUpload
      summary: Finalize the upload once every chunk has landed; promotes the chunks to a content blob.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: uploadId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The finalized blob., content: { application/json: { schema: { $ref: '#/components/schemas/CompleteBlobResponse' } } } }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.openapi.yaml#/components/responses/Conflict' }
  /api/scopes/{scopeId}/blob-uploads/{uploadId}/chunks/{index}:
    put:
      tags: [BlobChunkUpload]
      operationId: putBlobChunk
      summary: Upload one AEAD frame (idempotent — re-PUT is the basis of resume).
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: uploadId, in: path, required: true, schema: { type: string } }
        - { name: index, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PutChunkRequest' } } }
      responses:
        '204': { description: The frame was stored (or already present). }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.openapi.yaml#/components/responses/Conflict' }
  /api/scopes/{scopeId}/blobs/{blobId}/chunks/{index}:
    get:
      tags: [BlobChunkDownload]
      operationId: getBlobChunk
      summary: Download one AEAD frame of a finalized blob (the client opens it with openFrame).
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: blobId, in: path, required: true, schema: { type: string } }
        - { name: index, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: The frame ciphertext., content: { application/json: { schema: { $ref: '#/components/schemas/ChunkResponse' } } } }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/scopes/{scopeId}/blobs/{blobId}/presigned-chunks:
    get:
      tags: [BlobChunkPresign]
      operationId: getBlobPresignedChunks
      summary: Short-lived presigned GET URLs for a finalized blob's frames (direct-from-store download, ADR 0021).
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: blobId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Per-chunk presigned GET URLs (empty when the store can't presign)., content: { application/json: { schema: { $ref: '#/components/schemas/PresignedChunks' } } } }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/scopes/{scopeId}/nodes/{nodeId}/media:
    get:
      tags: [Media]
      operationId: listMedia
      summary: A Memory's media (original + typed derivatives), in upload order.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The node's media., content: { application/json: { schema: { $ref: '#/components/schemas/MediaList' } } } }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
    post:
      tags: [Media]
      operationId: createMedia
      summary: Attach a stored blob (+ derivatives) to a Memory/Chapter node.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateMediaRequest' } } }
      responses:
        '200': { description: The created media., content: { application/json: { schema: { $ref: '#/components/schemas/MediaItem' } } } }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/scopes/{scopeId}/nodes/{nodeId}/media/{mediaId}:
    patch:
      tags: [Media]
      operationId: updateMedia
      summary: Update a medium's highlight flag and/or its sealed metadata (e.g. an edited capture date).
      description: >
        Toggle the server-visible `highlighted` flag (a favourite/star, filterable; never content) and/or
        replace the sealed metadata blob (the client re-seals {takenAt, lat?, lng?} under the content key to
        edit, say, the capture date — the server stays blind to the values). Any scope key holder may update.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
        - { name: mediaId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateMediaRequest' } } }
      responses:
        '200': { description: The updated media., content: { application/json: { schema: { $ref: '#/components/schemas/MediaItem' } } } }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
    delete:
      tags: [Media]
      operationId: deleteMedia
      summary: Delete a single medium (and its derivatives) from a Memory/Chapter.
      description: >
        Removes the media row + its derivative rows and un-pins it as a cover wherever used. Any key holder
        of the scope may delete; the client gates it behind a confirm dialog. Blob chunks are left for a
        separate GC pass. Irreversible.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
        - { name: mediaId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Deleted. }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/public/shares/{shareId}/nodes/{nodeId}/media:
    get:
      tags: [PublicShareMedia]
      operationId: listShareMedia
      summary: A shared node's media (ciphertext, no auth — gated to the share's subtree).
      parameters:
        - { name: shareId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The node's media., content: { application/json: { schema: { $ref: '#/components/schemas/MediaList' } } } }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/public/shares/{shareId}/blobs/{blobId}/chunks/{index}:
    get:
      tags: [PublicShareMedia]
      operationId: getShareChunk
      summary: One AEAD frame of a shared blob (ciphertext, no auth — gated to the share's subtree).
      parameters:
        - { name: shareId, in: path, required: true, schema: { type: string } }
        - { name: blobId, in: path, required: true, schema: { type: string } }
        - { name: index, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: The frame ciphertext., content: { application/json: { schema: { $ref: '#/components/schemas/ChunkResponse' } } } }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/public/shares/{shareId}/blobs:
    post:
      tags: [PublicShareContribute]
      operationId: startShareBlob
      summary: Begin (or dedup) a guest blob upload (no auth — CONTRIBUTOR shares only).
      parameters:
        - { name: shareId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StartBlobRequest' } } }
      responses:
        '200': { description: A blob ticket., content: { application/json: { schema: { $ref: '#/components/schemas/BlobTicket' } } } }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/public/shares/{shareId}/blob-uploads/{uploadId}:
    get:
      tags: [PublicShareContribute]
      operationId: getShareUpload
      summary: A guest blob upload's progress (no auth — CONTRIBUTOR shares only).
      parameters:
        - { name: shareId, in: path, required: true, schema: { type: string } }
        - { name: uploadId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Upload progress., content: { application/json: { schema: { $ref: '#/components/schemas/BlobUploadProgress' } } } }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/public/shares/{shareId}/blob-uploads/{uploadId}/chunks/{index}:
    put:
      tags: [PublicShareContribute]
      operationId: putShareChunk
      summary: Upload one AEAD frame of a guest blob (no auth — CONTRIBUTOR shares only).
      parameters:
        - { name: shareId, in: path, required: true, schema: { type: string } }
        - { name: uploadId, in: path, required: true, schema: { type: string } }
        - { name: index, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PutChunkRequest' } } }
      responses:
        '204': { description: Stored. }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/public/shares/{shareId}/blob-uploads/{uploadId}/complete:
    post:
      tags: [PublicShareContribute]
      operationId: completeShareBlob
      summary: Finalize a guest blob upload (no auth — CONTRIBUTOR shares only).
      parameters:
        - { name: shareId, in: path, required: true, schema: { type: string } }
        - { name: uploadId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The finalized blob., content: { application/json: { schema: { $ref: '#/components/schemas/CompleteBlobResponse' } } } }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/public/shares/{shareId}/nodes/{nodeId}/contributed-media:
    post:
      tags: [PublicShareContribute]
      operationId: createShareMedia
      summary: Attach a guest-uploaded blob as media on a shared node (no auth — CONTRIBUTOR shares only).
      parameters:
        - { name: shareId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateMediaRequest' } } }
      responses:
        '200': { description: The created media., content: { application/json: { schema: { $ref: '#/components/schemas/MediaItem' } } } }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
components:
  schemas:
    StartBlobRequest:
      type: object
      required: [dedupToken, totalChunks, byteSize]
      properties:
        dedupToken: { type: string, x-field-extra-annotation: ['@field:jakarta.validation.constraints.Size(max = 128)'] }
        totalChunks: { type: integer, minimum: 1, maximum: 10000 }
        byteSize: { type: integer, format: int64, minimum: 0, maximum: 10737418240 }
        # Declared up front for a presigned (direct-to-store) upload: raw frames PUT straight to S3 carry no
        # per-frame suite metadata, so the client states the frames' crypto suite here. Optional — a proxied
        # upload still derives it from the frame bodies.
        suiteId: { type: string, x-field-extra-annotation: ['@field:jakarta.validation.constraints.Size(max = 32)'] }
    BlobTicket:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [READY, UPLOADING] }
        blobId: { type: string, description: 'Set when READY (dedup hit) — attach this blob directly.' }
        uploadId: { type: string, description: 'Set when UPLOADING — push the frames here, then complete.' }
        totalChunks: { type: integer }
    PutChunkRequest:
      type: object
      required: [frame]
      properties:
        frame: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
    BlobUploadProgress:
      type: object
      required: [uploadId, totalChunks, receivedChunks, status]
      properties:
        uploadId: { type: string }
        totalChunks: { type: integer }
        receivedChunks: { type: array, items: { type: integer } }
        status: { type: string, enum: [OPEN, COMPLETED] }
        # Direct-to-store fast path (ADR 0021): when the backend can presign, a short-lived PUT URL per still-
        # missing chunk. The client PUTs the raw sealed frame straight to S3 and skips the proxied chunk endpoint.
        # Absent/empty when the store can't presign (the in-memory dev backend) → client uses the proxied path.
        presignedPuts: { type: array, items: { $ref: '#/components/schemas/PresignedPut' } }
    PresignedPut:
      type: object
      required: [index, url]
      properties:
        index: { type: integer }
        url: { type: string }
    PresignedChunks:
      type: object
      required: [suiteId, chunks]
      properties:
        suiteId: { type: string }
        # Direct-from-store download fast path (ADR 0021): a short-lived GET URL per chunk. The client GETs the
        # raw sealed frame straight from S3 and opens it with openFrame. Empty when the store can't presign (the
        # in-memory dev backend) → client falls back to the proxied chunk endpoint.
        chunks: { type: array, items: { $ref: '#/components/schemas/PresignedPut' } }
    CompleteBlobResponse:
      type: object
      required: [blobId, totalChunks, byteSize]
      properties:
        blobId: { type: string }
        totalChunks: { type: integer }
        byteSize: { type: integer, format: int64 }
    ChunkResponse:
      type: object
      required: [frame]
      properties:
        frame: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
    BlobRef:
      type: object
      required: [blobId, totalChunks, byteSize]
      properties:
        blobId: { type: string }
        totalChunks: { type: integer }
        byteSize: { type: integer, format: int64 }
    MediaDerivativeInput:
      type: object
      required: [kind, blobId]
      properties:
        kind: { type: string, enum: [THUMBNAIL, PREVIEW] }
        blobId: { type: string }
    MediaDerivativeOut:
      type: object
      required: [kind, blob]
      properties:
        kind: { type: string, enum: [THUMBNAIL, PREVIEW] }
        blob: { $ref: '#/components/schemas/BlobRef' }
    CreateMediaRequest:
      type: object
      required: [originalBlobId, sealedMeta, mimeType]
      properties:
        originalBlobId: { type: string }
        sealedMeta: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
        mimeType: { type: string, x-field-extra-annotation: ['@field:jakarta.validation.constraints.Size(max = 255)'] }
        derivatives:
          type: array
          items: { $ref: '#/components/schemas/MediaDerivativeInput' }
    UpdateMediaRequest:
      type: object
      properties:
        highlighted: { type: boolean }
        sealedMeta: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
    MediaItem:
      type: object
      required: [id, scopeId, nodeId, sealedMeta, mimeType, original, derivatives, highlighted, createdAt]
      properties:
        id: { type: string }
        scopeId: { type: string }
        nodeId: { type: string }
        sealedMeta: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
        mimeType: { type: string, x-field-extra-annotation: ['@field:jakarta.validation.constraints.Size(max = 255)'] }
        original: { $ref: '#/components/schemas/BlobRef' }
        derivatives:
          type: array
          items: { $ref: '#/components/schemas/MediaDerivativeOut' }
        highlighted: { type: boolean }
        createdAt: { type: string, format: date-time }
    MediaList:
      type: object
      required: [media]
      properties:
        media: { type: array, items: { $ref: '#/components/schemas/MediaItem' } }
