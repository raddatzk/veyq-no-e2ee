openapi: 3.1.0
info:
  title: veyq resumable uploads
  version: 0.1.0
# NB: one operation per tag for the session/complete/status routes — they share the /api/uploads/{uploadId}
# prefix, and a single tag would make jaxrs-spec emit a greedy class-@Path that shadows the siblings.
paths:
  /api/scopes/{scopeId}/nodes/{nodeId}/uploads:
    post:
      tags: [UploadCreate]
      operationId: createUpload
      summary: Open a resumable upload session for a chunked media on a Memory/Chapter node.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUploadRequest' }
      responses:
        '200': { description: The open session., content: { application/json: { schema: { $ref: '#/components/schemas/UploadSession' } } } }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.openapi.yaml#/components/responses/Conflict' }
  /api/uploads/{uploadId}:
    get:
      tags: [UploadStatus]
      operationId: getUpload
      summary: Upload progress — which chunk indices have landed (drives resume).
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: uploadId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The upload progress., content: { application/json: { schema: { $ref: '#/components/schemas/UploadProgress' } } } }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/uploads/{uploadId}/complete:
    post:
      tags: [UploadComplete]
      operationId: completeUpload
      summary: Finalize the upload once every chunk has landed.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: uploadId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The completed session., content: { application/json: { schema: { $ref: '#/components/schemas/UploadSession' } } } }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.openapi.yaml#/components/responses/Conflict' }
  /api/uploads/{uploadId}/chunks/{index}:
    put:
      tags: [UploadChunk]
      operationId: putChunk
      summary: Upload one AEAD frame (idempotent — re-PUT is a no-op, the basis of resume).
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: uploadId, in: path, required: true, schema: { type: string } }
        - { name: index, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PutChunkRequest' }
      responses:
        '204': { description: The frame was stored (or already present). }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.openapi.yaml#/components/responses/Conflict' }
    get:
      tags: [UploadChunk]
      operationId: getChunk
      summary: Download one AEAD frame for decryption (the client opens it with openFrame).
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: uploadId, in: path, required: true, schema: { type: string } }
        - { name: index, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: The frame ciphertext., content: { application/json: { schema: { $ref: '#/components/schemas/ChunkResponse' } } } }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
components:
  schemas:
    CreateUploadRequest:
      type: object
      required: [totalChunks, mimeType, byteSize, takenAt]
      properties:
        totalChunks:
          type: integer
          minimum: 1
          maximum: 10000
          description: Number of encrypted frames in this upload; bounded server-side by `veyq.uploads.max-chunks`.
        mimeType: { type: string }
        byteSize:
          type: integer
          format: int64
          minimum: 0
          maximum: 10737418240
          description: Plaintext byte size; bounded server-side by `veyq.uploads.max-upload-bytes`.
        takenAt: { type: string, format: date-time }
    UploadSession:
      type: object
      required: [uploadId, scopeId, nodeId, totalChunks, mimeType, byteSize, takenAt, status, createdAt]
      properties:
        uploadId: { type: string }
        scopeId: { type: string }
        nodeId: { type: string }
        totalChunks: { type: integer }
        mimeType: { type: string }
        byteSize: { type: integer, format: int64 }
        takenAt: { type: string, format: date-time }
        status: { type: string, enum: [OPEN, COMPLETED] }
        createdAt: { type: string, format: date-time }
    UploadProgress:
      type: object
      required: [uploadId, totalChunks, receivedChunks, status]
      properties:
        uploadId: { type: string }
        totalChunks: { type: integer }
        receivedChunks:
          type: array
          description: The chunk indices already stored — the client re-sends only the missing ones.
          items: { type: integer }
        status: { type: string, enum: [OPEN, COMPLETED] }
    PutChunkRequest:
      type: object
      required: [frame]
      properties:
        frame:
          $ref: './common.openapi.yaml#/components/schemas/Blob'
          description: One chunked-AEAD frame; decoded frame bytes are bounded server-side by `veyq.uploads.max-frame-bytes`.
    ChunkResponse:
      type: object
      required: [frame]
      properties:
        frame: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
