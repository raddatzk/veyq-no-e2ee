openapi: 3.1.0
info:
  title: veyq key management
  version: 0.1.0
paths:
  /api/me/key-wraps/{unlockMethod}:
    put:
      tags: [Keys]
      operationId: upsertMyMasterKeyWrap
      summary: Add or replace one of the authenticated user's master-key unlock wraps.
      description: >
        The client has already unlocked the master key locally and uploads a replacement wrapped copy
        for one unlock method. The server stores only opaque ciphertext and does not learn the master
        key or the KEK that can open this wrap.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - name: unlockMethod
          in: path
          required: true
          schema: { type: string, enum: [PASSWORD, PASSKEY, RECOVERY, DEVICE] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertMasterKeyWrapRequest' }
      responses:
        '200':
          description: The stored master-key wrap.
          content:
            application/json:
              schema: { $ref: './common.openapi.yaml#/components/schemas/MasterKeyWrap' }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '409': { $ref: './common.openapi.yaml#/components/responses/Conflict' }
    delete:
      tags: [Keys]
      operationId: removeMyMasterKeyWrap
      summary: Remove one of the authenticated user's master-key unlock wraps.
      description: >
        Removes a stored wrapped copy of the Master Key for the current user. Removing the final
        surviving unlock wrap is rejected so an account cannot be locked out through this endpoint.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - name: unlockMethod
          in: path
          required: true
          schema: { type: string, enum: [PASSWORD, PASSKEY, RECOVERY, DEVICE] }
        - name: credentialRef
          in: query
          required: false
          schema: { type: string }
      responses:
        '204':
          description: The unlock wrap was removed.
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.openapi.yaml#/components/responses/Conflict' }
  /api/scopes/{scopeId}/grants/me:
    get:
      tags: [Keys]
      operationId: getMyScopeGrant
      summary: Fetch the authenticated user's wrapped grant for a scope (to open it by scope id).
      description: >
        Returns the caller's existing grant — the scope public key + the scope private key wrapped to the
        caller's identity. Used to open any scope the caller holds, e.g. a group scope (which has no
        tenant-keyed grant path). The server never sees the scope private key.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The caller's grant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScopeGrantResponse' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
    put:
      tags: [Keys]
      operationId: rewrapMyScopeGrant
      summary: Replace the authenticated user's wrapped grant for a scope.
      description: >
        The caller must already hold a grant for the scope. The client unwraps the scope key locally,
        wraps it to the current identity key and uploads only the replacement ciphertext. The server
        never sees scope private key material and cannot create new access through this endpoint.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RewrapMyScopeGrantRequest' }
      responses:
        '200':
          description: The updated caller grant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScopeGrantResponse' }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
components:
  schemas:
    UpsertMasterKeyWrapRequest:
      type: object
      required: [masterKeyWrap]
      properties:
        masterKeyWrap: { $ref: './common.openapi.yaml#/components/schemas/MasterKeyWrap' }
        # Only for unlockMethod=RECOVERY: SHA-256("veyq/v1/recovery-auth" || masterKey), base64url — stores
        # the recovery commitment so a later password reset can prove Secret-Key possession (see auth spec).
        recoveryAuthTag: { type: string }
    RewrapMyScopeGrantRequest:
      type: object
      required: [wrappedScopePrivateKey]
      properties:
        wrappedScopePrivateKey: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
    ScopeGrantResponse:
      type: object
      required: [scopeId, scopePublicKey, wrappedScopePrivateKey]
      properties:
        scopeId: { type: string }
        scopePublicKey: { $ref: './common.openapi.yaml#/components/schemas/KemPublicKey' }
        wrappedScopePrivateKey: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
