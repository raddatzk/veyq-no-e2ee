components:
  parameters:
    MemoryId:
      in: path
      required: true
      name: memoryId
      description: Public Memory id.
      schema:
        type: string
      example: mem_abc123
    ShareId:
      in: path
      required: true
      name: shareId
      description: Public share id.
      schema:
        type: string
      example: shr_abc123
    MediaId:
      in: path
      required: true
      name: mediaId
      description: Public media id.
      schema:
        type: string
      example: med_abc123
    MemoryPath:
      in: query
      required: true
      name: path
      description: Share-relative Memory path. `/` resolves to the share root.
      schema:
        type: string
      example: /day-1
  requestBodies:
    CreateMemoryShare:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/CreateMemoryShareRequest"
          example:
            name: Family review
            role: VIEWER
            password: share-password123
    UpdateMemoryShare:
      required: true
      content:
        application/json:
