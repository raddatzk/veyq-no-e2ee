  schemas:
    MemoryShareRole:
      type: string
      enum: [VIEWER, CONTRIBUTOR, MANAGER, UPLOADER]
    CreateMemoryShareRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        name:
          type: string
          nullable: true
          maxLength: 120
        role:
          "$ref": "#/components/schemas/MemoryShareRole"
        password:
          type: string
          nullable: true
          description: Optional share password. Non-empty values require at least 10 characters. Share passwords are hashed but are not checked against the compromised-password provider.
          minLength: 10
        noticeMarkdownByLocale:
          "$ref": "#/components/schemas/MarkdownByLocale"
      example:
        name: Family review
        role: VIEWER
        password: share-password123
        noticeMarkdownByLocale:
          en: |-
            # Notice for this share

            Please keep this Memory private.
    UpdateMemoryShareRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          nullable: true
          maxLength: 120
        role:
          "$ref": "#/components/schemas/MemoryShareRole"
        enabled:
          type: boolean
          description: Set to `false` to revoke the share link. Managed share deletion is not supported in major line 1.
        password:
          type: string
          nullable: true
          description: Optional replacement share password. Missing leaves the current password unchanged; null or empty string removes it. Non-empty values require at least 10 characters and are not checked against the compromised-password provider.
          minLength: 10
        noticeMarkdownByLocale:
          "$ref": "#/components/schemas/MarkdownByLocale"
      example:
        name: Family uploads
        role: CONTRIBUTOR
        enabled: true
        password: new-share-password123
        noticeMarkdownByLocale:
          en: |-
            # Upload notice

            Upload only media you may share.
    PublicShareLoginRequest:
      type: object
      additionalProperties: false
      properties:
        password:
          type: string
          nullable: true
          description: Password entered by the visitor for an existing protected share. The create/update minimum length does not apply to login payload validation so existing stored share passwords remain openable.
          minLength: 0
        displayName:
          description: Required for Contributor, Manager and Uploader shares. Viewer shares may omit it.
          "$ref": "./common.openapi.yaml#/components/schemas/DisplayName"
      example:
        password: share-password123
    MemoryShareSummary:
      type: object
      additionalProperties: false
      required: [id, memoryId, role, enabled, shareUrl, hasPassword, noticeVersion, createdAt, updatedAt]
      properties:
        id:
          type: string
        memoryId:
          type: string
        name:
          type: string
          nullable: true
        role:
          "$ref": "#/components/schemas/MemoryShareRole"
        enabled:
          type: boolean
        shareUrl:
          type: string
        hasPassword:
          type: boolean
        noticeVersion:
          type: integer
          format: int32
          minimum: 0
        noticeMarkdownByLocale:
          "$ref": "#/components/schemas/MarkdownByLocale"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        id: shr_abc123
        memoryId: mem_abc123
        name: Family review
        role: VIEWER
        enabled: true
        shareUrl: /s/shr_abc123
        hasPassword: true
        noticeVersion: 1
        noticeMarkdownByLocale:
          en: |-
            # Notice for this share

            Please keep this Memory private.
        createdAt: "2026-05-24T10:00:00Z"
        updatedAt: "2026-05-24T10:00:00Z"
    PublicSharePermissions:
      type: object
      additionalProperties: false
      required: [editMemory, editJournal, uploadTrack, uploadPlaylist, addChapter, setCover, setHighlight]
      properties:
        editMemory:
          description: True when the current share session may edit Memory metadata such as name, display name and date range.
          type: boolean
        editJournal:
          type: boolean
        uploadTrack:
          type: boolean
        uploadPlaylist:
          type: boolean
        addChapter:
          type: boolean
        setCover:
          type: boolean
        setHighlight:
          description: True when the current share session may highlight at least its own uploaded media. Public bucket responses expose per-bucket `canManage` for ownership-sensitive actions.
          type: boolean
    PublicShareSummary:
      type: object
      additionalProperties: false
      required: [id, role, authenticated, passwordRequired, displayNameRequired, canViewGallery, canUpload, canEdit, canDelete, permissions, notices]
      properties:
        id:
          type: string
        role:
          "$ref": "#/components/schemas/MemoryShareRole"
        authenticated:
          type: boolean
        passwordRequired:
          type: boolean
        displayNameRequired:
          type: boolean
        canViewGallery:
          type: boolean
        canUpload:
          type: boolean
        canEdit:
          type: boolean
        canDelete:
          type: boolean
        permissions:
          "$ref": "#/components/schemas/PublicSharePermissions"
        notices:
          type: array
          items:
            "$ref": "#/components/schemas/PublicShareNotice"
        redirectUrl:
          type: string
          nullable: true
        rootMemory:
          description: Present only when the caller already has public or authenticated access to Memory details.
          "$ref": "#/components/schemas/PublicShareMemorySummary"
          nullable: true
      example:
        id: shr_abc123
        role: VIEWER
        authenticated: true
        passwordRequired: true
        displayNameRequired: false
        canViewGallery: true
        canUpload: false
        canEdit: false
        canDelete: false
        permissions:
          editMemory: false
          editJournal: false
          uploadTrack: false
          uploadPlaylist: false
          addChapter: false
          setCover: false
          setHighlight: false
        notices:
          - scope: TENANT
            tenantName: friends
            tenantDomain: friends.example.test
            version: 1
            markdownByLocale:
              en: |-
                # Terms for this area

                Contact: Tenant Owner
        rootMemory:
          id: mem_abc123
          name: summer-trip
          displayName: Summer Trip
          path: /
          parentId: null
          childCount: 1
          mediaCount: 3
          startDate: "2026-05-03"
          endDate: "2026-05-05"
    PublicShareNoticeScope:
      type: string
      enum: [TENANT, SHARE]
    PublicShareNotice:
      type: object
      additionalProperties: false
      required: [scope, tenantName, tenantDomain, version, markdownByLocale]
      properties:
        scope:
          "$ref": "#/components/schemas/PublicShareNoticeScope"
        tenantName:
          type: string
        tenantDomain:
          type: string
        version:
          type: integer
          format: int32
          minimum: 0
        markdownByLocale:
          "$ref": "#/components/schemas/MarkdownByLocale"
      example:
        scope: TENANT
        tenantName: friends
        tenantDomain: friends.example.test
        version: 1
        markdownByLocale:
          en: |-
            # Terms for this area

            Contact: Tenant Owner
    MarkdownByLocale:
      type: object
      additionalProperties:
        type: string
        maxLength: 20000
      example:
        de: |-
          # Hinweis

          Bitte privat halten.
        en: |-
          # Notice

          Please keep this private.
    PublicShareTreeResponse:
      type: object
      additionalProperties: false
      required: [root, memories]
      properties:
        root:
          "$ref": "#/components/schemas/PublicShareMemorySummary"
        memories:
          type: array
          items:
            "$ref": "#/components/schemas/PublicShareMemorySummary"
      example:
        root:
          id: mem_abc123
          name: summer-trip
          displayName: Summer Trip
          path: /
          parentId: null
          childCount: 1
          mediaCount: 3
          startDate: "2026-05-03"
