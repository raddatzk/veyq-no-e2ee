components:
  parameters:
    MemoryId:
      in: path
      required: true
      name: memoryId
      description: Public Memory id.
      schema:
        type: string
      example: mem_abc123
    ShareId:
      in: path
      required: true
      name: shareId
      description: Public share id.
      schema:
        type: string
      example: shr_abc123
    MediaId:
      in: path
      required: true
      name: mediaId
      description: Public media id.
      schema:
        type: string
      example: med_abc123
    MemoryPath:
      in: query
      required: true
      name: path
      description: Share-relative Memory path. `/` resolves to the share root.
      schema:
        type: string
      example: /day-1
  requestBodies:
    CreateMemoryShare:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/CreateMemoryShareRequest"
          example:
            name: Family review
            role: VIEWER
            password: share-password123
    UpdateMemoryShare:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/UpdateMemoryShareRequest"
          example:
            name: Family uploads
            role: CONTRIBUTOR
            enabled: true
    PublicShareLogin:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/PublicShareLoginRequest"
          example:
            password: share-password123
            displayName: Alex
    UploadPublicShareMedia:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file:
                type: string
                format: binary
              title:
                type: string
          example:
            title: Ceremony
    CreatePublicShareMemory:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/CreatePublicShareMemoryRequest"
          example:
            name: day-2
            displayName: Day 2
            startDate: "2026-05-04"
            endDate: "2026-05-04"
    UpdatePublicShareMemory:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/UpdatePublicShareMemoryRequest"
          example:
            name: day-2
            displayName: Day 2
            startDate: "2026-05-04"
            endDate: "2026-05-04"
    UpdatePublicShareMediaMetadata:
      required: true
      content:
        application/json:
          schema:
            "$ref": "./memories.openapi.yaml#/components/schemas/UpdateMemoryMediaMetadataRequest"
          example:
            capturedAt: "2026-05-04T18:30:00Z"
    UpdateMemoryJournal:
      required: true
      content:
        application/json:
          schema:
            "$ref": "./memories.openapi.yaml#/components/schemas/UpdateMemoryJournalRequest"
          example:
            markdown: |-
              # Ceremony

              ![First dance](veyq:media/med_abc123)
              ![Reception](veyq:media/med_abc123,med_def456)
    SetPublicShareMemoryCover:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              file:
                type: string
                format: binary
              mediaId:
                type: string
              cropX:
                type: number
                format: double
              cropY:
                type: number
                format: double
              cropWidth:
                type: number
                format: double
              cropHeight:
                type: number
                format: double
          example:
            mediaId: med_abc123
            cropX: 0.1
            cropY: 0.05
            cropWidth: 0.8
            cropHeight: 0.8
  responses:
    MemoryShare:
      description: Managed public share.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/MemoryShareSummary"
          example:
            id: shr_abc123
            memoryId: mem_abc123
            role: VIEWER
            enabled: true
            shareUrl: /s/shr_abc123
            name: Family review
            hasPassword: true
            createdAt: "2026-05-24T10:00:00Z"
            updatedAt: "2026-05-24T10:00:00Z"
    MemoryShares:
      description: Managed public shares.
      content:
        application/json:
          schema:
            type: array
            items:
              "$ref": "#/components/schemas/MemoryShareSummary"
          example:
            - id: shr_abc123
              memoryId: mem_abc123
              role: VIEWER
              enabled: true
              shareUrl: /s/shr_abc123
              name: Family review
              hasPassword: true
              createdAt: "2026-05-24T10:00:00Z"
              updatedAt: "2026-05-24T10:00:00Z"
    PublicShare:
      description: Public share state.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/PublicShareSummary"
          example:
            id: shr_abc123
            role: VIEWER
            authenticated: true
            passwordRequired: true
            displayNameRequired: false
            canViewGallery: true
            canUpload: false
            canEdit: false
            canDelete: false
            rootMemory:
              id: mem_abc123
              name: summer-trip
              displayName: Summer Trip
              path: /
              parentId: null
              childCount: 1
              mediaCount: 3
              startDate: "2026-05-03"
              endDate: "2026-05-05"
    PublicShareTree:
      description: Public Memory subtree.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/PublicShareTreeResponse"
          example:
            root:
              id: mem_abc123
              name: summer-trip
              displayName: Summer Trip
              path: /
              parentId: null
              childCount: 1
              mediaCount: 3
              startDate: "2026-05-03"
              endDate: "2026-05-05"
            memories: []
    PublicShareMemory:
      description: Public share Memory.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/PublicShareMemorySummary"
          example:
            id: mem_abc123
            name: summer-trip
            displayName: Summer Trip
            path: /
            parentId: null
            childCount: 1
            mediaCount: 3
            startDate: "2026-05-03"
            endDate: "2026-05-05"
    PublicShareMemoryHeader:
      description: Public share Memory detail header.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/PublicShareMemoryHeaderSummary"
          example:
            id: mem_abc123
            displayName: Summer Trip
            path: /
            coverUrl: /api/public-shares/shr_abc123/memories/mem_abc123/cover/content
            coverCrop:
              x: 0
              y: 0
              width: 1
              height: 1
            startDate: "2026-05-03"
            endDate: "2026-05-05"
            directMediaCount: 3
            descendantMediaCount: 5
            childMemoryCount: 1
    MemoryJournal:
      description: Public share Memory journal.
      content:
        application/json:
          schema:
            "$ref": "./memories.openapi.yaml#/components/schemas/MemoryJournalSummary"
          example:
            memoryId: mem_abc123
            markdown: |-
              # Ceremony

              ![First dance](veyq:media/med_abc123)
              ![Reception](veyq:media/med_abc123,med_def456)
            updatedAt: "2026-05-24T10:00:00Z"
    PublicShareMemoryList:
      description: Public share Memories.
      content:
        application/json:
          schema:
            type: array
            items:
              "$ref": "#/components/schemas/PublicShareMemorySummary"
          example:
            - id: mem_child123
              name: day-1
              displayName: Day 1
              path: /day-1
              parentId: mem_abc123
              childCount: 0
              mediaCount: 2
              startDate: "2026-05-03"
              endDate: "2026-05-03"
    PublicShareMedia:
      description: Public media summary.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/PublicShareMediaSummary"
          example:
            id: med_abc123
            memoryId: mem_abc123
            title: Ceremony
            uploader:
              type: ANONYMOUS
              displayName: Alex
            createdAt: "2026-05-24T10:00:00Z"
            capturedAtOverride: false
            mimeType: image/jpeg
            sizeBytes: 1000
            contentUrl: /api/public-shares/shr_abc123/media/med_abc123/content
    PublicShareMediaList:
      description: Public media summaries.
      content:
        application/json:
          schema:
            type: array
            items:
              "$ref": "#/components/schemas/PublicShareMediaSummary"
          example:
            - id: med_abc123
              memoryId: mem_abc123
              title: Ceremony
              uploader:
                type: ANONYMOUS
                displayName: Alex
              createdAt: "2026-05-24T10:00:00Z"
              capturedAtOverride: false
              mimeType: image/jpeg
              sizeBytes: 1000
              contentUrl: /api/public-shares/shr_abc123/media/med_abc123/content
  schemas:
    MemoryShareRole:
      type: string
      enum: [VIEWER, CONTRIBUTOR, MANAGER, UPLOADER]
    CreateMemoryShareRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        name:
          type: string
          nullable: true
          maxLength: 120
        role:
          "$ref": "#/components/schemas/MemoryShareRole"
        password:
          type: string
          nullable: true
          minLength: 0
    UpdateMemoryShareRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          nullable: true
          maxLength: 120
        role:
          "$ref": "#/components/schemas/MemoryShareRole"
        enabled:
          type: boolean
          description: Set to `false` to revoke the share link. Managed share deletion is not supported in V1.
        password:
          type: string
          nullable: true
          minLength: 0
    PublicShareLoginRequest:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        password:
          type: string
          nullable: true
