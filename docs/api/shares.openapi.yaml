          name: includeChildren
          required: false
          schema:
            type: boolean
            default: false
          description: Include original media assigned to descendant Memories inside the shared subtree.
        - in: query
          name: locale
          required: false
          schema:
            type: string
            enum: [de, en]
          description: Preferred UI locale for the generated ZIP filename.
      responses:
        "200":
          description: ZIP archive with original media files.
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Attachment filename for the generated ZIP archive.
          content:
            application/zip:
              schema:
                type: string
                format: binary
              example: "<binary zip archive>"
        "401":
          "$ref": "./common.openapi.yaml#/components/responses/401"
        "403":
