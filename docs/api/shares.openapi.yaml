---
openapi: 3.1.0
info:
  title: veyq Public Shares API
  version: 0.1.0
  description: Password-protected public Memory subtree sharing.
servers:
  - url: /
security:
  - accessTokenCookie: []
tags:
  - name: MemoryShares
  - name: PublicShares
paths:
  "/api/{tenantName}/memories/{memoryId}/shares":
    get:
      tags: [MemoryShares]
      operationId: listMemoryShares
      summary: List shares for a memory
      x-implementation-status: implemented
      x-preconditions:
        - A valid access token cookie must be present.
        - The current user must be a member of the addressed tenant and see the addressed Memory.
      description: |-
        Lists public shares created for the addressed Memory.

        Vorbedingungen:
        - A valid access token cookie must be present.
        - The current user must be a member of the addressed tenant and see the addressed Memory.

        Implementierungsstatus: implemented.
      parameters:
        - "$ref": "./common.openapi.yaml#/components/parameters/TenantName"
        - "$ref": "#/components/parameters/MemoryId"
      responses:
        "200":
          "$ref": "#/components/responses/MemoryShares"
        "401":
          "$ref": "./common.openapi.yaml#/components/responses/401"
        "403":
          "$ref": "./common.openapi.yaml#/components/responses/403"
        "404":
          "$ref": "./common.openapi.yaml#/components/responses/404"
    post:
      tags: [MemoryShares]
      operationId: createMemoryShare
      summary: Create a memory share
      x-implementation-status: implemented
      x-preconditions:
        - A valid access token cookie must be present.
        - The current user must be a member of the addressed tenant and see the addressed Memory.
      description: |-
        Creates a public share for the addressed Memory subtree. Password protection and share-specific notices are optional. Share passwords require at least 10 characters when set and are stored as Argon2id hashes, but they are not checked against the compromised-password provider.

        Vorbedingungen:
        - A valid access token cookie must be present.
        - The current user must be a member of the addressed tenant and see the addressed Memory.
      parameters:
        - "$ref": "./common.openapi.yaml#/components/parameters/TenantName"
        - "$ref": "#/components/parameters/MemoryId"
      requestBody:
        "$ref": "#/components/requestBodies/CreateMemoryShare"
      responses:
        "200":
          "$ref": "#/components/responses/MemoryShare"
        "400":
          "$ref": "./common.openapi.yaml#/components/responses/400"
        "401":
          "$ref": "./common.openapi.yaml#/components/responses/401"
        "403":
          "$ref": "./common.openapi.yaml#/components/responses/403"
        "404":
          "$ref": "./common.openapi.yaml#/components/responses/404"
  "/api/{tenantName}/memory-shares/{shareId}":
    put:
      tags: [MemoryShares]
      operationId: updateMemoryShare
      summary: Update a memory share
      x-implementation-status: implemented
      x-preconditions:
        - A valid access token cookie must be present.
        - The current user must be a member of the addressed tenant and see the addressed Memory.
      description: |-
        Updates public share role, enabled state, internal name, password or share-specific notice.
        Missing `name` or `password` fields leave the current value unchanged.
        `null` or an empty string removes the corresponding name/password value. Non-empty share passwords require at least 10 characters and are not checked against the compromised-password provider.
        Missing `noticeMarkdownByLocale` leaves the current notice unchanged. An empty map clears the notice.
        Managed shares are not deleted in major line 1; set `enabled=false` to revoke a share link.

        Vorbedingungen:
        - A valid access token cookie must be present.
        - The current user must be a member of the share tenant and see the root Memory.
      parameters:
        - "$ref": "./common.openapi.yaml#/components/parameters/TenantName"
        - "$ref": "#/components/parameters/ShareId"
      requestBody:
        "$ref": "#/components/requestBodies/UpdateMemoryShare"
      responses:
        "200":
          "$ref": "#/components/responses/MemoryShare"
        "400":
          "$ref": "./common.openapi.yaml#/components/responses/400"
        "401":
          "$ref": "./common.openapi.yaml#/components/responses/401"
        "403":
          "$ref": "./common.openapi.yaml#/components/responses/403"
        "404":
          "$ref": "./common.openapi.yaml#/components/responses/404"
  "/api/public-shares/{shareId}":
    get:
      tags: [PublicShares]
      operationId: getPublicShare
      summary: Resolve public share state
      security: []
      x-implementation-status: implemented
      x-preconditions:
        - The share id exists and the share is enabled.
        - A valid share access-token cookie or normal authenticated Memory visibility is required for protected content.
      description: |-
        Resolves a public share and reports whether protected Memory content can be loaded.
        Protected unauthenticated shares intentionally omit Memory metadata.

        Vorbedingungen:
        - The share id exists and the share is enabled.
        - A valid share access-token cookie or normal authenticated Memory visibility is required for protected content.
      parameters:
        - "$ref": "#/components/parameters/ShareId"
      responses:
        "200":
          "$ref": "#/components/responses/PublicShare"
        "404":
          "$ref": "./common.openapi.yaml#/components/responses/404"
  "/api/public-shares/{shareId}/login":
    post:
      tags: [PublicShares]
      operationId: loginPublicShare
      summary: Open a public share identity session
      security: []
      x-implementation-status: implemented
      x-preconditions:
        - The share id exists and the share is enabled.
        - Contributor, Manager and Uploader shares provide a display name for the anonymous share identity.
      description: |-
        Checks the public share password, creates an anonymous share identity and sets HttpOnly share access-/refresh-token cookies.

        Vorbedingungen:
        - The share id exists and the share is enabled.
        - Contributor, Manager and Uploader shares provide a display name for the anonymous share identity.
      parameters:
        - "$ref": "#/components/parameters/ShareId"
      requestBody:
        "$ref": "#/components/requestBodies/PublicShareLogin"
      responses:
        "200":
          "$ref": "#/components/responses/PublicShare"
        "400":
          "$ref": "./common.openapi.yaml#/components/responses/400"
        "401":
          "$ref": "./common.openapi.yaml#/components/responses/401"
        "404":
          "$ref": "./common.openapi.yaml#/components/responses/404"
  "/api/public-shares/{shareId}/logout":
    post:
      tags: [PublicShares]
      operationId: logoutPublicShare
      summary: Close a public share identity session
      security: []
      x-implementation-status: implemented
      x-preconditions:
        - The share id exists and the share is enabled.
        - A valid share access- or refresh-token cookie may be present.
      description: |-
        Revokes the current share access-/refresh-token cookies for this share.

        Vorbedingungen:
        - The share id exists.
      parameters:
        - "$ref": "#/components/parameters/ShareId"
      responses:
        "204":
          description: Share session revoked.
        "404":
          "$ref": "./common.openapi.yaml#/components/responses/404"
  "/api/public-shares/{shareId}/refresh":
    post:
      tags: [PublicShares]
      operationId: refreshPublicShare
      summary: Refresh a public share identity session
      security: []
      x-implementation-status: implemented
      x-preconditions:
        - The share id exists and the share is enabled.
        - A valid share refresh-token cookie must be present.
      description: |-
        Rotates the public share refresh token and sets a new public share access-token cookie.

        Vorbedingungen:
        - The share id exists and the share is enabled.
        - A valid share refresh-token cookie must be present.
      parameters:
        - "$ref": "#/components/parameters/ShareId"
      responses:
        "200":
          "$ref": "#/components/responses/PublicShare"
        "401":
          "$ref": "./common.openapi.yaml#/components/responses/401"
        "404":
          "$ref": "./common.openapi.yaml#/components/responses/404"
  "/api/public-shares/{shareId}/tree":
    get:
      tags: [PublicShares]
      operationId: getPublicShareTree
      summary: Load public share memory tree
      security: []
      x-implementation-status: implemented
      x-preconditions:
        - The share id exists and the share is enabled.
        - A valid share access-token cookie or normal authenticated Memory visibility is required for protected content.
      description: |-
        Loads the Memory subtree visible through the share.

        Vorbedingungen:
        - The share is enabled.
        - A valid share access-token cookie or normal authenticated Memory visibility is present.
      parameters:
        - "$ref": "#/components/parameters/ShareId"
      responses:
        "200":
          "$ref": "#/components/responses/PublicShareTree"
        "401":
          "$ref": "./common.openapi.yaml#/components/responses/401"
        "404":
          "$ref": "./common.openapi.yaml#/components/responses/404"
  "/api/public-shares/{shareId}/memories/by-path":
    get:
      tags: [PublicShares]
      operationId: getPublicShareMemoryByPath
      summary: Load a Memory in a public share by path
      security: []
      x-implementation-status: implemented
      x-preconditions: &publicShareReadPreconditions
        - The share id exists and the share is enabled.
        - A valid share access-token cookie or normal authenticated Memory visibility is present.
        - The requested Memory belongs to the shared subtree.
      description: |-
        Loads one Memory from the shared subtree by share-relative path.

        Vorbedingungen:
        - The share is enabled.
        - A valid share access-token cookie or normal authenticated Memory visibility is present.
        - The requested Memory belongs to the shared subtree.
      parameters:
        - "$ref": "#/components/parameters/ShareId"
        - "$ref": "#/components/parameters/MemoryPath"
      responses:
        "200":
          "$ref": "#/components/responses/PublicShareMemory"
        "401":
          "$ref": "./common.openapi.yaml#/components/responses/401"
        "404":
          "$ref": "./common.openapi.yaml#/components/responses/404"
  "/api/public-shares/{shareId}/memories/{memoryId}":
    put:
      tags: [PublicShares]
      operationId: updatePublicShareMemory
      summary: Update a Memory through a public share
      security: []
      x-implementation-status: implemented
      x-preconditions: &publicShareEditPreconditions
        - The share role is `CONTRIBUTOR` or `MANAGER`.
        - A valid share access-token cookie or normal authenticated Memory visibility is present.
        - The requested Memory belongs to the shared subtree.
      description: |-
        Updates display metadata for one Memory inside the shared subtree.

        Vorbedingungen:
        - The share role is `CONTRIBUTOR` or `MANAGER`.
        - A valid share access-token cookie or normal authenticated Memory visibility is present.
        - The requested Memory belongs to the shared subtree.
      parameters:
        - "$ref": "#/components/parameters/ShareId"
        - "$ref": "#/components/parameters/MemoryId"
      requestBody:
        "$ref": "#/components/requestBodies/UpdatePublicShareMemory"
      responses:
        "200":
          "$ref": "#/components/responses/PublicShareMemory"
        "400":
          "$ref": "./common.openapi.yaml#/components/responses/400"
        "401":
          "$ref": "./common.openapi.yaml#/components/responses/401"
        "403":
          "$ref": "./common.openapi.yaml#/components/responses/403"
        "404":
          "$ref": "./common.openapi.yaml#/components/responses/404"
    delete:
      tags: [PublicShares]
      operationId: deletePublicShareMemory
      summary: Delete a submemory through a public share
      security: []
      x-implementation-status: implemented
      x-preconditions: &publicShareDeletePreconditions
        - The share role is `MANAGER`.
        - A valid share access-token cookie or normal authenticated Memory visibility is present.
        - The requested Memory belongs to the shared subtree and is not the share root.
      description: |-
        Deletes a submemory inside the shared subtree. The share root cannot be deleted through the share.

        Vorbedingungen:
        - The share role is `MANAGER`.
        - A valid share access-token cookie or normal authenticated Memory visibility is present.
        - The requested Memory belongs to the shared subtree and is not the share root.
      parameters:
        - "$ref": "#/components/parameters/ShareId"
        - "$ref": "#/components/parameters/MemoryId"
      responses:
        "204":
          description: Public share submemory deleted.
        "401":
          "$ref": "./common.openapi.yaml#/components/responses/401"
        "403":
          "$ref": "./common.openapi.yaml#/components/responses/403"
        "404":
          "$ref": "./common.openapi.yaml#/components/responses/404"
  "/api/public-shares/{shareId}/memories/{memoryId}/children":
    get:
      tags: [PublicShares]
      operationId: listPublicShareChildMemories
      summary: List child Memories in a public share
      security: []
      x-implementation-status: implemented
      x-preconditions:
        - The share id exists and the share is enabled.
        - A valid share access-token cookie or normal authenticated Memory visibility is present.
        - The requested Memory belongs to the shared subtree.
      description: |-
        Lists child Memories for one Memory inside the shared subtree.

        Vorbedingungen:
        - The share is enabled.
        - A valid share access-token cookie or normal authenticated Memory visibility is present.
        - The requested Memory belongs to the shared subtree.
      parameters:
        - "$ref": "#/components/parameters/ShareId"
        - "$ref": "#/components/parameters/MemoryId"
      responses:
        "200":
          "$ref": "#/components/responses/PublicShareMemoryList"
        "401":
          "$ref": "./common.openapi.yaml#/components/responses/401"
        "404":
          "$ref": "./common.openapi.yaml#/components/responses/404"
    post:
      tags: [PublicShares]
      operationId: createPublicShareChildMemory
      summary: Create a child Memory through a public share
      security: []
      x-implementation-status: implemented
      x-preconditions:
        - The share role is `CONTRIBUTOR` or `MANAGER`.
        - A valid share access-token cookie or normal authenticated Memory visibility is present.
        - The requested Memory belongs to the shared subtree.
      description: |-
        Creates a child Memory below one Memory inside the shared subtree.

        Vorbedingungen:
        - The share role is `CONTRIBUTOR` or `MANAGER`.
        - A valid share access-token cookie or normal authenticated Memory visibility is present.
        - The parent Memory belongs to the shared subtree.
      parameters:
        - "$ref": "#/components/parameters/ShareId"
        - "$ref": "#/components/parameters/MemoryId"
      requestBody:
        "$ref": "#/components/requestBodies/CreatePublicShareMemory"
      responses:
        "200":
          "$ref": "#/components/responses/PublicShareMemory"
        "400":
          "$ref": "./common.openapi.yaml#/components/responses/400"
        "401":
          "$ref": "./common.openapi.yaml#/components/responses/401"
        "403":
          "$ref": "./common.openapi.yaml#/components/responses/403"
        "404":
          "$ref": "./common.openapi.yaml#/components/responses/404"
  "/api/public-shares/{shareId}/memories/{memoryId}/header":
    get:
      tags: [PublicShares]
      operationId: getPublicShareMemoryHeader
      summary: Get public share Memory header
      security: []
      x-implementation-status: implemented
      x-preconditions:
        - The share id exists and the share is enabled.
        - A valid share access-token cookie or normal authenticated Memory visibility is present.
        - The requested Memory belongs to the shared subtree.
      description: |-
        Returns the detail header for one Memory inside the shared subtree. The response exposes only share-safe fields and separates direct media from descendant media within the share.

        Vorbedingungen:
        - The share is enabled.
        - A valid share access-token cookie or normal authenticated Memory visibility is present.
        - The requested Memory belongs to the shared subtree.
      parameters:
        - "$ref": "#/components/parameters/ShareId"
        - "$ref": "#/components/parameters/MemoryId"
      responses:
        "200":
          "$ref": "#/components/responses/PublicShareMemoryHeader"
        "401":
          "$ref": "./common.openapi.yaml#/components/responses/401"
        "403":
          "$ref": "./common.openapi.yaml#/components/responses/403"
        "404":
          "$ref": "./common.openapi.yaml#/components/responses/404"
  "/api/public-shares/{shareId}/memories/{memoryId}/journal":
    get:
      tags: [PublicShares]
      operationId: getPublicShareMemoryJournal
      summary: Get public share Memory journal
      security: []
      x-implementation-status: implemented
      x-preconditions:
        - The share id exists and the share is enabled.
        - A valid share access-token cookie or normal authenticated Memory visibility is present.
        - The share role allows full Memory viewing.
        - The requested Memory belongs to the shared subtree.
      description: |-
        Returns the Markdown journal for one Memory inside the shared subtree. Uploader-only shares cannot read journals.

        Vorbedingungen:
        - The share is enabled.
        - A valid share access-token cookie or normal authenticated Memory visibility is present.
        - The share role allows full Memory viewing.
        - The requested Memory belongs to the shared subtree.
      parameters:
        - "$ref": "#/components/parameters/ShareId"
        - "$ref": "#/components/parameters/MemoryId"
      responses:
        "200":
          "$ref": "#/components/responses/MemoryJournal"
        "401":
          "$ref": "./common.openapi.yaml#/components/responses/401"
        "403":
          "$ref": "./common.openapi.yaml#/components/responses/403"
        "404":
          "$ref": "./common.openapi.yaml#/components/responses/404"
    put:
      tags: [PublicShares]
      operationId: updatePublicShareMemoryJournal
      summary: Update public share Memory journal
      security: []
      x-implementation-status: implemented
      x-preconditions:
        - The share role is `MANAGER`.
        - A valid share access-token cookie or normal authenticated Memory visibility is present.
        - The requested Memory belongs to the shared subtree.
      description: |-
        Replaces the Markdown journal for one Memory inside the shared subtree. veyq `::` embed tokens are validated against content visible inside the shared subtree.

        Vorbedingungen:
        - The share role is `MANAGER`.
        - A valid share access-token cookie or normal authenticated Memory visibility is present.
        - The requested Memory belongs to the shared subtree.
      parameters:
        - "$ref": "#/components/parameters/ShareId"
        - "$ref": "#/components/parameters/MemoryId"
      requestBody:
        "$ref": "#/components/requestBodies/UpdateMemoryJournal"
      responses:
        "200":
          "$ref": "#/components/responses/MemoryJournal"
        "400":
          "$ref": "./common.openapi.yaml#/components/responses/400"
        "401":
          "$ref": "./common.openapi.yaml#/components/responses/401"
        "403":
          "$ref": "./common.openapi.yaml#/components/responses/403"
        "404":
          "$ref": "./common.openapi.yaml#/components/responses/404"
  "/api/public-shares/{shareId}/memories/{memoryId}/journal/live-session":
    post:
      tags: [PublicShares]
      operationId: createPublicShareMemoryJournalLiveSession
      summary: Create public share Memory journal live editing session
      security: []
      x-implementation-status: implemented
      x-preconditions:
        - The share role is `MANAGER`.
        - A valid share access-token cookie or normal authenticated Memory visibility is present.
        - The requested Memory belongs to the shared subtree.
      description: |-
        Issues a short-lived, Memory-bound editor session for collaborative Markdown journal editing inside a public Manager share. The returned token is scoped to the addressed shared Memory journal document and is accepted only by the live journal collaboration service.

        Vorbedingungen:
        - The share role is `MANAGER`.
        - A valid share access-token cookie or normal authenticated Memory visibility is present.
        - The requested Memory belongs to the shared subtree.
      parameters:
        - "$ref": "#/components/parameters/ShareId"
        - "$ref": "#/components/parameters/MemoryId"
      responses:
        "200":
          "$ref": "#/components/responses/MemoryJournalLiveSession"
        "401":
          "$ref": "./common.openapi.yaml#/components/responses/401"
        "403":
          "$ref": "./common.openapi.yaml#/components/responses/403"
        "404":
          "$ref": "./common.openapi.yaml#/components/responses/404"
  "/api/public-shares/{shareId}/memories/{memoryId}/media":
    get:
      tags: [PublicShares]
      operationId: listPublicShareMemoryMedia
      summary: List media for one public share Memory
      security: []
      x-implementation-status: implemented
      x-preconditions:
        - The share id exists and the share is enabled.
        - A valid share access-token cookie or normal authenticated Memory visibility is present.
        - The requested Memory belongs to the shared subtree.
      description: |-
        Lists media for one Memory inside the shared subtree. When `includeChildren=true`, media from descendant Memories inside the shared subtree is included.

        Vorbedingungen:
        - The share is enabled.
        - A valid share access-token cookie or normal authenticated Memory visibility is present.
        - The requested Memory belongs to the shared subtree.
      parameters:
        - "$ref": "#/components/parameters/ShareId"
        - "$ref": "#/components/parameters/MemoryId"
        - in: query
          name: includeChildren
          required: false
          schema:
            type: boolean
            default: false
          description: Include media assigned to descendant Memories inside the shared subtree.
      responses:
        "200":
          "$ref": "#/components/responses/PublicShareMediaList"
        "401":
          "$ref": "./common.openapi.yaml#/components/responses/401"
        "404":
          "$ref": "./common.openapi.yaml#/components/responses/404"
    post:
      tags: [PublicShares]
      operationId: uploadPublicShareMemoryMedia
      summary: Upload media to one public share Memory
      security: []
      x-implementation-status: implemented
      x-preconditions:
        - The share role is `CONTRIBUTOR`, `MANAGER` or `UPLOADER`.
        - A valid share access-token cookie or normal authenticated Memory visibility is present.
        - The requested Memory belongs to the shared subtree.
      description: |-
        Uploads media into one Memory inside the shared subtree.

        Vorbedingungen:
        - The share role is `CONTRIBUTOR`, `MANAGER` or `UPLOADER`.
        - A valid share access-token cookie or normal authenticated Memory visibility is present.
        - The requested Memory belongs to the shared subtree.
      parameters:
        - "$ref": "#/components/parameters/ShareId"
        - "$ref": "#/components/parameters/MemoryId"
      requestBody:
        "$ref": "#/components/requestBodies/UploadPublicShareMedia"
      responses:
        "200":
          "$ref": "#/components/responses/PublicShareMedia"
        "400":
          "$ref": "./common.openapi.yaml#/components/responses/400"
        "401":
          "$ref": "./common.openapi.yaml#/components/responses/401"
        "403":
          "$ref": "./common.openapi.yaml#/components/responses/403"
        "404":
          "$ref": "./common.openapi.yaml#/components/responses/404"
  "/api/public-shares/{shareId}/memories/{memoryId}/media/updates":
    get:
      tags: [PublicShares]
      operationId: waitForPublicShareMemoryMediaUpdates
      summary: Wait for public share Memory media updates
      security: []
      x-implementation-status: implemented
      x-preconditions:
        - The share id exists and the share is enabled.
        - A valid share access-token cookie or normal authenticated Memory visibility is present.
        - The requested Memory belongs to the shared subtree.
      description: |-
        Long-polls for public share media updated after the supplied `updatedAt` plus media id cursor. The response contains changed media ordered by update time and id. Clients merge the returned media locally and may refresh aggregate header or bucket state separately. When `knownMediaSetHash` is supplied and does not match the server's current sorted visible media id set, the response also includes `currentMediaIds` so clients can remove deleted media without refetching all media summaries. The server evaluates the media-set hash at most once per long-poll request; later deletions are reported on the next poll.

        Vorbedingungen:
        - The share is enabled.
        - A valid share access-token cookie or normal authenticated Memory visibility is present.
        - The requested Memory belongs to the shared subtree.
      parameters:
        - "$ref": "#/components/parameters/ShareId"
        - "$ref": "#/components/parameters/MemoryId"
        - in: query
          name: includeChildren
          required: false
          schema:
            type: boolean
            default: false
          description: Include media assigned to descendant Memories inside the shared subtree.
        - in: query
          name: afterUpdatedAt
          required: false
          schema:
            type: string
            format: date-time
          description: Updated timestamp of the newest media item already known to the client.
        - in: query
          name: afterMediaId
          required: false
          schema:
            type: string
          description: Public id of the newest media item already known to the client, used as a stable tie-breaker.
        - in: query
          name: knownMediaSetHash
          required: false
          schema:
            type: string
          description: SHA-256 hash of the client's sorted visible public media id set. If it differs from the current server set, the response includes `currentMediaIds`.
        - in: query
          name: timeoutSeconds
          required: false
          schema:
            type: integer
            default: 25
            minimum: 1
            maximum: 30
          description: Maximum time to hold the request before returning an empty update set.
      responses:
        "200":
          "$ref": "#/components/responses/PublicShareMediaUpdates"
        "401":
          "$ref": "./common.openapi.yaml#/components/responses/401"
        "404":
          "$ref": "./common.openapi.yaml#/components/responses/404"
  "/api/public-shares/{shareId}/memories/{memoryId}/media-buckets":
    get:
      tags: [PublicShares]
      operationId: listPublicShareMemoryMediaBuckets
      summary: List public share Memory media buckets
      security: []
      x-implementation-status: implemented
      x-preconditions:
        - The share id exists and the share is enabled.
        - A valid share access-token cookie or normal authenticated Memory visibility is present.
        - The requested Memory belongs to the shared subtree.
      description: |-
        Lists media buckets visible to the current public-share identity for one Memory. When `includeChildren=true`, buckets from descendant Memories inside the shared subtree are included.

        Vorbedingungen:
        - The share is enabled.
        - A valid share access-token cookie or normal authenticated Memory visibility is present.
        - The requested Memory belongs to the shared subtree.
      parameters:
        - "$ref": "#/components/parameters/ShareId"
        - "$ref": "#/components/parameters/MemoryId"
        - in: query
          name: includeChildren
          required: false
          schema:
            type: boolean
            default: false
          description: Include media buckets assigned to descendant Memories inside the shared subtree.
      responses:
        "200":
