openapi: 3.1.0
info:
  title: veyq Account API
  version: 1.0
  description: >
    Authenticated account lifecycle endpoints for profile metadata, avatar management,
    password changes, login-device sessions, password recovery and email changes. The API keeps
    content and key material operator-blind: private keys and master keys never leave the client, and
    the server stores only opaque wraps, verifiers and low-sensitivity account metadata.
paths:
  /api/me:
    get:
      tags:
        - AccountLifecycle
      operationId: getCurrentUser
      summary: The authenticated user for a session token (proves the session resolves).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The current user.
          content:
            application/json:
              schema:
                $ref: "./common.openapi.yaml#/components/schemas/UserSummary"
              example:
                id: c3f7a1b2-8d42-4c9e-a7f1-2b6d90f4e123
                email: ava@example.com
                displayName: Ava Winter
                serverRole: ServerMember
                username: ava-winter
                avatarUrl: "https://objects.example.com/veyq/profile-avatars/c3f7a1b2-8d42-4c9e-a7f1-2b6d90f4e123/8c57f4df-2a87-49a1-bd7a-67a2e29f3e52?X-Amz-Expires=900&X-Amz-Signature=..."
        '401':
          $ref: "./common.openapi.yaml#/components/responses/Unauthorized"
    patch:
      tags:
        - AccountLifecycle
      operationId: updateCurrentProfile
      summary: Update low-sensitivity profile fields for the authenticated user.
      description: |
        Updates server-visible identity metadata. This endpoint intentionally does not change email, credentials or device wraps; those require their own verification/key-wrap flows.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
            examples:
              displayNameAndUsername:
                summary: Rename profile and profile address
                value:
                  displayName: Ava Winter
                  username: ava-winter
              keepDisplayName:
                summary: Keep the name but change the username
                value:
                  displayName: Ava Winter
                  username: ava
      responses:
        '200':
          description: The updated current user.
          content:
            application/json:
              schema:
                $ref: "./common.openapi.yaml#/components/schemas/UserSummary"
              example:
                id: c3f7a1b2-8d42-4c9e-a7f1-2b6d90f4e123
                email: ava@example.com
                displayName: Ava Winter
                serverRole: ServerMember
                username: ava-winter
                avatarUrl: "https://objects.example.com/veyq/profile-avatars/c3f7a1b2-8d42-4c9e-a7f1-2b6d90f4e123/8c57f4df-2a87-49a1-bd7a-67a2e29f3e52?X-Amz-Expires=900&X-Amz-Signature=..."
        '400':
          $ref: "./common.openapi.yaml#/components/responses/BadRequest"
        '401':
          $ref: "./common.openapi.yaml#/components/responses/Unauthorized"
    delete:
      tags:
        - AccountLifecycle
      operationId: deleteCurrentAccount
      summary: Delete the current account by credential and key erasure.
      description: |
        Authenticated and re-authenticated with the current password. The server erases credential/key
        material, invalidates sessions and anonymizes the profile while keeping non-personal audit/content
        references stable.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountRequest"
            example:
              password: current-password
      responses:
        '204':
          description: Account credentials/key material were erased and the profile anonymized.
        '400':
          $ref: "./common.openapi.yaml#/components/responses/BadRequest"
        '401':
          $ref: "./common.openapi.yaml#/components/responses/Unauthorized"
        '409':
          $ref: "./common.openapi.yaml#/components/responses/Conflict"
  /api/me/avatar:
    delete:
      tags:
        - Avatar
      operationId: deleteCurrentAvatar
      summary: Remove the authenticated user's profile image.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The updated current user.
          content:
            application/json:
              schema:
                $ref: "./common.openapi.yaml#/components/schemas/UserSummary"
              example:
                id: c3f7a1b2-8d42-4c9e-a7f1-2b6d90f4e123
                email: ava@example.com
                displayName: Ava Winter
                serverRole: ServerMember
                username: ava-winter
        '401':
          $ref: "./common.openapi.yaml#/components/responses/Unauthorized"
  /api/me/avatar/upload:
    post:
      tags:
        - Avatar
      operationId: startCurrentAvatarUpload
      summary: Start a direct-to-object-store avatar upload.
      description: |
        Authenticated metadata request. The backend creates a new server-owned avatar object key and returns a short-lived presigned PUT URL. The client uploads the image bytes directly to that URL, then confirms the upload with `POST /api/me/avatar/upload/complete`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartAvatarUploadRequest"
            examples:
              png:
                summary: PNG avatar upload
                value:
                  contentType: image/png
                  byteSize: 184320
              webp:
                summary: WebP avatar upload
                value:
                  contentType: image/webp
                  byteSize: 98214
      responses:
        '200':
          description: Presigned upload ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarUploadTicket"
              example:
                uploadRef: profile-avatars/c3f7a1b2-8d42-4c9e-a7f1-2b6d90f4e123/7e5f64dc-7d02-44f9-9c20-55135d60a016
                uploadUrl: "https://objects.example.com/veyq/profile-avatars/c3f7a1b2-8d42-4c9e-a7f1-2b6d90f4e123/7e5f64dc-7d02-44f9-9c20-55135d60a016?X-Amz-Expires=900&X-Amz-Signature=..."
                expiresInSeconds: 900
        '400':
          $ref: "./common.openapi.yaml#/components/responses/BadRequest"
        '401':
          $ref: "./common.openapi.yaml#/components/responses/Unauthorized"
        '409':
          $ref: "./common.openapi.yaml#/components/responses/Conflict"
  /api/me/avatar/upload/complete:
    post:
      tags:
        - Avatar
      operationId: completeCurrentAvatarUpload
      summary: Confirm a direct avatar upload and make it current.
      description: |
        Called after the client PUTs the image to the presigned object-store URL. The backend verifies that the generated object exists, enforces the avatar size limit, stores the content type metadata, deletes the previous avatar object and returns the updated user with a fresh presigned `avatarUrl`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteAvatarUploadRequest"
            example:
              uploadRef: profile-avatars/c3f7a1b2-8d42-4c9e-a7f1-2b6d90f4e123/7e5f64dc-7d02-44f9-9c20-55135d60a016
              contentType: image/png
      responses:
        '200':
          description: The updated current user.
          content:
            application/json:
              schema:
                $ref: "./common.openapi.yaml#/components/schemas/UserSummary"
              example:
                id: c3f7a1b2-8d42-4c9e-a7f1-2b6d90f4e123
                email: ava@example.com
                displayName: Ava Winter
                serverRole: ServerMember
                username: ava-winter
                avatarUrl: "https://objects.example.com/veyq/profile-avatars/c3f7a1b2-8d42-4c9e-a7f1-2b6d90f4e123/7e5f64dc-7d02-44f9-9c20-55135d60a016?X-Amz-Expires=900&X-Amz-Signature=..."
        '400':
          $ref: "./common.openapi.yaml#/components/responses/BadRequest"
        '401':
          $ref: "./common.openapi.yaml#/components/responses/Unauthorized"
        '404':
          $ref: "./common.openapi.yaml#/components/responses/NotFound"
  /api/me/password:
    post:
      tags:
        - Password
      operationId: changeCurrentPassword
      summary: Change the password and replace the PASSWORD master-key wrap.
      description: |
        Authenticated and re-authenticated with the current password. The client keeps the Master Key unchanged and submits a new PASSWORD wrap. The server derives the new auth verifier from the new password and invalidates all sessions.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
            example:
              currentPassword: current-password
              newPassword: correct-horse-battery-staple
              masterKeyWrap:
                unlockMethod: PASSWORD
                suiteId: v1
                wrappedKey: bXktbmV3LXBhc3N3b3JkLXdyYXA
                kdfParams: eyJhbGciOiJhcmdvbjJpZCIsIm0iOjE5NDU2fQ
      responses:
        '204':
          description: Password changed; sessions invalidated.
        '400':
          $ref: "./common.openapi.yaml#/components/responses/BadRequest"
        '401':
          $ref: "./common.openapi.yaml#/components/responses/Unauthorized"
  /api/me/devices:
    get:
      tags:
        - LoginDevices
      operationId: listLoginDevices
      summary: List active login devices for the authenticated user.
      description: |
        Groups active server sessions by the client-generated device identifier. The human-readable device name is stored as client-encrypted opaque text; the server can invalidate sessions for a device without learning the name or any key material.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active login devices.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginDeviceList"
              examples:
                multipleDevices:
                  summary: Two active login devices
                  value:
                    devices:
                      - deviceRef: dev_01J0HA0B7K8M9N2P3Q4R5S6T7V
                        encryptedName: eyJjdCI6ImxhcHRvcC1jaXBoZXJ0ZXh0In0
                        lastLoginAt: '2026-06-24T08:31:12Z'
                      - deviceRef: dev_01J0HA0W8X7Y6Z5A4B3C2D1E0F
                        encryptedName: eyJjdCI6InBob25lLWNpcGhlcnRleHQifQ
                        lastLoginAt: '2026-06-23T19:04:51Z'
                empty:
                  summary: No active devices
                  value:
                    devices: []
        '401':
          $ref: "./common.openapi.yaml#/components/responses/Unauthorized"
  /api/me/devices/{deviceRef}:
    put:
      tags:
        - LoginDevices
      operationId: renameLoginDevice
      summary: Update the encrypted display name for one login device.
      security:
        - bearerAuth: []
      parameters:
        - name: deviceRef
          in: path
          required: true
          example: dev_01J0HA0B7K8M9N2P3Q4R5S6T7V
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameLoginDeviceRequest"
            examples:
              laptop:
                summary: Encrypted laptop name
                value:
                  encryptedName: eyJjdCI6IkF2YXMtTWFjQm9vay1jaXBoZXJ0ZXh0In0
              phone:
                summary: Encrypted phone name
                value:
                  encryptedName: eyJjdCI6IkF2YXMtUGhvbmUtY2lwaGVydGV4dCJ9
      responses:
        '204':
          description: The encrypted device name was updated.
        '400':
          $ref: "./common.openapi.yaml#/components/responses/BadRequest"
        '401':
          $ref: "./common.openapi.yaml#/components/responses/Unauthorized"
    delete:
      tags:
        - LoginDevices
      operationId: removeLoginDevice
      summary: Sign out all active sessions for one login device.
      security:
        - bearerAuth: []
      parameters:
        - name: deviceRef
          in: path
          required: true
          example: dev_01J0HA0B7K8M9N2P3Q4R5S6T7V
          schema:
            type: string
      responses:
        '204':
          description: All sessions for that device identifier were invalidated.
        '401':
          $ref: "./common.openapi.yaml#/components/responses/Unauthorized"
  /api/me/password-reset/request:
    post:
      tags:
        - Password
      operationId: requestPasswordReset
      summary: Request a password reset — email a one-time token to the address (if an account exists).
      description: |
        Always returns 204 (never reveals whether an account exists). If the email maps to an account with a RECOVERY wrap, the server emails a one-time reset link. The token is the email second factor; the Secret Key (entered later) is the crypto factor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequestRequest"
            examples:
              existingAccount:
                summary: Existing or unknown account, same response
                value:
                  email: ava@example.com
              unknownAccount:
                summary: Unknown address, still returns 204
                value:
                  email: unknown@example.com
      responses:
        '204':
          description: Accepted (an email was sent iff the account exists).
        '400':
          $ref: "./common.openapi.yaml#/components/responses/BadRequest"
  /api/me/password-reset/material:
    post:
      tags:
        - Password
      operationId: getPasswordResetMaterial
      summary: Exchange a valid reset token for the account's RECOVERY master-key wrap.
      description: |
        Gated by the email-delivered token (proves email control). Returns the RECOVERY wrap (master key wrapped under the Secret Key) so the client can unwrap the master key with the Secret Key. Invalid, expired or consumed tokens — or an account without a recovery wrap — return 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetTokenRequest"
            example:
              token: prt_01J0HA1E2F3G4H5J6K7M8N9P0Q
      responses:
        '200':
          description: The recovery wrap + the account email (for display).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetMaterial"
              example:
                email: ava@example.com
                recoveryWrap:
                  unlockMethod: RECOVERY
                  suiteId: v1
                  wrappedKey: cmVjb3Zlcnktd3JhcC1jaXBoZXJ0ZXh0
        '400':
          $ref: "./common.openapi.yaml#/components/responses/BadRequest"
  /api/me/password-reset/confirm:
    post:
      tags:
        - Password
      operationId: confirmPasswordReset
      summary: Complete a reset — swap the PASSWORD master-key wrap, derive the auth verifier and invalidate sessions.
      description: |
        Gated by the same token. The client has unwrapped the master key with the Secret Key and re-wrapped it under the new password; this submits the new PASSWORD wrap and the new password. The server derives the new auth verifier, consumes the token and invalidates all of the user's sessions. The RECOVERY wrap is untouched.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmRequest"
            example:
              token: prt_01J0HA1E2F3G4H5J6K7M8N9P0Q
              newPassword: correct-horse-battery-staple
              masterKeyWrap:
                unlockMethod: PASSWORD
                suiteId: v1
                wrappedKey: bmV3LXBhc3N3b3JkLXdyYXA
                kdfParams: eyJhbGciOiJhcmdvbjJpZCIsIm0iOjE5NDU2fQ
              recoveryAuthTag: uB0qY8XopHdt7vR8Uqq93w
      responses:
        '204':
          description: The password was reset.
        '400':
          $ref: "./common.openapi.yaml#/components/responses/BadRequest"
  /api/me/email-change/request:
    post:
      tags:
        - Email
      operationId: requestEmailChange
      summary: Request an email change — emails a one-time confirmation token to the NEW address.
      description: |
        Authenticated. Starts a change to the caller's account email. The new address must be free. A one-time token is emailed to the NEW address; confirming it (separately) commits the change.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailChangeRequestRequest"
            examples:
              personalAddress:
                summary: Change to a personal address
                value:
                  newEmail: ava.new@example.com
              customDomain:
                summary: Change to an address on a custom domain
                value:
                  newEmail: ava@family.example.com
      responses:
        '204':
          description: A confirmation email was sent to the new address.
        '400':
          $ref: "./common.openapi.yaml#/components/responses/BadRequest"
        '401':
          $ref: "./common.openapi.yaml#/components/responses/Unauthorized"
        '409':
          description: The requested email address is already in use.
  /api/me/email-change/confirm:
    post:
      tags:
        - Email
      operationId: confirmEmailChange
      summary: Confirm an email change with the token emailed to the new address.
      description: |
        Token-gated (no session required): control of the new inbox is the proof, so the link works on any device. Consumes the token and swaps the account email. Returns the updated user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailChangeConfirmRequest"
            example:
              token: ect_01J0HA2A3B4C5D6E7F8G9H0J1K
      responses:
        '200':
          description: The updated current user.
          content:
            application/json:
              schema:
                $ref: "./common.openapi.yaml#/components/schemas/UserSummary"
              example:
                id: c3f7a1b2-8d42-4c9e-a7f1-2b6d90f4e123
                email: ava.new@example.com
                displayName: Ava Winter
                serverRole: ServerMember
                username: ava-winter
                avatarUrl: "https://objects.example.com/veyq/profile-avatars/c3f7a1b2-8d42-4c9e-a7f1-2b6d90f4e123/8c57f4df-2a87-49a1-bd7a-67a2e29f3e52?X-Amz-Expires=900&X-Amz-Signature=..."
        '400':
          $ref: "./common.openapi.yaml#/components/responses/BadRequest"
        '409':
          description: The requested email address is already in use.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque session token
      description: Bearer session token returned by the session login/refresh endpoints.
  schemas:
    RenameLoginDeviceRequest:
      type: object
      example:
        encryptedName: eyJjdCI6IkF2YXMtTWFjQm9vay1jaXBoZXJ0ZXh0In0
      required:
        - encryptedName
      properties:
        encryptedName:
          type: string
          maxLength: 16384
          x-field-extra-annotation:
            - '@field:jakarta.validation.constraints.Size(max = 16384)'
    LoginDeviceSummary:
      type: object
      example:
        deviceRef: dev_01J0HA0B7K8M9N2P3Q4R5S6T7V
        encryptedName: eyJjdCI6ImxhcHRvcC1jaXBoZXJ0ZXh0In0
        lastLoginAt: '2026-06-24T08:31:12Z'
      required:
        - deviceRef
        - encryptedName
        - lastLoginAt
      properties:
        deviceRef:
          type: string
        encryptedName:
          type: string
          description: Client-encrypted human-readable device/login name.
        lastLoginAt:
          type: string
          format: date-time
    LoginDeviceList:
      type: object
      example:
        devices:
          - deviceRef: dev_01J0HA0B7K8M9N2P3Q4R5S6T7V
            encryptedName: eyJjdCI6ImxhcHRvcC1jaXBoZXJ0ZXh0In0
            lastLoginAt: '2026-06-24T08:31:12Z'
      required:
        - devices
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/LoginDeviceSummary"
    UpdateProfileRequest:
      type: object
      example:
        displayName: Ava Winter
        username: ava-winter
      required:
        - displayName
        - username
      properties:
        displayName:
          type: string
          x-field-extra-annotation:
            - '@field:com.veyq.app.shared.validation.DisplayName'
        username:
          type: string
          maxLength: 80
          pattern: ^[a-z0-9](?:[a-z0-9-]{0,78}[a-z0-9])?$
          x-field-extra-annotation:
            - '@field:jakarta.validation.constraints.Size(max = 80)'
    StartAvatarUploadRequest:
      type: object
      example:
        contentType: image/png
        byteSize: 184320
      required:
        - contentType
        - byteSize
      properties:
        contentType:
          type: string
          enum:
            - image/png
            - image/jpeg
            - image/webp
        byteSize:
          type: integer
          format: int64
          minimum: 1
          maximum: 700000
    AvatarUploadTicket:
      type: object
      example:
        uploadRef: profile-avatars/c3f7a1b2-8d42-4c9e-a7f1-2b6d90f4e123/7e5f64dc-7d02-44f9-9c20-55135d60a016
        uploadUrl: "https://objects.example.com/veyq/profile-avatars/c3f7a1b2-8d42-4c9e-a7f1-2b6d90f4e123/7e5f64dc-7d02-44f9-9c20-55135d60a016?X-Amz-Expires=900&X-Amz-Signature=..."
        expiresInSeconds: 900
      required:
        - uploadRef
        - uploadUrl
        - expiresInSeconds
      properties:
        uploadRef:
          type: string
          description: Opaque reference to the server-generated avatar object key. Submit it unchanged to complete the upload.
          maxLength: 512
          x-field-extra-annotation:
            - '@field:jakarta.validation.constraints.Size(max = 512)'
        uploadUrl:
          type: string
          description: Short-lived presigned PUT URL. The client PUTs the image bytes directly to this URL.
          maxLength: 8192
          x-field-extra-annotation:
            - '@field:jakarta.validation.constraints.Size(max = 8192)'
        expiresInSeconds:
          type: integer
          format: int32
    CompleteAvatarUploadRequest:
      type: object
      example:
        uploadRef: profile-avatars/c3f7a1b2-8d42-4c9e-a7f1-2b6d90f4e123/7e5f64dc-7d02-44f9-9c20-55135d60a016
        contentType: image/png
      required:
        - uploadRef
        - contentType
      properties:
        uploadRef:
          type: string
          maxLength: 512
          x-field-extra-annotation:
            - '@field:jakarta.validation.constraints.Size(max = 512)'
        contentType:
          type: string
          enum:
            - image/png
            - image/jpeg
            - image/webp
    ChangePasswordRequest:
      type: object
      example:
        currentPassword: current-password
        newPassword: correct-horse-battery-staple
        masterKeyWrap:
          unlockMethod: PASSWORD
          suiteId: v1
          wrappedKey: bXktbmV3LXBhc3N3b3JkLXdyYXA
          kdfParams: eyJhbGciOiJhcmdvbjJpZCIsIm0iOjE5NDU2fQ
      required:
        - currentPassword
        - newPassword
        - masterKeyWrap
      properties:
        currentPassword:
          type: string
          x-field-extra-annotation:
            - '@field:jakarta.validation.constraints.Size(max = 1024)'
        newPassword:
          type: string
          x-field-extra-annotation:
            - '@field:jakarta.validation.constraints.Size(max = 1024)'
        masterKeyWrap:
          $ref: "./common.openapi.yaml#/components/schemas/MasterKeyWrap"
    DeleteAccountRequest:
      type: object
      example:
        password: current-password
      required:
        - password
      properties:
        password:
          type: string
          x-field-extra-annotation:
            - '@field:jakarta.validation.constraints.Size(max = 1024)'
    PasswordResetRequestRequest:
      type: object
      example:
        email: ava@example.com
      required:
        - email
      properties:
        email:
          type: string
          x-field-extra-annotation:
            - '@field:com.veyq.app.shared.validation.Email'
    PasswordResetTokenRequest:
      type: object
      example:
        token: prt_01J0HA1E2F3G4H5J6K7M8N9P0Q
      required:
        - token
      properties:
        token:
          type: string
          x-field-extra-annotation:
            - '@field:jakarta.validation.constraints.Size(max = 512)'
    PasswordResetMaterial:
      type: object
      example:
        email: ava@example.com
        recoveryWrap:
          unlockMethod: RECOVERY
          suiteId: v1
          wrappedKey: cmVjb3Zlcnktd3JhcC1jaXBoZXJ0ZXh0
      required:
        - email
        - recoveryWrap
      properties:
        email:
          type: string
          description: The account email (so the reset screen can show whose account).
          x-field-extra-annotation:
