openapi: 3.1.0
info:
  title: veyq scope content
  version: 0.1.0
paths:
  /api/scopes/{scopeId}/content-key:
    get:
      tags: [ScopeContentKey]
      operationId: getScopeContentKey
      summary: Fetch the scope's content key, wrapped to the scope public key (key-holders only).
      description: >
        The stable per-scope content key (AD-03) wrapped to the scope public key. A key-holder unwraps it
        with the scope private key from their grant; the server only ever sees ciphertext. 404 until the
        first key-holder provisions it.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The wrapped content key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScopeContentKeyResponse' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Conflict' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
    put:
      tags: [ScopeContentKey]
      operationId: provisionScopeContentKey
      summary: Provision the scope's content key once (first key-holder wins).
      description: >
        A key-holder mints a content key, wraps it to the scope public key and provisions it. Single-shot
        per scope — a second provision is rejected so all holders converge on one content key.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProvisionContentKeyRequest' }
      responses:
        '200':
          description: The provisioned wrapped content key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScopeContentKeyResponse' }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Conflict' }
        '409': { $ref: './common.openapi.yaml#/components/responses/Conflict' }
  /api/scopes/{scopeId}/items:
    get:
      tags: [ScopeItems]
      operationId: listScopeItems
      summary: List the scope's encrypted items (key-holders only). Ciphertext only.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The scope's items.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScopeItemList' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Conflict' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
    post:
      tags: [ScopeItems]
      operationId: createScopeItem
      summary: Store an encrypted item under the scope (key-holders only). The server stores ciphertext only.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateScopeItemRequest' }
      responses:
        '200':
          description: The stored item.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScopeItem' }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Conflict' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
components:
  schemas:
    ScopeContentKeyResponse:
      type: object
      required: [wrappedContentKey]
      properties:
        wrappedContentKey: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
    ProvisionContentKeyRequest:
      type: object
      required: [wrappedContentKey]
      properties:
        wrappedContentKey: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
    CreateScopeItemRequest:
      type: object
      required: [sealedContent]
      properties:
        sealedContent: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
    ScopeItem:
      type: object
      required: [id, sealedContent, createdAt]
      properties:
        id: { type: string }
        sealedContent: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
        createdAt: { type: string, format: date-time }
    ScopeItemList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ScopeItem' }
