openapi: 3.1.0
info:
  title: veyq memory tree
  version: 0.1.0
paths:
  /api/scopes/{scopeId}/nodes:
    get:
      tags: [MemoryTree]
      operationId: listNodes
      summary: The scope's node graph — Folders, Memories and Chapters (ciphertext + structure only).
      description: >
        Returns every node in the scope as a flat list (id, parentId, type, blinded slug token, order index
        and the sealed name/metadata). The client reconstructs the tree and decrypts names locally; the
        server never sees names or paths. A root-level node reports parentId = null.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - name: parentId
          in: query
          required: false
          description: >
            Omit for the full node graph (e.g. rotation re-sealing). Pass a node id for that node's direct
            children, or the literal "root" for the scope's root-level children — the level-by-level listing
            that backs browse / path resolution (the client walks one level per path segment).
          schema: { type: string }
      responses:
        '200':
          description: The scope's nodes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryNodeList' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
    post:
      tags: [MemoryTree]
      operationId: createNode
      summary: Create a Folder, Memory or Chapter under a scope (or at its root).
      description: >
        Creates one node. The server enforces the containment invariants from the node type + parent type
        (Folder/Memory live at the root or in a Folder; a Chapter is a Memory nested in a Memory or Chapter;
        never a Folder inside a Memory) and slug uniqueness per parent (the blinded slug token must be unique
        among the parent's children → SLUG_EXISTS). The name/title is sealed client-side; the server stores
        ciphertext, the structural type, the slug token and the order index only.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateNodeRequest' }
      responses:
        '200':
          description: The created node.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryNode' }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.openapi.yaml#/components/responses/Conflict' }
  /api/scopes/{scopeId}/nodes/{nodeId}:
    patch:
      tags: [NodeCurate]
      operationId: updateNode
      summary: Curate a node — rename, move, reorder, or set its cover.
      description: >
        Updates the provided fields of one node. Rename = sealedContent + slugToken (re-sealed name + slug).
        Move = newParentId ("root" or a node id) + slugToken (recomputed under the new parent) + orderIndex;
        the server re-checks containment + slug uniqueness and rejects a move into the node's own subtree
        (NODE_CYCLE). Reorder = orderIndex. Cover = coverMediaId (must be a media of this node). The server
        stays blind to names.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateNodeRequest' }
      responses:
        '200': { description: The updated node., content: { application/json: { schema: { $ref: '#/components/schemas/MemoryNode' } } } }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.openapi.yaml#/components/responses/Conflict' }
    delete:
      tags: [NodeCurate]
      operationId: deleteNode
      summary: Delete a node (Folder/Memory/Chapter) and everything beneath it.
      description: >
        Recursively removes the node, its descendant nodes, and all content hanging off them (media +
        derivatives, journal, tracks, shares). Any key holder of the scope may delete; the client gates it
        behind a confirm-by-name dialog. Irreversible.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Deleted. }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/scopes/{scopeId}/favorites:
    get:
      # Own tag → the generated MemoryFavoritesApi gets the specific class-@Path /api/scopes/{scopeId}/favorites
      # instead of the greedy /api/scopes/{scopeId} that the toggle path would otherwise force (which shadows
      # sibling routes like KeysApi /grants/me). See the password-reset "one tag per op" note.
      tags: [MemoryFavorites]
      operationId: listMemoryFavorites
      summary: List the caller's personal Memory favorites in a scope.
      description: >
        Returns node ids the authenticated user has personally marked as favorite in this scope. This is
        navigation state only: the server sees ids, but not Memory titles, covers or content.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Favorite node ids for this user in this scope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryFavoriteList' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/scopes/{scopeId}/nodes/{nodeId}/favorite:
    put:
      tags: [MemoryFavorite]
      operationId: favoriteMemory
      summary: Mark a Memory as a personal favorite.
      description: >
        Creates an idempotent per-user favorite relation for a Memory. Folders and Chapters cannot be favorited.
        The server stores only user id, scope id and node id; encrypted Memory metadata is unchanged.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Favorite status., content: { application/json: { schema: { $ref: '#/components/schemas/MemoryFavoriteStatus' } } } }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
    delete:
      tags: [MemoryFavorite]
      operationId: unfavoriteMemory
      summary: Remove a Memory from the caller's personal favorites.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Favorite status., content: { application/json: { schema: { $ref: '#/components/schemas/MemoryFavoriteStatus' } } } }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/scopes/{scopeId}/nodes/{nodeId}/journal:
    get:
      tags: [MemoryJournal]
      operationId: getJournal
      summary: A Memory's journal — its sealed Markdown body (ciphertext only).
      description: >
        Returns the Memory's journal as a sealed blob (Markdown body sealed client-side under the scope
        content key) plus the last-updated timestamp. A Memory with no journal yet reports a null body.
        Journals live only on a Memory or Chapter (not a Folder).
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The journal (body may be null)., content: { application/json: { schema: { $ref: '#/components/schemas/MemoryJournal' } } } }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/scopes/{scopeId}/nodes/{nodeId}/journal/live:
    get:
      tags: [MemoryJournal]
      operationId: getJournalLive
      summary: The journal's operator-blind CRDT state — sealed Yjs snapshot + sealed update log.
      description: >
        Returns the sealed Yjs state snapshot (null for a journal never compacted) plus every sealed update
        with seq > baseSeq. A client applies the snapshot then the updates to reconstruct the document, then
        edits and appends. Ciphertext only; the server never reads it.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The CRDT state., content: { application/json: { schema: { $ref: '#/components/schemas/JournalLiveState' } } } }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/scopes/{scopeId}/nodes/{nodeId}/journal/updates:
    post:
      tags: [MemoryJournal]
      operationId: appendJournalUpdate
      summary: Append one sealed Yjs update to the journal log.
      description: >
        Persists a sealed Yjs update and returns its server-assigned monotonic seq. Ciphertext only.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppendJournalUpdateRequest' }
      responses:
        '200': { description: The assigned seq., content: { application/json: { schema: { $ref: '#/components/schemas/AppendJournalUpdateResponse' } } } }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/scopes/{scopeId}/nodes/{nodeId}/journal/snapshot:
    put:
      tags: [MemoryJournal]
      operationId: compactJournal
      summary: Compact the journal — write a fresh snapshot + Markdown projection, prune folded updates.
      description: >
        Replaces the sealed Yjs state snapshot and the sealed Markdown read projection, sets baseSeq to the
        covered seq, and deletes every update with seq <= coveredSeq. Whole-document, operator-blind.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompactJournalRequest' }
      responses:
        '200': { description: The compacted journal (Markdown projection)., content: { application/json: { schema: { $ref: '#/components/schemas/MemoryJournal' } } } }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/scopes/{scopeId}/nodes/{nodeId}/tracks:
    get:
      tags: [MemoryTrack]
      operationId: listTracks
      summary: A Memory's GPX tracks — each a sealed route (ciphertext only).
      description: >
        Returns the Memory's tracks. Each track's name + point list is sealed client-side under the scope
        content key; the server stores ciphertext + a timestamp only and never sees the route. Tracks live
        on a Memory or Chapter (not a Folder).
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The node's tracks., content: { application/json: { schema: { $ref: '#/components/schemas/MemoryTrackList' } } } }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
    post:
      tags: [MemoryTrack]
      operationId: createTrack
      summary: Add a sealed GPX track to a Memory/Chapter.
      description: >
        Stores one track as a sealed blob ({name, points} sealed client-side). The server stays blind to the
        route; it stores ciphertext + a timestamp only.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateTrackRequest' } } }
      responses:
        '200': { description: The created track., content: { application/json: { schema: { $ref: '#/components/schemas/MemoryTrack' } } } }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/scopes/{scopeId}/nodes/{nodeId}/tracks/{trackId}:
    patch:
      tags: [MemoryTrack]
      operationId: updateTrack
      summary: Replace a track's sealed content (e.g. rename — the client re-seals {name, points}).
      description: >
        The client re-seals the track's {name, points} (typically just a new name, same points) and PUTs the
        new ciphertext. The server stays blind — it only swaps the stored blob, keeping the track id (so journal
        ::track embeds keep resolving).
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
        - { name: trackId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateTrackRequest' } } }
      responses:
        '200': { description: The updated track., content: { application/json: { schema: { $ref: '#/components/schemas/MemoryTrack' } } } }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
    delete:
      tags: [MemoryTrack]
      operationId: deleteTrack
      summary: Remove a track from a Memory/Chapter.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
        - { name: trackId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Deleted. }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/scopes/{scopeId}/nodes/{nodeId}/playlists:
    get:
      tags: [MemoryPlaylist]
      operationId: listPlaylists
      summary: A Memory/Chapter's sealed streaming-playlist links (ciphertext; the server is blind to them).
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The playlists., content: { application/json: { schema: { $ref: '#/components/schemas/MemoryPlaylistList' } } } }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
    post:
      tags: [MemoryPlaylist]
      operationId: createPlaylist
      summary: Add a sealed playlist link ({provider, url, title?, note?} sealed client-side) to a Memory/Chapter.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreatePlaylistRequest' } } }
      responses:
        '200': { description: The created playlist., content: { application/json: { schema: { $ref: '#/components/schemas/MemoryPlaylist' } } } }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/scopes/{scopeId}/nodes/{nodeId}/playlists/{playlistId}:
    patch:
      tags: [MemoryPlaylist]
      operationId: updatePlaylist
      summary: Update a playlist's sealed content and/or its featured flag (at most one featured per node).
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
        - { name: playlistId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdatePlaylistRequest' } } }
      responses:
        '200': { description: The updated playlist., content: { application/json: { schema: { $ref: '#/components/schemas/MemoryPlaylist' } } } }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
    delete:
      tags: [MemoryPlaylist]
      operationId: deletePlaylist
      summary: Remove a playlist link from a Memory/Chapter.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
        - { name: playlistId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Deleted. }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/scopes/{scopeId}/nodes/{nodeId}/participants:
    get:
      tags: [MemoryParticipant]
      operationId: listParticipants
      summary: A Memory/Chapter's participants — encrypted People metadata (ciphertext only).
      description: >
        Returns sealed participant payloads. Each payload contains the display name and optional linked user id
        sealed client-side under the Memory content key; the server stores ciphertext only and never sees who
        participates in which Memory.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The participants., content: { application/json: { schema: { $ref: '#/components/schemas/MemoryParticipantList' } } } }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
    post:
      tags: [MemoryParticipant]
      operationId: createParticipant
      summary: Add a sealed participant payload to a Memory/Chapter.
      description: >
        Stores one participant as an opaque sealed payload. Linked-vs-anonymous semantics are inside the
        ciphertext; the server only validates auth, node type and crypto-suite id.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateParticipantRequest' } } }
      responses:
        '200': { description: The created participant., content: { application/json: { schema: { $ref: '#/components/schemas/MemoryParticipant' } } } }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/scopes/{scopeId}/nodes/{nodeId}/participants/{participantId}:
    patch:
      tags: [MemoryParticipant]
      operationId: updateParticipant
      summary: Replace a participant's sealed payload.
      description: >
        The client re-seals the participant payload (for example after rename or linking to a user) and swaps
        the ciphertext. The participant id stays stable for embeds/local UI references.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
        - { name: participantId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateParticipantRequest' } } }
      responses:
        '200': { description: The updated participant., content: { application/json: { schema: { $ref: '#/components/schemas/MemoryParticipant' } } } }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
    delete:
      tags: [MemoryParticipant]
      operationId: deleteParticipant
      summary: Remove a participant from a Memory/Chapter.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
        - { name: participantId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Deleted. }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/scopes/{scopeId}/nodes/{nodeId}/shares:
    get:
      tags: [MemoryShare]
      operationId: listShares
      summary: The read-only public share links for a Memory.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The node's shares., content: { application/json: { schema: { $ref: '#/components/schemas/ShareList' } } } }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
    post:
      tags: [MemoryShare]
      operationId: createShare
      summary: Create a read-only public share link for a Memory subtree.
      description: >
        Stores the scope content key wrapped under a per-share key (the share key rides the returned link's
        fragment and never reaches the server). The server is blind to the content and only gates which
        ciphertext a guest can fetch to this node's subtree.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateShareRequest' } } }
      responses:
        '200': { description: The created share., content: { application/json: { schema: { $ref: '#/components/schemas/ShareSummary' } } } }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/scopes/{scopeId}/nodes/{nodeId}/shares/{shareId}:
    patch:
      tags: [MemoryShare]
      operationId: updateShare
      summary: Edit a link's expiry, label and notice (the password can't change — re-issue the link for that).
      description: >
        Replaces the editable, server-side fields of a share. Omitting expiresAt deactivates the expiry;
        an empty label/notice clears it. The wrapped content key, role and password are immutable.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
        - { name: shareId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateShareRequest' } } }
      responses:
        '200': { description: The updated share., content: { application/json: { schema: { $ref: '#/components/schemas/ShareSummary' } } } }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
    delete:
      tags: [MemoryShare]
      operationId: revokeShare
      summary: Revoke a public share link.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
        - { name: shareId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Revoked. }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/public/shares/{shareId}:
    get:
      tags: [PublicShareTree]
      operationId: getPublicShare
      summary: Resolve a public share — the wrapped content key + the shared root node (no auth).
      description: >
        Unauthenticated. Returns the share-key-wrapped content key and the shared subtree's root node
        (ciphertext). The guest unwraps the content key with the share key from the link fragment and
        decrypts client-side; the server never sees the share key or any plaintext.
      parameters:
        - { name: shareId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The share., content: { application/json: { schema: { $ref: '#/components/schemas/PublicShare' } } } }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/public/shares/{shareId}/nodes:
    get:
      tags: [PublicShareTree]
      operationId: listShareNodes
      summary: The shared subtree's nodes — the root and its descendants (ciphertext, no auth).
      parameters:
        - { name: shareId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The subtree nodes., content: { application/json: { schema: { $ref: '#/components/schemas/MemoryNodeList' } } } }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/public/shares/{shareId}/nodes/{nodeId}/journal:
    get:
      tags: [PublicShareTree]
      operationId: getShareJournal
      summary: A shared node's journal — READ-ONLY (ciphertext, no auth; only the owner edits it).
      parameters:
        - { name: shareId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The journal., content: { application/json: { schema: { $ref: '#/components/schemas/MemoryJournal' } } } }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/public/shares/{shareId}/nodes/{nodeId}/journal/live:
    get:
      tags: [PublicShareTree]
      operationId: getShareJournalLive
      summary: A shared node's journal CRDT state — READ-ONLY (sealed snapshot + update log, no auth).
      description: >
        Lets a read-capable share guest reconstruct the live journal (snapshot + updates), then subscribe to
        the relay (`?share=<shareId>`) for live deltas. Ciphertext only; the server never decrypts it.
      parameters:
        - { name: shareId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The CRDT state., content: { application/json: { schema: { $ref: '#/components/schemas/JournalLiveState' } } } }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/public/shares/{shareId}/nodes/{nodeId}/tracks:
    get:
      tags: [PublicShareTree]
      operationId: listShareTracks
      summary: A shared node's GPX tracks — READ-ONLY (ciphertext, no auth; gated to the share's subtree).
      description: >
        Returns a node's sealed tracks for a read-capable share guest. Each route is sealed under the scope
        content key (the guest unwraps it with the share key); the server stores ciphertext only. Gated to the
        shared subtree (siblings 404) and to VIEWER/CONTRIBUTOR roles (a blind UPLOADER cannot read).
      parameters:
        - { name: shareId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The node's tracks., content: { application/json: { schema: { $ref: '#/components/schemas/MemoryTrackList' } } } }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/public/shares/{shareId}/nodes/{nodeId}/playlists:
    get:
      tags: [PublicShareTree]
      operationId: listSharePlaylists
      summary: A shared node's playlist links — READ-ONLY (ciphertext, no auth; gated to the share's subtree).
      description: >
        Returns a node's sealed playlists for a read-capable share guest (the guest unwraps with the share key).
        Gated to the shared subtree (siblings 404) and to VIEWER/CONTRIBUTOR roles (a blind UPLOADER cannot read).
      parameters:
        - { name: shareId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The node's playlists., content: { application/json: { schema: { $ref: '#/components/schemas/MemoryPlaylistList' } } } }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/public/shares/{shareId}/nodes/{nodeId}/participants:
    get:
      tags: [PublicShareTree]
      operationId: listShareParticipants
      summary: A shared node's participants — READ-ONLY (ciphertext, no auth; gated to the share's subtree).
      description: >
        Returns a node's sealed participant payloads for a read-capable share guest (the guest unwraps with
        the share key). Gated to the shared subtree and to VIEWER/CONTRIBUTOR roles; a blind UPLOADER cannot
        read People metadata.
      parameters:
        - { name: shareId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The node's participants., content: { application/json: { schema: { $ref: '#/components/schemas/MemoryParticipantList' } } } }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
components:
  schemas:
    NodeType:
      type: string
      enum: [FOLDER, MEMORY, CHAPTER]
    CreateNodeRequest:
      type: object
      required: [type, slugToken, orderIndex, sealedContent]
      properties:
        parentId:
          type: string
          description: The parent node id; omit (or null) to create at the scope root.
        type: { $ref: '#/components/schemas/NodeType' }
        slugToken:
          type: string
          description: Blinded slug token (HMAC of the normalized slug under a per-scope slug key); opaque to the server.
        orderIndex: { type: integer, description: 'Manual sibling ordering (server-visible integer; no name exposure).' }
        sealedContent: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
    UpdateNodeRequest:
      type: object
      properties:
        sealedContent: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
        slugToken: { type: string, description: 'Recomputed blinded slug token (required with a rename or a move).', x-field-extra-annotation: ['@field:jakarta.validation.constraints.Size(max = 128)'] }
        newParentId: { type: string, description: 'Move target: a node id, or "root" for the scope root. Omit to keep the parent.' }
        orderIndex: { type: integer }
        coverMediaId: { type: string, description: 'A media id of this node to pin as its cover.' }
    MemoryNode:
      type: object
      required: [id, scopeId, type, slugToken, orderIndex, sealedContent, createdAt]
      properties:
        id: { type: string }
        parentId: { type: string, description: 'The parent node id, or null for a root-level node.' }
        scopeId: { type: string }
        type: { $ref: '#/components/schemas/NodeType' }
        slugToken: { type: string, x-field-extra-annotation: ['@field:jakarta.validation.constraints.Size(max = 128)'] }
        orderIndex: { type: integer }
        sealedContent: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
        coverMediaId: { type: string, description: 'The pinned cover media id, if any.' }
        createdAt: { type: string, format: date-time }
    MemoryNodeList:
      type: object
      required: [nodes]
      properties:
        nodes:
          type: array
          items: { $ref: '#/components/schemas/MemoryNode' }
    MemoryFavoriteList:
      type: object
      required: [nodeIds]
      properties:
        nodeIds:
          type: array
          items: { type: string }
    MemoryFavoriteStatus:
      type: object
      required: [favorite]
      properties:
        favorite: { type: boolean }
    MemoryJournal:
      type: object
      required: [nodeId]
      properties:
        nodeId: { type: string }
        sealedContent: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
        updatedAt: { type: string, format: date-time, description: 'When the journal was last written, if ever.' }
    JournalLiveState:
      type: object
      description: The operator-blind CRDT state of a journal — a sealed Yjs snapshot + the sealed update log.
      required: [baseSeq, updates]
      properties:
        snapshot: { $ref: './common.openapi.yaml#/components/schemas/Blob' }   # sealed Yjs state; null until first compaction
        baseSeq: { type: integer, format: int64, description: 'The highest update seq folded into the snapshot.' }
        updates:
          type: array
          items: { $ref: '#/components/schemas/JournalUpdate' }
    JournalUpdate:
      type: object
      required: [seq, sealedUpdate, authorId]
      properties:
        seq: { type: integer, format: int64 }
        sealedUpdate: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
        authorId: { type: string, description: 'The user id that appended this update (low-sensitivity metadata).' }
    AppendJournalUpdateRequest:
      type: object
      required: [sealedUpdate]
      properties:
        sealedUpdate: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
    AppendJournalUpdateResponse:
      type: object
      required: [seq]
      properties:
        seq: { type: integer, format: int64 }
    CompactJournalRequest:
      type: object
      description: A fresh snapshot covering seq <= coveredSeq, plus the Markdown read projection.
      required: [snapshot, markdown, coveredSeq]
      properties:
        snapshot: { $ref: './common.openapi.yaml#/components/schemas/Blob' }   # sealed Yjs state
        markdown: { $ref: './common.openapi.yaml#/components/schemas/Blob' }   # sealed Markdown body (reader projection)
        coveredSeq: { type: integer, format: int64 }
    MemoryTrack:
      type: object
      required: [id, nodeId, sealedContent, createdAt]
      properties:
        id: { type: string }
        nodeId: { type: string }
        sealedContent: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
        createdAt: { type: string, format: date-time }
    MemoryTrackList:
      type: object
      required: [tracks]
      properties:
        tracks:
          type: array
          items: { $ref: '#/components/schemas/MemoryTrack' }
    MemoryPlaylist:
      type: object
      required: [id, nodeId, sealedContent, featured, createdAt]
      properties:
        id: { type: string }
        nodeId: { type: string }
        sealedContent: { $ref: './common.openapi.yaml#/components/schemas/Blob' }   # AEAD {provider, url, title?, note?}
        featured: { type: boolean }
        createdAt: { type: string, format: date-time }
    MemoryPlaylistList:
      type: object
      required: [playlists]
      properties:
        playlists:
          type: array
          items: { $ref: '#/components/schemas/MemoryPlaylist' }
    MemoryParticipant:
      type: object
      required: [id, nodeId, sealedPayload, createdAt]
      properties:
        id: { type: string }
        nodeId: { type: string }
        sealedPayload:
          allOf: [{ $ref: './common.openapi.yaml#/components/schemas/Blob' }]
          description: 'AEAD payload such as {displayName, linkedUserId?, presentation?}; opaque to the server.'
        createdAt: { type: string, format: date-time }
    MemoryParticipantList:
      type: object
      required: [participants]
      properties:
        participants:
          type: array
          items: { $ref: '#/components/schemas/MemoryParticipant' }
    CreatePlaylistRequest:
      type: object
      required: [sealedContent]
      properties:
        sealedContent: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
        featured: { type: boolean }
    UpdatePlaylistRequest:
      type: object
      properties:
        sealedContent: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
        featured: { type: boolean }
    CreateTrackRequest:
      type: object
      required: [sealedContent]
      properties:
        sealedContent: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
    UpdateTrackRequest:
      type: object
      required: [sealedContent]
      properties:
        sealedContent: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
    CreateParticipantRequest:
      type: object
      required: [sealedPayload]
      properties:
        sealedPayload: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
    UpdateParticipantRequest:
      type: object
      required: [sealedPayload]
      properties:
        sealedPayload: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
    ShareRole:
      type: string
      enum: [VIEWER, CONTRIBUTOR, UPLOADER]
    CreateShareRequest:
      type: object
      required: [wrappedContentKey]
      properties:
        wrappedContentKey: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
        role: { $ref: '#/components/schemas/ShareRole' }
        uploadCapabilityHash: { $ref: './common.openapi.yaml#/components/schemas/Blob', description: 'SHA-256 of the blind upload-capability token. Required for CONTRIBUTOR/UPLOADER shares; the raw token is derived client-side and sent only to guest upload endpoints.' }
        passwordSalt: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
        expiresAt: { type: string, format: date-time, description: 'When the link stops working (omit for never).' }
        label: { type: string, description: 'An owner-facing label for the link (not shown to guests).', x-field-extra-annotation: ['@field:jakarta.validation.constraints.Size(max = 256)'] }
        noticeMarkdown: { type: string, description: 'Extra terms a guest must accept for THIS share (markdown).', x-field-extra-annotation: ['@field:jakarta.validation.constraints.Size(max = 200000)'] }
    UpdateShareRequest:
      type: object
      properties:
        expiresAt: { type: string, format: date-time, description: 'New expiry; omit to deactivate it.' }
        label: { type: string, x-field-extra-annotation: ['@field:jakarta.validation.constraints.Size(max = 256)'] }
        noticeMarkdown: { type: string, x-field-extra-annotation: ['@field:jakarta.validation.constraints.Size(max = 200000)'] }
    ShareSummary:
      type: object
      required: [shareId, nodeId, role, passwordProtected, label, createdAt]
      properties:
        shareId: { type: string }
        nodeId: { type: string }
        role: { $ref: '#/components/schemas/ShareRole' }
        passwordProtected: { type: boolean }
        expiresAt: { type: string, format: date-time }
        label: { type: string, x-field-extra-annotation: ['@field:jakarta.validation.constraints.Size(max = 256)'] }
        noticeMarkdown: { type: string, x-field-extra-annotation: ['@field:jakarta.validation.constraints.Size(max = 200000)'] }
        createdAt: { type: string, format: date-time }
    ShareList:
      type: object
      required: [shares]
      properties:
        shares:
          type: array
          items: { $ref: '#/components/schemas/ShareSummary' }
    ShareNotice:
      type: object
      required: [scope, version, markdown]
      properties:
        scope: { type: string, enum: [TENANT, SHARE] }
        version: { type: integer }
        markdown: { type: string, x-field-extra-annotation: ['@field:jakarta.validation.constraints.Size(max = 200000)'] }
    PublicShare:
      type: object
      # `root` (the shared node, incl. its sealed name) is returned ONLY to roles that can read content.
      # An UPLOADER is a blind drop-off and must not learn metadata: it gets rootNodeId (to target the upload)
      # + wrappedContentKey (to seal its contribution) but never the root node.
      required: [shareId, scopeId, rootNodeId, role, passwordProtected, notices, wrappedContentKey]
      properties:
        shareId: { type: string }
        scopeId: { type: string }
        rootNodeId: { type: string }
        role: { $ref: '#/components/schemas/ShareRole' }
        passwordProtected: { type: boolean }
        passwordSalt: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
        notices:
          type: array
          items: { $ref: '#/components/schemas/ShareNotice' }
        wrappedContentKey: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
        root: { $ref: '#/components/schemas/MemoryNode' }
