openapi: 3.1.0
info:
  title: veyq memory tree
  version: 0.1.0
paths:
  /api/scopes/{scopeId}/nodes:
    get:
      tags: [MemoryTree]
      operationId: listNodes
      summary: The scope's node graph — Folders, Memories and Chapters (ciphertext + structure only).
      description: >
        Returns every node in the scope as a flat list (id, parentId, type, blinded slug token, order index
        and the sealed name/metadata). The client reconstructs the tree and decrypts names locally; the
        server never sees names or paths. A root-level node reports parentId = null.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - name: parentId
          in: query
          required: false
          description: >
            Omit for the full node graph (e.g. rotation re-sealing). Pass a node id for that node's direct
            children, or the literal "root" for the scope's root-level children — the level-by-level listing
            that backs browse / path resolution (the client walks one level per path segment).
          schema: { type: string }
      responses:
        '200':
          description: The scope's nodes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryNodeList' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
    post:
      tags: [MemoryTree]
      operationId: createNode
      summary: Create a Folder, Memory or Chapter under a scope (or at its root).
      description: >
        Creates one node. The server enforces the containment invariants from the node type + parent type
        (Folder/Memory live at the root or in a Folder; a Chapter is a Memory nested in a Memory or Chapter;
        never a Folder inside a Memory) and slug uniqueness per parent (the blinded slug token must be unique
        among the parent's children → SLUG_EXISTS). The name/title is sealed client-side; the server stores
        ciphertext, the structural type, the slug token and the order index only.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateNodeRequest' }
      responses:
        '200':
          description: The created node.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryNode' }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.openapi.yaml#/components/responses/Conflict' }
  /api/scopes/{scopeId}/nodes/{nodeId}:
    patch:
      tags: [NodeCurate]
      operationId: updateNode
      summary: Curate a node — rename, move, reorder, or set its cover.
      description: >
        Updates the provided fields of one node. Rename = sealedContent + slugToken (re-sealed name + slug).
        Move = newParentId ("root" or a node id) + slugToken (recomputed under the new parent) + orderIndex;
        the server re-checks containment + slug uniqueness and rejects a move into the node's own subtree
        (NODE_CYCLE). Reorder = orderIndex. Cover = coverMediaId (must be a media of this node). The server
        stays blind to names.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateNodeRequest' }
      responses:
        '200': { description: The updated node., content: { application/json: { schema: { $ref: '#/components/schemas/MemoryNode' } } } }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.openapi.yaml#/components/responses/Conflict' }
  /api/scopes/{scopeId}/nodes/{nodeId}/journal:
    get:
      tags: [MemoryJournal]
      operationId: getJournal
      summary: A Memory's journal — its sealed Markdown body (ciphertext only).
      description: >
        Returns the Memory's journal as a sealed blob (Markdown body sealed client-side under the scope
        content key) plus the last-updated timestamp. A Memory with no journal yet reports a null body.
        Journals live only on a Memory or Chapter (not a Folder).
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The journal (body may be null)., content: { application/json: { schema: { $ref: '#/components/schemas/MemoryJournal' } } } }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
    put:
      tags: [MemoryJournal]
      operationId: updateJournal
      summary: Replace a Memory's journal body.
      description: >
        Upserts the Memory's journal with a new sealed Markdown body (whole-document replacement). The server
        stores ciphertext and a timestamp only; it never sees the journal text.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMemoryJournalRequest' }
      responses:
        '200': { description: The updated journal., content: { application/json: { schema: { $ref: '#/components/schemas/MemoryJournal' } } } }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/scopes/{scopeId}/nodes/{nodeId}/tracks:
    get:
      tags: [MemoryTrack]
      operationId: listTracks
      summary: A Memory's GPX tracks — each a sealed route (ciphertext only).
      description: >
        Returns the Memory's tracks. Each track's name + point list is sealed client-side under the scope
        content key; the server stores ciphertext + a timestamp only and never sees the route. Tracks live
        on a Memory or Chapter (not a Folder).
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The node's tracks., content: { application/json: { schema: { $ref: '#/components/schemas/MemoryTrackList' } } } }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
    post:
      tags: [MemoryTrack]
      operationId: createTrack
      summary: Add a sealed GPX track to a Memory/Chapter.
      description: >
        Stores one track as a sealed blob ({name, points} sealed client-side). The server stays blind to the
        route; it stores ciphertext + a timestamp only.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateTrackRequest' } } }
      responses:
        '200': { description: The created track., content: { application/json: { schema: { $ref: '#/components/schemas/MemoryTrack' } } } }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/scopes/{scopeId}/nodes/{nodeId}/tracks/{trackId}:
    delete:
      tags: [MemoryTrack]
      operationId: deleteTrack
      summary: Remove a track from a Memory/Chapter.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
        - { name: trackId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Deleted. }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/scopes/{scopeId}/nodes/{nodeId}/shares:
    get:
      tags: [MemoryShare]
      operationId: listShares
      summary: The read-only public share links for a Memory.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The node's shares., content: { application/json: { schema: { $ref: '#/components/schemas/ShareList' } } } }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
    post:
      tags: [MemoryShare]
      operationId: createShare
      summary: Create a read-only public share link for a Memory subtree.
      description: >
        Stores the scope content key wrapped under a per-share key (the share key rides the returned link's
        fragment and never reaches the server). The server is blind to the content and only gates which
        ciphertext a guest can fetch to this node's subtree.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateShareRequest' } } }
      responses:
        '200': { description: The created share., content: { application/json: { schema: { $ref: '#/components/schemas/ShareSummary' } } } }
        '400': { $ref: './common.openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/scopes/{scopeId}/nodes/{nodeId}/shares/{shareId}:
    delete:
      tags: [MemoryShare]
      operationId: revokeShare
      summary: Revoke a public share link.
      parameters:
        - $ref: './common.openapi.yaml#/components/parameters/AuthHeader'
        - { name: scopeId, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
        - { name: shareId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Revoked. }
        '401': { $ref: './common.openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/public/shares/{shareId}:
    get:
      tags: [PublicShareTree]
      operationId: getPublicShare
      summary: Resolve a public share — the wrapped content key + the shared root node (no auth).
      description: >
        Unauthenticated. Returns the share-key-wrapped content key and the shared subtree's root node
        (ciphertext). The guest unwraps the content key with the share key from the link fragment and
        decrypts client-side; the server never sees the share key or any plaintext.
      parameters:
        - { name: shareId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The share., content: { application/json: { schema: { $ref: '#/components/schemas/PublicShare' } } } }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
  /api/public/shares/{shareId}/nodes:
    get:
      tags: [PublicShareTree]
      operationId: listShareNodes
      summary: The shared subtree's nodes — the root and its descendants (ciphertext, no auth).
      parameters:
        - { name: shareId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The subtree nodes., content: { application/json: { schema: { $ref: '#/components/schemas/MemoryNodeList' } } } }
        '404': { $ref: './common.openapi.yaml#/components/responses/NotFound' }
components:
  schemas:
    NodeType:
      type: string
      enum: [FOLDER, MEMORY, CHAPTER]
    CreateNodeRequest:
      type: object
      required: [type, slugToken, orderIndex, sealedContent]
      properties:
        parentId:
          type: string
          description: The parent node id; omit (or null) to create at the scope root.
        type: { $ref: '#/components/schemas/NodeType' }
        slugToken:
          type: string
          description: Blinded slug token (HMAC of the normalized slug under a per-scope slug key); opaque to the server.
        orderIndex: { type: integer, description: 'Manual sibling ordering (server-visible integer; no name exposure).' }
        sealedContent: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
    UpdateNodeRequest:
      type: object
      properties:
        sealedContent: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
        slugToken: { type: string, description: 'Recomputed blinded slug token (required with a rename or a move).' }
        newParentId: { type: string, description: 'Move target: a node id, or "root" for the scope root. Omit to keep the parent.' }
        orderIndex: { type: integer }
        coverMediaId: { type: string, description: 'A media id of this node to pin as its cover.' }
    MemoryNode:
      type: object
      required: [id, scopeId, type, slugToken, orderIndex, sealedContent, createdAt]
      properties:
        id: { type: string }
        parentId: { type: string, description: 'The parent node id, or null for a root-level node.' }
        scopeId: { type: string }
        type: { $ref: '#/components/schemas/NodeType' }
        slugToken: { type: string }
        orderIndex: { type: integer }
        sealedContent: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
        coverMediaId: { type: string, description: 'The pinned cover media id, if any.' }
        createdAt: { type: string, format: date-time }
    MemoryNodeList:
      type: object
      required: [nodes]
      properties:
        nodes:
          type: array
          items: { $ref: '#/components/schemas/MemoryNode' }
    MemoryJournal:
      type: object
      required: [nodeId]
      properties:
        nodeId: { type: string }
        sealedContent: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
        updatedAt: { type: string, format: date-time, description: 'When the journal was last written, if ever.' }
    UpdateMemoryJournalRequest:
      type: object
      required: [sealedContent]
      properties:
        sealedContent: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
    MemoryTrack:
      type: object
      required: [id, nodeId, sealedContent, createdAt]
      properties:
        id: { type: string }
        nodeId: { type: string }
        sealedContent: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
        createdAt: { type: string, format: date-time }
    MemoryTrackList:
      type: object
      required: [tracks]
      properties:
        tracks:
          type: array
          items: { $ref: '#/components/schemas/MemoryTrack' }
    CreateTrackRequest:
      type: object
      required: [sealedContent]
      properties:
        sealedContent: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
    CreateShareRequest:
      type: object
      required: [wrappedContentKey]
      properties:
        wrappedContentKey: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
    ShareSummary:
      type: object
      required: [shareId, nodeId, createdAt]
      properties:
        shareId: { type: string }
        nodeId: { type: string }
        createdAt: { type: string, format: date-time }
    ShareList:
      type: object
      required: [shares]
      properties:
        shares:
          type: array
          items: { $ref: '#/components/schemas/ShareSummary' }
    PublicShare:
      type: object
      required: [shareId, scopeId, rootNodeId, wrappedContentKey, root]
      properties:
        shareId: { type: string }
        scopeId: { type: string }
        rootNodeId: { type: string }
        wrappedContentKey: { $ref: './common.openapi.yaml#/components/schemas/Blob' }
        root: { $ref: '#/components/schemas/MemoryNode' }
