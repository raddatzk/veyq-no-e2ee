---
openapi: 3.1.0
info:
  title: Veyq Explorer API
  version: 0.1.0
  description: >
    Draft contract for the planned Explorer API shape. This document is a discussion artifact and may intentionally differ
    from the current backend implementation.
servers:
- url: "/"
security:
- accessTokenCookie: []
tags:
- name: Explorer
paths:
  "/api/{tenantName}/explorer":
    get:
      tags:
      - Explorer
      summary: Load the library explorer for a tenant path
      description: |-
        Returns the current explorer location, its full breadcrumb chain, visible scope root shortcuts, child folders, and child albums.

        Vorbedingungen:
        - Ein gueltiger VEYQ_ACCESS_TOKEN Cookie muss vorhanden sein.
        - Das initiale Setup muss abgeschlossen sein.
        - Der aktuelle Benutzer muss Mitglied des Tenant-Pfads sein.

        Implementierungsstatus: implemented.
      operationId: getExplorer
      parameters:
      - name: tenantName
        "$ref": "./common.openapi.yaml#/components/parameters/TenantName"
      - name: path
        "$ref": "#/components/parameters/Path"
      responses:
        '200':
          "$ref": "#/components/responses/Explorer"
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
        '403':
          "$ref": "./common.openapi.yaml#/components/responses/403"
        '404':
          "$ref": "./common.openapi.yaml#/components/responses/404"
      x-implementation-status: implemented
      x-preconditions:
      - Ein gueltiger VEYQ_ACCESS_TOKEN Cookie muss vorhanden sein.
      - Das initiale Setup muss abgeschlossen sein.
      - Der aktuelle Benutzer muss Mitglied des Tenant-Pfads sein.
      x-required-membership: TenantMember
components:
  securitySchemes:
    accessTokenCookie:
      type: apiKey
      in: cookie
      name: VEYQ_ACCESS_TOKEN
      description: HttpOnly access token cookie set by the login endpoint.
  parameters:
    Path:
      in: query
      required: false
      name: path
      description: >
        Explorer path inside the tenant. Empty or omitted loads the tenant root. Group scopes use `/@groupName`; the personal
        scope uses `/~me`.
      schema:
        type: string
        default: "/"
      examples:
        tenantRoot:
          summary: Tenant root
          value: "/"
        groupRoot:
          summary: Group root
          value: "/@familie"
        personalRoot:
          summary: Personal root
          value: "/~me"
        nestedFolder:
          summary: Folder in a group scope
          value: "/@familie/urlaub"

  responses:
    Explorer:
      description: Explorer state for the requested path.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ExplorerResponse"
          example:
            location:
              kind: TENANT_ROOT
              path: "/"
              displayName: Friends
            breadcrumbs: []
            scopeRoots: []
            folders: []
            albums: []

  schemas:
    ExplorerResponse:
      type: object
      additionalProperties: false
      required:
        - location
        - breadcrumbs
        - scopeRoots
        - folders
        - albums
      properties:
        location:
          "$ref": "#/components/schemas/ExplorerLocation"
        breadcrumbs:
          type: array
          description: 'Full clickable navigation chain including the current location as the last item.'
          items:
            "$ref": "#/components/schemas/ExplorerBreadcrumb"
        scopeRoots:
          type: array
          description: 'Quick navigation entries shown at the tenant root only. Empty for group, personal, folder, and album locations.'
          items:
            "$ref": "#/components/schemas/ExplorerScopeRoot"
        folders:
          type: array
          description: Visible child folders at the current location.
          items:
            "$ref": "#/components/schemas/ExplorerFolder"
        albums:
          type: array
          description: Visible child albums at the current location.
          items:
            "$ref": "#/components/schemas/ExplorerAlbum"
      examples:
        - tenantRoot:
          "$ref": "#/components/examples/TenantRootExplorer"
        - groupRoot:
          "$ref": "#/components/examples/GroupRootExplorer"
        - personalRoot:
          "$ref": "#/components/examples/PersonalRootExplorer"
        - album:
          "$ref": "#/components/examples/AlbumExplorer"

    ExplorerLocation:
      type: object
      additionalProperties: false
      required:
      - kind
      - path
      - displayName
      properties:
        kind:
          "$ref": "#/components/schemas/LocationKind"
        path:
          type: string
          description: Canonical explorer path for this location.
          examples:
          - "/"
          - "/@familie"
          - "/~me"
          - "/@familie/urlaub"
        displayName:
          type: string
          description: Human-readable label for this location.
    ExplorerBreadcrumb:
      type: object
      additionalProperties: false
      required:
      - kind
      - path
      - displayName
      - label
      properties:
        kind:
          "$ref": "#/components/schemas/LocationKind"
        path:
          type: string
          description: Canonical explorer path opened when this breadcrumb is clicked.
        displayName:
          type: string
          description: Human-readable domain name without navigation prefixes.
        label:
          type: string
          description: 'UI label for the breadcrumb. Group labels include the `@` prefix; personal labels include the `~` prefix.'
    LocationKind:
      type: string
      description: Kind of explorer location or breadcrumb entry.
      enum:
      - TENANT
      - GROUP
      - USER
      - FOLDER
      - ALBUM
    ExplorerScopeRoot:
      type: object
      additionalProperties: false
      required:
      - kind
      - name
      - displayName
      - path
      properties:
        kind:
          type: string
          enum:
          - GROUP
          - USER
        name:
          type: string
          description: Stable scope name. Groups use their group name; personal scope uses `me`.
          examples:
          - familie
          - me
        displayName:
          type: string
          description: Human-readable scope label.
        path:
          type: string
          description: Canonical explorer path for this scope root.
          examples:
          - "/@familie"
          - "/~me"
    ExplorerFolder:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - displayName
      - path
      properties:
        id:
          type: string
          description: Public folder identifier.
        name:
          type: string
          description: Stable URL/path segment.
        displayName:
          type: string
          description: Human-readable folder label.
        path:
          type: string
          description: Canonical explorer path for this folder.
        ownerBadge:
          anyOf:
          - "$ref": "#/components/schemas/OwnerBadge"
          - type: 'null'
          default:
          description: 'Optional UI hint for mixed owner lists at the tenant root. This is not authorization data.'
    ExplorerAlbum:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - displayName
      - path
      - coverMediaId
      properties:
        id:
          type: string
          description: Public album identifier.
        name:
          type: string
          description: Stable URL/path segment.
        displayName:
          type: string
          description: Human-readable album label.
        path:
          type: string
          description: Canonical explorer path for this album.
        coverMediaId:
          anyOf:
          - type: string
          - type: 'null'
          description: Public media id used as album cover, if set.
        ownerBadge:
          anyOf:
          - "$ref": "#/components/schemas/OwnerBadge"
          - type: 'null'
          default:
          description: 'Optional UI hint for mixed owner lists at the tenant root. This is not authorization data.'
    OwnerBadge:
      type: object
      additionalProperties: false
      required:
      - kind
      - displayName
      properties:
        kind:
          type: string
          enum:
          - TENANT
          - GROUP
          - USER
        displayName:
          type: string
          description: Label shown in the UI badge.
        name:
          type: string
          description: Optional stable owner name, such as a group name or `me`.
    ErrorResponse:
      type: object
      additionalProperties: true
      properties:
        message:
          type: string
  examples:
    TenantRootExplorer:
      summary: Tenant root with mixed owner items and scope shortcuts
      value:
        location:
          kind: TENANT
          path: "/"
          displayName: Familie
        breadcrumbs:
        - kind: TENANT
          path: "/"
          displayName: Familie
          label: Familie
        scopeRoots:
        - kind: USER
          name: me
          displayName: Kevin
          path: "/~me"
        - kind: GROUP
          name: familie
          displayName: Familie
          path: "/@familie"
        folders:
        - id: fld_tenant_urlaub
          name: urlaub
          displayName: Urlaub
          path: "/urlaub"
          ownerBadge:
            kind: TENANT
            displayName: Tenant
        - id: fld_group_urlaub
          name: gruppenurlaub
          displayName: Gruppenurlaub
          path: "/@familie/gruppenurlaub"
          ownerBadge:
            kind: GROUP
            name: familie
            displayName: Familie
        albums:
        - id: alb_private
          name: privat
          displayName: Privat
          path: "/~me/privat"
          coverMediaId: med_cover_1
          ownerBadge:
            kind: USER
            name: me
            displayName: Kevin
    GroupRootExplorer:
      summary: Group root
      value:
        location:
          kind: GROUP
          path: "/@familie"
          displayName: Familie
        breadcrumbs:
        - kind: TENANT
          path: "/"
          displayName: Familie
          label: Familie
        - kind: GROUP
          path: "/@familie"
          displayName: Familie
          label: "@Familie"
        scopeRoots: []
        folders:
        - id: fld_group_urlaub
          name: urlaub
          displayName: Urlaub
          path: "/@familie/urlaub"
          ownerBadge:
        albums: []
    PersonalRootExplorer:
      summary: Personal root
      value:
        location:
          kind: USER
          path: "/~me"
          displayName: Kevin
        breadcrumbs:
        - kind: TENANT
          path: "/"
          displayName: Familie
          label: Familie
        - kind: USER
          path: "/~me"
          displayName: Kevin
          label: "~Kevin"
        scopeRoots: []
        folders: []
        albums:
        - id: alb_private
          name: privat
          displayName: Privat
          path: "/~me/privat"
          coverMediaId:
          ownerBadge:
    AlbumExplorer:
      summary: Album location
      value:
        location:
          kind: ALBUM
          path: "/@familie/urlaub/sommer"
          displayName: Sommer
        breadcrumbs:
        - kind: TENANT
          path: "/"
          displayName: Familie
          label: Familie
        - kind: GROUP
          path: "/@familie"
          displayName: Familie
          label: "@Familie"
        - kind: FOLDER
          path: "/@familie/urlaub"
          displayName: Urlaub
          label: Urlaub
        - kind: ALBUM
          path: "/@familie/urlaub/sommer"
          displayName: Sommer
          label: Sommer
        scopeRoots: []
        folders: []
        albums: []
