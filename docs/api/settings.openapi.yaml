---
openapi: 3.1.0
info:
  title: Veyq Settings API
  version: 0.2.0
  description: API contract for resolving settings navigation context.
servers:
- url: "/"
security:
- accessTokenCookie: []
tags:
- name: Settings
paths:
  "/api/settings":
    get:
      tags:
      - Settings
      summary: Load navigation context for a settings page
      operationId: getSettings
      parameters:
      - "$ref": "#/components/parameters/Path"
      responses:
        '200':
          "$ref": "#/components/responses/Settings"
        '400':
          "$ref": "./common.openapi.yaml#/components/responses/400"
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
        '403':
          "$ref": "./common.openapi.yaml#/components/responses/403"
        '404':
          "$ref": "./common.openapi.yaml#/components/responses/404"
      x-implementation-status: implemented
      x-preconditions:
      - Ein gueltiger VEYQ_ACCESS_TOKEN Cookie muss vorhanden sein.
      - Das initiale Setup muss abgeschlossen sein.
      description: |-
        Load navigation context for a settings page.

        Vorbedingungen:
        - Ein gueltiger VEYQ_ACCESS_TOKEN Cookie muss vorhanden sein.
        - Das initiale Setup muss abgeschlossen sein.

        Implementierungsstatus: implemented.
components:
  securitySchemes:
    accessTokenCookie:
      type: apiKey
      in: cookie
      name: VEYQ_ACCESS_TOKEN

  parameters:
    Path:
      name: path
      in: query
      required: true
      description: Full frontend route path for the settings page.
      schema:
        type: string
      examples:
        serverSettings:
          value: "/settings"
        userSettings:
          value: "/~me"
        tenantSettings:
          value: "/friends/settings"
        groupSettings:
          value: "/friends/@alle/settings"
        folderSettings:
          value: "/friends/urlaub/settings"

  responses:
    Settings:
      description: Settings navigation context
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/SettingsResponse"
          example:
            location:
              path: "/friends/@alle/settings"
              displayName: Einstellungen
              label: Einstellungen
            subject:
              type: GROUP
              displayName: Alle
              label: "@Alle"
            breadcrumbs:
            - type: TENANT
              path: "/friends"
              displayName: Friends
              label: Friends

  schemas:
    SettingsResponse:
      type: object
      additionalProperties: false
      required:
      - location
      - subject
      - breadcrumbs
      properties:
        location:
          "$ref": "#/components/schemas/SettingsLocation"
        subject:
          "$ref": "#/components/schemas/SettingsSubject"
        breadcrumbs:
          type: array
          items:
            "$ref": "#/components/schemas/SettingsBreadcrumb"
      example:
        groupSettings:
          value:
            location:
              path: "/friends/@alle/settings"
              displayName: Einstellungen
              label: Einstellungen
            subject:
              type: GROUP
              displayName: Alle
              label: "@Alle"
            breadcrumbs:
              - type: TENANT
                path: "/friends"
                displayName: Friends
                label: Friends
              - type: GROUP
                path: "/friends/@alle"
                displayName: Alle
                label: "@Alle"
              - type: GROUP
                path: "/friends/@alle/settings"
                displayName: Einstellungen
                label: Einstellungen
    SettingsLocation:
      type: object
      additionalProperties: false
      required:
      - path
      - displayName
      - label
      properties:
        path:
          type: string
        displayName:
          type: string
        label:
          type: string
    SettingsSubject:
      type: object
      additionalProperties: false
      required:
      - type
      - displayName
      - label
      properties:
        type:
          "$ref": "#/components/schemas/SettingsSubjectType"
        displayName:
          type: string
        label:
          type: string
    SettingsBreadcrumb:
      type: object
      additionalProperties: false
      required:
      - type
      - path
      - displayName
      - label
      properties:
        type:
          "$ref": "#/components/schemas/SettingsSubjectType"
        path:
          type: string
        displayName:
          type: string
        label:
          type: string
    SettingsSubjectType:
      type: string
      enum:
      - SERVER
      - USER
      - TENANT
      - TENANT_USER
      - GROUP
      - FOLDER
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
      - message
      properties:
        message:
          type: string
