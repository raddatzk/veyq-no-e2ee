openapi: 3.1.0
info:
  title: Lunva Settings API
  version: 0.2.0
  description: API contract for resolving settings navigation context.
servers:
  - url: /
security:
  - accessTokenCookie: []
tags:
  - name: Settings
paths:
  /api/settings:
    get:
      tags:
        - Settings
      summary: Load navigation context for a settings page
      operationId: getSettings
      parameters:
        - name: path
          in: query
          required: true
          description: Full frontend route path for the settings page.
          schema:
            type: string
          examples:
            serverSettings:
              value: /settings
            userSettings:
              value: /~me
            tenantSettings:
              value: /friends/settings
            groupSettings:
              value: /friends/@alle/settings
            folderSettings:
              value: /friends/urlaub/settings
      responses:
        "200":
          description: Settings navigation context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponse"
              examples:
                groupSettings:
                  value:
                    location:
                      path: /friends/@alle/settings
                      displayName: Einstellungen
                      label: Einstellungen
                    subject:
                      type: GROUP
                      displayName: Alle
                      label: "@Alle"
                    breadcrumbs:
                      - type: TENANT
                        path: /friends
                        displayName: Friends
                        label: Friends
                      - type: GROUP
                        path: /friends/@alle
                        displayName: Alle
                        label: "@Alle"
                      - type: GROUP
                        path: /friends/@alle/settings
                        displayName: Einstellungen
                        label: Einstellungen
        "400":
          description: The path is not a supported settings path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: Unsupported settings path
        "401":
          description: The request is not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: Authentication required
        "403":
          description: The authenticated user may not access the target settings page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: User has insufficient role on server
        "404":
          description: The tenant or subject path was not found or is not visible to the current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: Path not found
components:
  securitySchemes:
    accessTokenCookie:
      type: apiKey
      in: cookie
      name: LUNVA_ACCESS_TOKEN
  schemas:
    SettingsResponse:
      type: object
      additionalProperties: false
      required:
        - location
        - subject
        - breadcrumbs
      properties:
        location:
          $ref: "#/components/schemas/SettingsLocation"
        subject:
          $ref: "#/components/schemas/SettingsSubject"
        breadcrumbs:
          type: array
          items:
            $ref: "#/components/schemas/SettingsBreadcrumb"
    SettingsLocation:
      type: object
      additionalProperties: false
      required:
        - path
        - displayName
        - label
      properties:
        path:
          type: string
        displayName:
          type: string
        label:
          type: string
    SettingsSubject:
      type: object
      additionalProperties: false
      required:
        - type
        - displayName
        - label
      properties:
        type:
          $ref: "#/components/schemas/SettingsSubjectType"
        displayName:
          type: string
        label:
          type: string
    SettingsBreadcrumb:
      type: object
      additionalProperties: false
      required:
        - type
        - path
        - displayName
        - label
      properties:
        type:
          $ref: "#/components/schemas/SettingsSubjectType"
        path:
          type: string
        displayName:
          type: string
        label:
          type: string
    SettingsSubjectType:
      type: string
      enum:
        - SERVER
        - USER
        - TENANT
        - TENANT_USER
        - GROUP
        - FOLDER
        - ALBUM
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
