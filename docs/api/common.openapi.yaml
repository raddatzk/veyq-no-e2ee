openapi: 3.1.0
info:
  title: veyq common
  version: 0.1.0
paths: {}
components:
  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    ServerRole:
      type: string
      enum: [ServerOwner, ServerMember]
    CryptoSuiteId:
      type: string
      description: Versioned crypto-suite identifier, e.g. "v1".
    UserSummary:
      type: object
      required: [id, email, displayName, serverRole]
      properties:
        id: { type: string }
        email: { type: string }
        displayName: { type: string }
        serverRole: { $ref: '#/components/schemas/ServerRole' }
    IdentityPublicKey:
      type: object
      description: The user's hybrid KEM public key + Ed25519 signing public key (base64url).
      required: [suiteId, kemPublicKey, signPublicKey]
      properties:
        suiteId: { $ref: '#/components/schemas/CryptoSuiteId' }
        kemPublicKey: { type: string }
        signPublicKey: { type: string }
    Blob:
      type: object
      description: An opaque, self-describing ciphertext blob (base64url bytes + its suite id).
      required: [suiteId, bytes]
      properties:
        suiteId: { $ref: '#/components/schemas/CryptoSuiteId' }
        bytes: { type: string }
    KemPublicKey:
      type: object
      description: A hybrid KEM public key (X25519 || ML-KEM-768), base64url. Used as a scope/recipient key.
      required: [suiteId, kemPublicKey]
      properties:
        suiteId: { $ref: '#/components/schemas/CryptoSuiteId' }
        kemPublicKey: { type: string }
    MasterKeyWrap:
      type: object
      description: One wrapped copy of the master key, openable by a single unlock method.
      required: [unlockMethod, suiteId, wrappedKey]
      properties:
        unlockMethod: { type: string, enum: [PASSWORD, PASSKEY, RECOVERY, DEVICE] }
        suiteId: { $ref: '#/components/schemas/CryptoSuiteId' }
        wrappedKey: { type: string }
        kdfParams: { type: string }
        credentialRef: { type: string }
    AuthVerifier:
      type: object
      description: Proves an unlock to the server without revealing the master key.
      required: [kind, suiteId, verifier]
      properties:
        kind: { type: string, enum: [ARGON2_PROOF, WEBAUTHN] }
        suiteId: { $ref: '#/components/schemas/CryptoSuiteId' }
        verifier: { type: string }
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  parameters:
    AuthHeader:
      name: Authorization
      in: header
      required: true
      description: 'Bearer <sessionToken>'
      schema: { type: string }
