        description:
        example:
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - albumPath
              properties:
                file:
                  type: string
                  format: binary
                albumPath:
                  type: string
                title:
                  type: string
            example:
              file: example
              albumPath: "/urlaub"
      responses:
        '200':
          description: Uploaded media.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UploadMediaSummary"
              example:
                id: med_abc123
                title: Beach
                albumPath: "/@family/vacation/beach"
                ownerUserId: 1
                uploaderDisplayName: Kevin
                createdAt: '2026-05-03T12:00:00Z'
                capturedAt: '2026-05-03T11:45:00Z'
                capturedAtOverride: false
                mimeType: image/jpeg
                sizeBytes: 2048000
                contentUrl: "/api/friends/media/med_abc123/content"
                cameraMake: Canon
                cameraModel: R5
                lensModel: RF 24-70
                imageWidth: 4000
                imageHeight: 3000
                gpsLatitude: 52.52
                gpsLongitude: 13.405
