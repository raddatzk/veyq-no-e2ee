        folderPath: /summer
        name: summer-trip
        displayName: Summer Trip
        startDate: '2026-05-03'
        endDate: '2026-05-05'
        scope:
          type: TENANT
    UpdateMemoryRequest:
      type: object
      additionalProperties: false
      properties:
        parentId:
          type: string
          nullable: true
          description: New parent Memory id. Cross-scope moves and cycles are rejected.
        name:
          type: string
          nullable: true
        displayName:
          "$ref": "./common.openapi.yaml#/components/schemas/DisplayName"
          nullable: true
        startDate:
          type: string
          format: date
          nullable: true
          description: New user-defined Memory start date. When omitted, the current start date is kept.
        endDate:
          type: string
          format: date
          nullable: true
          description: New user-defined Memory end date. When omitted, the current end date is kept.
