components:
  parameters:
    MemoryId:
      in: path
      required: true
      name: memoryId
      schema:
        type: string
      description: Public Memory id.
      example: mem_abc123
    MediaId:
      in: path
      required: true
      name: mediaId
      schema:
        type: string
      description: Public media id.
      example: med_abc123
    BucketId:
      in: path
      required: true
      name: bucketId
      schema:
        type: string
      description: Public media bucket id.
      example: bkt_abc123
    TrackId:
      in: path
      required: true
      name: trackId
      schema:
        type: string
      description: Public track id.
      example: trk_abc123
    PlaylistId:
      in: path
      required: true
      name: playlistId
      schema:
        type: string
      description: Public playlist id.
      example: ply_abc123
    UserId:
      in: path
      required: true
      name: userId
      schema:
        type: integer
        format: int64
      description: Registered user id.
      example: 7
    FolderPath:
      in: query
      required: false
      name: folderPath
      schema:
        type: string
        default: "/"
      description: Organizational folder path. Empty or omitted addresses the tenant root.
      example: /summer
    NavigationPath:
      in: query
      required: false
      name: path
      schema:
        type: string
        default: "/"
      description: Organizational navigation path. Empty or omitted loads the tenant root.
      example: /@family/summer
    FolderPathParam:
      in: query
      required: true
      name: path
      schema:
        type: string
      description: Canonical folder path.
      example: /@family/summer
    MemoryPath:
      in: query
      required: true
      name: path
      schema:
        type: string
      description: Canonical Memory UI path with folder segments followed by one or more Memory name segments.
      example: /summer/beach-day
    SearchQuery:
      in: query
      required: true
      name: q
      schema:
        type: string
        minLength: 2
        maxLength: 120
      description: Search query. Matching is case-insensitive.
      example: beach
    SearchLimit:
      in: query
      required: false
      name: limit
      schema:
        type: integer
        format: int32
        default: 20
        minimum: 1
        maximum: 50
      description: Maximum number of results to return.
      example: 20
    UploadId:
      in: path
      required: true
      name: uploadId
      schema:
        type: string
      description: Resumable upload session id.
    ChunkIndex:
      in: path
      required: true
      name: chunkIndex
      schema:
        type: integer
        format: int32
        minimum: 0
      description: Zero-based upload chunk index.
  requestBodies:
    CreateMemory:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/CreateMemoryRequest"
          example:
            folderPath: /summer
            name: summer-trip
            displayName: Summer Trip
    UpdateMemory:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/UpdateMemoryRequest"
          example:
            name: summer-trip-2026
            displayName: Summer Trip 2026
    UploadMemoryCover:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            additionalProperties: false
            required:
              - cropX
              - cropY
              - cropWidth
              - cropHeight
            properties:
              file:
                type: string
                format: binary
                description: Cover original image file. Mutually exclusive with `mediaId`.
              mediaId:
                type: string
                description: Existing Memory media id to use as cover source. Mutually exclusive with `file`.
              cropX:
                type: number
                format: double
                minimum: 0
                maximum: 1
                description: Normalized crop x offset.
              cropY:
                type: number
                format: double
                minimum: 0
                maximum: 1
                description: Normalized crop y offset.
              cropWidth:
                type: number
                format: double
                minimum: 0
                maximum: 1
                description: Normalized crop width. Must form a 16:9 rectangle with `cropHeight`.
              cropHeight:
                type: number
                format: double
                minimum: 0
                maximum: 1
                description: Normalized crop height. Must form a 16:9 rectangle with `cropWidth`.
          example:
            mediaId: med_abc123
            cropX: 0
            cropY: 0.125
            cropWidth: 1
            cropHeight: 0.5625
    UploadMemoryMedia:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - file
            properties:
              file:
                type: string
                format: binary
              title:
                type: string
                nullable: true
          example:
            title: Beach
    UploadMemoryTrack:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - file
              - title
              - activityType
            properties:
              file:
                type: string
                format: binary
                description: GPX file.
              title:
                type: string
                minLength: 1
                maxLength: 160
              activityType:
                "$ref": "#/components/schemas/MemoryTrackActivityType"
          example:
            title: Alpine ridge day 2
            activityType: HIKING
    CreateMemoryMediaUpload:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/CreateMemoryMediaUploadRequest"
          example:
            filename: beach.mp4
            mimeType: video/mp4
            sizeBytes: 73400320
            title: Beach
            bucketId: bkt_abc123
    CreateMemoryMediaBucket:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/CreateMemoryMediaBucketRequest"
          example:
            parentBucketId: bkt_primary123
            displayName: Drone shots
    UpdateMemoryMediaBucket:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/UpdateMemoryMediaBucketRequest"
          example:
            displayName: Drone highlights
    MoveMemoryMedia:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/MoveMemoryMediaRequest"
          example:
            mediaIds:
              - med_abc123
            targetBucketId: bkt_abc123
    DeleteMemoryMediaBatch:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/DeleteMemoryMediaBatchRequest"
          example:
            mediaIds:
              - med_abc123
    UploadMediaChunk:
      required: true
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
          example: "<binary media chunk>"
    UpdateMemoryMediaMetadata:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/UpdateMemoryMediaMetadataRequest"
          example:
            capturedAt: '2026-05-03T12:30:00Z'
    UpdateMemoryMediaMetadataBatch:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/UpdateMemoryMediaMetadataBatchRequest"
          example:
            mediaIds:
              - med_abc123
              - med_def456
            capturedAtOffsetSeconds: 7200
    UpdateMemoryJournal:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/UpdateMemoryJournalRequest"
          example:
            markdown: |-
              # Beach day

              We started early.

              ![Sunset](veyq:media/med_abc123)
              ![Highlights](veyq:media/med_abc123,med_def456)
    UpdateMemoryTrack:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/UpdateMemoryTrackRequest"
          example:
            title: Alpine ridge day 2
            activityType: HIKING
    CreateMemoryPlaylist:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/CreateMemoryPlaylistRequest"
          example:
            title: Roadtrip soundtrack
            note: Songs from the van.
            url: https://open.spotify.com/playlist/37i9dQZF1DXcBWIGoYBM5M
    UpdateMemoryPlaylist:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/UpdateMemoryPlaylistRequest"
          example:
            title: Roadtrip soundtrack
            note: Songs from the van.
    CreateFolder:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/CreateFolderRequest"
          example:
            parentPath: /@family
            name: summer
            displayName: Summer
    UpdateFolder:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/UpdateFolderRequest"
          example:
            path: /@family/summer
            displayName: Summer 2026
    MoveFolder:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/MoveFolderRequest"
          example:
            path: /@family/summer
            newParentPath: /@family/archive
  responses:
    MemoryNavigation:
      description: Memory navigation state.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/MemoryNavigationResponse"
          example:
            location:
              kind: TENANT
              path: /
              displayName: Friends
            breadcrumbs:
              - kind: TENANT
                path: /
                displayName: Friends
                label: Friends
            scopeRoots:
              - kind: USER
