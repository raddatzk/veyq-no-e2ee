        - startDate
        - endDate
      properties:
        parentId:
          type: string
          nullable: true
          description: Parent Memory id. When present, the created Memory inherits the parent scope.
        folderPath:
          type: string
          nullable: true
          description: Organizational folder path for new top-level Memories. Ignored when `parentId` is present.
        name:
          type: string
          description: URL-safe sibling name.
        displayName:
          "$ref": "./common.openapi.yaml#/components/schemas/DisplayName"
        startDate:
          type: string
          format: date
          description: User-defined Memory start date.
        endDate:
          type: string
          format: date
          description: User-defined Memory end date.
        scope:
          "$ref": "#/components/schemas/MemoryScopeRequest"
          nullable: true
          description: Root scope for new root Memories. Ignored for child Memories because children inherit parent scope.
