        name: summer-2026
    SearchResultSummary:
      type: object
      additionalProperties: false
      required:
        - kind
        - id
        - displayName
        - path
        - scope
        - matchTypes
      properties:
        kind:
          type: string
          enum:
            - MEMORY
            - FOLDER
        id:
          type: string
          description: Public Memory or folder id.
        displayName:
          "$ref": "./common.openapi.yaml#/components/schemas/DisplayName"
        path:
          type: string
          description: Canonical UI path to navigate to this result.
        scope:
          "$ref": "#/components/schemas/MemoryScope"
        coverUrl:
          type: string
          nullable: true
          description: Renderable Memory cover URL. Only present for Memory results with a cover.
        coverCrop:
          "$ref": "#/components/schemas/CoverCrop"
        matchTypes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
              - TITLE
              - PATH
              - JOURNAL
        journalSnippet:
          type: string
          nullable: true
          description: Plain-text snippet from matching journal Markdown.
      example:
        kind: MEMORY
        id: mem_abc123
        displayName: Beach Day
        path: /summer-trip/beach-day
        scope:
          type: TENANT
        coverUrl: /api/friends/memories/mem_abc123/cover/content
        matchTypes:
          - TITLE
          - JOURNAL
        journalSnippet: "...the beach picnic started just before sunset..."
    MemorySummary:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - displayName
        - startDate
        - endDate
        - path
        - childCount
        - mediaCount
        - favorite
      properties:
        id:
          type: string
          description: Public Memory id.
        parentId:
          type: string
          nullable: true
          description: Public parent Memory id, or null for root Memories.
        name:
          type: string
          description: URL-safe sibling name inside the parent and scope.
        displayName:
          "$ref": "./common.openapi.yaml#/components/schemas/DisplayName"
        path:
          type: string
          description: Scope-prefixed display path used by the current implementation.
        coverMediaId:
          type: string
          nullable: true
          description: Public id of the cover media if one is set.
        coverUrl:
          type: string
          nullable: true
          description: URL for the renderable Memory cover source if one is set.
        coverCrop:
          "$ref": "#/components/schemas/CoverCrop"
        startDate:
          type: string
          format: date
          description: User-defined Memory start date.
        endDate:
          type: string
          format: date
          description: User-defined Memory end date.
        childCount:
          type: integer
          format: int32
        mediaCount:
          type: integer
          format: int32
        favorite:
          type: boolean
          description: Whether the current user has favorited this Memory.
        scope:
          "$ref": "#/components/schemas/MemoryScope"
      example:
        id: mem_abc123
        parentId: null
        name: summer-trip
        displayName: Summer Trip
        path: /summer-trip
        coverMediaId: med_abc123
        coverUrl: /api/friends/memories/mem_abc123/cover/content
        coverCrop:
          x: 0
          y: 0.125
          width: 1
          height: 0.5625
        startDate: '2026-05-03'
        endDate: '2026-05-05'
        childCount: 1
        mediaCount: 12
        favorite: true
        scope:
          type: TENANT
    MemoryHeaderSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - displayName
        - path
        - startDate
        - endDate
        - directMediaCount
        - descendantMediaCount
        - childMemoryCount
        - favorite
        - scope
        - participants
