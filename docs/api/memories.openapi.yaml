  schemas:
    MemoryNavigationResponse:
      type: object
      additionalProperties: false
      required:
        - location
        - breadcrumbs
        - scopeRoots
        - favoriteMemories
        - folders
      properties:
        location:
          "$ref": "#/components/schemas/MemoryNavigationLocation"
        breadcrumbs:
          type: array
          items:
            "$ref": "#/components/schemas/MemoryNavigationBreadcrumb"
        scopeRoots:
          type: array
          items:
            "$ref": "#/components/schemas/MemoryScopeRoot"
        favoriteMemories:
          type: array
          description: Memories favorited by the current user and visible in the current tenant.
          items:
            "$ref": "#/components/schemas/MemorySummary"
        folders:
          type: array
          items:
            "$ref": "#/components/schemas/MemoryFolder"
      example:
        location:
          kind: TENANT
          path: /
          displayName: Friends
        breadcrumbs:
          - kind: TENANT
            path: /
            displayName: Friends
            label: Friends
        scopeRoots:
          - kind: USER
            name: me
            displayName: Kevin
            path: /~me
        favoriteMemories: []
        folders:
          - id: fol_abc123
            name: summer
            displayName: Summer
            path: /summer
    MemoryNavigationLocation:
      type: object
      additionalProperties: false
      required:
        - kind
        - path
        - displayName
      properties:
        kind:
          "$ref": "#/components/schemas/MemoryNavigationKind"
        path:
          type: string
        displayName:
          "$ref": "./common.openapi.yaml#/components/schemas/DisplayName"
      example:
        kind: TENANT
        path: /
        displayName: Friends
    MemoryNavigationBreadcrumb:
      type: object
      additionalProperties: false
      required:
        - kind
        - path
        - displayName
        - label
      properties:
        kind:
          "$ref": "#/components/schemas/MemoryNavigationKind"
        path:
          type: string
        displayName:
          "$ref": "./common.openapi.yaml#/components/schemas/DisplayName"
        label:
          type: string
      example:
        kind: FOLDER
        path: /summer
        displayName: Summer
        label: Summer
    MemoryNavigationKind:
      type: string
      enum:
        - TENANT
        - GROUP
        - USER
        - FOLDER
    MemoryScopeRoot:
      type: object
      additionalProperties: false
      required:
        - kind
        - name
        - displayName
        - path
      properties:
        kind:
          type: string
          enum:
            - GROUP
            - USER
        name:
          type: string
        displayName:
          "$ref": "./common.openapi.yaml#/components/schemas/DisplayName"
        path:
          type: string
      example:
        kind: GROUP
        name: family
        displayName: Family
        path: /@family
    MemoryFolder:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - displayName
        - path
      properties:
        id:
          type: string
        name:
          type: string
        displayName:
          "$ref": "./common.openapi.yaml#/components/schemas/DisplayName"
        path:
          type: string
      example:
        id: fol_abc123
        name: summer
        displayName: Summer
        path: /@family/summer
    CreateFolderRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - displayName
      properties:
        parentPath:
          type: string
          nullable: true
        name:
          type: string
        displayName:
          "$ref": "./common.openapi.yaml#/components/schemas/DisplayName"
        scope:
          "$ref": "#/components/schemas/MemoryScopeRequest"
          nullable: true
      example:
        parentPath: /@family
        name: summer
        displayName: Summer
        scope:
          type: GROUP
          groupName: family
    UpdateFolderRequest:
      type: object
      additionalProperties: false
      required:
        - path
      properties:
        path:
          type: string
        name:
          type: string
          nullable: true
        displayName:
          "$ref": "./common.openapi.yaml#/components/schemas/DisplayName"
          nullable: true
      example:
