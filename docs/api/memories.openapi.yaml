---
openapi: 3.1.0
info:
  title: veyq Memories API
  version: 0.1.0
  description: Memory-first API for the veyq product model. Memories are the only rich content objects; folders remain organizational containers.
servers:
  - url: /
security:
  - accessTokenCookie: []
tags:
  - name: MemoryNavigation
  - name: Folders
  - name: Memories
  - name: MemoryParticipants
  - name: MemoryMedia
  - name: MemoryTracks
  - name: MemoryPlaylists
  - name: Search
paths:
  "/api/{tenantName}/search":
    get:
      tags:
        - Search
      operationId: searchTenant
      summary: Search visible memories, folders and journals
      x-implementation-status: implemented
      x-preconditions:
        - A valid access token cookie must be present.
        - The current user must be a member of the addressed tenant.
      description: |-
        Searches visible Memories, organizational folders and Memory journals inside the addressed tenant. Results are filtered by the current user's visible scopes and never include public-share-only or cross-tenant content.

        Vorbedingungen:
        - A valid access token cookie must be present.
        - The current user must be a member of the addressed tenant.

        Implementierungsstatus: implemented.
      parameters:
        - "$ref": "./common.openapi.yaml#/components/parameters/TenantName"
        - "$ref": "#/components/parameters/SearchQuery"
        - "$ref": "#/components/parameters/SearchLimit"
      responses:
        '200':
          "$ref": "#/components/responses/SearchResults"
        '400':
          "$ref": "./common.openapi.yaml#/components/responses/400"
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
        '403':
          "$ref": "./common.openapi.yaml#/components/responses/403"
  "/api/{tenantName}/memory-navigation":
    get:
      tags:
        - MemoryNavigation
      operationId: getMemoryNavigation
      summary: Load memory navigation for a tenant path
      x-implementation-status: implemented
      x-preconditions: &memoryPreconditions
        - A valid access token cookie must be present.
        - The current user must be a member of the addressed tenant.
      description: |-
        Returns the current memory navigation location, its breadcrumb chain, visible scope roots and child folders.

        Vorbedingungen:
        - A valid access token cookie must be present.
        - The current user must be a member of the addressed tenant.

        Implementierungsstatus: implemented.
      parameters:
        - "$ref": "./common.openapi.yaml#/components/parameters/TenantName"
        - "$ref": "#/components/parameters/NavigationPath"
      responses:
        '200':
          "$ref": "#/components/responses/MemoryNavigation"
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
        '403':
          "$ref": "./common.openapi.yaml#/components/responses/403"
        '404':
          "$ref": "./common.openapi.yaml#/components/responses/404"
  "/api/{tenantName}/folders":
    post:
      tags:
        - Folders
      operationId: createFolder
      summary: Create an organizational folder
      x-implementation-status: implemented
      x-preconditions:
        - A valid access token cookie must be present.
        - The current user must be a member of the addressed tenant.
      description: |-
        Creates an organizational folder for grouping Memories. Folders are not rich content objects.

        Vorbedingungen: Der Nutzer ist im Tenant authentifiziert und darf den Ziel-Scope sehen.
      parameters:
        - "$ref": "./common.openapi.yaml#/components/parameters/TenantName"
      requestBody:
        "$ref": "#/components/requestBodies/CreateFolder"
      responses:
        '200':
          "$ref": "#/components/responses/Folder"
        '400':
          "$ref": "./common.openapi.yaml#/components/responses/400"
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
        '403':
          "$ref": "./common.openapi.yaml#/components/responses/403"
        '404':
          "$ref": "./common.openapi.yaml#/components/responses/404"
        '409':
          "$ref": "./common.openapi.yaml#/components/responses/409"
    delete:
      tags:
        - Folders
      operationId: deleteFolder
      summary: Delete an organizational folder
      x-implementation-status: implemented
      x-preconditions:
        - A valid access token cookie must be present.
        - The current user must be a member of the addressed tenant.
      description: |-
        Deletes a visible organizational folder.

        Vorbedingungen: Der Nutzer ist im Tenant authentifiziert und darf den Ordner sehen.
      parameters:
        - "$ref": "./common.openapi.yaml#/components/parameters/TenantName"
        - "$ref": "#/components/parameters/FolderPathParam"
      responses:
        '204':
          description: Folder deleted.
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
        '403':
          "$ref": "./common.openapi.yaml#/components/responses/403"
        '404':
          "$ref": "./common.openapi.yaml#/components/responses/404"
  "/api/{tenantName}/folders/update":
    post:
      tags:
        - Folders
      operationId: updateFolder
      summary: Update an organizational folder
      x-implementation-status: implemented
      x-preconditions:
        - A valid access token cookie must be present.
        - The current user must be a member of the addressed tenant.
      description: |-
        Updates the name or display name of a visible organizational folder.

        Vorbedingungen: Der Nutzer ist im Tenant authentifiziert und darf den Ordner sehen.
      parameters:
        - "$ref": "./common.openapi.yaml#/components/parameters/TenantName"
      requestBody:
        "$ref": "#/components/requestBodies/UpdateFolder"
      responses:
        '200':
          "$ref": "#/components/responses/Folder"
        '400':
          "$ref": "./common.openapi.yaml#/components/responses/400"
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
        '403':
          "$ref": "./common.openapi.yaml#/components/responses/403"
        '404':
          "$ref": "./common.openapi.yaml#/components/responses/404"
        '409':
          "$ref": "./common.openapi.yaml#/components/responses/409"
  "/api/{tenantName}/folders/move":
    post:
      tags:
        - Folders
      operationId: moveFolder
      summary: Move an organizational folder
      x-implementation-status: implemented
      x-preconditions:
        - A valid access token cookie must be present.
        - The current user must be a member of the addressed tenant.
      description: |-
        Moves a visible organizational folder inside the same scope.

        Vorbedingungen: Der Nutzer ist im Tenant authentifiziert und darf Quelle und Ziel sehen.
      parameters:
        - "$ref": "./common.openapi.yaml#/components/parameters/TenantName"
      requestBody:
        "$ref": "#/components/requestBodies/MoveFolder"
      responses:
        '200':
          "$ref": "#/components/responses/Folder"
        '400':
          "$ref": "./common.openapi.yaml#/components/responses/400"
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
        '403':
          "$ref": "./common.openapi.yaml#/components/responses/403"
        '404':
          "$ref": "./common.openapi.yaml#/components/responses/404"
        '409':
          "$ref": "./common.openapi.yaml#/components/responses/409"
  "/api/{tenantName}/memories":
    get:
      tags:
        - Memories
      operationId: listMemories
      summary: List root memories
      x-implementation-status: implemented
      x-preconditions:
        - A valid access token cookie must be present.
        - The current user must be a member of the addressed tenant.
      description: &memoryDescription |-
        Lists root Memories visible to the current tenant member. Root Memories belong to a tenant, group or personal scope.

        Vorbedingungen:
        - A valid access token cookie must be present.
        - The current user must be a member of the addressed tenant.

        Implementierungsstatus: implemented.
      parameters:
        - "$ref": "./common.openapi.yaml#/components/parameters/TenantName"
      responses:
        '200':
          "$ref": "#/components/responses/MemorySummaries"
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
        '403':
          "$ref": "./common.openapi.yaml#/components/responses/403"
    post:
      tags:
        - Memories
      operationId: createMemory
      summary: Create a memory
      x-implementation-status: implemented
      x-preconditions:
        - A valid access token cookie must be present.
        - The current user must be a member of the addressed tenant.
      description: |-
        Creates a Memory. If `parentId` is present, the new Memory is created below that parent and inherits the parent's scope. If `parentId` is omitted, `scope` chooses the root scope and defaults to `TENANT`.

        Vorbedingungen:
        - A valid access token cookie must be present.
        - The current user must be a member of the addressed tenant.

        Implementierungsstatus: implemented.
      parameters:
        - "$ref": "./common.openapi.yaml#/components/parameters/TenantName"
      requestBody:
        "$ref": "#/components/requestBodies/CreateMemory"
      responses:
        '200':
          "$ref": "#/components/responses/Memory"
        '400':
          "$ref": "./common.openapi.yaml#/components/responses/400"
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
        '403':
          "$ref": "./common.openapi.yaml#/components/responses/403"
        '404':
          "$ref": "./common.openapi.yaml#/components/responses/404"
        '409':
          "$ref": "./common.openapi.yaml#/components/responses/409"
  "/api/{tenantName}/memories/by-folder":
    get:
      tags:
        - Memories
      operationId: listMemoriesByFolder
      summary: List memories in a folder path
      x-implementation-status: implemented
      x-preconditions:
        - A valid access token cookie must be present.
        - The current user must be a member of the addressed tenant.
      description: |-
        Lists top-level Memories that live in the addressed organizational folder path. This is the path-based UI listing used alongside folders.

        Vorbedingungen:
        - A valid access token cookie must be present.
        - The current user must be a member of the addressed tenant.

        Implementierungsstatus: implemented.
      parameters:
        - "$ref": "./common.openapi.yaml#/components/parameters/TenantName"
        - "$ref": "#/components/parameters/FolderPath"
      responses:
        '200':
          "$ref": "#/components/responses/MemorySummaries"
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
        '403':
          "$ref": "./common.openapi.yaml#/components/responses/403"
        '404':
          "$ref": "./common.openapi.yaml#/components/responses/404"
  "/api/{tenantName}/memories/by-path":
    get:
      tags:
        - Memories
      operationId: getMemoryByPath
      summary: Get a memory by folder path and memory name
      x-implementation-status: implemented
      x-preconditions:
        - A valid access token cookie must be present.
        - The current user must be a member of the addressed tenant.
      description: |-
        Resolves a Memory by its canonical UI path, for example `/travel/summer-trip` or `/travel/summer-trip/day-one`.
        The path may contain organizational folder segments followed by one or more nested Memory name segments.

        Vorbedingungen:
        - A valid access token cookie must be present.
        - The current user must be a member of the addressed tenant.

        Implementierungsstatus: implemented.
      parameters:
        - "$ref": "./common.openapi.yaml#/components/parameters/TenantName"
        - "$ref": "#/components/parameters/MemoryPath"
      responses:
        '200':
          "$ref": "#/components/responses/Memory"
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
        '403':
          "$ref": "./common.openapi.yaml#/components/responses/403"
        '404':
          "$ref": "./common.openapi.yaml#/components/responses/404"
  "/api/{tenantName}/memories/{memoryId}":
    get:
      tags:
        - Memories
      operationId: getMemory
      summary: Get a memory
      x-implementation-status: implemented
      x-preconditions:
        - A valid access token cookie must be present.
        - The current user must be a member of the addressed tenant.
      description: |-
        Returns one visible Memory by public id. The response includes direct child and direct media counts, not aggregated subtree counts.

        Vorbedingungen:
        - A valid access token cookie must be present.
        - The current user must be a member of the addressed tenant.

        Implementierungsstatus: implemented.
      parameters:
        - "$ref": "./common.openapi.yaml#/components/parameters/TenantName"
        - "$ref": "#/components/parameters/MemoryId"
      responses:
        '200':
          "$ref": "#/components/responses/Memory"
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
        '403':
          "$ref": "./common.openapi.yaml#/components/responses/403"
        '404':
          "$ref": "./common.openapi.yaml#/components/responses/404"
    put:
      tags:
        - Memories
      operationId: updateMemory
      summary: Update a memory
      x-implementation-status: implemented
      x-preconditions:
        - A valid access token cookie must be present.
        - The current user must be a member of the addressed tenant.
      description: |-
        Updates Memory display metadata or parent. Moving across scopes and moving a Memory below itself or one of its descendants is rejected.

        Vorbedingungen:
        - A valid access token cookie must be present.
        - The current user must be a member of the addressed tenant.

        Implementierungsstatus: implemented.
      parameters:
        - "$ref": "./common.openapi.yaml#/components/parameters/TenantName"
        - "$ref": "#/components/parameters/MemoryId"
      requestBody:
        "$ref": "#/components/requestBodies/UpdateMemory"
      responses:
        '200':
          "$ref": "#/components/responses/Memory"
        '400':
          "$ref": "./common.openapi.yaml#/components/responses/400"
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
        '403':
          "$ref": "./common.openapi.yaml#/components/responses/403"
        '404':
          "$ref": "./common.openapi.yaml#/components/responses/404"
        '409':
          "$ref": "./common.openapi.yaml#/components/responses/409"
    delete:
      tags:
        - Memories
      operationId: deleteMemory
      summary: Delete a memory
      x-implementation-status: implemented
      x-preconditions:
        - A valid access token cookie must be present.
        - The current user must be a member of the addressed tenant.
      description: |-
        Deletes the Memory, its descendant Memories and media owned by those Memories.

        Vorbedingungen:
        - A valid access token cookie must be present.
        - The current user must be a member of the addressed tenant.

        Implementierungsstatus: implemented.
      parameters:
        - "$ref": "./common.openapi.yaml#/components/parameters/TenantName"
        - "$ref": "#/components/parameters/MemoryId"
      responses:
        '204':
          description: Memory deleted.
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
        '403':
          "$ref": "./common.openapi.yaml#/components/responses/403"
        '404':
          "$ref": "./common.openapi.yaml#/components/responses/404"
  "/api/{tenantName}/memories/{memoryId}/favorite":
    put:
      tags:
        - Memories
      operationId: favoriteMemory
      summary: Favorite a memory
      x-implementation-status: implemented
      x-preconditions:
        - A valid access token cookie must be present.
        - The current user must be a member of the addressed tenant.
      description: |-
        Marks one visible Memory as a favorite for the current user.

        Vorbedingungen:
        - A valid access token cookie must be present.
        - The current user must be a member of the addressed tenant.

        Implementierungsstatus: implemented.
      parameters:
        - "$ref": "./common.openapi.yaml#/components/parameters/TenantName"
        - "$ref": "#/components/parameters/MemoryId"
      responses:
        '200':
          "$ref": "#/components/responses/Memory"
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
        '403':
          "$ref": "./common.openapi.yaml#/components/responses/403"
        '404':
          "$ref": "./common.openapi.yaml#/components/responses/404"
    delete:
      tags:
        - Memories
      operationId: unfavoriteMemory
      summary: Remove a memory favorite
      x-implementation-status: implemented
      x-preconditions:
        - A valid access token cookie must be present.
        - The current user must be a member of the addressed tenant.
      description: |-
        Removes the current user's favorite marker from one visible Memory. The operation is idempotent.

        Vorbedingungen:
        - A valid access token cookie must be present.
        - The current user must be a member of the addressed tenant.

        Implementierungsstatus: implemented.
      parameters:
        - "$ref": "./common.openapi.yaml#/components/parameters/TenantName"
        - "$ref": "#/components/parameters/MemoryId"
      responses:
        '200':
          "$ref": "#/components/responses/Memory"
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
        '403':
          "$ref": "./common.openapi.yaml#/components/responses/403"
        '404':
          "$ref": "./common.openapi.yaml#/components/responses/404"
  "/api/{tenantName}/memories/{memoryId}/children":
    get:
      tags:
        - Memories
      operationId: listChildMemories
      summary: List child memories
      x-implementation-status: implemented
      x-preconditions:
        - A valid access token cookie must be present.
        - The current user must be a member of the addressed tenant.
      description: |-
        Lists direct child Memories visible below the requested parent Memory.

        Vorbedingungen:
        - A valid access token cookie must be present.
        - The current user must be a member of the addressed tenant.

        Implementierungsstatus: implemented.
      parameters:
        - "$ref": "./common.openapi.yaml#/components/parameters/TenantName"
        - "$ref": "#/components/parameters/MemoryId"
      responses:
        '200':
          "$ref": "#/components/responses/MemorySummaries"
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
        '403':
          "$ref": "./common.openapi.yaml#/components/responses/403"
        '404':
          "$ref": "./common.openapi.yaml#/components/responses/404"
  "/api/{tenantName}/memories/{memoryId}/header":
    get:
      tags:
        - Memories
      operationId: getMemoryHeader
      summary: Get memory header
      x-implementation-status: implemented
      x-preconditions:
        - A valid access token cookie must be present.
        - The current user must be a member of the addressed tenant.
      description: |-
        Returns the detail header for one visible Memory. The response separates direct media from visible descendant media for aggregate header display.

        Vorbedingungen:
        - A valid access token cookie must be present.
        - The current user must be a member of the addressed tenant.

        Implementierungsstatus: implemented.
      parameters:
        - "$ref": "./common.openapi.yaml#/components/parameters/TenantName"
        - "$ref": "#/components/parameters/MemoryId"
      responses:
        '200':
          "$ref": "#/components/responses/MemoryHeader"
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
        '403':
          "$ref": "./common.openapi.yaml#/components/responses/403"
        '404':
          "$ref": "./common.openapi.yaml#/components/responses/404"
  "/api/{tenantName}/memories/{memoryId}/participants":
    get:
      tags:
        - MemoryParticipants
      operationId: listMemoryParticipants
      summary: List memory participants
      x-implementation-status: implemented
      x-preconditions:
        - A valid access token cookie must be present.
        - The current user must be a member of the addressed tenant.
      description: |-
        Lists registered users explicitly attached as participants to one visible Memory. Participants whose user is no longer eligible for the Memory scope are omitted.

        Vorbedingungen:
        - A valid access token cookie must be present.
        - The current user must be a member of the addressed tenant.

        Implementierungsstatus: implemented.
      parameters:
        - "$ref": "./common.openapi.yaml#/components/parameters/TenantName"
        - "$ref": "#/components/parameters/MemoryId"
      responses:
        '200':
          "$ref": "#/components/responses/MemoryParticipants"
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
        '403':
          "$ref": "./common.openapi.yaml#/components/responses/403"
        '404':
          "$ref": "./common.openapi.yaml#/components/responses/404"
  "/api/{tenantName}/memories/{memoryId}/participant-candidates":
    get:
      tags:
        - MemoryParticipants
      operationId: listMemoryParticipantCandidates
      summary: List eligible participant candidates
      x-implementation-status: implemented
      x-preconditions:
        - A valid access token cookie must be present.
        - The current user must be a member of the addressed tenant.
      description: |-
        Lists registered users who can be added as participants to the Memory according to the Memory scope. Tenant Memories expose accepted tenant members, group Memories expose members of that group and personal Memories expose only the personal-scope user.

        Vorbedingungen:
        - A valid access token cookie must be present.
        - The current user must be a member of the addressed tenant.

        Implementierungsstatus: implemented.
      parameters:
        - "$ref": "./common.openapi.yaml#/components/parameters/TenantName"
        - "$ref": "#/components/parameters/MemoryId"
      responses:
        '200':
          "$ref": "#/components/responses/MemoryParticipants"
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
        '403':
          "$ref": "./common.openapi.yaml#/components/responses/403"
        '404':
          "$ref": "./common.openapi.yaml#/components/responses/404"
  "/api/{tenantName}/memories/{memoryId}/participants/{userId}":
    put:
      tags:
        - MemoryParticipants
      operationId: addMemoryParticipant
      summary: Add a memory participant
      x-implementation-status: implemented
      x-preconditions:
        - A valid access token cookie must be present.
        - The current user must be a member of the addressed tenant.
      description: |-
        Adds one registered user as participant to a visible Memory when that user is eligible for the Memory scope. The operation is idempotent.

        Vorbedingungen:
        - A valid access token cookie must be present.
        - The current user must be a member of the addressed tenant.

        Implementierungsstatus: implemented.
      parameters:
        - "$ref": "./common.openapi.yaml#/components/parameters/TenantName"
        - "$ref": "#/components/parameters/MemoryId"
        - "$ref": "#/components/parameters/UserId"
      responses:
        '200':
          "$ref": "#/components/responses/MemoryParticipant"
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
        '403':
          "$ref": "./common.openapi.yaml#/components/responses/403"
        '404':
          "$ref": "./common.openapi.yaml#/components/responses/404"
    delete:
      tags:
        - MemoryParticipants
      operationId: removeMemoryParticipant
      summary: Remove a memory participant
      x-implementation-status: implemented
      x-preconditions:
        - A valid access token cookie must be present.
        - The current user must be a member of the addressed tenant.
      description: |-
        Removes one participant from a visible Memory. The operation is idempotent.

        Vorbedingungen:
        - A valid access token cookie must be present.
        - The current user must be a member of the addressed tenant.

        Implementierungsstatus: implemented.
      parameters:
        - "$ref": "./common.openapi.yaml#/components/parameters/TenantName"
        - "$ref": "#/components/parameters/MemoryId"
        - "$ref": "#/components/parameters/UserId"
      responses:
        '204':
          description: Participant removed.
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
        '403':
          "$ref": "./common.openapi.yaml#/components/responses/403"
        '404':
          "$ref": "./common.openapi.yaml#/components/responses/404"
  "/api/{tenantName}/memories/{memoryId}/journal":
    get:
      tags:
        - Memories
      operationId: getMemoryJournal
      summary: Get memory journal
      x-implementation-status: implemented
      x-preconditions:
        - A valid access token cookie must be present.
        - The current user must be a member of the addressed tenant.
        - The current user can see the addressed Memory.
      description: |-
        Returns the Markdown journal for one visible Memory. Each Memory has exactly one journal; Memories without saved journal text return an empty Markdown string.

        Vorbedingungen:
        - A valid access token cookie must be present.
        - The current user must be a member of the addressed tenant.
        - The current user can see the addressed Memory.

        Implementierungsstatus: implemented.
      parameters:
        - "$ref": "./common.openapi.yaml#/components/parameters/TenantName"
        - "$ref": "#/components/parameters/MemoryId"
      responses:
        '200':
          "$ref": "#/components/responses/MemoryJournal"
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
        '403':
          "$ref": "./common.openapi.yaml#/components/responses/403"
        '404':
          "$ref": "./common.openapi.yaml#/components/responses/404"
    put:
      tags:
        - Memories
      operationId: updateMemoryJournal
      summary: Update memory journal
      x-implementation-status: implemented
      x-preconditions:
        - A valid access token cookie must be present.
        - The current user must be a member of the addressed tenant.
        - The current user can see the addressed Memory.
      description: |-
        Replaces the Markdown journal for one visible Memory. veyq embed links are validated against content visible inside the current Memory context.

        Vorbedingungen:
        - A valid access token cookie must be present.
        - The current user must be a member of the addressed tenant.
        - The current user can see the addressed Memory.

        Implementierungsstatus: implemented.
      parameters:
        - "$ref": "./common.openapi.yaml#/components/parameters/TenantName"
        - "$ref": "#/components/parameters/MemoryId"
      requestBody:
        "$ref": "#/components/requestBodies/UpdateMemoryJournal"
      responses:
        '200':
          "$ref": "#/components/responses/MemoryJournal"
