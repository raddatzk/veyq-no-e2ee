<svg width="100%" viewBox="0 0 680 500" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
<title>One master key unlocked by four independent methods, which unlocks your identity key and all content</title>
<desc>Four unlock methods (password plus secret key, passkey via PRF, recovery code, this device) each independently open the same master key. The master key unlocks your private identity key, which unlocks all your memories and groups. The server stores only your public key, ciphertext and a login verifier.</desc>
<defs>
<marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9aa0a6"/></marker>
</defs>

<text x="340" y="26" text-anchor="middle" font-size="17" font-weight="500" fill="#1f2937">one master key, many ways to unlock it</text>

<g fill="#e8f0fe" stroke="#adc6f7">
<rect x="15" y="54" width="150" height="54" rx="10"/>
<rect x="185" y="54" width="150" height="54" rx="10"/>
<rect x="355" y="54" width="150" height="54" rx="10"/>
<rect x="525" y="54" width="150" height="54" rx="10"/>
</g>
<g font-weight="500" font-size="13" text-anchor="middle" fill="#1f2937">
<text x="90" y="80">password + secret key</text>
<text x="260" y="80">passkey (PRF)</text>
<text x="430" y="80">recovery code</text>
<text x="600" y="80">this device</text>
</g>
<g font-size="11" text-anchor="middle" fill="#5f6571">
<text x="90" y="97">you know + you have</text>
<text x="260" y="97">syncs across devices</text>
<text x="430" y="97">single-use backup</text>
<text x="600" y="97">biometric unlock</text>
</g>

<g fill="none" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#ah)">
<path d="M90,108 L250,166"/>
<path d="M260,108 L310,166"/>
<path d="M430,108 L370,166"/>
<path d="M600,108 L430,166"/>
</g>

<rect x="210" y="168" width="260" height="58" rx="12" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="2"/>
<text x="340" y="193" text-anchor="middle" font-size="15" font-weight="500" fill="#1f2937">master key</text>
<text x="340" y="212" text-anchor="middle" font-size="11" fill="#5f6571">one key, wrapped four times</text>

<line x1="340" y1="226" x2="340" y2="272" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#ah)"/>

<rect x="195" y="274" width="290" height="52" rx="10" fill="#f1f3f4" stroke="#cdd1d6"/>
<text x="340" y="296" text-anchor="middle" font-size="14" font-weight="500" fill="#1f2937">your private identity key</text>
<text x="340" y="313" text-anchor="middle" font-size="11" fill="#5f6571">unlocks all your content</text>

<line x1="340" y1="326" x2="340" y2="372" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#ah)"/>

<rect x="165" y="374" width="350" height="56" rx="10" fill="#f1f3f4" stroke="#cdd1d6"/>
<text x="340" y="398" text-anchor="middle" font-size="14" font-weight="500" fill="#1f2937">your memories &amp; groups</text>
<text x="340" y="416" text-anchor="middle" font-size="11" fill="#5f6571">wrapped to your public key</text>

<text x="340" y="452" text-anchor="middle" font-size="11" fill="#5f6571">the server stores only your public key, ciphertext and a login verifier — never a key</text>

<rect x="150" y="468" width="13" height="13" rx="3" fill="#e8f0fe" stroke="#adc6f7"/>
<text x="170" y="478" font-size="11" fill="#5f6571">what you provide to unlock</text>
<rect x="372" y="468" width="13" height="13" rx="3" fill="#f1f3f4" stroke="#cdd1d6"/>
<text x="392" y="478" font-size="11" fill="#5f6571">your keys &amp; content</text>
</svg>
