<svg width="100%" viewBox="0 0 680 190" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
<title>Registration: your keys are generated on your own device</title>
<desc>When you accept an invite, your device generates your keys and secret key, locks the master key with your chosen methods, and shows your emergency kit. The invite's temporary key unlocks the shared content and re-locks it to you. The server only ever sees public keys and ciphertext.</desc>
<defs>
<marker id="ag" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9aa0a6"/></marker>
</defs>

<text x="340" y="26" text-anchor="middle" font-size="16" font-weight="500" fill="#1f2937">registration — your keys are born on your device</text>

<rect x="12" y="52" width="150" height="62" rx="10" fill="#f1f3f4" stroke="#cdd1d6"/>
<rect x="182" y="52" width="150" height="62" rx="10" fill="#e8f0fe" stroke="#adc6f7"/>
<rect x="352" y="52" width="150" height="62" rx="10" fill="#e8f0fe" stroke="#adc6f7"/>
<rect x="522" y="52" width="150" height="62" rx="10" fill="#e6f4ea" stroke="#a8d5b5"/>

<g fill="none" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#ag)">
<path d="M162,83 L182,83"/><path d="M332,83 L352,83"/><path d="M502,83 L522,83"/>
</g>

<g font-size="12.5" text-anchor="middle" fill="#1f2937">
<text x="87" y="87">accept invite</text>
<text x="257" y="78">make keys +</text><text x="257" y="95">secret key</text>
<text x="427" y="78">lock the</text><text x="427" y="95">master key</text>
<text x="597" y="78">save your</text><text x="597" y="95">emergency kit</text>
</g>

<text x="340" y="148" text-anchor="middle" font-size="11" fill="#5f6571">the invite's temporary key unlocks the shared content, then re-locks it to your own key</text>
<text x="340" y="165" text-anchor="middle" font-size="11" fill="#5f6571">the server only ever sees public keys and ciphertext — never a secret</text>
</svg>
