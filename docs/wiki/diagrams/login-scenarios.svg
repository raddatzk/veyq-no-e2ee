<svg width="100%" viewBox="0 0 680 405" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
<title>Four ways to log in: trusted device, synced passkey, device-to-device, and cold start</title>
<desc>On a trusted device you unlock with face ID. On a new device a synced passkey unlocks via PRF. Device-to-device lets an old device approve the new one. Cold start needs the secret key from the emergency kit. Only cold start requires the secret key.</desc>
<defs>
<marker id="al" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9aa0a6"/></marker>
</defs>

<text x="340" y="26" text-anchor="middle" font-size="16" font-weight="500" fill="#1f2937">four ways onto a new (or trusted) device</text>

<!-- row labels -->
<g font-size="13" font-weight="500" fill="#1f2937">
<text x="12" y="85">trusted device</text>
<text x="12" y="163">synced passkey</text>
<text x="12" y="241">device-to-device</text>
<text x="12" y="319">cold start</text>
</g>
<g font-size="11" fill="#5f6571">
<text x="12" y="100">your own phone</text>
<text x="12" y="178">iCloud · Google</text>
<text x="12" y="256">old device nearby</text>
<text x="12" y="334">nothing else on hand</text>
</g>

<!-- step boxes: col1 gray (start), col2 blue (unlock method), col3 green (done) -->
<g fill="#f1f3f4" stroke="#cdd1d6">
<rect x="158" y="58" width="145" height="58" rx="10"/>
<rect x="158" y="136" width="145" height="58" rx="10"/>
<rect x="158" y="214" width="145" height="58" rx="10"/>
<rect x="158" y="292" width="145" height="58" rx="10"/>
</g>
<g fill="#e8f0fe" stroke="#adc6f7">
<rect x="340" y="58" width="145" height="58" rx="10"/>
<rect x="340" y="136" width="145" height="58" rx="10"/>
<rect x="340" y="214" width="145" height="58" rx="10"/>
<rect x="340" y="292" width="145" height="58" rx="10"/>
</g>
<g fill="#e6f4ea" stroke="#a8d5b5">
<rect x="522" y="58" width="145" height="58" rx="10"/>
<rect x="522" y="136" width="145" height="58" rx="10"/>
<rect x="522" y="214" width="145" height="58" rx="10"/>
<rect x="522" y="292" width="145" height="58" rx="10"/>
</g>

<g fill="none" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#al)">
<path d="M303,87 L340,87"/><path d="M485,87 L522,87"/>
<path d="M303,165 L340,165"/><path d="M485,165 L522,165"/>
<path d="M303,243 L340,243"/><path d="M485,243 L522,243"/>
<path d="M303,321 L340,321"/><path d="M485,321 L522,321"/>
</g>

<g font-size="12.5" text-anchor="middle" fill="#1f2937">
<text x="230" y="91">open the app</text><text x="412" y="91">face ID</text><text x="594" y="91">you're in</text>
<text x="230" y="169">passkey sign-in</text><text x="412" y="169">PRF unlocks</text><text x="594" y="169">in + enrolled</text>
<text x="230" y="247">new device: QR</text><text x="412" y="247">old device approves</text><text x="594" y="247">in + enrolled</text>
<text x="230" y="325">password sign-in</text><text x="412" y="325">secret key (kit)</text><text x="594" y="325">in + enrolled</text>
</g>

<text x="158" y="378" font-size="11" fill="#5f6571">you only type the secret key in the cold-start row — a passkey or a second device avoids it</text>
</svg>
