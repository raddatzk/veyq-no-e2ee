id: uc.people.manage-participants
title: Manage Participants
status: partial
documents:
  - type: feature
    ref: docs/wiki/features/people/_index.md
  - type: useCase
    ref: docs/wiki/features/people/use-cases/uc.people.manage-participants.md
  - type: crosscutting
    ref: docs/wiki/crosscutting/security-model.md
  - type: crosscutting
    ref: docs/wiki/crosscutting/search.md
  - type: decision
    ref: docs/wiki/decisions/0032-encrypted-memory-participants.md
  - type: api
    ref: docs/api/memory.openapi.yaml
  - type: entryPoint
    ref: backend/src/main/kotlin/com/veyq/app/features/people/participant/ParticipantHandler.kt
  - type: entryPoint
    ref: frontend/src/features/people/participants/participants.ts
  - type: entryPoint
    ref: frontend/src/app/home/MemoryDetailHeader.vue
  - type: entryPoint
    ref: frontend/src/app/home/PersonProfileView.vue
acceptanceCriteria:
  - id: uc.people.manage-participants.sealed-payload
    statement: "Participant display names and optional linked user ids are stored only inside sealed Memory-scoped payloads."
    coverage:
      backend:
        integration:
          - testName: addsListsUpdatesAndRemovesParticipants
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/app/features/people/participant/ParticipantSliceTest.kt
    gaps:
      - reason: "Web sealing/decryption is implemented but not yet covered by a focused crypto unit test."
        followUp: "Add web unit coverage for linked and anonymous participant payload sealing/decryption."
  - id: uc.people.manage-participants.linked-and-anonymous
    statement: "A Memory can contain both linked user participants and anonymous name-only participants; only linked participants are interactive."
    coverage:
      backend:
        integration:
          - testName: addsListsUpdatesAndRemovesParticipants
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/app/features/people/participant/ParticipantSliceTest.kt
      web:
        unit:
          - testName: "emits linked participant selections for the member profile view"
            kind: positive
            ref: frontend/src/app/home/MemoryContent.test.ts
          - testName: "renders accessible memories for a linked participant and emits selection"
            kind: positive
            ref: frontend/src/app/home/PersonProfileView.test.ts
    gaps:
      - reason: "Linked chip click-through has unit coverage, but anonymous participant rename and full browser e2e coverage are still missing."
        followUp: "Add rename support plus e2e coverage for add linked, add anonymous, open profile and remove flows."
  - id: uc.people.manage-participants.local-search
    statement: "Decrypted participant display names are local search keys for their Memories without using a server search endpoint."
    coverage:
      web:
        unit:
          - testName: "matches decrypted participant names while returning memory hits"
            kind: positive
            ref: frontend/src/features/search/search.test.ts
    gaps:
      - reason: "Search helper coverage exists, but there is no end-to-end coverage for the full participant UI-to-search flow."
        followUp: "Add an e2e test that adds a participant and finds the Memory by participant name."
