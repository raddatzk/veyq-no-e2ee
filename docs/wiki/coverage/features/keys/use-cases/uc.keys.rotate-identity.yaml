acceptanceCriteria:
  - id: uc.keys.rotate-identity.rotate
    statement: A user can rotate their identity keypair, re-wrapping exactly their owned grants, so they keep access to every scope and its content under the new identity while the master key stays unchanged.
    coverage:
      backend:
        integration:
          - testName: rotatesIdentityAndReWrapsExactlyTheOwnedGrants
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/app/features/keys/rotateidentity/RotateIdentitySliceTest.kt
          - testName: rotatesIdentityAndReWrapsExactlyTheOwnedGrants
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/app/features/keys/rotateidentity/RotateIdentitySliceTest.kt
      web:
        e2e:
          - testName: rotates the identity and keeps access to every scope + content via the new identity
            kind: positive
            ref: frontend/src/features/keys/rotateIdentity.e2e.test.ts
      android:
        e2e:
          - testName: rotateIdentityKeepsAccessToScopesAndContent
            kind: positive
            ref: android/src/test/kotlin/app/veyq/crypto/RotateIdentityE2ETest.kt
      apple:
        e2e:
          - testName: testRotateIdentityKeepsAccessToScopesAndContent
            kind: positive
            ref: apple/Tests/VeyqCryptoTests/RotateIdentityE2ETests.swift
