id: uc.keys.rotate-identity
title: Rotate the account identity key
status: implemented
documents:
  - type: feature
    ref: docs/wiki/features/keys/_index.md
  - type: useCase
    ref: docs/wiki/features/keys/use-cases/uc.keys.rotate-identity.md
  - type: crosscutting
    ref: docs/wiki/crosscutting/security-model.md
  - type: crosscutting
    ref: docs/wiki/crosscutting/account-key-model.md
  - type: api
    ref: docs/api/identity.openapi.yaml
  - type: entryPoint
    ref: backend/src/main/kotlin/com/veyq/app/features/keys/rotateidentity/MyGrantsHandler.kt
  - type: entryPoint
