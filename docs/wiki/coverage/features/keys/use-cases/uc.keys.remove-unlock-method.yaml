id: uc.keys.remove-unlock-method
title: Remove an unlock method
status: implemented
documents:
  - type: feature
    ref: docs/wiki/features/keys/_index.md
  - type: useCase
    ref: docs/wiki/features/keys/use-cases/uc.keys.remove-unlock-method.md
  - type: crosscutting
    ref: docs/wiki/crosscutting/security-model.md
  - type: crosscutting
    ref: docs/wiki/crosscutting/account-key-model.md
  - type: api
    ref: docs/api/crypto.openapi.yaml
  - type: entryPoint
    ref: backend/src/main/kotlin/com/veyq/app/features/keys/upsertunlockwrap/UnlockWrapHandler.kt
acceptanceCriteria:
  - id: uc.keys.remove-unlock-method.removes-selected-wrap
    statement: An authenticated user can remove a selected own unlock wrap, including one selected by credentialRef.
    coverage:
      backend:
        integration:
          - testName: removesOnlySelectedOwnUnlockWraps
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/app/features/keys/removeunlockwrap/RemoveUnlockWrapSliceTest.kt
  - id: uc.keys.remove-unlock-method.prevents-lockout
    statement: The final surviving unlock wrap cannot be removed.
    coverage:
      backend:
        integration:
          - testName: removesOnlySelectedOwnUnlockWraps
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/app/features/keys/removeunlockwrap/RemoveUnlockWrapSliceTest.kt
  - id: uc.keys.remove-unlock-method.rejects-invalid-targets
    statement: Invalid sessions and non-existing own wraps are rejected.
    coverage:
      backend:
        integration:
          - testName: removesOnlySelectedOwnUnlockWraps
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/app/features/keys/removeunlockwrap/RemoveUnlockWrapSliceTest.kt
