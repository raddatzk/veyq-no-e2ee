  - id: uc.keys.upsert-unlock-wrap.rejects-invalid-input
    statement: Invalid sessions, unknown suites and path/payload method mismatches are rejected.
    coverage:
      backend:
        integration:
          - testName: upsertsOnlyTheAuthenticatedUsersUnlockWrap
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/app/features/keys/upsertunlockwrap/UnlockWrapSliceTest.kt
