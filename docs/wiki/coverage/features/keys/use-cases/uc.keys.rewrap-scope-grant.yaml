id: uc.keys.rewrap-scope-grant
title: Rewrap a scope grant
status: implemented
documents:
  - type: feature
    ref: docs/wiki/features/keys/_index.md
  - type: useCase
    ref: docs/wiki/features/keys/use-cases/uc.keys.rewrap-scope-grant.md
  - type: crosscutting
    ref: docs/wiki/crosscutting/security-model.md
  - type: crosscutting
    ref: docs/wiki/crosscutting/account-key-model.md
  - type: api
    ref: docs/api/keys.openapi.yaml
  - type: entryPoint
    ref: backend/src/main/kotlin/com/veyq/app/features/keys/rewrapscopegrant/ScopeGrantRewrapHandler.kt
acceptanceCriteria:
  - id: uc.keys.rewrap-scope-grant.replace-own-ciphertext
    statement: A user who already has a grant for a scope can replace only their own wrapped grant ciphertext.
    coverage:
      backend:
        integration:
          - testName: rewrapsOnlyAnExistingOwnScopeGrant
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/app/features/keys/rewrapscopegrant/ScopeGrantRewrapSliceTest.kt
  - id: uc.keys.rewrap-scope-grant.no-access-creation
    statement: The endpoint rejects callers without an existing grant and cannot create new scope access.
    coverage:
      backend:
        integration:
          - testName: rewrapsOnlyAnExistingOwnScopeGrant
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/app/features/keys/rewrapscopegrant/ScopeGrantRewrapSliceTest.kt
  - id: uc.keys.rewrap-scope-grant.rejects-invalid-auth-or-suite
    statement: Invalid sessions and unknown crypto suites are rejected before storing replacement grants.
    coverage:
      backend:
        integration:
          - testName: rewrapsOnlyAnExistingOwnScopeGrant
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/app/features/keys/rewrapscopegrant/ScopeGrantRewrapSliceTest.kt
