acceptanceCriteria:
- id: uc.platform.web-views.routing
  statement: "Clean space paths build and parse round-trip — tenant (no prefix, host-resolved), personal (~me) and group (@slug) — and each space kind parses back out."
  gaps:
  - reason: Web coverage lived in the retired greenfield frontend; the consolidated client (former legacy/frontend) does not yet port a test for this criterion.
    followUp: Re-add coverage once the consolidated frontend ports a test for this use-case (test-coverage realignment after the legacy/frontend -> frontend promotion).
- id: uc.platform.web-views.read-cache
  statement: "The node read-cache serves a burst of reads from one fetch and drops cached entries on create/rename/delete and explicit invalidation."
  gaps:
  - reason: Web coverage lived in the retired greenfield frontend; the consolidated client (former legacy/frontend) does not yet port a test for this criterion.
    followUp: Re-add coverage once the consolidated frontend ports a test for this use-case (test-coverage realignment after the legacy/frontend -> frontend promotion).
- id: uc.platform.web-views.gallery-layout
  statement: "The gallery justifies every full row to the container width, preserves per-tile aspect (clamped), keeps a trailing widow at target height, and groups items into date buckets; empty inputs yield empty results."
  gaps:
  - reason: Web coverage lived in the retired greenfield frontend; the consolidated client (former legacy/frontend) does not yet port a test for this criterion.
    followUp: Re-add coverage once the consolidated frontend ports a test for this use-case (test-coverage realignment after the legacy/frontend -> frontend promotion).
- id: uc.platform.web-views.memory-views
  statement: "The home view renders the space switcher and memory/folder grids and navigates into folders; the Memory view renders the tabs, root gallery and journal (lazy, embed-aware, live-journal subscription) and navigates into chapters."
  gaps:
  - reason: Web coverage lived in the retired greenfield frontend; the consolidated client (former legacy/frontend) does not yet port a test for this criterion.
    followUp: Re-add coverage once the consolidated frontend ports a test for this use-case (test-coverage realignment after the legacy/frontend -> frontend promotion).
