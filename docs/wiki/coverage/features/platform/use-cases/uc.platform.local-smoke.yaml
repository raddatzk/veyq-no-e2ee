- id: uc.platform.local-smoke.seed-e2ee-data
  statement: "A dev-only smoke command creates a disposable account, signs in with the generated Secret Key, seeds encrypted Memory content through normal client/API paths, and writes a local browser-smoke seed file without direct database writes."
