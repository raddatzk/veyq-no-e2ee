id: uc.sharing.password-protect
title: Password-protect a share
status: implemented
documents:
- type: feature
  ref: docs/wiki/features/sharing/_index.md
- type: useCase
  ref: docs/wiki/features/sharing/use-cases/uc.sharing.password-protect.md
- type: crosscutting
  ref: docs/wiki/crosscutting/security-model.md
- type: entryPoint
  ref: backend/src/main/kotlin/com/veyq/app/features/memory/share/ShareHandler.kt
- type: entryPoint
  ref: frontend/src/features/memory/share/share.ts
acceptanceCriteria:
- id: uc.sharing.password-protect.gate
  statement: "A share's content key can be wrapped behind a passphrase (Argon2id over a server-stored salt) so the link alone cannot decrypt; the server stores only the salt."
  coverage:
    backend:
      integration:
      - testName: passwordExpiryAndLabel
        kind: positive
        ref: backend/src/test/kotlin/com/veyq/app/features/memory/share/ShareSliceTest.kt
    web:
      unit:
      - testName: "password-protected share wrap key (web-only by design)"
        kind: positive
        ref: frontend/src/shared/crypto/v1.conformance.test.ts
- id: uc.sharing.password-protect.wrong-passphrase
  statement: "Only the right passphrase re-derives the wrap key and opens the content key; a wrong or empty passphrase fails the client-side AEAD unwrap."
  gaps:
  - reason: Web coverage lived in the retired greenfield frontend; the consolidated client (former legacy/frontend) does not yet port a test for this criterion.
    followUp: Re-add coverage once the consolidated frontend ports a test for this use-case (test-coverage realignment after the legacy/frontend -> frontend promotion).
