id: uc.journal.live-coedit
title: Co-edit the journal live
status: implemented
documents:
  - type: feature
    ref: docs/wiki/features/journal/_index.md
  - type: useCase
    ref: docs/wiki/features/journal/use-cases/uc.journal.live-coedit.md
  - type: crosscutting
    ref: docs/wiki/crosscutting/live-collaboration.md
  - type: crosscutting
    ref: docs/wiki/crosscutting/security-model.md
  - type: entryPoint
    ref: backend/src/main/kotlin/com/veyq/app/features/memory/journallive/JournalRelay.kt
  - type: entryPoint
    ref: frontend/src/features/memory/journalLive/encryptedProvider.ts
acceptanceCriteria:
  - id: uc.journal.live-coedit.relay-converge
    statement: "Two clients editing at once converge through an operator-blind relay (CRDT), and an unauthorized relay token is rejected at connect."
    coverage:
      web:
        e2e:
          - testName: "two clients converge through the operator-blind relay; an unauthorized token is rejected"
            kind: positive
            ref: frontend/src/features/memory/journalLive/journalLive.e2e.test.ts
          - testName: "two clients converge through the operator-blind relay; an unauthorized token is rejected"
            kind: negative
            ref: frontend/src/features/memory/journalLive/journalLive.e2e.test.ts
      apple:
        e2e:
          - testName: testTwoProvidersConverge
            kind: positive
            ref: apple/Tests/VeyqCryptoTests/JournalLiveE2ETests.swift
      android:
        e2e:
          - testName: twoProvidersConverge
            kind: positive
            ref: android/core/src/test/kotlin/app/veyq/crypto/JournalLiveE2ETest.kt
