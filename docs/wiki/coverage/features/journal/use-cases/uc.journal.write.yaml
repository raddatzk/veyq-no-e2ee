id: uc.journal.write
title: Write the journal
status: implemented
documents:
- type: feature
  ref: docs/wiki/features/journal/_index.md
- type: useCase
  ref: docs/wiki/features/journal/use-cases/uc.journal.write.md
- type: crosscutting
  ref: docs/wiki/crosscutting/live-collaboration.md
- type: crosscutting
  ref: docs/wiki/crosscutting/security-model.md
- type: api
  ref: docs/api/memory.openapi.yaml
- type: entryPoint
  ref: backend/src/main/kotlin/com/veyq/app/features/memory/journal/JournalHandler.kt
- type: entryPoint
  ref: frontend/src/features/memory/journal/journal.ts
acceptanceCriteria:
- id: uc.journal.write.persist-roundtrip
  statement: "A journal is sealed under the content key and persisted as snapshot + increments with a Markdown projection; non-overlapping sessions reload and converge, and the operator only ever holds ciphertext."
  coverage:
    backend:
      integration:
      - testName: appendsUpdatesThenCompactsOperatorBlind
        kind: positive
        ref: backend/src/test/kotlin/com/veyq/app/features/memory/journal/JournalSliceTest.kt
    web:
      unit:
      - testName: "journal seal (per-message sub-key)"
        kind: positive
        ref: frontend/src/shared/crypto/v1.conformance.test.ts
    apple:
      e2e:
      - testName: testNonOverlappingSessionsConverge
        kind: positive
        ref: apple/Tests/VeyqCryptoTests/JournalPersistenceE2ETests.swift
    android:
      e2e:
      - testName: nonOverlappingSessionsConverge
        kind: positive
        ref: android/core/src/test/kotlin/app/veyq/crypto/JournalPersistenceE2ETest.kt
- id: uc.journal.write.validation
  statement: "A write is rejected when the node is not a Memory/chapter, the crypto suite is unknown, or the covered sequence is out of range."
  coverage:
    backend:
      integration:
      - testName: rejectsBadNodeSuiteAndSeq
        kind: negative
        ref: backend/src/test/kotlin/com/veyq/app/features/memory/journal/JournalSliceTest.kt
- id: uc.journal.write.safe-render
  statement: "The reader renders Markdown through an escape-first path: HTML is escaped and only http(s) links are clickable (no javascript: URLs)."
  gaps:
  - reason: Web coverage lived in the retired greenfield frontend; the consolidated client (former legacy/frontend) does not yet port a test for this criterion.
    followUp: Re-add coverage once the consolidated frontend ports a test for this use-case (test-coverage realignment after the legacy/frontend -> frontend promotion).
