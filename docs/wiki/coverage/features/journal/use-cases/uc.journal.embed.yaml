id: uc.journal.embed
title: Embed media, tracks, chapters & playlists
status: implemented
documents:
- type: feature
  ref: docs/wiki/features/journal/_index.md
- type: useCase
  ref: docs/wiki/features/journal/use-cases/uc.journal.embed.md
- type: crosscutting
  ref: docs/wiki/crosscutting/security-model.md
- type: entryPoint
  ref: frontend/src/features/memory/journal/journalEmbed.ts
acceptanceCriteria:
- id: uc.journal.embed.token-grammar
  statement: "Embed tokens parse and serialize round-trip with the dedupe/cap, first-id-only and empty-target rules, and text and embeds split in source order."
  coverage:
    web:
      unit:
      - testName: "parses a single media token with a label"
        kind: positive
        ref: frontend/src/features/memory/journal/journalEmbed.test.ts
      - testName: "parses comma-separated media ids (a carousel) without a label"
        kind: positive
        ref: frontend/src/features/memory/journal/journalEmbed.test.ts
      - testName: "keeps only the first id for a chapter"
        kind: positive
        ref: frontend/src/features/memory/journal/journalEmbed.test.ts
      - testName: "dedupes and caps track ids"
        kind: positive
        ref: frontend/src/features/memory/journal/journalEmbed.test.ts
      - testName: "parses two back-to-back tokens"
        kind: positive
        ref: frontend/src/features/memory/journal/journalEmbed.test.ts
      - testName: "ends a token at a newline"
        kind: positive
        ref: frontend/src/features/memory/journal/journalEmbed.test.ts
      - testName: "ignores an empty target"
        kind: negative
        ref: frontend/src/features/memory/journal/journalEmbed.test.ts
      - testName: "parses a playlist token and keeps only the first id"
        kind: positive
        ref: frontend/src/features/memory/journal/journalEmbed.test.ts
      - testName: "round-trips a labelled media embed"
        kind: positive
        ref: frontend/src/features/memory/journal/journalEmbed.test.ts
      - testName: "omits the suffix when there is no label"
        kind: positive
        ref: frontend/src/features/memory/journal/journalEmbed.test.ts
      - testName: "normalizes track ids on serialize"
        kind: positive
        ref: frontend/src/features/memory/journal/journalEmbed.test.ts
      - testName: "splits text and embeds in source order"
        kind: positive
        ref: frontend/src/features/memory/journal/journalEmbed.test.ts
      - testName: "returns a single markdown block when there are no embeds"
        kind: positive
        ref: frontend/src/features/memory/journal/journalEmbed.test.ts
      - testName: "handles an embed at the very start"
        kind: positive
        ref: frontend/src/features/memory/journal/journalEmbed.test.ts
      - testName: "dedupes, trims, drops empties, and caps at the max"
        kind: positive
        ref: frontend/src/features/memory/journal/journalEmbed.test.ts
    apple:
      unit:
      - testName: testParsesSingleMediaTokenWithLabel
