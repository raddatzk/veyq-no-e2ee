      - testName: parsesTwoBackToBackTokens
        kind: positive
        ref: android/core/src/test/kotlin/app/veyq/crypto/JournalEmbedTest.kt
      - testName: endsTokenAtNewline
        kind: positive
        ref: android/core/src/test/kotlin/app/veyq/crypto/JournalEmbedTest.kt
      - testName: ignoresEmptyTarget
