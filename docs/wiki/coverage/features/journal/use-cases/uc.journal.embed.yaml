- id: uc.journal.embed.render-blocks
  statement: "On read, embeds resolve to their blocks — a single photo or a carousel, a track block with stats, a chapter link — and an unresolved id degrades to a placeholder."
  gaps:
  - reason: Web coverage lived in the retired greenfield frontend; the consolidated client (former legacy/frontend) does not port a component test for this criterion.
    followUp: Add coverage once the consolidated frontend ports a test for this use-case.
- id: uc.journal.embed.atomic-chip
  statement: "In the live editor an embed renders as an atomic chip that deletes with a two-press Backspace gesture and disarms when the cursor moves."
  coverage:
    web:
      unit:
      - testName: "renders an atomic chip for an embed token"
        kind: positive
        ref: frontend/src/features/memory/journalLive/journalEmbedEditor.test.ts
      - testName: "takes two Backspace presses at the token end to delete the whole embed"
        kind: positive
        ref: frontend/src/features/memory/journalLive/journalEmbedEditor.test.ts
      - testName: "disarms a pending delete when the cursor moves"
        kind: positive
        ref: frontend/src/features/memory/journalLive/journalEmbedEditor.test.ts
- id: uc.journal.embed.picker
  statement: "The embed picker selects media/track/chapter ids with a caption/label, enforces single vs. multi selection, and offers Delete only while editing."
  gaps:
  - reason: Web coverage lived in the retired greenfield frontend; the consolidated client (former legacy/frontend) does not port a component test for this criterion.
    followUp: Add coverage once the consolidated frontend ports a test for this use-case.
