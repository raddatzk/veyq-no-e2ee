id: uc.journal.embed
title: Embed media, tracks, chapters & playlists
status: implemented
documents:
- type: feature
  ref: docs/wiki/features/journal/_index.md
- type: useCase
  ref: docs/wiki/features/journal/use-cases/uc.journal.embed.md
- type: crosscutting
  ref: docs/wiki/crosscutting/security-model.md
- type: entryPoint
  ref: frontend/src/features/memory/journal/journalEmbed.ts
acceptanceCriteria:
- id: uc.journal.embed.token-grammar
  statement: "Embed tokens parse and serialize round-trip with the dedupe/cap, first-id-only and empty-target rules, and text and embeds split in source order."
  coverage:
    apple:
      unit:
      - testName: testParsesSingleMediaTokenWithLabel
        kind: positive
        ref: apple/Tests/VeyqCryptoTests/JournalEmbedTests.swift
      - testName: testParsesCommaSeparatedMediaIdsWithoutLabel
        kind: positive
        ref: apple/Tests/VeyqCryptoTests/JournalEmbedTests.swift
      - testName: testKeepsOnlyFirstIdForChapter
        kind: positive
        ref: apple/Tests/VeyqCryptoTests/JournalEmbedTests.swift
      - testName: testKeepsOnlyFirstIdForPlaylist
        kind: positive
        ref: apple/Tests/VeyqCryptoTests/JournalEmbedTests.swift
      - testName: testDedupesAndCapsTrackIds
        kind: positive
        ref: apple/Tests/VeyqCryptoTests/JournalEmbedTests.swift
      - testName: testParsesTwoBackToBackTokens
        kind: positive
        ref: apple/Tests/VeyqCryptoTests/JournalEmbedTests.swift
      - testName: testEndsTokenAtNewline
        kind: positive
        ref: apple/Tests/VeyqCryptoTests/JournalEmbedTests.swift
      - testName: testIgnoresEmptyTarget
        kind: negative
        ref: apple/Tests/VeyqCryptoTests/JournalEmbedTests.swift
      - testName: testSplitsTextAndEmbedsInSourceOrder
        kind: positive
        ref: apple/Tests/VeyqCryptoTests/JournalEmbedTests.swift
      - testName: testReturnsSingleMarkdownBlockWhenNoEmbeds
        kind: positive
        ref: apple/Tests/VeyqCryptoTests/JournalEmbedTests.swift
      - testName: testHandlesEmbedAtTheVeryStart
        kind: positive
        ref: apple/Tests/VeyqCryptoTests/JournalEmbedTests.swift
      - testName: testRoundTripsLabelledMediaEmbed
        kind: positive
        ref: apple/Tests/VeyqCryptoTests/JournalEmbedTests.swift
      - testName: testOmitsSuffixWhenThereIsNoLabel
        kind: positive
        ref: apple/Tests/VeyqCryptoTests/JournalEmbedTests.swift
      - testName: testNormalizesTrackIdsOnSerialize
        kind: positive
        ref: apple/Tests/VeyqCryptoTests/JournalEmbedTests.swift
      - testName: testDedupesTrimsDropsEmptiesAndCaps
