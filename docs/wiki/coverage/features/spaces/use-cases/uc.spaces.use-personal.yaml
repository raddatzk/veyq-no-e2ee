acceptanceCriteria:
  - id: uc.spaces.use-personal.self-owned-scope
    statement: Account creation creates a self-owned personal scope and stores only the posted wrapped self-grant.
    coverage:
      backend:
        integration:
          - testName: coldRegistrationFlow
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/app/features/admin/setupserver/SetupServerSliceTest.kt
          - testName: registersNewOwnerAndActivatesTenant
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/app/features/account/registerviainvitation/RegisterViaInvitationSliceTest.kt
  - id: uc.spaces.use-personal.fetches-owner-grant
    statement: An authenticated user can fetch and locally open their own personal scope grant.
    coverage:
      backend:
        integration:
          - testName: loginUnlockAndSession
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/app/features/account/login/LoginSliceTest.kt
          - testName: registersNewOwnerAndActivatesTenant
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/app/features/account/registerviainvitation/RegisterViaInvitationSliceTest.kt
      web:
        e2e:
          - testName: registers, logs in, and unlocks the identity key matching the stored public key
            kind: positive
            ref: frontend/src/features/account/login/login.e2e.test.ts
          - testName: registers a new owner from an invite, then logs in and round-trips the scope grant
            kind: positive
            ref: frontend/src/features/account/registerViaInvitation/registerViaInvitation.e2e.test.ts
      android:
        e2e:
          - testName: loginAndUnlock
            kind: positive
            ref: android/core/src/test/kotlin/app/veyq/crypto/LoginE2ETest.kt
          - testName: registerNewOwnerThenLoginAndGrant
            kind: positive
            ref: android/core/src/test/kotlin/app/veyq/crypto/RegisterViaInvitationE2ETest.kt
      apple:
        e2e:
          - testName: testLoginAndUnlock
            kind: positive
            ref: apple/Tests/VeyqCryptoTests/LoginE2ETests.swift
          - testName: testRegisterNewOwnerThenLoginAndGrant
            kind: positive
            ref: apple/Tests/VeyqCryptoTests/RegisterViaInvitationE2ETests.swift
  - id: uc.spaces.use-personal.rejects-invalid-session
    statement: A missing or invalid session cannot fetch a personal scope grant.
    coverage:
      backend:
        integration:
          - testName: loginUnlockAndSession
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/app/features/account/login/LoginSliceTest.kt
  - id: uc.spaces.use-personal.encrypted-content
    statement: A personal-scope key-holder can provision the scope content key once, store encrypted items and read ciphertext back for local decryption; non-key-holders are rejected.
    coverage:
      backend:
        integration:
          - testName: storesAndServesEncryptedContentForKeyHoldersOnly
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/app/features/content/scopecontent/ScopeContentSliceTest.kt
          - testName: storesAndServesEncryptedContentForKeyHoldersOnly
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/app/features/content/scopecontent/ScopeContentSliceTest.kt
      web:
        e2e:
          - testName: "writes and reads encrypted content under the personal scope; the server stays blind"
            kind: positive
            ref: frontend/src/features/content/scopeContent.e2e.test.ts
      android:
        e2e:
          - testName: writeAndReadEncryptedContentUnderPersonalScope
            kind: positive
            ref: android/core/src/test/kotlin/app/veyq/crypto/ScopeContentE2ETest.kt
      apple:
        e2e:
          - testName: testWriteAndReadEncryptedContentUnderPersonalScope
            kind: positive
            ref: apple/Tests/VeyqCryptoTests/ScopeContentE2ETests.swift
