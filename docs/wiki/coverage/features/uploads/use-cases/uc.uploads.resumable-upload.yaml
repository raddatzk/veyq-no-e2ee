id: uc.uploads.resumable-upload
title: Resume an interrupted upload
status: partial
documents:
  - type: feature
    ref: docs/wiki/features/uploads/_index.md
  - type: useCase
    ref: docs/wiki/features/uploads/use-cases/uc.uploads.resumable-upload.md
  - type: crosscutting
    ref: docs/wiki/crosscutting/security-model.md
  - type: api
    ref: docs/api/uploads.openapi.yaml
  - type: entryPoint
    ref: backend/src/main/kotlin/com/veyq/app/features/uploads/resumableupload/ResumableUploadHandler.kt
  - type: entryPoint
    ref: backend/src/main/kotlin/com/veyq/app/shared/storage/BlobStore.kt
  - type: entryPoint
    ref: frontend/src/features/uploads/resumableUpload/resumableUpload.ts
  - type: entryPoint
    ref: android/src/main/kotlin/app/veyq/crypto/ResumableUpload.kt
  - type: entryPoint
    ref: apple/Sources/VeyqCrypto/ResumableUpload.swift
notes: >
  Core slice: chunked-AEAD frames (v1.sealFrame, AAD binds index+total) uploaded resumably; ciphertext frames
  live in a BlobStore (filesystem impl now; S3/MinIO and per-tenant buckets drop in behind the interface),
  the DB holds only session + chunk manifest. Bytes flow through the app server (no presigned URLs yet).
  Gallery integration of chunked media, transcode/streaming derivatives and presigned direct-to-store upload
  are later slices.
acceptanceCriteria:
  - id: uc.uploads.resumable-upload.frame-conformance
    statement: All three crypto cores produce byte-identical chunked-AEAD frames; a frame fails to open at the wrong index (AAD binds the position).
    coverage:
      backend:
        integration:
          - testName: chunked-AEAD frame (resumable upload / streaming)
            kind: positive
            ref: frontend/src/shared/crypto/v1.conformance.test.ts
  - id: uc.uploads.resumable-upload.resume-and-finalize
    statement: A chunked upload survives interruption — the client asks which chunks landed, re-sends only the missing ones, finalizes only when complete, and the media downloads byte-identical; media uploads target a Memory/Chapter only.
    coverage:
      backend:
        integration:
          - testName: resumesAChunkedUploadAndFinalizes
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/app/features/uploads/resumableupload/ResumableUploadSliceTest.kt
          - testName: resumesAChunkedUploadAndFinalizes
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/app/features/uploads/resumableupload/ResumableUploadSliceTest.kt
      web:
        e2e:
          - testName: "uploads some chunks, resumes the rest, finalizes, and downloads byte-identical"
            kind: positive
            ref: frontend/src/features/uploads/resumableUpload/resumableUpload.e2e.test.ts
      android:
        e2e:
          - testName: interruptAndResumeAChunkedUpload
            kind: positive
            ref: android/src/test/kotlin/app/veyq/crypto/ResumableUploadE2ETest.kt
      apple:
        e2e:
          - testName: testInterruptAndResumeAChunkedUpload
            kind: positive
            ref: apple/Tests/VeyqCryptoTests/ResumableUploadE2ETests.swift
  - id: uc.uploads.resumable-upload.abandoned-gc
    statement: A scheduled sweep reclaims abandoned OPEN upload sessions older than the TTL (their frames + manifest rows); fresh OPEN and COMPLETED sessions survive.
    coverage:
      backend:
        integration:
          - testName: purgesOnlyAbandonedOpenUploads
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/app/features/uploads/resumableupload/UploadGcSliceTest.kt
  - id: uc.uploads.resumable-upload.resource-limits
    statement: The server rejects excessive chunk counts, declared sizes, decoded frame sizes and cumulative frame data before expensive memory or BlobStore work.
    coverage:
      backend:
        integration:
          - testName: rejectsOversizedResumableUploadsBeforeHeavyWork
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/app/features/uploads/resumableupload/ResumableUploadSliceTest.kt
