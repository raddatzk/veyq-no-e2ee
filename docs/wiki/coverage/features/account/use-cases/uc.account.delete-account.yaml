id: uc.account.delete-account
title: Delete account
status: partial
documents:
- type: feature
  ref: docs/wiki/features/account/_index.md
- type: useCase
  ref: docs/wiki/features/account/use-cases/uc.account.delete-account.md
- type: crosscutting
  ref: docs/wiki/crosscutting/security-model.md
- type: api
  ref: docs/api/account.openapi.yaml
- type: entryPoint
  ref: backend/src/main/kotlin/com/veyq/app/features/account/login/LoginHandler.kt
- type: entryPoint
  ref: frontend/src/features/account/login/login.ts
acceptanceCriteria:
- id: uc.account.delete-account.crypto-erases-account
  statement: Account deletion requires password re-authentication, removes key material and sessions, purges personal scopes, and anonymizes the profile.
  gaps:
  - reason: The account API and handler implement self-service account deletion, but no active acceptance test maps to DELETE /api/me.
    followUp: Add backend integration coverage for successful deletion and post-delete session rejection.
- id: uc.account.delete-account.rejects-invalid-proof
  statement: Invalid sessions or wrong passwords do not delete the account.
  gaps:
  - reason: Authorization and password checks are implemented but lack direct endpoint coverage.
    followUp: Add backend integration coverage for invalid bearer token and wrong password.
- id: uc.account.delete-account.blocks-last-server-owner
  statement: The last Server Owner cannot delete their account.
  gaps:
  - reason: The LAST_SERVER_OWNER conflict exists in LoginHandler.deleteAccount but is not directly tested.
    followUp: Add backend integration coverage for the final Server Owner conflict.
