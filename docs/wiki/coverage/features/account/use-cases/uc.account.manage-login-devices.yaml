acceptanceCriteria:
- id: uc.account.manage-login-devices.list
  statement: The authenticated user can list active login devices grouped by deviceRef with encrypted names and last login timestamps.
  gaps:
  - reason: Login device listing is implemented in LoginDeviceResource but lacks direct acceptance coverage.
    followUp: Add backend integration coverage for grouped devices and invalid session rejection.
- id: uc.account.manage-login-devices.rename
  statement: The authenticated user can replace one device's encrypted display name.
  gaps:
  - reason: Rename support exists in backend and web helpers, but no mapped test covers encrypted-name validation or persistence.
    followUp: Add backend integration coverage for rename success, blank encryptedName and invalid session.
- id: uc.account.manage-login-devices.remove
  statement: The authenticated user can invalidate all sessions for one login-device identifier.
  gaps:
  - reason: Device session invalidation is implemented but not mapped to a direct account-device acceptance test.
    followUp: Add backend integration coverage proving sessions for the selected deviceRef stop resolving.
