acceptanceCriteria:
- id: uc.account.change-password.replaces-password-wrap
  statement: A valid current password plus a PASSWORD master-key wrap replaces the stored PASSWORD wrap and auth verifier.
  gaps:
  - reason: The handler implements this flow, but no active backend slice test maps to /api/me/password.
    followUp: Add integration coverage proving the PASSWORD wrap and verifier are replaced.
- id: uc.account.change-password.invalidates-sessions
  statement: A successful password change invalidates all existing sessions and clears the refresh cookie.
  gaps:
  - reason: Session invalidation is implemented in LoginHandler.changePassword, but the behavior is not covered by an acceptance test.
    followUp: Add integration coverage that an old access token fails after password change.
- id: uc.account.change-password.rejects-invalid-proof-or-wrap
  statement: Wrong current password, missing session and non-PASSWORD wraps are rejected.
  gaps:
  - reason: Negative branches exist in the handler but are not directly covered for this endpoint.
    followUp: Add backend integration coverage for wrong password, invalid session and EXPECTED_PASSWORD_WRAP.
