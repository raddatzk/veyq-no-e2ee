id: uc.account.register-via-invitation
title: Register via an invitation
status: implemented
documents:
  - type: feature
    ref: docs/wiki/features/account/_index.md
  - type: feature
    ref: docs/wiki/features/spaces/_index.md
  - type: useCase
    ref: docs/wiki/features/account/use-cases/uc.account.register-via-invitation.md
  - type: crosscutting
    ref: docs/wiki/crosscutting/security-model.md
  - type: crosscutting
    ref: docs/wiki/crosscutting/account-key-model.md
  - type: decision
    ref: docs/wiki/decisions/README.md
  - type: api
    ref: docs/api/tenants.openapi.yaml
  - type: entryPoint
    ref: backend/src/main/kotlin/com/veyq/app/features/account/registerviainvitation/RegisterViaInvitationHandler.kt
  - type: entryPoint
    ref: frontend/src/features/account/registerViaInvitation/registerViaInvitation.ts
  - type: entryPoint
    ref: android/core/src/main/kotlin/app/veyq/crypto/RegisterViaInvitation.kt
  - type: entryPoint
    ref: apple/Sources/VeyqCrypto/RegisterViaInvitation.swift
acceptanceCriteria:
  - id: uc.account.register-via-invitation.new-owner
    statement: A brand-new invitee can create a cryptographic account, claim the tenant and receive a session in one step.
    coverage:
      backend:
        integration:
          - testName: registersNewOwnerAndActivatesTenant
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/app/features/account/registerviainvitation/RegisterViaInvitationSliceTest.kt
      web:
        e2e:
          - testName: registers a new owner from an invite, then logs in and round-trips the scope grant
            kind: positive
            ref: frontend/src/features/account/registerViaInvitation/registerViaInvitation.e2e.test.ts
        unit:
          - testName: lets new users join with a passkey by default
            kind: positive
            ref: frontend/src/views/TenantJoinView.test.ts
      android:
        e2e:
          - testName: registerNewOwnerThenLoginAndGrant
            kind: positive
            ref: android/core/src/test/kotlin/app/veyq/crypto/RegisterViaInvitationE2ETest.kt
      apple:
        e2e:
          - testName: testRegisterNewOwnerThenLoginAndGrant
            kind: positive
            ref: apple/Tests/VeyqCryptoTests/RegisterViaInvitationE2ETests.swift
  - id: uc.account.register-via-invitation.public-metadata
    statement: Invite metadata is fetchable without exposing the bootstrap secret.
    coverage:
      web:
        e2e:
          - testName: registers a new owner from an invite, then logs in and round-trips the scope grant
            kind: positive
            ref: frontend/src/features/account/registerViaInvitation/registerViaInvitation.e2e.test.ts
        unit:
          - testName: renders the translated email label on tenant registration links
            kind: positive
            ref: frontend/src/views/TenantJoinView.test.ts
          - testName: exposes language and theme controls on tenant registration links
            kind: positive
            ref: frontend/src/views/TenantJoinView.test.ts
          - testName: still reads tokens from legacy tenant registration paths
            kind: positive
            ref: frontend/src/views/TenantJoinView.test.ts
      android:
        e2e:
          - testName: registerNewOwnerThenLoginAndGrant
            kind: positive
            ref: android/core/src/test/kotlin/app/veyq/crypto/RegisterViaInvitationE2ETest.kt
      apple:
        e2e:
          - testName: testRegisterNewOwnerThenLoginAndGrant
            kind: positive
            ref: apple/Tests/VeyqCryptoTests/RegisterViaInvitationE2ETests.swift
  - id: uc.account.register-via-invitation.blind-self-grant
    statement: The tenant scope is born client-side and the server stores only the posted ciphertext self-grant.
    coverage:
      backend:
        integration:
          - testName: registersNewOwnerAndActivatesTenant
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/app/features/account/registerviainvitation/RegisterViaInvitationSliceTest.kt
      web:
        e2e:
          - testName: registers a new owner from an invite, then logs in and round-trips the scope grant
            kind: positive
            ref: frontend/src/features/account/registerViaInvitation/registerViaInvitation.e2e.test.ts
      android:
        e2e:
          - testName: registerNewOwnerThenLoginAndGrant
            kind: positive
            ref: android/core/src/test/kotlin/app/veyq/crypto/RegisterViaInvitationE2ETest.kt
      apple:
        e2e:
          - testName: testRegisterNewOwnerThenLoginAndGrant
            kind: positive
            ref: apple/Tests/VeyqCryptoTests/RegisterViaInvitationE2ETests.swift
  - id: uc.account.register-via-invitation.rejection-paths
    statement: Wrong bootstrap secrets, consumed invites and duplicate email registration are rejected without silently consuming valid invites.
    coverage:
      backend:
        integration:
          - testName: registersNewOwnerAndActivatesTenant
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/app/features/account/registerviainvitation/RegisterViaInvitationSliceTest.kt
          - testName: rejectsDuplicateEmail
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/app/features/account/registerviainvitation/RegisterViaInvitationSliceTest.kt
