id: uc.account.recover-keys
title: Recover keys
status: implemented
documents:
- type: feature
  ref: docs/wiki/features/account/_index.md
- type: useCase
  ref: docs/wiki/features/account/use-cases/uc.account.recover-keys.md
- type: crosscutting
  ref: docs/wiki/crosscutting/account-key-model.md
- type: crosscutting
  ref: docs/wiki/crosscutting/security-model.md
acceptanceCriteria:
- id: uc.account.recover-keys.emergency-kit
  statement: "The emergency kit round-trips through a machine-readable payload, is found embedded in surrounding text (e.g. PDF), parses byte-compatibly across web and native, and rejects malformed tokens."
  coverage:
    apple:
      unit:
      - testName: testRoundTrip
        kind: positive
        ref: apple/Tests/VeyqCryptoTests/EmergencyKitTests.swift
      - testName: testFindsPayloadEmbeddedInText
        kind: positive
        ref: apple/Tests/VeyqCryptoTests/EmergencyKitTests.swift
      - testName: testParsesWebProducedToken
        kind: positive
        ref: apple/Tests/VeyqCryptoTests/EmergencyKitTests.swift
      - testName: testRejectsGarbage
        kind: negative
        ref: apple/Tests/VeyqCryptoTests/EmergencyKitTests.swift
    android:
      unit:
      - testName: roundTrips
        kind: positive
        ref: android/core/src/test/kotlin/app/veyq/crypto/EmergencyKitTest.kt
      - testName: findsPayloadEmbeddedInText
        kind: positive
        ref: android/core/src/test/kotlin/app/veyq/crypto/EmergencyKitTest.kt
      - testName: parsesWebProducedToken
        kind: positive
        ref: android/core/src/test/kotlin/app/veyq/crypto/EmergencyKitTest.kt
      - testName: rejectsGarbage
        kind: negative
        ref: android/core/src/test/kotlin/app/veyq/crypto/EmergencyKitTest.kt
- id: uc.account.recover-keys.password-reset
  statement: "Registration produces a RECOVERY wrap openable by the Secret Key alone (yielding the same master key, excluded from the login key bag); a reset via email token re-wraps under a new password and invalidates sessions, and is rejected without a Secret-Key proof, on an invalid token, or silently for unknown/no-recovery accounts."
  coverage:
    backend:
      integration:
      - testName: resetsPasswordViaEmailTokenAndInvalidatesSessions
        kind: positive
        ref: backend/src/test/kotlin/com/veyq/app/features/account/resetpassword/PasswordResetSliceTest.kt
      - testName: rejectsConfirmWithoutSecretKeyProof
        kind: negative
        ref: backend/src/test/kotlin/com/veyq/app/features/account/resetpassword/PasswordResetSliceTest.kt
      - testName: silentForUnknownEmailAndAccountsWithoutRecovery
        kind: negative
        ref: backend/src/test/kotlin/com/veyq/app/features/account/resetpassword/PasswordResetSliceTest.kt
      - testName: rejectsInvalidToken
        kind: negative
        ref: backend/src/test/kotlin/com/veyq/app/features/account/resetpassword/PasswordResetSliceTest.kt
    web:
      unit:
      - testName: "recovery commitment (password reset)"
        kind: positive
        ref: frontend/src/shared/crypto/v1.conformance.test.ts
    apple:
      unit:
      - testName: testRecoveryWrapRoundTrips
        kind: positive
        ref: apple/Tests/VeyqCryptoTests/ResetPasswordTests.swift
      e2e:
      - testName: testRecoveryWrapNotInLoginKeyBag
        kind: positive
        ref: apple/Tests/VeyqCryptoTests/ResetPasswordE2ETests.swift
    android:
      unit:
      - testName: recoveryWrapRoundTrips
        kind: positive
        ref: android/core/src/test/kotlin/app/veyq/crypto/ResetPasswordTest.kt
      e2e:
      - testName: recoveryWrapNotInLoginKeyBag
        kind: positive
        ref: android/core/src/test/kotlin/app/veyq/crypto/ResetPasswordE2ETest.kt
- id: uc.account.recover-keys.remembered-login
  statement: "When the user chooses to remember the login, email, password and Secret Key are stored locally and can be cleared together with legacy device-unlock state."
  gaps:
  - reason: Web coverage lived in the retired greenfield frontend; the consolidated client (former legacy/frontend) does not yet port a test for this criterion.
    followUp: Re-add coverage once the consolidated frontend ports a test for this use-case (test-coverage realignment after the legacy/frontend -> frontend promotion).
- id: uc.account.recover-keys.password-strength
  statement: "A new password is checked for breach exposure (HIBP k-anonymity) and against the length policy before it is accepted."
  coverage:
    apple:
      unit:
      - testName: testSha1HexUpperKnownVector
        kind: positive
        ref: apple/Tests/VeyqCryptoTests/PwnedTests.swift
      - testName: testBreachCountParsesMatchingSuffix
        kind: positive
        ref: apple/Tests/VeyqCryptoTests/PwnedTests.swift
      - testName: testBreachCountZeroWhenAbsent
        kind: negative
        ref: apple/Tests/VeyqCryptoTests/PwnedTests.swift
      - testName: testMinimumLengthIs10
        kind: positive
        ref: apple/Tests/VeyqCryptoTests/PasswordPolicyTests.swift
      - testName: testTooShortOnlyFlagsNonEmptyBelowMinimum
        kind: positive
        ref: apple/Tests/VeyqCryptoTests/PasswordPolicyTests.swift
      - testName: testHintKeyFollowsLengthTiers
        kind: positive
        ref: apple/Tests/VeyqCryptoTests/PasswordPolicyTests.swift
    android:
      unit:
      - testName: sha1HexUpperKnownVector
        kind: positive
        ref: android/core/src/test/kotlin/app/veyq/crypto/PwnedTest.kt
      - testName: breachCountParsesMatchingSuffix
        kind: positive
        ref: android/core/src/test/kotlin/app/veyq/crypto/PwnedTest.kt
      - testName: breachCountZeroWhenAbsent
        kind: negative
        ref: android/core/src/test/kotlin/app/veyq/crypto/PwnedTest.kt
      - testName: minimumLengthIs10
        kind: positive
        ref: android/core/src/test/kotlin/app/veyq/crypto/PasswordPolicyTest.kt
      - testName: tooShortOnlyFlagsNonEmptyBelowMinimum
        kind: positive
        ref: android/core/src/test/kotlin/app/veyq/crypto/PasswordPolicyTest.kt
      - testName: hintKeyFollowsLengthTiers
        kind: positive
        ref: android/core/src/test/kotlin/app/veyq/crypto/PasswordPolicyTest.kt
