id: uc.account.change-email
title: Change account email
status: implemented
documents:
- type: feature
  ref: docs/wiki/features/account/_index.md
- type: useCase
  ref: docs/wiki/features/account/use-cases/uc.account.change-email.md
- type: crosscutting
  ref: docs/wiki/crosscutting/security-model.md
- type: api
  ref: docs/api/auth.openapi.yaml
- type: entryPoint
  ref: backend/src/main/kotlin/com/veyq/app/features/account/emailchange/EmailChangeHandler.kt
- type: entryPoint
  ref: backend/src/main/kotlin/com/veyq/app/features/account/emailchange/EmailChangeResource.kt
acceptanceCriteria:
- id: uc.account.change-email.confirm-swaps-email
  statement: An authenticated request emails a single-use token to the new address; confirming it swaps the account email and the same session reports the new address.
  coverage:
    backend:
      integration:
      - testName: changesEmailViaTokenToNewAddress
        kind: positive
        ref: backend/src/test/kotlin/com/veyq/app/features/account/emailchange/EmailChangeSliceTest.kt
- id: uc.account.change-email.rejects-taken-address
  statement: A change to an address already in use is rejected and no confirmation email is sent.
  coverage:
    backend:
      integration:
      - testName: rejectsChangeToTakenEmail
        kind: negative
        ref: backend/src/test/kotlin/com/veyq/app/features/account/emailchange/EmailChangeSliceTest.kt
- id: uc.account.change-email.rejects-invalid-token
  statement: Confirming with an invalid, expired or already-used token is rejected.
  coverage:
    backend:
      integration:
      - testName: rejectsConfirmWithInvalidToken
        kind: negative
        ref: backend/src/test/kotlin/com/veyq/app/features/account/emailchange/EmailChangeSliceTest.kt
- id: uc.account.change-email.requires-session
  statement: Requesting an email change without a valid session is rejected.
  coverage:
    backend:
      integration:
      - testName: rejectsRequestWithoutValidSession
        kind: negative
        ref: backend/src/test/kotlin/com/veyq/app/features/account/emailchange/EmailChangeSliceTest.kt
