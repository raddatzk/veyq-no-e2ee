id: uc.account.login
title: Log in and unlock
status: implemented
documents:
- type: feature
  ref: docs/wiki/features/account/_index.md
- type: useCase
  ref: docs/wiki/features/account/use-cases/uc.account.login.md
- type: crosscutting
  ref: docs/wiki/crosscutting/security-model.md
- type: crosscutting
  ref: docs/wiki/crosscutting/platform-concepts.md
- type: api
  ref: docs/api/auth.openapi.yaml
- type: entryPoint
  ref: backend/src/main/kotlin/com/veyq/app/features/account/login/LoginHandler.kt
- type: entryPoint
  ref: frontend/src/features/account/login/login.ts
- type: entryPoint
  ref: frontend/src/App.vue
- type: entryPoint
  ref: frontend/src/features/account/rememberedLogin/rememberedLogin.ts
- type: entryPoint
  ref: android/core/src/main/kotlin/app/veyq/crypto/Login.kt
- type: entryPoint
  ref: apple/Sources/VeyqCrypto/Login.swift
acceptanceCriteria:
- id: uc.account.login.keybag-session
  statement: Password login returns a session and the wrapped key bag needed for client-side unlock.
  coverage:
    backend:
      integration:
      - testName: loginUnlockAndSession
        kind: positive
        ref: backend/src/test/kotlin/com/veyq/app/features/account/login/LoginSliceTest.kt
    web:
      e2e:
      - testName: registers, logs in, and unlocks the identity key matching the stored public key
        kind: positive
        ref: frontend/src/features/account/login/login.e2e.test.ts
    android:
      e2e:
      - testName: loginAndUnlock
        kind: positive
        ref: android/core/src/test/kotlin/app/veyq/crypto/LoginE2ETest.kt
    apple:
      e2e:
      - testName: testLoginAndUnlock
        kind: positive
        ref: apple/Tests/VeyqCryptoTests/LoginE2ETests.swift
- id: uc.account.login.rejects-invalid-credentials
  statement: Wrong passwords and bogus sessions are rejected.
  coverage:
    backend:
      integration:
      - testName: loginUnlockAndSession
        kind: negative
        ref: backend/src/test/kotlin/com/veyq/app/features/account/login/LoginSliceTest.kt
- id: uc.account.login.session-hygiene
  statement: Expired sessions are swept without dropping still-valid sessions.
  coverage:
    backend:
      integration:
      - testName: purgeExpiredDropsOnlyExpiredRows
        kind: positive
        ref: backend/src/test/kotlin/com/veyq/app/shared/security/SessionGcTest.kt
- id: uc.account.login.remembered-login-boot
  statement: A remembered login is used during app boot after reload so the user lands directly in the app.
  gaps:
  - reason: Web coverage lived in the retired greenfield frontend; the consolidated client (former legacy/frontend) does not port a component test for this criterion.
    followUp: Add coverage once the consolidated frontend ports a test for this use-case.
