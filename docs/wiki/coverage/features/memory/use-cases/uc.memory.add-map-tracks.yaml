id: uc.memory.add-map-tracks
title: Add map tracks
status: implemented
documents:
- type: feature
  ref: docs/wiki/features/memory/_index.md
- type: useCase
  ref: docs/wiki/features/memory/use-cases/uc.memory.add-map-tracks.md
- type: crosscutting
  ref: docs/wiki/crosscutting/security-model.md
- type: api
  ref: docs/api/memory.openapi.yaml
acceptanceCriteria:
- id: uc.memory.add-map-tracks.seal-list-remove
  statement: "A GPX route is sealed under the content key, listed on the Memory, and can be removed; the operator only holds ciphertext."
  coverage:
    backend:
      integration:
      - testName: addsListsAndRemovesTracks
        kind: positive
        ref: backend/src/test/kotlin/com/veyq/app/features/memory/track/TrackSliceTest.kt
- id: uc.memory.add-map-tracks.gpx-parse
  statement: "The client parses a GPX file into a named track with points and optional elevation/time, falling back to route points, and rejects malformed or empty tracks."
  coverage:
    apple:
      unit:
      - testName: testExtractsTrackNamePointsAndOptionalEleTime
        kind: positive
        ref: apple/Tests/VeyqCryptoTests/GpxTests.swift
      - testName: testFallsBackToRoutePointsAndGenericName
        kind: positive
        ref: apple/Tests/VeyqCryptoTests/GpxTests.swift
      - testName: testReturnsNilOnMalformedOrEmpty
        kind: negative
        ref: apple/Tests/VeyqCryptoTests/GpxTests.swift
    android:
      unit:
      - testName: extractsTrackNamePointsAndOptionalEleTime
        kind: positive
        ref: android/core/src/test/kotlin/app/veyq/crypto/GpxTest.kt
      - testName: fallsBackToRoutePointsAndGenericName
        kind: positive
        ref: android/core/src/test/kotlin/app/veyq/crypto/GpxTest.kt
      - testName: returnsNullOnMalformedOrEmpty
        kind: negative
        ref: android/core/src/test/kotlin/app/veyq/crypto/GpxTest.kt
- id: uc.memory.add-map-tracks.stats
  statement: "Track stats (distance, ascent/descent, duration) are derived from the points and formatted for display."
  coverage:
    apple:
      unit:
      - testName: testComputesDistanceWithoutEleOrTime
        kind: positive
        ref: apple/Tests/VeyqCryptoTests/TrackStatsTests.swift
      - testName: testSumsAscentAndDescentWithElevations
        kind: positive
        ref: apple/Tests/VeyqCryptoTests/TrackStatsTests.swift
      - testName: testDerivesDurationFromFirstAndLastTimestamp
        kind: positive
        ref: apple/Tests/VeyqCryptoTests/TrackStatsTests.swift
      - testName: testFormatsDistanceDurationAndElevation
        kind: positive
        ref: apple/Tests/VeyqCryptoTests/TrackStatsTests.swift
    android:
      unit:
      - testName: computesDistanceWithoutEleOrTime
        kind: positive
        ref: android/core/src/test/kotlin/app/veyq/crypto/TrackStatsTest.kt
      - testName: sumsAscentAndDescentWithElevations
        kind: positive
        ref: android/core/src/test/kotlin/app/veyq/crypto/TrackStatsTest.kt
      - testName: derivesDurationFromFirstAndLastTimestamp
        kind: positive
        ref: android/core/src/test/kotlin/app/veyq/crypto/TrackStatsTest.kt
      - testName: formatsDistanceDurationAndElevation
        kind: positive
        ref: android/core/src/test/kotlin/app/veyq/crypto/TrackStatsTest.kt
