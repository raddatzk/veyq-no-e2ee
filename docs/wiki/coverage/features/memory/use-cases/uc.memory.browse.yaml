id: uc.memory.browse
title: Browse a Memory
status: partial
documents:
  - type: feature
    ref: docs/wiki/features/memory/_index.md
  - type: useCase
    ref: docs/wiki/features/memory/use-cases/uc.memory.browse.md
  - type: crosscutting
    ref: docs/wiki/crosscutting/space-navigation.md
  - type: api
    ref: docs/api/memory.openapi.yaml
  - type: entryPoint
    ref: backend/src/main/kotlin/com/veyq/app/features/memory/createtree/MemoryTreeHandler.kt
  - type: entryPoint
    ref: frontend/src/features/memory/browse/browse.ts
  - type: entryPoint
    ref: android/core/src/main/kotlin/app/veyq/crypto/Browse.kt
  - type: entryPoint
    ref: apple/Sources/VeyqCrypto/Browse.swift
notes: >
  Library/orchestration layer only: tree navigation + clean-slug-path resolution. The Memory view itself
  (gallery, map, lightbox, buckets, journal) depends on media uploads + UI and is out of scope here.
acceptanceCriteria:
  - id: uc.memory.browse.level-listing
    statement: The client can list one level of the tree at a time (root children, or a node's direct children), scoped so a foreign parent id cannot leak nodes.
    coverage:
      backend:
        integration:
          - testName: buildsTreeWithContainmentAndSlugInvariants
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/app/features/memory/createtree/MemoryTreeSliceTest.kt
  - id: uc.memory.browse.path-resolution
    statement: A clean slug path (no type markers in the URL) resolves client-side to the chain of nodes, one per segment, each carrying its own type; resolution is parent-scoped and a missing segment fails.
    coverage:
      web:
        e2e:
          - testName: walks the tree level by level and resolves the type of each path segment
            kind: positive
            ref: frontend/src/features/memory/browse/browse.e2e.test.ts
      android:
        e2e:
          - testName: resolvesACleanSlugPathClientSide
            kind: positive
            ref: android/core/src/test/kotlin/app/veyq/crypto/BrowseE2ETest.kt
      apple:
        e2e:
          - testName: testResolvesACleanSlugPathClientSide
            kind: positive
            ref: apple/Tests/VeyqCryptoTests/BrowseE2ETests.swift
  - id: uc.memory.browse.gallery-day-buckets
    statement: "The gallery derives a local calendar-day key per medium and groups consecutive same-day runs into buckets (re-opening a bucket for a non-consecutive return), byte-compatibly with the web dateBuckets (which is covered under uc.platform.web-views.gallery-layout)."
    coverage:
      apple:
        unit:
          - testName: testGroupsConsecutiveRunsAndReopensForNonConsecutive
            kind: positive
            ref: apple/Tests/VeyqCryptoTests/DayBucketsTests.swift
          - testName: testFallsBackToPlaceholderForInvalidTimestamps
            kind: negative
            ref: apple/Tests/VeyqCryptoTests/DayBucketsTests.swift
          - testName: testDayKeyHasIsoDateShape
            kind: positive
            ref: apple/Tests/VeyqCryptoTests/DayBucketsTests.swift
      android:
        unit:
          - testName: groupsConsecutiveRunsAndReopensForNonConsecutive
            kind: positive
            ref: android/core/src/test/kotlin/app/veyq/crypto/DayBucketsTest.kt
          - testName: fallsBackToPlaceholderForInvalidTimestamps
            kind: negative
            ref: android/core/src/test/kotlin/app/veyq/crypto/DayBucketsTest.kt
          - testName: dayKeyHasIsoDateShape
            kind: positive
            ref: android/core/src/test/kotlin/app/veyq/crypto/DayBucketsTest.kt
