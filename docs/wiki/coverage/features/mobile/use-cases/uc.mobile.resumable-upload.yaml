id: uc.mobile.resumable-upload
title: Resumable upload from mobile
status: implemented
documents:
  - type: feature
    ref: docs/wiki/features/mobile/_index.md
  - type: useCase
    ref: docs/wiki/features/mobile/use-cases/uc.mobile.resumable-upload.md
  - type: crosscutting
    ref: docs/wiki/crosscutting/security-model.md
  - type: entryPoint
    ref: apple/Sources/VeyqCrypto/Media.swift
  - type: entryPoint
    ref: android/core/src/main/kotlin/app/veyq/crypto/Media.kt
acceptanceCriteria:
  - id: uc.mobile.resumable-upload.chunked-resume
    statement: "Media uploads as sealed chunks via presigned URLs; an interrupted upload resumes by re-sending only the missing chunks, and the assembled blob attaches to the Memory."
    coverage:
      backend:
        integration:
          - testName: directToStoreRoundTrip
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/app/features/uploads/blob/PresignedUploadE2ETest.kt
          - testName: resumeSkipsChunksAlreadyInTheStore
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/app/features/uploads/blob/PresignedUploadE2ETest.kt
      apple:
        e2e:
          - testName: testUnifiedUploadDownloadDedupResumeAndGallery
            kind: positive
            ref: apple/Tests/VeyqCryptoTests/MediaE2ETests.swift
      android:
        e2e:
          - testName: unifiedUploadDownloadDedupResumeAndGallery
            kind: positive
            ref: android/core/src/test/kotlin/app/veyq/crypto/MediaE2ETest.kt
