id: uc.mobile.open-in-app
title: Open a link in the native app
status: implemented
documents:
  - type: feature
    ref: docs/wiki/features/mobile/_index.md
  - type: useCase
    ref: docs/wiki/features/mobile/use-cases/uc.mobile.open-in-app.md
  - type: crosscutting
    ref: docs/wiki/crosscutting/platform-concepts.md
acceptanceCriteria:
  - id: uc.mobile.open-in-app.invite-link-parsing
    statement: "An invite deep link is parsed locally into its parts (pragmatic or passphrase-protected); the secrets ride the fragment and a non-invite link is rejected."
    coverage:
      apple:
        unit:
          - testName: testRoundTripsPragmaticInviteThroughFragment
            kind: positive
            ref: apple/Tests/VeyqCryptoTests/InviteLinkTests.swift
          - testName: testReturnsNilForNonInviteHashes
            kind: negative
            ref: apple/Tests/VeyqCryptoTests/InviteLinkTests.swift
      android:
        unit:
          - testName: roundTripsPragmaticInviteThroughFragment
            kind: positive
            ref: android/core/src/test/kotlin/app/veyq/crypto/InviteLinkTest.kt
          - testName: returnsNullForNonInviteHashes
            kind: negative
            ref: android/core/src/test/kotlin/app/veyq/crypto/InviteLinkTest.kt
  - id: uc.mobile.open-in-app.os-dispatch
    statement: "The OS delivers a veyq:// link to the app (iOS onOpenURL / Android intent-filter) and the app routes to the target — an invite-accept flow or an in-app destination."
    gaps:
      - reason: "OS deep-link delivery (onOpenURL / intent-filter) and the in-app navigation dispatch are platform/UI integration with no isolated unit test; only the link parsing (above) is unit-tested."
        followUp: "Cover via an instrumented / UI test if the routing dispatch grows non-trivial."
