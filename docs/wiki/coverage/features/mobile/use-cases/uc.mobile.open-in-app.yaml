id: uc.mobile.open-in-app
title: Open a link in the native app
status: implemented
documents:
  - type: feature
    ref: docs/wiki/features/mobile/_index.md
  - type: useCase
    ref: docs/wiki/features/mobile/use-cases/uc.mobile.open-in-app.md
  - type: crosscutting
    ref: docs/wiki/crosscutting/platform-concepts.md
acceptanceCriteria:
  - id: uc.mobile.open-in-app.invite-link-parsing
    statement: "An invite deep link is parsed locally into its parts (pragmatic or passphrase-protected); the secrets ride the fragment and a non-invite link is rejected."
    coverage:
      apple:
        unit:
          - testName: testRoundTripsPragmaticInviteThroughFragment
            kind: positive
            ref: apple/Tests/VeyqCryptoTests/InviteLinkTests.swift
          - testName: testReturnsNilForNonInviteHashes
            kind: negative
            ref: apple/Tests/VeyqCryptoTests/InviteLinkTests.swift
          - testName: testParsesInviteDeepLinkWithInstance
            kind: positive
            ref: apple/Tests/VeyqCryptoTests/InviteLinkTests.swift
          - testName: testDeepLinkRequiresInstanceAndInvite
            kind: negative
            ref: apple/Tests/VeyqCryptoTests/InviteLinkTests.swift
      android:
        unit:
          - testName: roundTripsPragmaticInviteThroughFragment
            kind: positive
            ref: android/core/src/test/kotlin/app/veyq/crypto/InviteLinkTest.kt
          - testName: returnsNullForNonInviteHashes
            kind: negative
            ref: android/core/src/test/kotlin/app/veyq/crypto/InviteLinkTest.kt
          - testName: parsesInviteDeepLinkWithInstance
            kind: positive
            ref: android/core/src/test/kotlin/app/veyq/crypto/InviteLinkTest.kt
          - testName: deepLinkRequiresInstanceAndInvite
            kind: negative
            ref: android/core/src/test/kotlin/app/veyq/crypto/InviteLinkTest.kt
  - id: uc.mobile.open-in-app.route-and-slug
    statement: "The 'open' path's space selector (~me / @group / tenant) and the group-name slug parse byte-compatibly with the web, so a member 'open in app' link resolves to the right space."
    coverage:
      apple:
        unit:
          - testName: testParsesPersonalGroupAndTenantPrefixes
            kind: positive
            ref: apple/Tests/VeyqCryptoTests/SpacePathTests.swift
          - testName: testSlugifyMatchesWebRoundTrip
            kind: positive
            ref: apple/Tests/VeyqCryptoTests/SpacePathTests.swift
      android:
        unit:
          - testName: parsesPersonalGroupAndTenantPrefixes
            kind: positive
            ref: android/core/src/test/kotlin/app/veyq/crypto/SpacePathTest.kt
          - testName: slugifyMatchesWebRoundTrip
            kind: positive
            ref: android/core/src/test/kotlin/app/veyq/crypto/SpacePathTest.kt
  - id: uc.mobile.open-in-app.os-dispatch
    statement: "The OS delivers a veyq:// link to the app (iOS onOpenURL / Android intent-filter) and the app routes to the target — an invite-accept flow or an in-app destination."
    gaps:
      - reason: "Invite parsing + instance extraction and the 'open' path's selector/slug are now unit-tested cross-platform; what remains is the thin per-platform URL extraction (URLComponents / android.net.Uri) and the OS delivery itself (onOpenURL / intent-filter) plus the in-app navigation — no isolated unit test."
        followUp: "Cover OS delivery + navigation with an instrumented/UI test if the dispatch grows non-trivial."
