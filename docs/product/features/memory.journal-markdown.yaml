id: memory.journal-markdown
title: Memory Journal Markdown
status: implemented
capabilities:
  - memory.journal-markdown
productArea: Markdown journals and veyq embeds.
entryPoints:
  - docs/api/memories.openapi.yaml
  - docs/api/shares.openapi.yaml
  - frontend/src/features/memories/components/JournalRenderer.vue
acceptanceCriteria:
  - id: memory.journal-markdown.empty-journal
    statement: Memories without saved journal text return an empty Markdown journal.
    coverage:
      backend:
        integration:
          - testName: reads empty journal and updates markdown with visible embeds
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/memory/MemoryServiceTest.kt
  - id: memory.journal-markdown.visible-embeds-update
    statement: Journal updates with visible media embeds succeed.
    coverage:
      backend:
        integration:
          - testName: reads empty journal and updates markdown with visible embeds
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/memory/MemoryServiceTest.kt
  - id: memory.journal-markdown.media-embed-boundary
    statement: Media embeds outside the current Memory context are rejected.
    coverage:
      backend:
        integration:
          - testName: rejects journal media embeds outside the current memory
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/memory/MemoryServiceTest.kt
  - id: memory.journal-markdown.carousel-boundary
    statement: Carousel embeds are rejected if any media is outside context.
    coverage:
      backend:
        integration:
          - testName: rejects journal carousel embeds when any media is outside the current memory
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/memory/MemoryServiceTest.kt
  - id: memory.journal-markdown.legacy-veyq-links
    statement: Legacy `veyq:` Markdown link and image targets are no longer treated as veyq journal embeds.
    coverage:
      backend:
        integration:
          - testName: does not validate legacy veyq markdown link embeds
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/memory/MemoryServiceTest.kt
  - id: memory.journal-markdown.ui-rendering
    statement: UI renders Markdown headings, media embeds and carousel embeds.
    coverage:
      frontend:
        unit:
          - testName: renders journal markdown and media embeds
            kind: positive
            ref: frontend/src/features/memories/components/MemoryDetail.test.ts
          - testName: renders chapter playlist and track journal embeds with double colon syntax
            kind: positive
            ref: frontend/src/features/memories/components/MemoryDetail.test.ts
        integration:
          - testName: memory detail renders breadcrumb context and memory tabs
            kind: positive
            ref: frontend/e2e/memory-detail.spec.ts
      ios:
        unit:
          - testName: testJournalParserKeepsMarkdownAroundMediaEmbed
            kind: positive
            ref: ios/VeyqTests/VeyqTests.swift
          - testName: testJournalParserTurnsCommaSeparatedMediaIntoCarousel
            kind: positive
            ref: ios/VeyqTests/VeyqTests.swift
          - testName: testJournalParserDecodesPercentEncodedMediaIDs
            kind: negative
            ref: ios/VeyqTests/VeyqTests.swift
  - id: memory.journal-markdown.ui-editing
    statement: UI supports editing, help text and picker insertion for media, chapter, playlist and track embeds.
    coverage:
      frontend:
        unit:
          - testName: opens the media picker from the editor button and inserts selected media markdown
            kind: positive
            ref: frontend/src/features/memories/components/MemoryDetail.test.ts
          - testName: opens embed pickers from editor buttons and inserts chapter playlist and track markdown
            kind: positive
            ref: frontend/src/features/memories/components/MemoryDetail.test.ts
          - testName: renders comma-separated media embeds as a carousel with unavailable placeholders
            kind: negative
            ref: frontend/src/features/memories/components/MemoryDetail.test.ts
          - testName: changes journal carousel pages with native navigators
            kind: positive
            ref: frontend/src/features/memories/components/MemoryDetail.test.ts
          - testName: emits changed after saving the journal
            kind: positive
            ref: frontend/src/features/memories/components/MemoryDetail.test.ts
          - testName: shows markdown and veyq embed help while editing the journal
            kind: positive
            ref: frontend/src/features/memories/components/MemoryDetail.test.ts
          - testName: opens the media picker when typing media target and replaces the trigger
            kind: positive
            ref: frontend/src/features/memories/components/MemoryDetail.test.ts
          - testName: opens the type picker when typing double colon and then inserts media
            kind: negative
            ref: frontend/src/features/memories/components/MemoryDetail.test.ts
          - testName: navigates and dismisses the type picker with keyboard and outside clicks
            kind: positive
            ref: frontend/src/features/memories/components/MemoryDetail.test.ts
          - testName: preserves an existing media caption when replacing a media target
            kind: positive
            ref: frontend/src/features/memories/components/MemoryDetail.test.ts
          - testName: opens the media picker from an existing media tag double-click and replaces that tag
            kind: positive
            ref: frontend/src/features/memories/components/MemoryDetail.test.ts
          - testName: deletes an existing media pill from the edit dialog
            kind: positive
            ref: frontend/src/features/memories/components/MemoryDetail.test.ts
          - testName: deletes an existing chapter pill from the edit dialog
            kind: positive
            ref: frontend/src/features/memories/components/MemoryDetail.test.ts
          - testName: opens the media picker from the editor button when the cursor is inside an existing media tag
            kind: positive
            ref: frontend/src/features/memories/components/MemoryDetail.test.ts
          - testName: opens the media picker from a live editor autocomplete trigger and replaces the trigger
            kind: positive
            ref: frontend/src/features/memories/components/MemoryDetail.test.ts
          - testName: opens the native type completion for the double colon trigger
            kind: positive
            ref: frontend/src/features/memories/components/MemoryJournalLiveEditor.test.ts
          - testName: keeps canonical type prefixes searchable when completion labels are localized
            kind: positive
            ref: frontend/src/features/memories/components/MemoryJournalLiveEditor.test.ts
          - testName: opens the media picker from an existing carousel tag with media order preserved
            kind: positive
            ref: frontend/src/features/memories/components/MemoryDetail.test.ts
          - testName: does not open the media picker when double-clicking outside a media tag
            kind: negative
            ref: frontend/src/features/memories/components/MemoryDetail.test.ts
    gaps:
      - reason: Live journal media autocomplete and re-opening existing media embeds are covered by unit tests but not by a real browser E2E flow yet.
        followUp: Add Playwright coverage when E2E execution is available again.
  - id: memory.journal-markdown.public-viewer-read
    statement: Public viewers can read journals.
    coverage:
      backend:
        integration:
          - testName: public share journal is readable by viewers and writable by contributors
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/memory/MemoryShareResourceTest.kt
  - id: memory.journal-markdown.public-permitted-write
    statement: Public journal writes are limited to permitted share roles.
    coverage:
      backend:
        integration:
          - testName: public share journal is readable by viewers and writable by contributors
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/memory/MemoryShareResourceTest.kt
  - id: memory.journal-markdown.uploader-denied
    statement: Uploader-only shares cannot read journals.
    coverage:
      backend:
        integration:
          - testName: uploader only share cannot read journal
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/memory/MemoryShareResourceTest.kt
