id: memory.maps
title: Memory Media Maps
status: implemented
capabilities:
  - memory.maps
productArea: GPS media maps with browser opt-in for external map tiles.
entryPoints:
  - docs/api/memories.openapi.yaml
  - docs/legal/privacy.md
  - frontend/src/features/memories/components/MemoryContextPanel.vue
acceptanceCriteria:
  - id: memory.maps.gps-metadata
    statement: GPS metadata extraction makes media mapable.
    coverage:
      backend:
        unit:
          - testName: applies extracted metadata to media blob
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/library/media/MediaMetadataExtractorTest.kt
  - id: memory.maps.private-render
    statement: Memory map renders media locations.
    coverage:
      frontend:
        unit:
          - testName: clusters overlapping marker previews with a count badge
            kind: positive
            ref: frontend/src/features/memories/components/MemoryContextPanel.test.ts
          - testName: enables direct scroll wheel touch and control zooming
            kind: positive
            ref: frontend/src/features/memories/components/MemoryContextPanel.test.ts
          - testName: keeps lightbox navigation inside the clicked marker cluster
            kind: positive
            ref: frontend/src/features/memories/components/MemoryContextPanel.test.ts
          - testName: supports arrow key navigation inside the clicked marker cluster
            kind: positive
            ref: frontend/src/features/memories/components/MemoryContextPanel.test.ts
          - testName: keeps distant marker previews separate
            kind: positive
            ref: frontend/src/features/memories/components/MemoryContextPanel.test.ts
  - id: memory.maps.track-route-render
    statement: Track map renders route polyline.
    coverage:
      frontend:
        unit:
          - testName: renders a Leaflet polyline using latitude longitude positions
            kind: positive
            ref: frontend/src/features/memories/components/TrackMap.test.ts
          - testName: renders selected tracks and memory photos on the map while reset fits the tracks
            kind: positive
            ref: frontend/src/features/memories/components/TrackMap.test.ts
          - testName: groups nearby memory photos as clickable map markers
            kind: positive
            ref: frontend/src/features/memories/components/TrackMap.test.ts
          - testName: enables direct scroll wheel touch and control zooming
            kind: positive
            ref: frontend/src/features/memories/components/TrackMap.test.ts
  - id: memory.maps.no-external-tiles-before-consent
    statement: OSM tiles are not requested before consent.
    coverage:
      frontend:
        unit:
          - testName: keeps OpenStreetMap tile consent anonymous without a signed-in user
            kind: negative
            ref: frontend/src/features/memories/components/MemoryContextPanel.test.ts
          - testName: renders route without OpenStreetMap tiles until consent is granted
            kind: negative
            ref: frontend/src/features/memories/components/TrackMap.test.ts
  - id: memory.maps.public-responsive
    statement: Public share map surfaces remain responsive.
    coverage:
      frontend:
        integration:
          - testName: major line 1 public viewer share shows map tracks and playlist privacy gates
            kind: positive
            ref: frontend/e2e/major-1-smoke.spec.ts
          - testName: public share view is responsive without the workspace shell
            kind: positive
            ref: frontend/e2e/responsive.spec.ts
  - id: memory.maps.context-panel
    statement: Memory context panel combines media locations, track metrics and permitted track actions.
    coverage:
      frontend:
        unit:
          - testName: shows located media and track metrics in one context surface
            kind: positive
            ref: frontend/src/features/memories/components/MemoryContextPanel.test.ts
          - testName: uses deterministic distinct track colors and activity line styles
            kind: positive
            ref: frontend/src/features/memories/components/MemoryContextPanel.test.ts
          - testName: fits the map to a visible track when the track row is clicked
            kind: positive
            ref: frontend/src/features/memories/components/MemoryContextPanel.test.ts
          - testName: keeps track editing actions for permitted users
            kind: positive
            ref: frontend/src/features/memories/components/MemoryContextPanel.test.ts
  - id: memory.maps.consent-scoping
    statement: OpenStreetMap consent is scoped correctly and avoids local disable controls after consent.
    coverage:
      frontend:
        unit:
          - testName: keeps OpenStreetMap tile consent scoped to the signed-in user
            kind: positive
            ref: frontend/src/features/memories/components/MemoryContextPanel.test.ts
          - testName: does not render a map-local OpenStreetMap disable button after consent
            kind: negative
            ref: frontend/src/features/memories/components/MemoryContextPanel.test.ts
          - testName: lists grouped external providers and keeps anonymous consent in browser storage
            kind: positive
            ref: frontend/src/features/settings/components/PrivacySettingsPanel.test.ts
          - testName: keeps consent scoped to the signed-in user
            kind: positive
            ref: frontend/src/features/settings/components/PrivacySettingsPanel.test.ts
          - testName: opens external content dialog and stores grouped provider consent for the signed-in user
            kind: positive
            ref: frontend/src/features/settings/components/UserSettingsForm.test.ts
          - testName: does not show external content dialog before opening it
            kind: negative
            ref: frontend/src/features/settings/components/UserSettingsForm.test.ts
          - testName: stores OpenStreetMap tile consent only in local storage
            kind: negative
            ref: frontend/src/shared/privacy/privacyConsent.test.ts
          - testName: stores OpenStreetMap tile consent separately per user when scoped
            kind: positive
            ref: frontend/src/shared/privacy/privacyConsent.test.ts
gaps:
  - reason: Private/public consent reset and opt-out behavior is not split into explicit acceptance criteria yet.
    followUp: Add separate ACs and tests for consent reset and opt-out flows.
