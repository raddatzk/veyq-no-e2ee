id: user.profile-account-settings
title: User Profile And Account Settings
status: implemented
capabilities: []
productArea: User profiles, avatars, email confirmation, profile permalinks, password settings and passkey account management.
entryPoints:
  - docs/api/users.openapi.yaml
  - frontend/src/features/settings/components/UserSettingsForm.vue
  - frontend/src/views/EmailConfirmView.vue
acceptanceCriteria:
  - id: user.profile-account-settings.profile-avatar-email-permalink
    statement: >-
      Users can manage avatar, profile visibility, email confirmation, display name and permalink settings with
      validation.
    coverage:
      backend:
        integration:
          - testName: uploads serves and deletes own avatar
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: profile avatar follows tenant profile visibility
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: avatar upload rejects invalid image data
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: avatar upload rejects oversized files
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: email change requires confirmation before new address can be used
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: display name update does not create an email confirmation
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: user settings can change permalink independently from display name
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: user settings rejects duplicate and reserved permalinks
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: profile endpoint returns only public header fields
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: email confirmation must belong to the logged in user
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: email confirmation rejects stale and conflicting tokens
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
      frontend:
        unit:
          - testName: shows pending email and confirmation message after profile save
            kind: positive
            ref: frontend/src/features/settings/components/UserSettingsForm.test.ts
          - testName: renders profile settings labels in English
            kind: positive
            ref: frontend/src/features/settings/components/UserSettingsForm.test.ts
          - testName: uploads an avatar and updates auth state
            kind: positive
            ref: frontend/src/features/settings/components/UserSettingsForm.test.ts
          - testName: deletes an avatar and clears auth state
            kind: negative
            ref: frontend/src/features/settings/components/UserSettingsForm.test.ts
  - id: user.profile-account-settings.permalink-normalization
    statement: Permalink utilities normalize profile paths and enforce length limits.
    coverage:
      frontend:
        unit:
          - testName: normalizes text for path-safe names
            kind: positive
            ref: frontend/src/composables/usePermalink.test.ts
          - testName: limits permalink length
            kind: positive
            ref: frontend/src/composables/usePermalink.test.ts
  - id: user.profile-account-settings.email-confirmation
    statement: Email confirmation links can be opened anonymously and bind to the authenticated user during confirmation.
    coverage:
      frontend:
        unit:
          - testName: allows anonymous email confirmation links
            kind: positive
            ref: frontend/src/router.test.ts
          - testName: confirms the token and updates authenticated user state
            kind: positive
            ref: frontend/src/views/EmailConfirmView.test.ts
