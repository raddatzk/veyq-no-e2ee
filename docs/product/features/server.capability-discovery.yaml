id: server.capability-discovery
title: Server Capability Discovery
status: implemented
capabilities:
  - server.setup
  - auth.passkeys
  - auth.mobile-handoff
  - spaces.tenant-group-personal
  - memory.core
  - memory.media
  - memory.media-resumable-upload
  - memory.media-upload-eta
  - memory.media-live-updates
  - memory.media-zip-download
  - memory.journal-markdown
  - memory.maps
  - memory.tracks
  - memory.playlists
  - memory.public-sharing
  - memory.public-uploader-links
  - server.backup-upgrade
  - server.auto-updates
productArea: Server capability registry, settings exposure and notifications.
entryPoints:
  - docs/api/server.openapi.yaml
  - docs/product/capabilities.md
  - frontend/src/components/app/WorkspaceTopbar.vue
acceptanceCriteria:
  - id: server.capability-discovery.all-user-visible
    statement: Regular users see all-user capabilities.
    coverage:
      backend:
        unit:
          - testName: upload eta capability is visible to regular users
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/settings/CapabilityRegistryTest.kt
  - id: server.capability-discovery.upload-eta-announced
    statement: Upload ETA capability is announced as new.
    coverage:
      backend:
        unit:
          - testName: upload eta capability is announced as new
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/settings/CapabilityRegistryTest.kt
  - id: server.capability-discovery.settings-owner-access
    statement: Server owner can load settings endpoints.
    coverage:
      backend:
        integration:
          - testName: server owner can load server settings endpoints
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/settings/SettingsResourceTest.kt
  - id: server.capability-discovery.public-client-discovery
    statement: Public discovery exposes mobile login and client capabilities.
    coverage:
      backend:
        integration:
          - testName: public discovery exposes mobile login and client capabilities
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/settings/SettingsResourceTest.kt
          - testName: public discovery uses the request host for mobile login
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/settings/SettingsResourceTest.kt
      ios:
        unit:
          - testName: testConnectPersistsClientCapabilitySnapshotWithNativeSession
            kind: positive
            ref: ios/VeyqTests/VeyqTests.swift
          - testName: testConnectRejectsInstancesMissingRequiredCapabilities
            kind: negative
            ref: ios/VeyqTests/VeyqTests.swift
  - id: server.capability-discovery.settings-auth-required
    statement: Server settings reject unauthenticated requests.
    coverage:
      backend:
        integration:
          - testName: server settings endpoints reject unauthenticated requests
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/settings/SettingsResourceTest.kt
  - id: server.capability-discovery.settings-owner-required
    statement: Server settings reject non-owner server members.
    coverage:
      backend:
        integration:
          - testName: server settings endpoints reject server members
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/settings/SettingsResourceTest.kt
  - id: server.capability-discovery.notification-ui
    statement: Frontend topbar shows and dismisses capability notifications.
    coverage:
      frontend:
        unit:
          - testName: shows capability notifications behind a topbar mail icon
            kind: positive
            ref: frontend/src/components/app/WorkspaceTopbar.test.ts
          - testName: dismisses capability notifications from the topbar panel
            kind: positive
            ref: frontend/src/components/app/WorkspaceTopbar.test.ts
  - id: server.capability-discovery.server-settings-metadata
    statement: Server settings expose license, sponsor and build metadata.
    coverage:
      backend:
        unit:
          - testName: server settings expose community license defaults and sponsor link
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/settings/SettingsServiceTest.kt
          - testName: server settings expose fixed sponsor link and build metadata
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/settings/SettingsServiceTest.kt
      frontend:
        unit:
          - testName: renders license and edition information
            kind: positive
            ref: frontend/src/features/settings/components/ServerSettingsPanel.test.ts
          - testName: renders a GitHub commit link from the license revision
            kind: positive
            ref: frontend/src/features/settings/components/ServerSettingsPanel.test.ts
          - testName: renders support action from server settings
            kind: positive
            ref: frontend/src/features/settings/components/ServerSettingsPanel.test.ts
