id: platform.request-security
title: Request Security Pipeline
status: implemented
capabilities: []

productArea: Request authentication and authorization filters for setup, tenant, group and pentest routes.
entryPoints:
  - backend/src/main/kotlin/com/veyq/api/security
  - backend/src/main/kotlin/com/veyq/api/pentest
  - docs/pentest
acceptanceCriteria:
  - id: platform.request-security.route-authorization
    statement: Setup, tenant, tenant-owner and group-owner routes enforce authentication and membership requirements.
    coverage:
      backend:
        integration:
          - testName: security policy permits public setup status and denies protected API without auth
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/security/SecurityPipelineTest.kt
          - testName: setup filter returns stable setup required code
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/security/SecurityPipelineTest.kt
          - testName: tenant membership filter handles unauthenticated missing outsider and member cases
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/security/SecurityPipelineTest.kt
          - testName: tenant owner required allows tenant owner and rejects tenant member
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/security/SecurityPipelineTest.kt
          - testName: group owner required allows group owner and rejects member missing group and outsider
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/security/SecurityPipelineTest.kt
  - id: platform.request-security.pentest-reset
    statement: The destructive pentest reset endpoint is available only for disposable pentest instances and requires an explicit reset token.
    coverage:
      backend:
        integration:
          - testName: pentest reset rejects missing token
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/pentest/PentestResetResourceTest.kt
          - testName: pentest reset clears application state
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/pentest/PentestResetResourceTest.kt
          - testName: pentest reset endpoint is unavailable outside pentest profile
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/security/SecurityPipelineTest.kt
