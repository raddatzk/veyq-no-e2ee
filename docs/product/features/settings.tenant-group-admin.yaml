id: settings.tenant-group-admin
title: Tenant And Group Admin Settings
status: implemented
capabilities: []
productArea: Tenant settings, tenant user management, group settings and settings routes.
entryPoints:
  - frontend/src/views/SettingsView.vue
  - frontend/src/features/settings/components
  - docs/api/tenants.openapi.yaml
  - docs/api/groups.openapi.yaml
acceptanceCriteria:
  - id: settings.tenant-group-admin.tenant-delete-cleanup
    statement: Tenant owners can delete tenants while related Memory share state is cleaned up safely.
    coverage:
      backend:
        integration:
          - testName: tenant owner can delete tenant with memory share state
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/tenant/MultiTenantResourceTest.kt
  - id: settings.tenant-group-admin.tenant-logo-management
    statement: Tenant owners can manage logos and tenant members can read them.
    coverage:
      backend:
        integration:
          - testName: tenant owners manage logos and members can read them
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/tenant/MultiTenantResourceTest.kt
      frontend:
        unit:
          - testName: renders tenant logo images when available
            kind: positive
            ref: frontend/src/components/app/TenantSidebar.test.ts
          - testName: keeps tenant initials as fallback without a logo
            kind: negative
            ref: frontend/src/components/app/TenantSidebar.test.ts
  - id: settings.tenant-group-admin.group-member-visibility
    statement: Tenant members can create groups and see only groups they can access.
    coverage:
      backend:
        integration:
          - testName: tenant members can create groups and only read accessible groups
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/tenant/MultiTenantResourceTest.kt
  - id: settings.tenant-group-admin.tenant-user-management
    statement: Tenant user invitations, activation, membership visibility and role management respect tenant boundaries.
    coverage:
      backend:
        integration:
          - testName: tenant owner invites and activates existing tenant user by email
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: tenant registration invite allows new and existing users to join as members
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: tenant registration invite rejects wrong domain revoked expired and exhausted links
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: tenant owner invites new tenant user by email without server role escalation and manages tenant role
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: tenant member can list tenant users but cannot mutate tenant users
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: duplicate global pending user can be invited into another tenant
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: tenant creation activates tenant when invited owner accepts
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
  - id: settings.tenant-group-admin.responsive-settings
    statement: Settings screens keep management rows and forms responsive.
    coverage:
      frontend:
        integration:
          - testName: settings screens keep management rows and forms responsive
            kind: positive
            ref: frontend/e2e/responsive.spec.ts
  - id: settings.tenant-group-admin.settings-ui-management
    statement: Settings UI manages tenant, group and member administration while preserving route and permission boundaries.
    coverage:
      frontend:
        unit:
          - testName: opens the create dialog and then switches to group management without route navigation
            kind: negative
            ref: frontend/src/features/settings/components/CreateGroupFlowDialog.test.ts
          - testName: closes the flow when cancelling creation
            kind: positive
            ref: frontend/src/features/settings/components/CreateGroupFlowDialog.test.ts
          - testName: loads groups and creates a new group
            kind: positive
            ref: frontend/src/features/settings/components/GroupSettingsPanel.test.ts
          - testName: loads a group detail and saves members with roles
            kind: positive
            ref: frontend/src/features/settings/components/GroupSettingsPanel.test.ts
          - testName: opens the create dialog from the sidebar query trigger
            kind: positive
            ref: frontend/src/features/settings/components/GroupSettingsPanel.test.ts
          - testName: opens group management when a group row is clicked
            kind: positive
            ref: frontend/src/features/settings/components/GroupSettingsPanel.test.ts
          - testName: prevents removing the last owner
            kind: positive
            ref: frontend/src/features/settings/components/GroupSettingsPanel.test.ts
          - testName: requires the group display name before deleting a group
            kind: positive
            ref: frontend/src/features/settings/components/GroupSettingsPanel.test.ts
          - testName: renders group detail read-only for regular group members
            kind: negative
            ref: frontend/src/features/settings/components/GroupSettingsPanel.test.ts
          - testName: saves tenant terms from the multilingual editor
            kind: positive
            ref: frontend/src/features/settings/components/TenantSettingsPanel.test.ts
          - testName: shows existing terms languages as editable rows
            kind: positive
            ref: frontend/src/features/settings/components/TenantSettingsPanel.test.ts
          - testName: imports tenant owner email addresses into the contact template clause
            kind: positive
            ref: frontend/src/features/settings/components/TenantSettingsPanel.test.ts
          - testName: uploads a tenant logo and updates the tenant state
            kind: positive
            ref: frontend/src/features/settings/components/TenantSettingsPanel.test.ts
          - testName: removes a tenant logo and clears the tenant state
            kind: negative
            ref: frontend/src/features/settings/components/TenantSettingsPanel.test.ts
          - testName: renders tenant setting blocks in the requested order
            kind: positive
            ref: frontend/src/features/settings/components/TenantSettingsPanel.test.ts
          - testName: requires a custom contact when no tenant owner email is available
            kind: negative
            ref: frontend/src/features/settings/components/TenantSettingsPanel.test.ts
          - testName: invites a tenant user directly by email and role
            kind: positive
            ref: frontend/src/features/settings/components/TenantSettingsPanel.test.ts
          - testName: creates and copies a tenant registration link
            kind: positive
            ref: frontend/src/features/settings/components/TenantSettingsPanel.test.ts
          - testName: lists and revokes tenant registration links
            kind: negative
            ref: frontend/src/features/settings/components/TenantSettingsPanel.test.ts
          - testName: reinvites pending users without changing tenant role
            kind: negative
            ref: frontend/src/features/settings/components/TenantSettingsPanel.test.ts
          - testName: shows loading only on the pending user resend action
            kind: negative
            ref: frontend/src/features/settings/components/TenantSettingsPanel.test.ts
          - testName: updates tenant member roles from the tenant member table
            kind: positive
            ref: frontend/src/features/settings/components/TenantSettingsPanel.test.ts
          - testName: requires the tenant display name before deleting a tenant
            kind: positive
            ref: frontend/src/features/settings/components/TenantSettingsPanel.test.ts
          - testName: loads the settings context with the full global route path
            kind: positive
            ref: frontend/src/views/SettingsView.test.ts
          - testName: does not show browser privacy settings globally on settings pages
            kind: negative
            ref: frontend/src/views/SettingsView.test.ts
          - testName: does not show browser privacy settings on tenant settings pages
            kind: negative
            ref: frontend/src/views/SettingsView.test.ts
          - testName: does not show browser privacy settings on server settings pages
            kind: negative
            ref: frontend/src/views/SettingsView.test.ts
          - testName: loads tenant settings context with tenant prefix in the path
            kind: positive
            ref: frontend/src/views/SettingsView.test.ts
          - testName: allows anonymous tenant registration links
            kind: positive
            ref: frontend/src/router.test.ts
          - testName: renders the translated email label on tenant registration links
            kind: positive
            ref: frontend/src/views/TenantJoinView.test.ts
          - testName: lets new users join with a passkey by default
            kind: positive
            ref: frontend/src/views/TenantJoinView.test.ts
          - testName: exposes language and theme controls on tenant registration links
            kind: positive
            ref: frontend/src/views/TenantJoinView.test.ts
          - testName: hides tenant member management for tenant members
            kind: positive
            ref: frontend/src/views/SettingsView.test.ts
          - testName: does not show tenant settings while opening the create group flow
            kind: negative
            ref: frontend/src/views/SettingsView.test.ts
