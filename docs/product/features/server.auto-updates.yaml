id: server.auto-updates
title: Server Auto Updates
status: implemented
capabilities:
  - server.auto-updates
productArea: Opt-in major-channel auto-updates for the application container.
entryPoints:
  - scripts/veyq-server.sh
  - docs/development.md
  - docs/api/server.openapi.yaml
acceptanceCriteria:
  - id: server.auto-updates.opt-in
    statement: Auto-updates are opt-in through updater profile/config.
    gaps:
      - reason: No automated Feature Trust test currently proves opt-in updater configuration.
        followUp: Add update configuration integration coverage around the updater profile.
  - id: server.auto-updates.major-channel
    statement: Automatic updates should follow a compatible major channel.
    gaps:
      - reason: No automated update simulation currently proves major-channel compatibility behavior.
        followUp: Add an updater simulation or fixture test for compatible channel selection.
  - id: server.auto-updates.failure-notification
    statement: Update failures should produce ServerOwner notification.
    gaps:
      - reason: No automated update simulation currently proves ServerOwner failure notification behavior.
        followUp: Add backend integration coverage for update failure event ingestion and notification exposure.
gaps:
  - reason: No automated update simulation currently proves these ACs.
    followUp: Do not count scripts or workflows as coverage; add dedicated updater simulation tests.
