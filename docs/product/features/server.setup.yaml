id: server.setup
title: Server Setup
status: implemented
capabilities:
  - server.setup
productArea: Self-hosted setup, first admin and first Memory space.
entryPoints:
  - docs/api/setup.openapi.yaml
  - frontend/src/views/SetupView.vue
acceptanceCriteria:
  - id: server.setup.display-name-validation
    statement: Setup trims valid display names and rejects missing display names.
    coverage:
      backend:
        integration:
          - testName: setup display name is required and trimmed
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/setup/SetupValidationTest.kt
      frontend:
        unit:
          - testName: requires a display name before starting passkey setup
            kind: negative
            ref: frontend/src/views/SetupView.test.ts
          - testName: asks for TOTP setup before privacy opt-ins after password admin setup
            kind: positive
            ref: frontend/src/views/SetupView.test.ts
          - testName: enables TOTP before privacy opt-ins after password admin setup
            kind: positive
            ref: frontend/src/views/SetupView.test.ts
  - id: server.setup.passkey-display-name-rules
    statement: Initial passkey display names are optional, but passkey rename names are required.
    coverage:
      backend:
        integration:
          - testName: passkey display name is optional when creating and required when renaming
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/setup/SetupValidationTest.kt
        unit:
          - testName: passkey display name is suggested from known aaguid
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/setup/SetupValidationTest.kt
      frontend:
        unit:
          - testName: asks for privacy opt-ins after passkey admin setup and passkey naming
            kind: positive
            ref: frontend/src/views/SetupView.test.ts
  - id: server.setup.initial-flow-outside-workspace
    statement: Initial setup and tenant creation run outside the authenticated workspace shell without exposing the internal tenant name or permalink field, and the first Memory space cannot be created until an owner email is entered.
    coverage:
      frontend:
        unit:
          - testName: generates the internal tenant name and requires owner email during setup
            kind: positive
            ref: frontend/src/views/SetupView.test.ts
          - testName: generates the internal tenant name and requires owner email during setup
            kind: negative
            ref: frontend/src/views/SetupView.test.ts
        integration:
          - testName: initial setup keeps tenant creation outside the workspace shell
            kind: positive
            ref: frontend/e2e/setup-flow.spec.ts
          - testName: initial setup screen stays within the viewport
            kind: positive
            ref: frontend/e2e/responsive.spec.ts
  - id: server.setup.owner-can-create-first-tenant
    statement: A server owner can create a tenant from the empty workspace state after entering the invited owner email.
    coverage:
      backend:
        integration:
          - testName: tenant creation validates name and requires server owner
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/tenant/MultiTenantResourceTest.kt
      frontend:
        unit:
          - testName: requires an owner email before creating the tenant
            kind: negative
            ref: frontend/src/components/tenant/CreateTenantDialog.test.ts
          - testName: redirects home after tenant creation even when tenant refresh fails
            kind: positive
            ref: frontend/src/views/SetupView.test.ts
          - testName: shows loading and blocks duplicate tenant creation during setup
            kind: negative
            ref: frontend/src/views/SetupView.test.ts
        integration:
          - testName: server owners can create a tenant from an empty workspace shell
            kind: positive
            ref: frontend/e2e/setup-flow.spec.ts
  - id: server.setup.already-configured-blocked
    statement: Admin setup is blocked after the first admin exists.
    coverage:
      backend:
        integration:
          - testName: admin setup is blocked after first admin exists
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/tenant/MultiTenantResourceTest.kt
gaps:
  - reason: No real full-stack browser E2E exists for setup yet.
    followUp: Add e2e.browser coverage after a full-stack browser harness exists.
