id: user.account-lifecycle
title: User Account Lifecycle
status: planned
capabilities: []
productArea: Account deletion, ServerOwner deactivation and tenant membership removal.
entryPoints:
  - docs/adr/0017-user-lifecycle-and-tenant-membership-removal.md
  - docs/api/users.openapi.yaml
  - docs/api/tenants.openapi.yaml
acceptanceCriteria:
  - id: user.account-lifecycle.self-delete-reauth
    statement: Users can delete their own global account only after fresh password or passkey re-authentication.
    coverage:
      backend:
        integration:
          - testName: user deletes own account with password anonymizes visible references deletes private content and releases email
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
      frontend:
        unit:
          - testName: deletes the current account with password confirmation
            kind: positive
            ref: frontend/src/features/settings/components/UserSettingsForm.test.ts
          - testName: shows progress and blocks duplicate account deletion while pending
            kind: negative
            ref: frontend/src/features/settings/components/UserSettingsForm.test.ts
    gaps:
      - reason: Passkey self-delete re-authentication is not covered by an automated backend or browser test yet.
        followUp: Add a WebAuthn assertion test path for self-delete with passkey confirmation.
  - id: user.account-lifecycle.delete-anonymizes-visible-references
    statement: Account deletion transfers tenant-visible attribution and creator references to the global deleted-user account while deleting user-private content and credentials.
    coverage:
      backend:
        integration:
          - testName: user deletes own account with password anonymizes visible references deletes private content and releases email
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
  - id: user.account-lifecycle.server-owner-disable
    statement: ServerOwners can disable and re-enable users without deleting their visible attribution, and disabled users cannot authenticate or use existing sessions.
    coverage:
      backend:
        integration:
          - testName: server admin disables and enables user sessions
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: server admin cannot disable its own account
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
      frontend:
        unit:
          - testName: disables and enables managed users from the server user list
            kind: positive
            ref: frontend/src/features/settings/components/ServerSettingsPanel.test.ts
          - testName: updates managed user server roles
            kind: positive
            ref: frontend/src/features/settings/components/ServerSettingsPanel.test.ts
  - id: user.account-lifecycle.system-users-hidden
    statement: ServerOwner user management lists only human-managed accounts and hides internal system accounts such as the global deleted-user replacement identity.
    coverage:
      backend:
        integration:
          - testName: server admin user list excludes system users
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
  - id: user.account-lifecycle.tenant-soft-remove
    statement: Tenant owners can soft-remove tenant users so active access stops but historical user-owned media and buckets remain attached for later rejoin.
    coverage:
      backend:
        integration:
          - testName: tenant owner soft removes user and reinvite restores pending membership
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: tenant owner cannot soft remove the last tenant owner
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
      frontend:
        unit:
          - testName: soft removes active tenant members
            kind: positive
            ref: frontend/src/features/settings/components/TenantSettingsPanel.test.ts
  - id: user.account-lifecycle.last-owner-protection
    statement: Account deletion, deactivation and tenant removal preserve at least one active ServerOwner and one active TenantOwner where applicable.
    coverage:
      backend:
        integration:
          - testName: server admin cannot disable its own account
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: last server owner cannot delete own account
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: last tenant owner cannot delete own account
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: tenant owner cannot soft remove the last tenant owner
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
