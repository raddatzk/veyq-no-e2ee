id: memory.core
title: Core Memory Management
status: implemented
capabilities:
  - memory.core
productArea: Memory CRUD, nested Memories, covers, favorites, dates and folders.
entryPoints:
  - docs/api/memories.openapi.yaml
  - frontend/src/views/TenantView.vue
  - frontend/src/features/memories/components/MemoryDetail.vue
acceptanceCriteria:
  - id: memory.core.create-tree
    statement: Users can create root and child Memories and list descendant media.
    coverage:
      backend:
        integration:
          - testName: creates root and child memories and lists descendant media by taken time
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/memory/MemoryServiceTest.kt
      frontend:
        integration:
          - testName: major line 1 empty states guide first setup and empty Memories
            kind: positive
            ref: frontend/e2e/major-1-smoke.spec.ts
  - id: memory.core.tree-invariants
    statement: Sibling collisions, cycles and cross-scope moves are rejected.
    coverage:
      backend:
        integration:
          - testName: prevents sibling collisions cycles and cross-scope moves
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/memory/MemoryServiceTest.kt
  - id: memory.core.scope-inheritance
    statement: Group Memories require membership and children inherit parent scope.
    coverage:
      backend:
        integration:
          - testName: group memories require membership and children inherit parent scope
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/memory/MemoryServiceTest.kt
  - id: memory.core.favorites-private
    statement: Favorites are private to the current tenant user.
    coverage:
      backend:
        integration:
          - testName: favorites are private to the current tenant user and appear in navigation
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/memory/MemoryServiceTest.kt
          - testName: favorites reject memories outside the current visible tenant scope
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/memory/MemoryServiceTest.kt
      frontend:
        unit:
          - testName: renders favorite memory covers without a favorites add action or star overlay
            kind: negative
            ref: frontend/src/components/app/TenantSidebar.test.ts
          - testName: toggles the current memory as a favorite
            kind: positive
            ref: frontend/src/features/memories/components/MemoryDetail.test.ts
          - testName: removes the current memory from favorites
            kind: positive
            ref: frontend/src/features/memories/components/MemoryDetail.test.ts
          - testName: hides favorite actions when favorites are disabled
            kind: negative
            ref: frontend/src/features/memories/components/MemoryDetail.test.ts
  - id: memory.core.cover-management
    statement: Covers can be uploaded, set from media and cropped.
    coverage:
      backend:
        integration:
          - testName: uploads standalone covers and deletes descendant memories and media
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/memory/MemoryServiceTest.kt
          - testName: sets cover from existing memory media with crop metadata
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/memory/MemoryServiceTest.kt
          - testName: updates crop only for existing standalone cover
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/memory/MemoryServiceTest.kt
          - testName: standalone cover upload clears existing cover media reference
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/memory/MemoryServiceTest.kt
          - testName: clears memory cover only for visible memories
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/memory/MemoryServiceTest.kt
      frontend:
        integration:
          - testName: memory cards render explicit cover images
            kind: positive
            ref: frontend/e2e/tenant-navigation.spec.ts
        unit:
          - testName: creates a memory with required date range and optional cropped cover
            kind: positive
            ref: frontend/src/features/memories/components/MemoryDialogs.test.ts
          - testName: uploads a standalone cover image
            kind: positive
            ref: frontend/src/features/memories/components/MemoryDialogs.test.ts
          - testName: shows localized cover error codes
            kind: positive
            ref: frontend/src/features/memories/components/MemoryDialogs.test.ts
          - testName: creates a standalone cover from existing memory media
            kind: positive
            ref: frontend/src/features/memories/components/MemoryDialogs.test.ts
          - testName: preloads an existing media cover with saved crop metadata
            kind: positive
            ref: frontend/src/features/memories/components/MemoryDialogs.test.ts
          - testName: updates crop only for an existing standalone cover without reuploading it
            kind: negative
            ref: frontend/src/features/memories/components/MemoryDialogs.test.ts
          - testName: disables saving until a cover source is loaded
            kind: positive
            ref: frontend/src/features/memories/components/MemoryDialogs.test.ts
          - testName: removes an existing cover
            kind: positive
            ref: frontend/src/features/memories/components/MemoryDialogs.test.ts
  - id: memory.core.invalid-cover-rejected
    statement: Invalid crop metadata and invalid crop-only updates are rejected.
    coverage:
      backend:
        integration:
          - testName: rejects invalid cover crop metadata
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/memory/MemoryServiceTest.kt
          - testName: keeps existing standalone cover when new cover validation fails
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/memory/MemoryServiceTest.kt
          - testName: rejects crop only without existing standalone cover
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/memory/MemoryServiceTest.kt
  - id: memory.core.date-range
    statement: Valid date ranges are accepted and end-before-start is rejected.
    coverage:
      backend:
        integration:
          - testName: updates and validates memory date range
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/memory/MemoryServiceTest.kt
          - testName: rejects memory create with end date before start date
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/memory/MemoryServiceTest.kt
      frontend:
        unit:
          - testName: updates memory display metadata and emits the updated memory
            kind: positive
            ref: frontend/src/features/memories/components/MemoryDialogs.test.ts
          - testName: sets the memory end date from the initial start date and enables full-field date picker opening
            kind: positive
            ref: frontend/src/features/memories/components/MemoryDialogs.test.ts
          - testName: does not overwrite a manually selected memory end date when the start date changes
            kind: negative
            ref: frontend/src/features/memories/components/MemoryDialogs.test.ts
          - testName: keeps memory creation disabled for an invalid date range
            kind: negative
            ref: frontend/src/features/memories/components/MemoryDialogs.test.ts
          - testName: fills an emptied memory end date from the next edited start date
            kind: positive
            ref: frontend/src/features/memories/components/MemoryDialogs.test.ts
          - testName: keeps memory editing from submitting an invalid date range
            kind: negative
            ref: frontend/src/features/memories/components/MemoryDialogs.test.ts
          - testName: deletes a memory after explicit confirmation
            kind: positive
            ref: frontend/src/features/memories/components/MemoryDialogs.test.ts
          - testName: shows progress and blocks duplicate memory deletion while pending
            kind: negative
            ref: frontend/src/features/memories/components/MemoryDialogs.test.ts
  - id: memory.core.search-visible-only
    statement: Search returns only visible Memories, folders and journal snippets.
    coverage:
      backend:
        integration:
          - testName: search finds visible memories folders and journal snippets with ranked results
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/memory/MemoryServiceTest.kt
          - testName: search only returns memories and folders in visible scopes
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/memory/MemoryServiceTest.kt
          - testName: search limits result count
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/memory/MemoryServiceTest.kt
      frontend:
        unit:
          - testName: opens search from the topbar and navigates to a result
            kind: positive
            ref: frontend/src/components/app/WorkspaceTopbar.test.ts
          - testName: closes search when keyboard focus leaves the search area
            kind: positive
            ref: frontend/src/components/app/WorkspaceTopbar.test.ts
          - testName: shows active uploads next to search and can cancel all
            kind: positive
            ref: frontend/src/components/app/WorkspaceTopbar.test.ts
  - id: memory.core.detail-navigation
    statement: Memory detail renders navigable context, overview sections and child navigation.
    coverage:
      frontend:
        unit:
          - testName: renders header date total media and chapters
            kind: positive
            ref: frontend/src/features/memories/components/MemoryDetail.test.ts
          - testName: does not render scope metadata
            kind: negative
            ref: frontend/src/features/memories/components/MemoryDetail.test.ts
          - testName: hides chapter count when there are no chapters
            kind: negative
            ref: frontend/src/features/memories/components/MemoryDetail.test.ts
          - testName: does not use the first media item as an implicit cover
            kind: negative
            ref: frontend/src/features/memories/components/MemoryDetail.test.ts
          - testName: uses and emits controlled active tab state
            kind: positive
            ref: frontend/src/features/memories/components/MemoryDetail.test.ts
          - testName: renders an explicit cover image
            kind: positive
            ref: frontend/src/features/memories/components/MemoryDetail.test.ts
        integration:
          - testName: memory detail renders breadcrumb context and memory tabs
            kind: positive
            ref: frontend/e2e/memory-detail.spec.ts
          - testName: memory detail actions, tabs, and share dialog adapt to the viewport
            kind: positive
            ref: frontend/e2e/responsive.spec.ts
      ios:
        unit:
          - testName: testJustifiedLayoutCanLimitRenderedRows
            kind: positive
            ref: ios/VeyqTests/VeyqTests.swift
          - testName: testMockMemoryDetailIncludesNavigableChapters
            kind: positive
            ref: ios/VeyqTests/VeyqTests.swift
          - testName: testShareImportTargetsIncludeChapters
            kind: positive
            ref: ios/VeyqTests/VeyqTests.swift
          - testName: testShareImportTargetsDoNotFetchUnknownChapters
            kind: negative
            ref: ios/VeyqTests/VeyqTests.swift
          - testName: testShareImportMemoryTargetDecodesChapterMetadata
            kind: positive
            ref: ios/VeyqTests/VeyqTests.swift
          - testName: testInternalMemoryShareLinksUseSectionHashes
            kind: positive
            ref: ios/VeyqTests/VeyqTests.swift
          - testName: testAPIClientListsMemoryChaptersWithBearerHeader
            kind: positive
            ref: ios/VeyqTests/VeyqTests.swift
      e2e:
        ios:
          - testName: testConnectAndOpenMemoryDetail
            kind: positive
            ref: ios/VeyqUITests/VeyqUITests.swift
  - id: memory.core.memory-schema-baseline
    statement: The baseline migration creates the current Memory model without legacy Album tables.
    coverage:
      backend:
        integration:
          - testName: baseline migration creates memory model without legacy album tables
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/memory/MemoryMigrationTest.kt
  - id: memory.core.participant-profile-visibility
    statement: Memory participants and profile Memory visibility follow tenant, group and personal scope rules.
    coverage:
      backend:
        integration:
          - testName: adds lists and removes tenant memory participants
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/memory/MemoryServiceTest.kt
          - testName: participant eligibility follows group and personal memory scope
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/memory/MemoryServiceTest.kt
          - testName: participant profile memories return visible roots only
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/memory/MemoryServiceTest.kt
      frontend:
        unit:
          - testName: loads candidates and saves add remove diffs
            kind: positive
            ref: frontend/src/features/memories/components/MemoryParticipantsDialog.test.ts
          - testName: shows selected count and selected candidate state
            kind: positive
            ref: frontend/src/features/memories/components/MemoryParticipantsDialog.test.ts
          - testName: filters participants by display name
            kind: positive
            ref: frontend/src/features/memories/components/MemoryParticipantsDialog.test.ts
          - testName: filters participants by permalink
            kind: positive
            ref: frontend/src/features/memories/components/MemoryParticipantsDialog.test.ts
          - testName: keeps hidden selections while filtering
            kind: negative
            ref: frontend/src/features/memories/components/MemoryParticipantsDialog.test.ts
          - testName: links visible participants to their profile routes
            kind: positive
            ref: frontend/src/features/memories/components/MemoryParticipantsStrip.test.ts
          - testName: renders avatar images when available
            kind: positive
            ref: frontend/src/features/memories/components/MemoryParticipantsStrip.test.ts
          - testName: moves additional participants behind the overflow control
            kind: positive
            ref: frontend/src/features/memories/components/MemoryParticipantsStrip.test.ts
  - id: memory.core.header-counts
    statement: Memory headers separate direct and descendant media counts.
    coverage:
      backend:
        integration:
          - testName: memory header separates direct and descendant media counts
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/memory/MemoryServiceTest.kt
  - id: memory.core.path-resolution
    statement: Memory path resolution preserves group and personal root scopes.
    coverage:
      backend:
        integration:
          - testName: creates and resolves memories by folder path
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/memory/MemoryServiceTest.kt
          - testName: folder paths preserve group and personal root scopes
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/memory/MemoryServiceTest.kt
  - id: memory.core.creation-entrypoints
    statement: Folder and Memory creation live in content tiles, not the topbar.
    coverage:
      frontend:
        integration:
          - testName: folder and memory creation live in content tiles, not the topbar
            kind: negative
            ref: frontend/e2e/tenant-navigation.spec.ts
  - id: memory.core.card-rendering
    statement: Memory cards render dates, cover images and fallback covers without leaking extra metadata.
    coverage:
      frontend:
        unit:
          - testName: renders a single date when the memory range is within one day
            kind: positive
            ref: frontend/src/features/memories/components/MemoryCard.test.ts
          - testName: renders a date range across multiple days
            kind: positive
            ref: frontend/src/features/memories/components/MemoryCard.test.ts
          - testName: renders the cover image when a cover url exists
            kind: positive
            ref: frontend/src/features/memories/components/MemoryCard.test.ts
          - testName: renders the fallback cover icon without additional card metadata
            kind: negative
            ref: frontend/src/features/memories/components/MemoryCard.test.ts
  - id: memory.core.tab-hash-routing
    statement: Memory tab hashes parse, serialize and fall back to gallery safely.
    coverage:
      frontend:
        unit:
          - testName: falls back to gallery for empty and unknown hashes
            kind: negative
            ref: frontend/src/features/memories/utils/memoryTabs.test.ts
          - testName: parses supported tab hashes
            kind: positive
            ref: frontend/src/features/memories/utils/memoryTabs.test.ts
          - testName: serializes tabs to route hashes
            kind: positive
            ref: frontend/src/features/memories/utils/memoryTabs.test.ts
          - testName: uses memory tab hashes and drops them when opening a child memory
            kind: positive
            ref: frontend/src/views/TenantView.test.ts
          - testName: opens a newly created child memory
            kind: positive
            ref: frontend/src/views/TenantView.test.ts
gaps:
  - reason: No current e2e.browser test runs Memory CRUD against frontend, Quarkus and a test database together.
    followUp: Add full-stack browser coverage for the highest-risk Memory creation and navigation flow.
