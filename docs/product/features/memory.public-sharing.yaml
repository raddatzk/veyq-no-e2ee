id: memory.public-sharing
title: Public Memory Sharing
status: implemented
capabilities:
  - memory.public-sharing
productArea: Public Memory shares with Viewer, Contributor, Manager and Uploader roles.
entryPoints:
  - docs/api/shares.openapi.yaml
  - frontend/src/views/PublicShareView.vue
acceptanceCriteria:
  - id: memory.public-sharing.password-login
    statement: Password-protected shares require password and open access token cookie.
    coverage:
      backend:
        integration:
          - testName: public share requires password and opens access token cookie
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/memory/MemoryShareResourceTest.kt
      frontend:
        unit:
          - testName: opens a password-protected viewer share without a display name
            kind: positive
            ref: frontend/src/views/PublicShareView.test.ts
  - id: memory.public-sharing.password-hashing
    statement: New share passwords are stored as Argon2id.
    coverage:
      backend:
        integration:
          - testName: new public share password is stored as argon2id
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/memory/MemoryShareResourceTest.kt
  - id: memory.public-sharing.passwordless-viewer
    statement: Passwordless viewer shares can read memory without login.
    coverage:
      backend:
        integration:
          - testName: passwordless viewer reads memory without login
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/memory/MemoryShareResourceTest.kt
  - id: memory.public-sharing.contributor-identity-required
    statement: Passwordless contributors require identity login before write.
    coverage:
      backend:
        integration:
          - testName: passwordless contributor requires identity login before write
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/memory/MemoryShareResourceTest.kt
  - id: memory.public-sharing.password-update-revocation
    statement: Password update can set, remove and revoke sessions.
    coverage:
      backend:
        integration:
          - testName: password update can leave set remove and revoke sessions
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/memory/MemoryShareResourceTest.kt
  - id: memory.public-sharing.viewer-readonly
    statement: Viewer shares can read Memory view but cannot write or delete.
    coverage:
      backend:
        integration:
          - testName: viewer reads memory view but cannot write or delete
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/memory/MemoryShareResourceTest.kt
      frontend:
        integration:
          - testName: major line 1 public viewer share stays gallery-only and shows share scope
            kind: negative
            ref: frontend/e2e/major-1-smoke.spec.ts
  - id: memory.public-sharing.contributor-write-no-delete
    statement: Contributor shares can write inside subtree but cannot delete.
    coverage:
      backend:
        integration:
          - testName: contributor writes inside subtree but cannot delete
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/memory/MemoryShareResourceTest.kt
  - id: memory.public-sharing.manager-delete-submemory
    statement: Manager shares can delete submemories but not share root.
    coverage:
      backend:
        integration:
          - testName: manager deletes submemories but not share root
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/memory/MemoryShareResourceTest.kt
  - id: memory.public-sharing.header-no-private-scope
    statement: Public share header exposes subtree counts without private scope data.
    coverage:
      backend:
        integration:
          - testName: public share memory header exposes subtree counts without scope
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/memory/MemoryShareResourceTest.kt
      frontend:
        integration:
          - testName: major line 1 public viewer share stays gallery-only and shows share scope
            kind: positive
            ref: frontend/e2e/major-1-smoke.spec.ts
  - id: memory.public-sharing.notices-and-terms
    statement: Tenant terms and share notices gate public access where configured.
    coverage:
      backend:
        integration:
          - testName: tenant terms and share notices are versioned and exposed before share login
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/memory/MemoryShareResourceTest.kt
        unit:
          - testName: share notice can be updated and cleared
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/memory/MemoryShareResourceTest.kt
      frontend:
        unit:
          - testName: requires accepting tenant terms before showing the share login
            kind: positive
            ref: frontend/src/views/PublicShareView.test.ts
          - testName: does not reuse share notice acceptance across shares
            kind: negative
            ref: frontend/src/views/PublicShareView.test.ts
  - id: memory.public-sharing.rate-limit
    statement: Share login failures are rate-limited and success clears failures.
    coverage:
      backend:
        integration:
          - testName: share login is rate limited and success clears failures
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/memory/MemoryShareResourceTest.kt
        unit:
          - testName: share login rate limit ignores spoofed forwarded for by default
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/memory/MemoryShareResourceTest.kt
  - id: memory.public-sharing.stable-error-codes
    statement: Public share upload and cover errors return stable API codes.
    coverage:
      backend:
        unit:
          - testName: public share upload returns stable code for empty files
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/memory/MemoryShareResourceTest.kt
          - testName: public share cover returns stable code for invalid crop
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/memory/MemoryShareResourceTest.kt
  - id: memory.public-sharing.managed-share-creation
    statement: Managed public shares can be named and created without passwords.
    coverage:
      backend:
        unit:
          - testName: managed share can be named and created without password
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/memory/MemoryShareResourceTest.kt
  - id: memory.public-sharing.share-dialog-password-management
    statement: Share dialog manages password protection from the Memory UI.
    coverage:
      frontend:
        integration:
          - testName: share dialog manages password protection with a toggle
            kind: positive
            ref: frontend/e2e/memory-detail.spec.ts
  - id: memory.public-sharing.public-route-rendering
    statement: Public share routes render shared Memory views under stable public URLs.
    coverage:
      frontend:
        integration:
          - testName: public share route renders the shared memory view under /s
            kind: positive
            ref: frontend/e2e/memory-detail.spec.ts
  - id: memory.public-sharing.public-auth-responsive
    statement: Public authentication screens stay usable on narrow viewports.
    coverage:
      frontend:
        integration:
          - testName: public auth screens stay within the viewport
            kind: positive
            ref: frontend/e2e/responsive.spec.ts
  - id: memory.public-sharing.share-dialog-management
    statement: Memory share dialogs manage regular and uploader shares through compact row actions.
    coverage:
      frontend:
        unit:
          - testName: passes file names to injected share media upload handlers
            kind: positive
            ref: frontend/src/features/memories/components/MemoryDialogs.test.ts
          - testName: manages existing shares through compact row actions
            kind: positive
            ref: frontend/src/features/memories/components/MemoryDialogs.test.ts
          - testName: manages uploader shares separately from memory shares
            kind: positive
            ref: frontend/src/features/memories/components/MemoryDialogs.test.ts
  - id: memory.public-sharing.public-shell-behavior
    statement: >-
      Public share shell preserves footer, hero, notices, tab hashes and close actions across protected and
      authenticated states.
    coverage:
      frontend:
        unit:
          - testName: shows a public footer and opens browser privacy settings in a dialog
            kind: positive
            ref: frontend/src/views/PublicShareView.test.ts
          - testName: keeps the public share hero on protected login screens
            kind: positive
            ref: frontend/src/views/PublicShareView.test.ts
          - testName: stores share notice acceptance for the current share
            kind: positive
            ref: frontend/src/views/PublicShareView.test.ts
          - testName: reuses tenant term acceptance across shares on the same domain
            kind: positive
            ref: frontend/src/views/PublicShareView.test.ts
          - testName: hides the public share hero once the memory detail is visible
            kind: positive
            ref: frontend/src/views/PublicShareView.test.ts
          - testName: uses memory tab hashes and drops them when opening a child memory
            kind: positive
            ref: frontend/src/views/PublicShareView.test.ts
          - testName: keeps a close action for authenticated share sessions
            kind: positive
            ref: frontend/src/views/PublicShareView.test.ts
gaps:
  - reason: No real full-stack browser E2E exists for public share permissions yet.
    followUp: Add e2e.browser coverage after a full-stack browser harness exists.
