id: auth.password-login
title: Password Login
status: implemented
capabilities: []

productArea: Email/password login, invalid credential handling, login rate limits and input interpretation boundaries.
entryPoints:
  - docs/api/auth.openapi.yaml
  - backend/src/main/kotlin/com/veyq/api/auth
  - frontend/src/views/LoginView.vue
acceptanceCriteria:
  - id: auth.password-login.valid-credentials-issue-session
    statement: Valid email/password credentials authenticate the user and issue access and refresh cookies.
    coverage:
      backend:
        integration:
          - testName: login succeeds and sets access and refresh cookies
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/auth/AuthResourceTest.kt

  - id: auth.password-login.invalid-credentials-rejected
    statement: Missing, incomplete or wrong password login requests are rejected without issuing access or refresh cookies.
    coverage:
      backend:
        integration:
          - testName: login fails for wrong password
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/auth/AuthResourceTest.kt

  - id: auth.password-login.failures-are-rate-limited
    statement: Repeated failed password login attempts are rate-limited and expose retry timing without authenticating the request.
    coverage:
      backend:
        integration:
          - testName: login failures are rate limited with retry after header
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/auth/AuthResourceTest.kt

  - id: auth.password-login.input-treated-as-data
    statement: Password login treats submitted email and password values as data and does not interpret them as executable instructions or backend control input.
    gaps:
      - reason: No dedicated automated password-login input-interpretation coverage exists yet for generated input variants.
        followUp: Add backend integration coverage for dynamically selected login input variants against the login endpoint.

  - id: auth.password-login.errors-are-safe
    statement: Password login failures return stable, safe error responses without exposing whether an account exists or leaking internal exception details.
    coverage:
      backend:
        integration:
          - testName: login fails for wrong password
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/auth/AuthResourceTest.kt
    gaps:
      - reason: Current coverage proves wrong-password rejection but does not separately assert equivalent response shape for unknown users and malformed login input.
        followUp: Add backend integration assertions for safe login error shape across unknown user, malformed body and dynamically generated input cases.
