name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "!docs/api/**"
      - "!docs/wiki/coverage/**"
      - "!docs/product/test-feature-reverse-audit.md"
      - "site/**"
      - ".github"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "!docs/api/**"
      - "!docs/wiki/coverage/**"
      - "!docs/product/test-feature-reverse-audit.md"
      - "site/**"
      - ".github"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Run backend checks
        working-directory: backend
        run: ./gradlew --no-daemon check

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run frontend checks
        working-directory: web
        run: npm run check

  trust-chain:
    name: Trust-chain validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # The deterministic guards from scripts/ (PyYAML is the only dep). A red guard fails the build:
      #   validate_coverage       — every use-case acceptance criterion resolves to a test ref on each surface
      #   validate_changes        — CR number/id unique, satisfies:/adrs: resolve, adrs quoted
      #   validate_doc_links      — every relative link under docs/ resolves
      #   validate_feature_wiring — every uc/en is indexed; enabler Serves ↔ back-reference is symmetric
      #   validate_capabilities   — every capability's serves resolves to a real, built use-case (ADR 0032)
      #   validate_contracts_common — shared OpenAPI components (ErrorResponse/bearerAuth/params/enums) don't drift (ADR 0038)
      #   validate_http_failure_projection — ErrorResponse is built only in the shared/http/ writer (ADR 0042)
      #   validate_scope_model_vocabulary — docs name no scope keypair / ADMIN role; entity roles == contract enum (ADR 0007/0024)
      - name: Validate trust-chain guards
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet pyyaml
          .venv/bin/python scripts/validate_coverage.py
          .venv/bin/python scripts/validate_changes.py
          .venv/bin/python scripts/validate_doc_links.py
          .venv/bin/python scripts/validate_feature_wiring.py
          .venv/bin/python scripts/validate_capabilities.py
          .venv/bin/python scripts/validate_contracts_common.py
          .venv/bin/python scripts/validate_http_failure_projection.py
          .venv/bin/python scripts/validate_scope_model_vocabulary.py

  web-e2e:
    name: Web E2E (live backend)
    # Disabled: scripts/run_web_e2e.py was moved to legacy/ in the greenfield reset and not yet ported back.
    # Drop `if: false` to re-enable once the web e2e orchestrator is restored to scripts/.
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Build the runnable fast-jar once; the orchestrator boots a fresh copy (fresh in-mem DB) per e2e file,
      # because every suite registers its own single-owner-per-boot Server Owner.
      - name: Build backend fast-jar
        working-directory: backend
        run: ./gradlew --no-daemon quarkusBuild

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Run web E2E suites against a live backend
        run: python3 scripts/run_web_e2e.py
