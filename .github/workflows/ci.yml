name: CI

on:
  push:
    branches:
      - main
    # Docs are ignored *here* on purpose: a doc change cannot break `./gradlew check` or `npm run check`.
    # The guards that do validate docs live in trust-chain.yml, which is unfiltered.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "site/**"
      - ".github"
  pull_request:
    branches:
      - main
    # Docs are ignored *here* on purpose: a doc change cannot break `./gradlew check` or `npm run check`.
    # The guards that do validate docs live in trust-chain.yml, which is unfiltered.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "site/**"
      - ".github"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Run backend checks
        working-directory: backend
        run: ./gradlew --no-daemon check

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run frontend checks
        working-directory: web
        run: npm run check

  web-e2e:
    name: Web E2E (live backend)
    # Disabled: scripts/run_web_e2e.py is in the tree but not yet ported — it still globs frontend/, passes
    # VEYQ_API_BASE where the suites read VEYQ_BASE, and sets two backend knobs that never existed. Drop
    # `if: false` once the port lands. See architecture/README.md §11 + changes/cr-e2e-orchestrator.md.
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Build the runnable fast-jar once; the orchestrator boots a fresh copy (fresh in-mem DB) per e2e file,
      # because every suite registers its own single-owner-per-boot Server Owner.
      - name: Build backend fast-jar
        working-directory: backend
        run: ./gradlew --no-daemon quarkusBuild

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Run web E2E suites against a live backend
        run: python3 scripts/run_web_e2e.py
