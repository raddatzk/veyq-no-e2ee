name: Container

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build veyq image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute veyq version
        id: veyq-version
        run: |
          major="$(tr -d '[:space:]' < VERSION)"
          echo "major=${major}" >> "$GITHUB_OUTPUT"
          echo "version=${major}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/veyq

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: runtime-jvm
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository_owner }}/veyq:build-${{ github.sha }}-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VEYQ_VERSION=${{ steps.veyq-version.outputs.version }}
            VEYQ_REVISION=sha-${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=veyq-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=veyq-${{ matrix.arch }}

  publish:
    name: Publish multi-arch image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compute veyq version
        id: veyq-version
        run: |
          major="$(tr -d '[:space:]' < VERSION)"
          echo "major=${major}" >> "$GITHUB_OUTPUT"
          echo "version=${major}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/veyq
          tags: |
            type=ref,event=tag
            type=raw,value=${{ steps.veyq-version.outputs.version }},enable={{is_default_branch}}
            type=raw,value=${{ steps.veyq-version.outputs.major }},enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create multi-arch manifest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/veyq
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          mapfile -t tags <<< "$TAGS"
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=("-t" "$tag")
          done

          docker buildx imagetools create \
            "${tag_args[@]}" \
            "$IMAGE:build-${GITHUB_SHA}-amd64" \
            "$IMAGE:build-${GITHUB_SHA}-arm64"
