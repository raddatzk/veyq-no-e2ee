name: Mutation (backend)

# The backend assertion-strength gate — the trust chain's last link on the pure decision tier (ADR 0045 §2).
# validate_coverage.py proves a test REF resolves; this proves the test's ASSERTIONS pin the decision (a rotate
# that re-grants a pendingConsent proposal, a cascade that soft-deletes shared content, a token-bucket refill that
# discards its sub-token remainder — each dies here). PIT mutates only the curated pure policies (backend/pitest.scope.json), never the dumb
# stores nor the @QuarkusTest slices (ADR 0045 §2). The build's `mutationThreshold` is the gate; the meta-check is
# its per-glob sibling.
#
# Cost control is PIT's INCREMENTAL history file (ADR 0045 §4), cached below: PIT re-tests only mutants whose code
# OR covering tests changed since the cached run — so a weakened *assertion* (a test edit, no source change) is
# still caught, which a file-level git-diff scope would have missed.
#
# Not in ci.yml's `backend` job: mutation is a heavier, path-gated job, kept off every push's critical path
# (CLAUDE.md / ADR 0045 §4 — `./gradlew check` stays compile + slices).

on:
  pull_request:
    branches: [main]
    # Source AND tests: a change to either can move the score (a weakened assertion lives in a *Test.kt), so either
    # must re-run the gate. The manifest/build/meta-check/workflow gate themselves. This list mirrors
    # backend/pitest.scope.json one-for-one, in the same order, and `scripts/validate_mutation_trigger_paths.py`
    # KEEPS it there — because editing the manifest alone does not: `b15807a7` added ShareAccessPolicy and
    # MembershipPolicy to the scope and left this filter behind, so a PR touching only those never ran the gate
    # (inbox #114). Adding a policy means editing both, and the guard is what says so.
    paths:
      - "backend/src/main/kotlin/com/veyq/app/features/spaces/scope/RotationPolicy.kt"
      - "backend/src/main/kotlin/com/veyq/app/features/admin/tenant/RemovalPolicy.kt"
      - "backend/src/main/kotlin/com/veyq/app/shared/ratelimit/TokenBucket.kt"
      - "backend/src/main/kotlin/com/veyq/app/features/sharing/ShareAccessPolicy.kt"
      - "backend/src/main/kotlin/com/veyq/app/features/spaces/scope/MembershipPolicy.kt"
      - "backend/src/test/kotlin/com/veyq/app/features/spaces/scope/RotationPolicyTest.kt"
      - "backend/src/test/kotlin/com/veyq/app/features/admin/tenant/RemovalPolicyTest.kt"
      - "backend/src/test/kotlin/com/veyq/app/shared/ratelimit/TokenBucketTest.kt"
      - "backend/src/test/kotlin/com/veyq/app/features/sharing/ShareAccessPolicyTest.kt"
      - "backend/src/test/kotlin/com/veyq/app/features/spaces/scope/MembershipPolicyTest.kt"
      - "backend/pitest.scope.json"
      - "backend/build.gradle.kts"
      - "scripts/mutation_meta_check_backend.py"
      - "scripts/mutation_meta_check_selftest.py"
      - ".github/workflows/mutation-backend.yml"
  # Also on main. A PR gates before the merge, so this is a backstop, not the primary gate: it catches what the PR
  # job structurally cannot — a direct push, an admin/force merge, or a green PR that lands on a main which has
  # meanwhile drifted. The same filter is repeated because Actions supports no YAML anchors; ci.yml duplicates its
  # own filter the same way. The guard checks the two blocks SEPARATELY, not as a union — hand-duplicated lists
  # drift apart, and a backstop that has quietly stopped covering a class is worse than none.
  push:
    branches: [main]
    paths:
      - "backend/src/main/kotlin/com/veyq/app/features/spaces/scope/RotationPolicy.kt"
      - "backend/src/main/kotlin/com/veyq/app/features/admin/tenant/RemovalPolicy.kt"
      - "backend/src/main/kotlin/com/veyq/app/shared/ratelimit/TokenBucket.kt"
      - "backend/src/main/kotlin/com/veyq/app/features/sharing/ShareAccessPolicy.kt"
      - "backend/src/main/kotlin/com/veyq/app/features/spaces/scope/MembershipPolicy.kt"
      - "backend/src/test/kotlin/com/veyq/app/features/spaces/scope/RotationPolicyTest.kt"
      - "backend/src/test/kotlin/com/veyq/app/features/admin/tenant/RemovalPolicyTest.kt"
      - "backend/src/test/kotlin/com/veyq/app/shared/ratelimit/TokenBucketTest.kt"
      - "backend/src/test/kotlin/com/veyq/app/features/sharing/ShareAccessPolicyTest.kt"
      - "backend/src/test/kotlin/com/veyq/app/features/spaces/scope/MembershipPolicyTest.kt"
      - "backend/pitest.scope.json"
      - "backend/build.gradle.kts"
      - "scripts/mutation_meta_check_backend.py"
      - "scripts/mutation_meta_check_selftest.py"
      - ".github/workflows/mutation-backend.yml"
  workflow_dispatch:

# One run per PR (or per main ref); a new push cancels the last (a mutation run is minutes, not seconds).
concurrency:
  group: veyq-mutation-backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mutation:
    name: Backend mutation gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      # The incremental history is the CI cache (ADR 0045 §4): PIT re-tests only mutants whose code or covering
      # tests changed since the cached run. Restored best-effort (restore-keys), a fresh copy saved each run so the
      # next PR starts warm. A missing file on a cold run is fine — PIT builds it from scratch.
      - name: Restore PIT incremental history
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: backend/build/pitest/history.bin
          key: pit-incremental-${{ github.sha }}
          restore-keys: |
            pit-incremental-

      - name: Run backend mutation gate
        working-directory: backend
        # build.gradle.kts breaks the build below the calibrated mutationThreshold (95) — that is the gate.
        run: ./gradlew --no-daemon pitest

      - name: Meta-check selftest (the total-vs-per-glob asymmetry is as documented)
        # Pins the two meta-checks' asymmetry (inbox #109) with fabricated fixtures — no real report needed. If
        # the check logic rots, this reds before the real check below.
        run: python3 scripts/mutation_meta_check_selftest.py

      - name: Per-glob meta-check (every scope glob mutated something)
        # ADR 0045 §4: a scope glob that matches nothing yet leaves the build green (its siblings carry the run,
        # so failWhenNoMutations stays silent) is a claim nothing backs — a renamed class the manifest missed.
        # Diff-free: the invariant holds on every run, not only when a PR touches the scope.
        run: python3 scripts/mutation_meta_check_backend.py
