# Greenfield iOS app. The SwiftUI app lives here and depends on the local `apple/` SwiftPM package
# (VeyqCrypto = shared crypto + slice logic, headlessly testable via `swift test`). Generate the
# Xcode project from this spec with `xcodegen generate` — no Xcode GUI required:
#   cd ios && xcodegen generate
#   xcodebuild -project Veyq.xcodeproj -scheme Veyq \
#     -destination 'platform=iOS Simulator,name=iPhone 16' build
name: Veyq
options:
  bundleIdPrefix: app.veyq
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  VeyqCrypto:
    path: ../apple
targets:
  Veyq:
    type: application
    platform: iOS
    sources:
      - Veyq
    dependencies:
      - package: VeyqCrypto
        product: VeyqCrypto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.veyq.ios
        MARKETING_VERSION: "1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: veyq
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # Simulator builds don't need signing; on-device uses this team (mirrors legacy).
        DEVELOPMENT_TEAM: MDQY93XVHF
