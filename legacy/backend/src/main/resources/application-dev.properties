# Dev profile (Quarkus `dev` profile — activated by `quarkusDev` and the "Run Backend" IntelliJ run config).
# These values were previously the `%dev.*` overrides inside application.properties.

# Local blind store: a real MariaDB on localhost:3306 (matches the mariadb:10.11 image in
# infra/docker-compose.yml). Flyway migrates the schema at start. Spin one up with e.g.
#   docker run --rm -p 3306:3306 -e MARIADB_DATABASE=veyq -e MARIADB_USER=veyq \
#     -e MARIADB_PASSWORD=veyq -e MARIADB_ROOT_PASSWORD=veyq mariadb:10.11
# Override any of these via the DB_* env if your local DB differs.
quarkus.datasource.db-kind=${DB_KIND:mariadb}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:mariadb://localhost:3306/veyq}
quarkus.datasource.username=${DB_USER:veyq}
quarkus.datasource.password=${DB_PASSWORD:change-me}

# Mail is captured in the MockMailbox by default (never sent). To exercise REAL mail locally, drop a gitignored
# `backend/.env` (Quarkus dev auto-loads it) with VEYQ_MAIL_MOCK=false + the MAIL_* SMTP creds — see
# backend/.env.example. Keep secrets out of the tracked .run/ configs; .env is the untracked place for them.
quarkus.mailer.mock=${VEYQ_MAIL_MOCK:true}
# Local frontend handoff URL. Production/default config remains operator-supplied via VEYQ_APP_BASE_URL.
veyq.app.base-url=${VEYQ_APP_BASE_URL:http://localhost:8081}

# Blob store: defaults to the in-process backend so `quarkusDev` boots with no MinIO (media upload/download is
# then unavailable — direct-to-store is the only transport, ADR 0021). To exercise media locally, start the dev
# MinIO (infra/docker-compose.dev.yml) and set BLOB_STORE_BACKEND=s3 — the s3 defaults below already point at it
# (the "Backend (quarkusDev)" run config does this). The browser reaches MinIO at the public endpoint directly.
veyq.blob-store.backend=${BLOB_STORE_BACKEND:memory}
veyq.blob-store.s3-endpoint=${BLOB_STORE_S3_ENDPOINT:http://localhost:9000}
veyq.blob-store.s3-public-endpoint=${BLOB_STORE_S3_PUBLIC_ENDPOINT:http://localhost:9000}
veyq.blob-store.s3-access-key=${BLOB_STORE_S3_ACCESS_KEY:veyqdev}
veyq.blob-store.s3-secret-key=${BLOB_STORE_S3_SECRET_KEY:veyqdevsecret}

# Rate limiter off so the slice + opt-in e2e suites can hammer auth paths from one host.
veyq.ratelimit.enabled=false

# Local smoke bootstrap endpoint. It only persists client-generated account key material; content still uses
# the normal E2EE API paths.
veyq.dev-tools.enabled=true
