# JVM memory for the Gradle build JVM and the Kotlin compiler.
# CodeQL's autobuild runs Gradle with --no-daemon and the Kotlin compiler
# runs out of heap ("GC overhead limit exceeded") under the default settings,
# so raise it for both the build JVM and the Kotlin compile daemon.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g
