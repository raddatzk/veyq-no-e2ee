openapi: 3.1.0
info:
  title: veyq common
  version: 0.1.0
paths: {}
components:
  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string, x-field-extra-annotation: ['@field:jakarta.validation.constraints.Size(max = 2000)'] }
    ServerRole:
      type: string
      enum: [ServerOwner, ServerMember]
    CryptoSuiteId:
      type: string
      description: Versioned crypto-suite identifier, e.g. "v1".
      maxLength: 16
      pattern: '^[a-z][a-z0-9-]*$'
    UserSummary:
      type: object
      required: [id, email, displayName, serverRole, username]
      properties:
        id: { type: string }
        email: { type: string, x-field-extra-annotation: ['@field:com.veyq.app.shared.validation.Email'] }
        displayName: { type: string, x-field-extra-annotation: ['@field:com.veyq.app.shared.validation.DisplayName'] }
        serverRole: { $ref: "#/components/schemas/ServerRole" }
        username:
          type: string
          description: URL-safe stable username/profile address segment.
          maxLength: 80
          pattern: '^[a-z0-9](?:[a-z0-9-]{0,78}[a-z0-9])?$'
          x-field-extra-annotation: ['@field:jakarta.validation.constraints.Size(max = 80)']
        avatarUrl:
          type: string
          description: Short-lived presigned object-store URL for the user's avatar. The avatar object key contains a generated version segment that changes on every upload and acts as the cache-buster.
          x-field-extra-annotation: ['@field:jakarta.validation.constraints.Size(max = 8192)']
    IdentityPublicKey:
      type: object
      description: The user's hybrid KEM public key + Ed25519 signing public key (base64url).
      required: [suiteId, kemPublicKey, signPublicKey]
      properties:
        suiteId: { $ref: "#/components/schemas/CryptoSuiteId" }
        kemPublicKey: { type: string, maxLength: 8192, x-field-extra-annotation: ['@field:jakarta.validation.constraints.Size(max = 8192)'] }
        signPublicKey: { type: string, maxLength: 512, x-field-extra-annotation: ['@field:jakarta.validation.constraints.Size(max = 512)'] }
    Blob:
      type: object
      description: An opaque, self-describing ciphertext blob (base64url bytes + its suite id).
      required: [suiteId, bytes]
      properties:
        suiteId: { $ref: "#/components/schemas/CryptoSuiteId" }
        # base64url ciphertext; bounded well above the largest single frame (~32 MiB → ~43M chars), the real
        # cap being quarkus.http.limits.max-body-size.
        bytes: { type: string, maxLength: 46000000, x-field-extra-annotation: ['@field:jakarta.validation.constraints.Size(max = 46000000)'] }
    KemPublicKey:
      type: object
      description: A hybrid KEM public key (X25519 || ML-KEM-768), base64url. Used as a scope/recipient key.
      required: [suiteId, kemPublicKey]
      properties:
        suiteId: { $ref: "#/components/schemas/CryptoSuiteId" }
        kemPublicKey: { type: string, maxLength: 8192, x-field-extra-annotation: ['@field:jakarta.validation.constraints.Size(max = 8192)'] }
    MasterKeyWrap:
      type: object
      description: One wrapped copy of the master key, openable by a single unlock method.
      required: [unlockMethod, suiteId, wrappedKey]
      properties:
        unlockMethod: { type: string, enum: [PASSWORD, PASSKEY, RECOVERY, DEVICE] }
        suiteId: { $ref: "#/components/schemas/CryptoSuiteId" }
        wrappedKey: { type: string, maxLength: 16384, x-field-extra-annotation: ['@field:jakarta.validation.constraints.Size(max = 16384)'] }
        kdfParams: { type: string, maxLength: 4096, x-field-extra-annotation: ['@field:jakarta.validation.constraints.Size(max = 4096)'] }
        credentialRef: { type: string, maxLength: 1024, x-field-extra-annotation: ['@field:jakarta.validation.constraints.Size(max = 1024)'] }
        # Human label for DEVICE wraps (the device/login name shown in user settings). Operator-visible, low
        # sensitivity; never set for PASSWORD/RECOVERY.
        name: { type: string, maxLength: 255, x-field-extra-annotation: ['@field:jakarta.validation.constraints.Size(max = 255)'] }
    AuthVerifier:
      type: object
      description: Proves account authentication to the server without revealing the master key. For ARGON2_PROOF, `verifier` is an Argon2id PHC string (`$argon2id$v=19$m=32768,t=3,p=1$...$...`).
      required: [kind, suiteId, verifier]
      properties:
        kind: { type: string, enum: [ARGON2_PROOF, WEBAUTHN] }
        suiteId: { $ref: "#/components/schemas/CryptoSuiteId" }
        verifier: { type: string, maxLength: 8192, x-field-extra-annotation: ['@field:jakarta.validation.constraints.Size(max = 8192)'] }
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            code: BAD_REQUEST
            message: Invalid request.
    Conflict:
      description: Conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            code: CONFLICT
            message: The request conflicts with the current resource state.
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            code: UNAUTHORIZED
            message: Authentication required.
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            code: FORBIDDEN
            message: The authenticated user is not allowed to perform this action.
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            code: NOT_FOUND
            message: The requested resource was not found.
    TooManyRequests:
      description: Too many requests
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            code: TOO_MANY_REQUESTS
            message: Rate limit exceeded.
  parameters:
    AuthHeader:
      name: Authorization
      in: header
      required: true
      description: 'Bearer <sessionToken>'
      schema: { type: string }
