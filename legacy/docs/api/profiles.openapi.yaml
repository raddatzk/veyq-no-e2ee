openapi: 3.1.0
info:
  title: veyq profiles
  version: 0.1.0
paths:
  /api/profiles/{username}:
    get:
      tags:
        - Profiles
      operationId: getUserProfile
      summary: Read a tenant-visible user profile by profile address.
      description: |
        Returns server-visible identity metadata for a user visible in the tenant. It deliberately does not expose a server-side participant-to-Memory graph; clients aggregate person-centric memories from decrypted participant payloads they already can access.

        `avatarUrl`, when present, is a short-lived presigned object-store URL. The avatar object key contains a generated version segment that changes on every upload and acts as the cache-buster.
      parameters:
        - $ref: "./common.openapi.yaml#/components/parameters/AuthHeader"
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tenant-visible profile metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileSummary"
        '401':
          $ref: "./common.openapi.yaml#/components/responses/Unauthorized"
        '403':
          $ref: "./common.openapi.yaml#/components/responses/Forbidden"
        '404':
          $ref: "./common.openapi.yaml#/components/responses/NotFound"
components:
  schemas:
    UserProfileSummary:
      type: object
      required:
        - id
        - displayName
        - username
        - initials
        - memories
      properties:
        id:
          type: string
        displayName:
          type: string
        username:
          type: string
        initials:
          type: string
        avatarUrl:
          type: string
          description: Short-lived presigned object-store URL for the avatar. The avatar object key contains the cache-busting version segment.
        memories:
          type: array
          items:
            type: object
