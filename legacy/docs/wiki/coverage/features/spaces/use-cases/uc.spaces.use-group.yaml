acceptanceCriteria:
  - id: uc.spaces.use-group.roster-is-the-wrap
    statement: The unified space roster lists TENANT entries exactly for tenants where the caller is an active member and holds the TENANT_ROOT scope key (access = the wrap); a member without the grant sees no enterable tenant-root space.
    coverage:
      backend:
        integration:
          - testName: listsPersonalPlusHeldTenantRootSpaces
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/app/features/spaces/switchactivespace/MySpacesSliceTest.kt
          - testName: listsPersonalPlusHeldTenantRootSpaces
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/app/features/spaces/switchactivespace/MySpacesSliceTest.kt
  - id: uc.spaces.use-group.shared-collaboration
    statement: Two members of one group write and read the same shared content under a single scope content key; each sees the other's items.
    coverage:
      web:
        e2e:
          - testName: "lists the tenant-root space for both members and both read each other's shared items"
            kind: positive
            ref: frontend/src/features/spaces/useGroup/useGroup.e2e.test.ts
      android:
        e2e:
          - testName: twoMembersCollaborateOnOneSharedScope
            kind: positive
            ref: android/core/src/test/kotlin/app/veyq/crypto/UseGroupE2ETest.kt
      apple:
        e2e:
          - testName: testTwoMembersCollaborateOnOneSharedScope
            kind: positive
            ref: apple/Tests/VeyqCryptoTests/UseGroupE2ETests.swift
