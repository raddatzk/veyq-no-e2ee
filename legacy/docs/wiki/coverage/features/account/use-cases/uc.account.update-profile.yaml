id: uc.account.update-profile
title: Update profile
status: implemented
documents:
- type: feature
  ref: docs/wiki/features/account/_index.md
- type: useCase
  ref: docs/wiki/features/account/use-cases/uc.account.update-profile.md
- type: crosscutting
  ref: docs/wiki/crosscutting/security-model.md
- type: api
  ref: docs/api/account.openapi.yaml
- type: decision
  ref: docs/wiki/decisions/0031-profile-fields-server-visible.md
- type: entryPoint
  ref: backend/src/main/kotlin/com/veyq/app/features/account/login/LoginHandler.kt
acceptanceCriteria:
- id: uc.account.update-profile.display-name-and-username
  statement: The authenticated user can update server-visible display name and username; the response and later /api/me reads return the updated UserSummary.
  coverage:
    backend:
      integration:
      - testName: updatesCurrentProfileDisplayName
        kind: positive
        ref: backend/src/test/kotlin/com/veyq/app/features/account/login/LoginSliceTest.kt
- id: uc.account.update-profile.validation
  statement: Blank display names and invalid sessions are rejected before any profile update is persisted.
  coverage:
    backend:
      integration:
      - testName: updatesCurrentProfileDisplayName
        kind: negative
        ref: backend/src/test/kotlin/com/veyq/app/features/account/login/LoginSliceTest.kt
- id: uc.account.update-profile.username-conflict
  statement: Updating to a username held by another account is rejected.
  gaps:
  - reason: The handler implements a USERNAME_TAKEN conflict, but the current account slice test only covers success, blank display name and invalid sessions.
    followUp: Add a backend integration assertion for a second account that already owns the requested username.
