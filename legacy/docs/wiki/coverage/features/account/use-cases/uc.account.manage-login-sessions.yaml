acceptanceCriteria:
- id: uc.account.manage-login-sessions.list
  statement: The authenticated user can list active login-session families with encrypted labels and last-used timestamps.
  coverage:
    backend:
      integration:
      - testName: managesLoginSessionFamilies
        kind: positive
        ref: backend/src/test/kotlin/com/veyq/app/features/account/login/LoginSliceTest.kt
- id: uc.account.manage-login-sessions.rename
  statement: The authenticated user can replace one login-session family's encrypted display label.
  coverage:
    backend:
      integration:
      - testName: managesLoginSessionFamilies
        kind: positive
        ref: backend/src/test/kotlin/com/veyq/app/features/account/login/LoginSliceTest.kt
- id: uc.account.manage-login-sessions.remove
  statement: The authenticated user can revoke all rows in one root login-session family.
  coverage:
    backend:
      integration:
      - testName: managesLoginSessionFamilies
        kind: positive
        ref: backend/src/test/kotlin/com/veyq/app/features/account/login/LoginSliceTest.kt
      - testName: logoutInvalidatesTheAssociatedAccessAndRefreshTokenFamily
        kind: positive
        ref: backend/src/test/kotlin/com/veyq/app/features/account/login/LoginSliceTest.kt
