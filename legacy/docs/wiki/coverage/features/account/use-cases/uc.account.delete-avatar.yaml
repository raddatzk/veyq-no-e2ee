acceptanceCriteria:
- id: uc.account.delete-avatar.clears-profile-image
  statement: Deleting the current avatar clears the avatar pointer and returns a UserSummary without avatarUrl.
  gaps:
  - reason: The backend handler and web helper implement avatar deletion, but no active acceptance test maps to this endpoint.
    followUp: Add backend integration coverage for clearing an existing avatar and for the no-existing-avatar case.
- id: uc.account.delete-avatar.requires-session
  statement: Deleting an avatar requires a valid session.
  gaps:
  - reason: Session enforcement is implemented through the handler, but this endpoint has no direct negative coverage.
    followUp: Add a backend integration assertion for an invalid or missing bearer token.
