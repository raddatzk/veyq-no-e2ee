id: uc.account.reset-password
title: Reset password
status: implemented
documents:
- type: feature
  ref: docs/wiki/features/account/_index.md
- type: useCase
  ref: docs/wiki/features/account/use-cases/uc.account.reset-password.md
- type: crosscutting
  ref: docs/wiki/crosscutting/security-model.md
- type: crosscutting
  ref: docs/wiki/crosscutting/account-key-model.md
- type: api
  ref: docs/api/account.openapi.yaml
- type: entryPoint
  ref: backend/src/main/kotlin/com/veyq/app/features/account/resetpassword/PasswordResetHandler.kt
- type: entryPoint
  ref: backend/src/main/kotlin/com/veyq/app/features/account/resetpassword/PasswordResetResource.kt
- type: entryPoint
  ref: frontend/src/features/account/resetPassword/resetPassword.ts
acceptanceCriteria:
- id: uc.account.reset-password.recovery-wrap-lifecycle
  statement: Registration produces a RECOVERY wrap openable by the Secret Key alone, and the login key bag excludes that RECOVERY wrap.
  coverage:
    web:
      unit:
      - testName: "registration produces both a PASSWORD and a RECOVERY master-key wrap"
        kind: positive
        ref: frontend/src/features/account/resetPassword/resetPassword.test.ts
      - testName: "the RECOVERY wrap opens with the Secret Key alone and yields the SAME master key as the PASSWORD wrap"
        kind: positive
        ref: frontend/src/features/account/resetPassword/resetPassword.test.ts
      - testName: "re-wrapping the recovered master key under a NEW password round-trips (and the old password no longer opens it)"
        kind: positive
        ref: frontend/src/features/account/resetPassword/resetPassword.test.ts
      - testName: "recovery commitment (password reset)"
        kind: positive
        ref: frontend/src/shared/crypto/v1.conformance.test.ts
      e2e:
      - testName: "registration persists a RECOVERY wrap; login still works and the key bag excludes RECOVERY"
        kind: positive
        ref: frontend/src/features/account/resetPassword/resetPassword.e2e.test.ts
    apple:
      unit:
      - testName: testRecoveryWrapRoundTrips
        kind: positive
        ref: apple/Tests/VeyqCryptoTests/ResetPasswordTests.swift
      e2e:
      - testName: testRecoveryWrapNotInLoginKeyBag
        kind: positive
        ref: apple/Tests/VeyqCryptoTests/ResetPasswordE2ETests.swift
    android:
      unit:
      - testName: recoveryWrapRoundTrips
        kind: positive
        ref: android/core/src/test/kotlin/app/veyq/crypto/ResetPasswordTest.kt
      e2e:
      - testName: recoveryWrapNotInLoginKeyBag
        kind: positive
        ref: android/core/src/test/kotlin/app/veyq/crypto/ResetPasswordE2ETest.kt
- id: uc.account.reset-password.email-token-secret-key-proof
  statement: A reset via email token releases recovery material, re-wraps under a new password only with Secret-Key proof, consumes the token and invalidates sessions.
  coverage:
    backend:
      integration:
      - testName: resetsPasswordViaEmailTokenAndInvalidatesSessions
        kind: positive
        ref: backend/src/test/kotlin/com/veyq/app/features/account/resetpassword/PasswordResetSliceTest.kt
      - testName: rejectsConfirmWithoutSecretKeyProof
        kind: negative
        ref: backend/src/test/kotlin/com/veyq/app/features/account/resetpassword/PasswordResetSliceTest.kt
      - testName: rejectsInvalidToken
        kind: negative
        ref: backend/src/test/kotlin/com/veyq/app/features/account/resetpassword/PasswordResetSliceTest.kt
    web:
      unit:
      - testName: resets password with token from route
        kind: positive
        ref: frontend/src/views/ResetPasswordView.test.ts
- id: uc.account.reset-password.non-enumerable-request
  statement: Reset requests are silent for unknown addresses and accounts without a RECOVERY wrap.
  coverage:
    backend:
      integration:
      - testName: silentForUnknownEmailAndAccountsWithoutRecovery
        kind: negative
        ref: backend/src/test/kotlin/com/veyq/app/features/account/resetpassword/PasswordResetSliceTest.kt
