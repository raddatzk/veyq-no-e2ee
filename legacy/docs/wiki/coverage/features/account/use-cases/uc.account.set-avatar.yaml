acceptanceCriteria:
- id: uc.account.set-avatar.direct-upload
  statement: Starting an avatar upload returns a presigned upload ticket for a server-generated object key.
  gaps:
  - reason: The backend and web helper implement the direct-upload ticket flow, but no active acceptance test maps to it yet.
    followUp: Add backend integration coverage for successful ticket creation and presign-unavailable conflict.
- id: uc.account.set-avatar.complete-validates-object
  statement: Completing an upload validates ownership of the uploadRef, object existence and size before returning a UserSummary with avatarUrl.
  gaps:
  - reason: The completion validation branches are implemented in LoginHandler but lack direct slice coverage.
    followUp: Add backend integration coverage for success, malformed uploadRef, missing object and size-limit failures.
