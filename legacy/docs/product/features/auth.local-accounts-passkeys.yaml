id: auth.local-accounts-passkeys
title: Local Accounts And Passkeys
status: implemented
capabilities:
  - auth.passkeys
  - auth.totp-mfa
productArea: Local accounts, login, passkeys, password flows and invitations.
entryPoints:
  - docs/api/auth.openapi.yaml
  - docs/api/users.openapi.yaml
  - frontend/src/views/LoginView.vue
acceptanceCriteria:
  - id: auth.local-accounts-passkeys.password-login
    statement: Password login succeeds and sets access/refresh cookies.
    coverage:
      backend:
        integration:
          - testName: login succeeds and sets access and refresh cookies
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/auth/AuthResourceTest.kt
  - id: auth.local-accounts-passkeys.wrong-password-rejected
    statement: Wrong passwords are rejected and repeated failures are rate-limited.
    coverage:
      backend:
        integration:
          - testName: login fails for wrong password
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/auth/AuthResourceTest.kt
          - testName: login failures are rate limited with retry after header
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/auth/AuthResourceTest.kt
  - id: auth.local-accounts-passkeys.password-login-totp
    statement: Users can enable TOTP for password login, password login then requires a valid TOTP code, and passkey login is not stacked with TOTP.
    coverage:
      backend:
        integration:
          - testName: password login requires totp code when enabled
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/auth/AuthResourceTest.kt
          - testName: totp can be disabled with password and current code
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/auth/AuthResourceTest.kt
          - testName: totp enable requires current password
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/auth/AuthResourceTest.kt
      frontend:
        unit:
          - testName: asks for a TOTP code only after password login requires it
            kind: positive
            ref: frontend/src/views/LoginView.test.ts
          - testName: enables TOTP after showing the enrollment QR code
            kind: positive
            ref: frontend/src/features/settings/components/UserSettingsForm.test.ts
          - testName: shows manual TOTP secret only after fallback request
            kind: positive
            ref: frontend/src/features/settings/components/UserSettingsForm.test.ts
          - testName: hides TOTP setup for passkey-only accounts
            kind: negative
            ref: frontend/src/features/settings/components/UserSettingsForm.test.ts
          - testName: disables TOTP with password and current code
            kind: positive
            ref: frontend/src/features/settings/components/UserSettingsForm.test.ts
    gaps:
      - reason: Passkey login interaction is covered by design and unchanged passkey login tests, but no automated test currently proves a TOTP-enabled passkey user can still log in without TOTP.
        followUp: Add a WebAuthn test path for a TOTP-enabled user once passkey login tests cover real assertions end to end.
      - reason: Recovery codes, ServerOwner reset and tenant/server MFA enforcement policy are intentionally outside the first password-login TOTP slice.
        followUp: Add a dedicated TOTP MFA feature slice after policy and recovery decisions are documented.
  - id: auth.local-accounts-passkeys.password-quality
    statement: Short or compromised passwords are rejected according to configured policy.
    coverage:
      backend:
        unit:
          - testName: password requires at least ten characters
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/common/validation/PasswordValidatorTest.kt
          - testName: rejects passwords returned by the pwned password range response
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/auth/PasswordCompromiseCheckerTest.kt
          - testName: allows passwords that are not present in the range response
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/auth/PasswordCompromiseCheckerTest.kt
          - testName: allows passwords when the remote check fails open
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/auth/PasswordCompromiseCheckerTest.kt
          - testName: rejects passwords when the remote check fails closed
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/auth/PasswordCompromiseCheckerTest.kt
  - id: auth.local-accounts-passkeys.passkey-login-options
    statement: Passkey login options rotate challenges in the same cookie context.
    coverage:
      backend:
        integration:
          - testName: passkey login options rotate challenge in the same cookie context
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/auth/AuthResourceTest.kt
      frontend:
        unit:
          - testName: uses passkey as the initial login method
            kind: positive
            ref: frontend/src/views/LoginView.test.ts
          - testName: renders login options for other tenant domains across auth methods
            kind: positive
            ref: frontend/src/views/LoginView.test.ts
  - id: auth.local-accounts-passkeys.passkey-domain-boundaries
    statement: Passkey domain/link/reset flows reject unknown, wrong-domain, consumed or expired tokens.
    coverage:
      backend:
        integration:
          - testName: passkey domains reject unknown hosts
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: passkey link options reject consumed and expired tokens
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: passkey reset sends domain-bound reset link and options reject wrong domain
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
      frontend:
        unit:
          - testName: shows passkey creation CTA when returning with a fragment link code and cleans the URL
            kind: positive
            ref: frontend/src/views/LoginView.test.ts
          - testName: completes passkey linking and follows the sanitized redirect
            kind: positive
            ref: frontend/src/views/LoginView.test.ts
          - testName: ignores external-looking redirect paths after passkey login
            kind: negative
            ref: frontend/src/views/LoginView.test.ts
  - id: auth.local-accounts-passkeys.invitation-acceptance
    statement: Tenant invitation emails include the link expiration time, can create a new password or passkey account, and require login before acceptance for existing accounts.
    coverage:
      backend:
        integration:
          - testName: server admin creates invited tenant user and invitation can be accepted
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: passkey only user can accept tenant invitation without display name
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: tenant owner invites and activates existing tenant user by email
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: tenant creation invites existing owner account through login flow
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: passkey link token allows pending target tenant membership
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: passkey link token rejects removed target tenant membership
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
      frontend:
        unit:
          - testName: asks for TOTP setup before privacy opt-ins after password invitation acceptance
            kind: positive
            ref: frontend/src/views/InviteView.test.ts
          - testName: enables TOTP before privacy opt-ins after password invitation acceptance
            kind: positive
            ref: frontend/src/views/InviteView.test.ts
          - testName: asks for privacy opt-ins after passkey invitation acceptance and passkey naming
            kind: positive
            ref: frontend/src/views/InviteView.test.ts
          - testName: requires a display name before starting passkey invitation acceptance
            kind: negative
            ref: frontend/src/views/InviteView.test.ts
          - testName: accepts an invitation for an already signed-in user without privacy opt-ins
            kind: negative
            ref: frontend/src/views/InviteView.test.ts
          - testName: sends existing invited accounts to login instead of account creation
            kind: positive
            ref: frontend/src/views/InviteView.test.ts
  - id: auth.local-accounts-passkeys.own-passkey-management
    statement: Users can list, rename and delete their own passkeys but cannot manage another user’s passkeys.
    coverage:
      backend:
        integration:
          - testName: user can list own passkeys
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: passkey delete requires valid own passkey assertion
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: last passkey without password cannot be deleted
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: foreign passkey cannot be deleted
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: user can rename own passkey
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: user cannot rename another users passkey
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: renaming passkey requires display name
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
      frontend:
        unit:
          - testName: renders password TOTP and passkeys as two login method panels
            kind: positive
            ref: frontend/src/features/settings/components/UserSettingsForm.test.ts
          - testName: adds a passkey and asks to confirm the suggested name
            kind: positive
            ref: frontend/src/features/settings/components/UserSettingsForm.test.ts
          - testName: renders existing passkey names as editable fields
            kind: positive
            ref: frontend/src/features/settings/components/UserSettingsForm.test.ts
          - testName: requires a passkey name before renaming a passkey
            kind: positive
            ref: frontend/src/features/settings/components/UserSettingsForm.test.ts
          - testName: renames a passkey with trimmed input and updates the list
            kind: positive
            ref: frontend/src/features/settings/components/UserSettingsForm.test.ts
          - testName: deletes a passkey after passkey confirmation
            kind: positive
            ref: frontend/src/features/settings/components/UserSettingsForm.test.ts
          - testName: does not allow deleting the last passkey without a password
            kind: negative
            ref: frontend/src/features/settings/components/UserSettingsForm.test.ts
    gaps:
      - reason: Backend covers the confirmed passkey delete negative paths, but no integration test currently drives a browser-grade WebAuthn assertion to prove the successful server-side delete path end to end.
        followUp: Add a WebAuthn integration harness for successful authenticated passkey-management assertions.
  - id: auth.local-accounts-passkeys.password-reset-and-change
    statement: Password reset emails include the link expiration time, and password reset and password change flows enforce token validity, rate limits and current-password rules.
    coverage:
      backend:
        integration:
          - testName: password reset can be requested from login email and completed with token
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: passkey only user can set first password without current password
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: password user must provide current password when changing password
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: password can be deleted with current password when passkey exists and removes totp
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: password delete rejects wrong password and missing passkey fallback
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: forgot password requests are rate limited
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: reset password token failures are rate limited and success clears the failure counter
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: used reset password token returns password reset error
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
      frontend:
        unit:
          - testName: changes an existing password with the current password
            kind: positive
            ref: frontend/src/features/settings/components/UserSettingsForm.test.ts
          - testName: sets the first password without requiring the current password
            kind: negative
            ref: frontend/src/features/settings/components/UserSettingsForm.test.ts
          - testName: deletes password only when a passkey fallback exists and clears password TOTP state
            kind: positive
            ref: frontend/src/features/settings/components/UserSettingsForm.test.ts
          - testName: does not show password delete without passkey fallback
            kind: negative
            ref: frontend/src/features/settings/components/UserSettingsForm.test.ts
          - testName: requests password reset for the entered email
            kind: positive
            ref: frontend/src/views/LoginView.test.ts
          - testName: resets password with token from route
            kind: positive
            ref: frontend/src/views/ResetPasswordView.test.ts
  - id: auth.local-accounts-passkeys.passkey-reset-linking-and-registration
    statement: Passkey registration, reset and cross-domain linking enforce domain, token and account boundaries.
    coverage:
      backend:
        integration:
          - testName: creating passkey does not require display name
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: passkey domains list other tenant domains
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: passkey registration options reject unknown hosts
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: passkey link code is exchanged into target-domain grant
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: passkey link creation rejects unauthenticated same unknown and malformed targets
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: passkey link token requires target tenant membership
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: passkey link creation rejects existing passkey for target domain
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: passkey link grant is rejected if target passkey appears after exchange
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: passkey link token cannot be used as a normal session
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: passkey registration options use email as username
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: passkey reset uses the request domain for multi-tenant users
            kind: positive
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: passkey reset is not sent for password-only users
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
          - testName: accepting invitation with passkey does not require passkey display name
            kind: negative
            ref: backend/src/test/kotlin/com/veyq/api/usermgmt/UserManagementResourceTest.kt
      frontend:
        unit:
          - testName: requests passkey reset for the entered email
            kind: positive
            ref: frontend/src/views/LoginView.test.ts
          - testName: keeps accepting query link codes as a compatibility fallback
            kind: negative
            ref: frontend/src/views/LoginView.test.ts
          - testName: resets the passkey with the reset token and authenticates the user
            kind: positive
            ref: frontend/src/views/ResetPasskeyView.test.ts
  - id: auth.local-accounts-passkeys.passkey-client-rp-display
    statement: Passkey client utilities present stable relying-party display names.
    coverage:
      frontend:
        unit:
          - testName: uses veyq as the relying party name when the API returns localhost
            kind: positive
            ref: frontend/src/shared/utils/passkeys.test.ts
          - testName: keeps a configured relying party display name
            kind: positive
            ref: frontend/src/shared/utils/passkeys.test.ts
