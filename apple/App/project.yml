# Greenfield Apple app. The SwiftUI app lives here (apple/App) and depends on the sibling `apple/`
# SwiftPM package (VeyqCrypto = shared crypto + slice logic, headlessly testable via `swift test`).
# Generate the Xcode project from this spec with `xcodegen generate` — no Xcode GUI required:
#   cd apple/App && xcodegen generate
#   xcodebuild -project Veyq.xcodeproj -scheme Veyq \
#     -destination 'platform=iOS Simulator,name=iPhone 16' build
name: Veyq
options:
  bundleIdPrefix: app.veyq
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  VeyqCrypto:
    path: ..
targets:
  Veyq:
    type: application
    platform: iOS
    sources:
      - Veyq
    dependencies:
      - package: VeyqCrypto
        product: VeyqCrypto
      - sdk: AppIntents.framework
    # Partial Info.plist for keys without a build-setting form; merged with the generated plist.
    info:
      path: Veyq/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: app.veyq.ios
            CFBundleURLSchemes: [veyq]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.veyq.ios
        MARKETING_VERSION: "1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
        # Universal: iPhone + iPad (device family above) + macOS via Mac Catalyst. We opt into Catalyst
        # rather than "Designed for iPad" so the Mac build is a real desktop app we can adapt later.
        SUPPORTS_MACCATALYST: "YES"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: veyq
        INFOPLIST_KEY_NSCameraUsageDescription: "veyq scannt den QR-Code aus deinem Emergency Kit, um deine Anmeldung vorzubereiten."
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        APP_SHORTCUTS_ENABLE_FLEXIBLE_MATCHING: "NO"
        # Simulator builds don't need signing; on-device uses this team (mirrors legacy).
        DEVELOPMENT_TEAM: MDQY93XVHF
