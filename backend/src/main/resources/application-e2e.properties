# E2E (`scripts/run_web_e2e.py`): a fast-jar booted against the bundled compose stack, one boot per web e2e file.
#
# Why a declared profile instead of a pile of env overrides in the script: the relaxations a live e2e run needs
# are then visible in the repo, to a reader, next to the defaults they relax — and the orchestrator stops
# carrying policy. `%dev` was the other candidate and is deliberately NOT reused: it is maintained for the
# IntelliJ flow, so a change made there for a local convenience would silently move what CI runs.
#
# THIS PROFILE SHIPS INSIDE THE JAR, exactly as `%dev` and `%test` do. So `-Dquarkus.profile=e2e` on a
# production runtime would turn off `Secure` on the refresh cookie and raise four rate-limit budgets to
# effectively unlimited. That is not a new risk class — it is equally true of `%dev` — but it is stated here
# rather than left to be discovered.
#
# NOTE what is deliberately absent: `quarkus.datasource.db-kind`. It is a BUILD-TIME property, baked at
# augmentation, and `quarkusBuild` augments under `%prod` — so a value written here would be inert. The boot
# works because `%prod` already bakes `mariadb`; setting it here would look like the reason and be a lie.
# Everything below is runtime config, which a profile file does reach.

# --- datasource ---------------------------------------------------------------------------------------------
# The bundled compose MariaDB (infra/docker-compose.yml), documented throwaway creds. The URL is what the
# orchestrator overrides per boot (QUARKUS_DATASOURCE_JDBC_URL) to point at a fresh `veyq_e2e_<n>` database —
# a fresh instance in the only sense the suites care about: `setupRequired === true`.
# The `veyq` user holds grants on the `veyq` database only, so the orchestrator creates each e2e database AS
# ROOT and grants it to `veyq` before the boot. Without that GRANT the boot fails with an access-denied, not
# with a missing-database error, which is the more confusing of the two.
quarkus.datasource.jdbc.url=jdbc:mariadb://localhost:3306/veyq
quarkus.datasource.username=veyq
quarkus.datasource.password=change-me

# --- object store -------------------------------------------------------------------------------------------
# A byte path is a HARD requirement outside `%test`: a blank endpoint ABORTS startup (BlobStoreStartupCheck,
# ADR 0013 §1). There is no in-memory escape hatch for a booted jar, so `media.e2e.test.ts` needs a real store
# and gets the bundled Garage. Documented throwaway dev creds (infra/README.md, infra/garage-init.sh).
# Bring it up first: docker compose -f infra/docker-compose.yml --profile s3 up -d
veyq.blob-store.endpoint=http://localhost:19000
veyq.blob-store.access-key=GK0123456789abcdef01234567
veyq.blob-store.secret-key=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

# `veyq.blob-store.public-endpoint` is deliberately LEFT UNSET, and this is the expensive one to get wrong.
# `%dev` signs presigned URLs for `http://127.0.0.1:5173` so the Vite dev server's same-origin `/veyq` proxy
# forwards the PUT/GET without CORS. There is no Vite server in an e2e run — the suites are node-runtime Vitest
# talking straight to the store — and `BlobStore` falls back to `endpoint` when this is blank, which is exactly
# what is wanted. Set it, and SigV4 signs a host the request never goes to: `media.e2e.test.ts` then fails in
# the **PUT**, long after a green boot, which is the most expensive place for this mistake to surface.

# --- session ------------------------------------------------------------------------------------------------
# The suites talk plain http, so a `Secure` refresh cookie would never be sent and "remember me" would break.
veyq.session.cookie.secure=false

# --- rate limits --------------------------------------------------------------------------------------------
# `%e2e` is NOT a copy of `%test`: `%test` relaxes only the auth and share-password bounds, because its slice
# tests never drive a whole multi-actor flow. A live run does. `scopeRotation.e2e.test.ts` births four actors
# with real Argon2id logins from one IP and sends two member invites, so the per-IP auth budget (60/60s) is a
# coin flip and the per-recipient invite budget (3/3600s) trips on a re-run against a warm limiter.
#
# All four limiters are in-memory and per-instance, so a fresh boot per file already resets them. These
# relaxations are what makes a SECOND file, or a re-run inside one boot, not a flake.
veyq.ratelimit.auth.max-requests=1000000
veyq.ratelimit.user.max-requests=1000000
veyq.ratelimit.invite.per-recipient-max-requests=1000000
veyq.ratelimit.invite.per-tenant-max-requests=1000000

# No current e2e suite drives a share flow, so this one is pre-emptive — stated as a choice rather than left
# silent: a 429 inside a live suite reads as a flake and gets debugged as one, so the cost of relaxing a bound
# nothing hits yet is much lower than the cost of the first suite that hits it.
veyq.share.password.rate.max-per-window=1000000

# --- config-secret KEK --------------------------------------------------------------------------------------
# ADR 0050 amendment: the server GENERATES this file `0600` on first start. Its default is `config-secret.key`
# RELATIVE TO THE PROCESS CWD — so N boots from the repo root would share one key file and leave an untracked
# secret beside the repo. The orchestrator overrides this per boot (VEYQ_SECURITY_CONFIG_SECRET_FILE) with a
# path under its per-run temp dir. This default only keeps a HAND boot from littering the repo root.
veyq.security.config-secret-file=backend/build/e2e-config-secret.key
