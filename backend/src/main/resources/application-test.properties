# Test profile (Quarkus `test` profile). These values were previously the `%test.*` overrides inside
# application.properties. The datasource stays on the base H2 in-memory default (fast, no external DB).

# Mail is captured in the MockMailbox, never sent.
quarkus.mailer.mock=true

# No S3/MinIO under test — use the in-process blob backend.
veyq.blob-store.backend=memory

# Rate limiter off so the test suite can hammer auth paths from one host.
veyq.ratelimit.enabled=false
