# Tests (`./gradlew check`, @QuarkusTest): in-memory H2 — hermetic + fast, fresh per JVM.
# `MODE=MariaDB` raises DDL/SQL parity with the prod engine so the test store parses what prod parses — the
# direct antidote to #94 (a `MODIFY COLUMN` type-change is MariaDB-only syntax that default-mode H2 rejects; it
# is what lets V41 run here). Parity is the point, but note the limit: MODE does NOT make H2 enforce MariaDB's
# `TEXT` byte ceiling, so an oversize-cap regression is caught by `scripts/validate_maxlength_storage.py`, never
# by this suite. Mode and guard are different jobs — do not conflate them.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:veyq;MODE=MariaDB;DB_CLOSE_DELAY=-1

# Bind tests to a random free port (quarkus-junit5 points RestAssured at it). The default test port is
# 8081, which collides with the Vite web dev server (`web`, --host 127.0.0.1:8081) when it is running.
quarkus.http.test-port=0

# Effectively disable the auth rate limiter for the slice tests — they all hit the endpoints from
# 127.0.0.1, so the production default (60/min) would trip across the suite. AuthRateLimitTest overrides
# this back down via its own @TestProfile to assert the 429 path.
veyq.ratelimit.auth.max-requests=1000000

# cr-0165: same treatment for the per-share password-attempt bound — the slice tests fire wrong tokens from
# 127.0.0.1 and the production default (10/window) would trip across the suite. SharePasswordAttemptBoundTest
# overrides this down via its own @TestProfile to assert the 429 path.
veyq.share.password.rate.max-per-window=1000000

veyq.session.cookie.secure=false

# cr-email-smtp-transport (ADR 0050): a fixed test KEK so ConfigSecretSeal is configured across the suite — the
# mail-settings slice tests seal an SMTP password at rest and unseal it at send time. A throwaway all-zero key is
# fine for tests (it protects nothing real); production supplies its own via VEYQ_SECURITY_CONFIG_SECRET_KEY.
veyq.security.config-secret-key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=