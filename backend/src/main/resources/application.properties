quarkus.datasource.db-kind=mariadb
quarkus.datasource.username=${DB_USER:lunva}
quarkus.datasource.password=${DB_PASSWORD:lunva}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:mariadb://localhost:3306/lunva}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

app.auth.cookie.access-token-name=${COOKIE_ACCESS_TOKEN_NAME:LUNVA_ACCESS_TOKEN}
app.auth.cookie.refresh-token-name=${COOKIE_REFRESH_TOKEN_NAME:LUNVA_REFRESH_TOKEN}
app.auth.cookie.secure=${COOKIE_SECURE:true}

app.auth.token.access-token-ttl-minutes=${ACCESS_TOKEN_TTL_MINUTES:15}
app.auth.token.refresh-token-ttl-minutes=${REFRESH_TOKEN_TTL_MINUTES:43200}

app.auth.token.cleanup-access-token-audit-days=${ACCESS_TOKEN_AUDIT_TTL_DAYS:30}
app.auth.token.cleanup-refresh-token-audit-days=${REFRESH_TOKEN_AUDIT_TTL_DAYS:90}
app.auth.token.cleanup-cron=${TOKEN_CLEANUP_CRON:0 0 0 * * ?}

app.auth.bcrypt.target-ms=${BCRYPT_TARGET_MS:250}
app.auth.bcrypt.min-cost=${BCRYPT_MIN_COST:10}
app.auth.bcrypt.max-cost=${BCRYPT_MAX_COST:14}
app.auth.bcrypt.benchmark-samples=${BCRYPT_BENCHMARK_SAMPLES:2}
