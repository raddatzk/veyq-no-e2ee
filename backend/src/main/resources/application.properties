quarkus.application.name=veyq-backend
quarkus.http.port=8080

# Blind store. H2 in-memory is the base default (tests + any env without DB_* set); the dev profile points at
# a local MariaDB on :3306 (see application-dev.properties) and deployment supplies DB_KIND=mariadb + a
# jdbc:mariadb DB_URL (see infra/docker-compose.yml). Flyway owns the schema, so the only DB-portable surface
# is the migrations — kept to types valid on both H2 and MariaDB.
quarkus.datasource.db-kind=${DB_KIND:h2}
quarkus.datasource.username=${DB_USER:sa}
quarkus.datasource.password=${DB_PASSWORD:}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:h2:mem:veyq;DB_CLOSE_DELAY=-1}
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true

# Outbound mail (email invites). The operator supplies SMTP via MAIL_* (see infra/docker-compose.yml + README);
# mock mode (dev/test) captures instead of sending. Defaults below are dev-localhost placeholders.
quarkus.mailer.from=${MAIL_FROM:veyq <noreply@veyq.app>}
quarkus.mailer.host=${MAIL_HOST:localhost}
quarkus.mailer.port=${MAIL_PORT:587}
quarkus.mailer.username=${MAIL_USERNAME:}
quarkus.mailer.password=${MAIL_PASSWORD:}
quarkus.mailer.login=${MAIL_LOGIN:DISABLED}
quarkus.mailer.tls=${MAIL_TLS:false}
# Dev/test send nothing real (captured in the MockMailbox — set in application-{dev,test}.properties); set
# false in production once SMTP is configured.
quarkus.mailer.mock=${VEYQ_MAIL_MOCK:false}
# The web origin used to build invite links in emails (the client also passes its own link).
veyq.app.base-url=${VEYQ_APP_BASE_URL:http://localhost:5173}

# Reverse-proxy header trust (Traefik in the Compose deployment terminates TLS and appends X-Forwarded-*).
# Quarkus must know which peers may set those headers — otherwise enabling address forwarding would let it
# resolve remoteAddress() from a client-spoofable X-Forwarded-For and undermine the rate limiter, which keys
# on the client IP. So Quarkus' trusted-proxies is bound to the SAME set the RateLimitFilter trusts (single
# source of truth); the forwarding switches default OFF for direct/dev exposure. The Compose stack turns them
# on. enable-forwarded-host has no consumer today (links come from veyq.app.base-url) but keeps request host/
# scheme correct for any future host-derived behavior.
quarkus.http.proxy.proxy-address-forwarding=${PROXY_ADDRESS_FORWARDING:false}
quarkus.http.proxy.allow-x-forwarded=${PROXY_ALLOW_X_FORWARDED:false}
quarkus.http.proxy.enable-forwarded-host=${PROXY_ENABLE_FORWARDED_HOST:false}
quarkus.http.proxy.trusted-proxies=${VEYQ_RATELIMIT_TRUSTED_PROXIES:}

# Blind blob store. The server does NOT store blobs locally: the only production backend is `s3` — an external
# S3-compatible object store, or the bundled MinIO/Garage container (see infra/docker-compose.yml). The store
# holds AEAD ciphertext exclusively, so S3 (and a future per-tenant bucket for SaaS) learns nothing. `memory`
# is an ephemeral in-process backend for dev/test only — the dev + test profiles select it (see
# application-{dev,test}.properties).
veyq.blob-store.backend=${BLOB_STORE_BACKEND:s3}
veyq.blob-store.s3-endpoint=${BLOB_STORE_S3_ENDPOINT:}
# The endpoint presigned URLs are signed for — the one CLIENTS reach directly (ADR 0021). For the bundled MinIO
# behind Traefik this is the public origin (a path route to the store); the internal s3-endpoint stays private.
# Empty ⇒ sign against s3-endpoint (external S3, or any publicly-reachable store).
veyq.blob-store.s3-public-endpoint=${BLOB_STORE_S3_PUBLIC_ENDPOINT:}
veyq.blob-store.s3-bucket=${BLOB_STORE_S3_BUCKET:veyq-blobs}
# Region only matters for AWS (it validates the SigV4 scope against the endpoint). MinIO ignores it and Ceph-based
# stores (Hetzner, …) accept the default — SigV4 only needs the region to be self-consistent, which the SDK
# guarantees. So: set this for AWS, leave the default everywhere else. ⇒ connecting any S3 = endpoint + bucket + keys.
veyq.blob-store.s3-region=${BLOB_STORE_S3_REGION:us-east-1}
veyq.blob-store.s3-access-key=${BLOB_STORE_S3_ACCESS_KEY:}
veyq.blob-store.s3-secret-key=${BLOB_STORE_S3_SECRET_KEY:}
# Credential hygiene: mask the S3 keys in any config dump / dev console (they're operator env secrets, never
# persisted to the DB and never returned by any endpoint). SmallRye refuses to print a registered secret key.
smallrye.config.secret-keys=veyq.blob-store.s3-access-key,veyq.blob-store.s3-secret-key
# Dev + test never reach a real object store — they select the in-process backend in
# application-{dev,test}.properties so no S3/MinIO is needed locally.

# Max request body. Chunk-upload frames are the largest bodies (base64-expanded AEAD frames); cap them so a
# single request can't exhaust memory. Operator-tunable via MEDIA_MAX_UPLOAD_SIZE (default 32 MiB).
quarkus.http.limits.max-body-size=${MEDIA_MAX_UPLOAD_SIZE:32M}

# Graceful shutdown: on SIGTERM (redeploy/auto-update) stop accepting new requests and drain in-flight ones
# (chunk uploads, live-edit relay) for up to this long before exiting, instead of cutting them mid-flight.
quarkus.shutdown.timeout=30S

# Logging: operator-tunable level; SQL logging is pinned OFF so request/bind values can never reach the logs
# (operator-blind — logs must never carry content, even ciphertext).
quarkus.log.level=${LOG_LEVEL:INFO}
quarkus.log.category."org.hibernate.SQL".level=OFF

# Datasource pool: fail fast on exhaustion rather than hanging a request thread indefinitely.
quarkus.datasource.jdbc.acquisition-timeout=5S

# Live-journal relay: cap the per-message size (anti-abuse) — CRDT updates are tiny; this bounds memory.
quarkus.websockets-next.server.max-message-size=1048576

# Per-IP rate limiting on abuse-prone unauthenticated endpoints (login, reset, invite, share upload).
# Off in dev/test (see application-{dev,test}.properties) so the slice + opt-in e2e suites can hammer those
# paths from one host.
veyq.ratelimit.enabled=${VEYQ_RATELIMIT_ENABLED:true}
# Trusted reverse-proxy IPs/CIDRs (comma-separated). X-Forwarded-For is honored ONLY when the socket peer is
# one of these — otherwise the header is ignored and the socket address is the rate-limit key, so a client
# cannot mint fresh buckets by spoofing XFF. Empty = trust none (key purely on the socket peer).
veyq.ratelimit.trusted-proxies=${VEYQ_RATELIMIT_TRUSTED_PROXIES:}
# Per-bucket limits (requests/minute, operator-tunable; defaults in shared/config/VeyqConfig.kt). Override via
# env: VEYQ_RATELIMIT_LOGIN_PER_MIN (10), _RESET_REQUEST_PER_MIN (5), _RESET_PER_MIN (15), _INVITE_PER_MIN (30),
# _INVITE_READ_PER_MIN (60), _SHARE_UPLOAD_PER_MIN (60), _SHARE_CHUNK_PER_MIN (600).
# Bearer-session lifetime: VEYQ_SESSION_TTL (ISO-8601 duration, default P30D).

# Dev smoke helpers are explicitly off by default; application-dev/test.properties enable them for local
# repeatable seed data. Production deployments should never expose /api/dev/*.
veyq.dev-tools.enabled=${VEYQ_DEV_TOOLS_ENABLED:false}
