quarkus.datasource.db-kind=mariadb
quarkus.datasource.username=${DB_USER:veyq}
quarkus.datasource.password=${DB_PASSWORD:change-me}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:mariadb://localhost:3306/veyq}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.hibernate-orm.schema-management.strategy=none

quarkus.http.limits.max-body-size=${MEDIA_MAX_UPLOAD_SIZE:32M}
quarkus.http.limits.max-form-attribute-size=${MEDIA_MAX_UPLOAD_SIZE:32M}

quarkus.mailer.from=${MAIL_FROM:veyq@example.invalid}
quarkus.mailer.host=${MAIL_HOST:localhost}
quarkus.mailer.port=${MAIL_PORT:1025}
quarkus.mailer.username=${MAIL_USERNAME:}
quarkus.mailer.password=${MAIL_PASSWORD:}
quarkus.mailer.login=${MAIL_LOGIN:DISABLED}
quarkus.mailer.tls=${MAIL_TLS:false}

quarkus.http.proxy.proxy-address-forwarding=${PROXY_ADDRESS_FORWARDING:false}
quarkus.http.proxy.allow-x-forwarded=${PROXY_ALLOW_X_FORWARDED:false}
quarkus.http.proxy.enable-forwarded-host=${PROXY_ENABLE_FORWARDED_HOST:false}

quarkus.webauthn.relying-party.name=${WEBAUTHN_RELYING_PARTY_NAME:veyq}
quarkus.webauthn.enable-login-endpoint=false
quarkus.webauthn.enable-registration-endpoint=false
quarkus.webauthn.resident-key=required
quarkus.webauthn.user-verification=required
quarkus.webauthn.cookie-name=VEYQ_WEBAUTHN_SESSION
quarkus.webauthn.challenge-cookie-name=VEYQ_WEBAUTHN_CHALLENGE

veyq.auth.cookie.access-token-name=${COOKIE_ACCESS_TOKEN_NAME:VEYQ_ACCESS_TOKEN}
veyq.auth.cookie.refresh-token-name=${COOKIE_REFRESH_TOKEN_NAME:VEYQ_REFRESH_TOKEN}
veyq.auth.cookie.secure=${COOKIE_SECURE:true}

veyq.auth.token.access-token-ttl-minutes=${ACCESS_TOKEN_TTL_MINUTES:15}
veyq.auth.token.refresh-token-ttl-minutes=${REFRESH_TOKEN_TTL_MINUTES:43200}
veyq.auth.token.cleanup-access-token-audit-days=${ACCESS_TOKEN_AUDIT_TTL_DAYS:30}
veyq.auth.token.cleanup-refresh-token-audit-days=${REFRESH_TOKEN_AUDIT_TTL_DAYS:90}
veyq.auth.token.cleanup-cron=${TOKEN_CLEANUP_CRON:0 0 0 * * ?}

veyq.user.invitation-ttl-days=${INVITATION_TTL_DAYS:7}
veyq.user.email-change-ttl-hours=${EMAIL_CHANGE_TTL_HOURS:24}
veyq.user.reset-password-ttl-hours=${RESET_PASSWORD_TTL_HOURS:2}
veyq.user.cleanup-cron=${USER_CLEANUP_CRON:0 0 0 * * ?}
veyq.user.cleanup-retention-days=${USER_CLEANUP_RETENTION_DAYS:30}

veyq.auth.argon2.target-ms=${ARGON2_TARGET_MS:500}
veyq.auth.argon2.memory-kib=${ARGON2_MEMORY_KIB:65536}
veyq.auth.argon2.min-iterations=${ARGON2_MIN_ITERATIONS:2}
veyq.auth.argon2.max-iterations=${ARGON2_MAX_ITERATIONS:10}
veyq.auth.argon2.parallelism=${ARGON2_PARALLELISM:1}
veyq.auth.argon2.benchmark-samples=${ARGON2_BENCHMARK_SAMPLES:2}

veyq.auth.pwned-passwords.enabled=${PWNED_PASSWORDS_ENABLED:true}
veyq.auth.pwned-passwords.endpoint=${PWNED_PASSWORDS_ENDPOINT:https://api.pwnedpasswords.com/range}
veyq.auth.pwned-passwords.timeout-ms=${PWNED_PASSWORDS_TIMEOUT_MS:2000}
veyq.auth.pwned-passwords.fail-closed=${PWNED_PASSWORDS_FAIL_CLOSED:false}

veyq.security.trust-forwarded-for=${TRUST_FORWARDED_FOR:false}

veyq.journal.live.websocket-url=${JOURNAL_LIVE_WEBSOCKET_URL:/api/collaboration/journal}
veyq.journal.live.token-secret=${JOURNAL_LIVE_TOKEN_SECRET:dev-only-change-me}
veyq.journal.live.token-ttl-minutes=${JOURNAL_LIVE_TOKEN_TTL_MINUTES:15}
veyq.journal.live.sidecar-secret=${JOURNAL_LIVE_SIDECAR_SECRET:}

veyq.media.storage-dir=${MEDIA_STORAGE_DIR:/tmp/veyq-media}
veyq.media.chunk-size=${MEDIA_CHUNK_SIZE:16M}
veyq.media.archive.batch-size=${MEDIA_ARCHIVE_BATCH_SIZE:500}
veyq.media.ffmpeg-path=${FFMPEG_PATH:ffmpeg}
veyq.media.preview-timeout-seconds=${MEDIA_PREVIEW_TIMEOUT_SECONDS:15}
veyq.media.upload-session-ttl-hours=${MEDIA_UPLOAD_SESSION_TTL_HOURS:24}
veyq.media.upload-session-cleanup-cron=${MEDIA_UPLOAD_SESSION_CLEANUP_CRON:0 0 * * * ?}

veyq.source-url=${VEYQ_SOURCE_URL:https://github.com/raddatzk/veyq}
veyq.version=${VEYQ_VERSION:}
veyq.revision=${VEYQ_REVISION:}
veyq.updater.notify-token=${VEYQ_UPDATER_NOTIFY_TOKEN:}
