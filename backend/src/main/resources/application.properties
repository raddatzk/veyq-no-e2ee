# Flyway owns the schema; Hibernate never generates or validates DDL.
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true

# dev/test default: in-memory H2 (offline, fresh per JVM).
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:veyq;DB_CLOSE_DELAY=-1

# production: MariaDB (URL + credentials supplied via environment in the deployment).
%prod.quarkus.datasource.db-kind=mariadb
