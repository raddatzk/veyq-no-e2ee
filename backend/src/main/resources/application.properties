quarkus.application.name=veyq-backend
quarkus.http.port=8080

# Blind store. H2 for dev/slice; MariaDB is swapped in for deployment. Flyway owns the schema.
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.jdbc.url=jdbc:h2:mem:veyq;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true

# Outbound mail (email invites). The operator supplies SMTP; mock mode (dev/test) captures instead of sending.
quarkus.mailer.from=${VEYQ_MAIL_FROM:veyq <noreply@veyq.app>}
quarkus.mailer.host=${VEYQ_SMTP_HOST:localhost}
quarkus.mailer.port=${VEYQ_SMTP_PORT:587}
quarkus.mailer.username=${VEYQ_SMTP_USER:}
quarkus.mailer.password=${VEYQ_SMTP_PASSWORD:}
quarkus.mailer.start-tls=${VEYQ_SMTP_STARTTLS:REQUIRED}
# Dev/test send nothing real (captured in the MockMailbox); set false in production once SMTP is configured.
%dev.quarkus.mailer.mock=true
%test.quarkus.mailer.mock=true
quarkus.mailer.mock=${VEYQ_MAIL_MOCK:false}
# The web origin used to build invite links in emails (the client also passes its own link).
veyq.app.base-url=${VEYQ_APP_BASE_URL:http://localhost:5173}
