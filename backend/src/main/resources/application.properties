# Flyway owns the schema; Hibernate never generates or validates DDL.
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true

# test default: in-memory H2 (offline, fresh per JVM — the test suite stays hermetic and fast).
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:veyq;DB_CLOSE_DELAY=-1

# dev: persistent local MariaDB (backend/docker-compose.yml) — prod parity + data survives restarts.
# Start it first: `cd backend && docker compose up -d`. A jdbc.url is set, so Quarkus connects to that
# container instead of spinning up its own Dev Services database.
%dev.quarkus.datasource.db-kind=mariadb
%dev.quarkus.datasource.jdbc.url=jdbc:mariadb://localhost:3306/veyq
%dev.quarkus.datasource.username=veyq
%dev.quarkus.datasource.password=veyq

# production: MariaDB (URL + credentials supplied via environment in the deployment).
%prod.quarkus.datasource.db-kind=mariadb
