# Shared across all profiles. Flyway owns the schema; Hibernate never generates or validates DDL.
# The datasource is configured per profile — see application-{dev,test,prod}.properties.
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true

# Central auth (cr-0012). Lazy authentication: the bearer mechanism runs only when a security annotation demands
# an identity — never on @PermitAll endpoints, so a present-but-bad token can't 401 a public call (e.g. logout
# stays idempotent). Default-deny (deny-unannotated-endpoints) is flipped on in phase 3, once every endpoint
# carries an explicit @Authenticated / @RolesAllowed / @PermitAll.
quarkus.http.auth.proactive=false

# Default-deny (cr-0012 phase 3): every JAX-RS endpoint must carry an explicit security annotation; an
# unannotated one is denied. The annotation is now the single mandatory place the token-or-not decision is
# taken, and a future endpoint added without one fails closed instead of silently shipping open.
quarkus.security.jaxrs.deny-unannotated-endpoints=true

# Tenant invites (cr-0009): how long an owner invite is valid, how long terminal-state invites are kept
# before the scheduled purge deletes them, and how often the purge runs. ISO-8601 durations.
veyq.tenant.invite.ttl=P7D
veyq.tenant.invite.retention=P30D
veyq.tenant.invite.purge.every=1h
# Dev-only (cr-0046): when set, the logging mailer also appends each invite as one JSON line so the local seed
# orchestrator reads the bootstrap secret deterministically. Unset by default; never written in production.
# veyq.tenant.invite.dev-file=build/dev-invites.jsonl

# Session-token purge (cr-0011): how often the scheduled cleanup deletes expired access/refresh tokens,
# stale login challenges, and token-less session families. Rows are removed strictly once past expiry.
veyq.session.purge.every=1h

# Public-auth rate limit (AuthRateLimitFilter): max requests per fixed window per client IP for the login
# challenge/verify + token refresh endpoints. In-memory, per-instance, best-effort defense-in-depth — a
# gateway/distributed bucket is the production answer. Behind a reverse proxy, also set
# `quarkus.http.proxy.proxy-address-forwarding=true` (and trust the proxy) so the real client IP is keyed,
# not the proxy's.
veyq.ratelimit.auth.max-requests=60
veyq.ratelimit.auth.window-seconds=60

# Blob store (media transport, ADR 0013). An unset/blank `veyq.blob-store.endpoint` ⇒ the in-memory dev store
# (no presign, no byte path — dev/test metadata only). Set these via operator env for the S3 store (any
# S3-compatible endpoint — bundled Garage, AWS S3, R2, B2, …; leaving them out of the properties file avoids
# empty-value config errors and keeps secrets out of the repo):
#   veyq.blob-store.endpoint=http://garage:3900    # internal S3 endpoint
#   veyq.blob-store.public-endpoint=https://store…  # client-reachable URL used purely to SIGN (blank ⇒ endpoint)
#   veyq.blob-store.access-key / .secret-key        # store credentials — never persisted, logged, or returned
#   veyq.blob-store.region                          # must match the store's S3 region (default us-east-1)
# Per-blob declared caps (declare-then-verify) bound abuse before any byte is verified.
veyq.blob-store.bucket=veyq
veyq.blob-store.region=us-east-1
veyq.blob-store.presign-ttl-seconds=600
veyq.blob.max-bytes=2147483648
veyq.blob.max-chunks=100000
