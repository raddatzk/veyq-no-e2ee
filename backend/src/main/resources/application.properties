quarkus.datasource.db-kind=mariadb
quarkus.datasource.username=${DB_USER:lunva}
quarkus.datasource.password=${DB_PASSWORD:lunva}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:mariadb://localhost:3306/lunva}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.hibernate-orm.schema-management.strategy=none

lunva.auth.cookie.access-token-name=${COOKIE_ACCESS_TOKEN_NAME:LUNVA_ACCESS_TOKEN}
lunva.auth.cookie.refresh-token-name=${COOKIE_REFRESH_TOKEN_NAME:LUNVA_REFRESH_TOKEN}
lunva.auth.cookie.secure=${COOKIE_SECURE:true}
%dev.lunva.auth.cookie.secure=${COOKIE_SECURE:false}
%test.lunva.auth.cookie.secure=${COOKIE_SECURE:false}

lunva.auth.token.access-token-ttl-minutes=${ACCESS_TOKEN_TTL_MINUTES:15}
lunva.auth.token.refresh-token-ttl-minutes=${REFRESH_TOKEN_TTL_MINUTES:43200}

lunva.auth.token.cleanup-access-token-audit-days=${ACCESS_TOKEN_AUDIT_TTL_DAYS:30}
lunva.auth.token.cleanup-refresh-token-audit-days=${REFRESH_TOKEN_AUDIT_TTL_DAYS:90}
lunva.auth.token.cleanup-cron=${TOKEN_CLEANUP_CRON:0 0 0 * * ?}

lunva.auth.bcrypt.target-ms=${BCRYPT_TARGET_MS:300}
lunva.auth.bcrypt.min-cost=${BCRYPT_MIN_COST:10}
lunva.auth.bcrypt.max-cost=${BCRYPT_MAX_COST:14}
lunva.auth.bcrypt.benchmark-samples=${BCRYPT_BENCHMARK_SAMPLES:2}

lunva.media.storage-dir=${MEDIA_STORAGE_DIR:/tmp/lunva-media}

quarkus.http.limits.max-body-size=${MEDIA_MAX_UPLOAD_SIZE:10G}
quarkus.http.limits.max-form-attribute-size=${MEDIA_MAX_UPLOAD_SIZE:10G}
