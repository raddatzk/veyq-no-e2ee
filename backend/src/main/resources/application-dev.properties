# Dev (`quarkusDev`): persistent local MariaDB (backend/docker-compose.yml) — prod parity + data survives
# restarts (no re-doing setup each run). Start it first: `cd backend && docker compose up -d`. A jdbc.url is
# set, so Quarkus connects to that container instead of starting its own Dev Services database.
quarkus.datasource.db-kind=mariadb
quarkus.datasource.jdbc.url=jdbc:mariadb://localhost:3306/veyq
quarkus.datasource.username=veyq
quarkus.datasource.password=change-me
