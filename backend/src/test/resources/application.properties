quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:lunva_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=0
quarkus.datasource.username=sa
quarkus.mailer.mock=true
quarkus.mailer.from=noreply@example.test
quarkus.mailer.host=localhost
quarkus.mailer.login=DISABLED
quarkus.datasource.password=sa
quarkus.http.test-port=0

quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.clean-at-start=true
quarkus.flyway.locations=db/migration

lunva.auth.cookie.access-token-name=LUNVA_ACCESS_TOKEN
lunva.auth.cookie.refresh-token-name=LUNVA_REFRESH_TOKEN
lunva.auth.cookie.secure=false

lunva.auth.token.access-token-ttl-minutes=15
lunva.auth.token.refresh-token-ttl-minutes=60
lunva.auth.token.cleanup-access-token-audit-days=30
lunva.auth.token.cleanup-refresh-token-audit-days=90
lunva.auth.token.cleanup-cron=0 0 0 * * ?
lunva.user.invitation-ttl-days=7
lunva.user.email-change-ttl-hours=24
lunva.user.reset-password-ttl-hours=2
lunva.user.cleanup-cron=0 0 0 * * ?
lunva.user.cleanup-retention-days=30

lunva.auth.bcrypt.target-ms=1
lunva.auth.bcrypt.min-cost=4
lunva.auth.bcrypt.max-cost=4
lunva.auth.bcrypt.benchmark-samples=1

lunva.media.storage-dir=/tmp/lunva-test-media
lunva.media.chunk-size=4
lunva.media.upload-session-ttl-hours=24
lunva.media.upload-session-cleanup-cron=0 0 * * * ?
