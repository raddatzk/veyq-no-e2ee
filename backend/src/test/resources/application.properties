# Tests drive GC beans (BlobUploadGc, SessionGc) directly via their handlers; the timed @Scheduled triggers
# add nothing but a race against test data over the shared in-memory DB. Disable them under test.
quarkus.scheduler.enabled=false
# Blob storage in tests is the ephemeral in-process backend — no S3/MinIO needed (applies under every
# @TestProfile, which layer on top of this base test config).
veyq.blob-store.backend=memory
