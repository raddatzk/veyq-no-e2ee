quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:veyq_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=0;INIT=CREATE SCHEMA IF NOT EXISTS veyq\\;SET SCHEMA veyq
quarkus.datasource.username=sa
quarkus.mailer.mock=true
quarkus.mailer.from=noreply@example.test
quarkus.mailer.host=localhost
quarkus.mailer.login=DISABLED
quarkus.datasource.password=sa
quarkus.http.test-port=0

quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.clean-at-start=true
quarkus.flyway.locations=db/migration

veyq.auth.cookie.access-token-name=VEYQ_ACCESS_TOKEN
veyq.auth.cookie.refresh-token-name=VEYQ_REFRESH_TOKEN
veyq.auth.cookie.secure=false

veyq.auth.token.access-token-ttl-minutes=15
veyq.auth.token.refresh-token-ttl-minutes=60
veyq.auth.token.cleanup-access-token-audit-days=30
veyq.auth.token.cleanup-refresh-token-audit-days=90
veyq.auth.token.cleanup-cron=0 0 0 * * ?
veyq.user.invitation-ttl-days=7
veyq.user.email-change-ttl-hours=24
veyq.user.reset-password-ttl-hours=2
veyq.user.cleanup-cron=0 0 0 * * ?
veyq.user.cleanup-retention-days=30

veyq.auth.argon2.target-ms=1
veyq.auth.argon2.memory-kib=1024
veyq.auth.argon2.min-iterations=1
veyq.auth.argon2.max-iterations=1
veyq.auth.argon2.parallelism=1
veyq.auth.argon2.benchmark-samples=1
veyq.auth.pwned-passwords.enabled=false
veyq.auth.pwned-passwords.endpoint=https://api.pwnedpasswords.com/range
veyq.auth.pwned-passwords.timeout-ms=2000
veyq.auth.pwned-passwords.fail-closed=false
veyq.security.trust-forwarded-for=false
quarkus.webauthn.relying-party.name=veyq

veyq.media.storage-dir=/tmp/veyq-test-media
veyq.media.chunk-size=4
veyq.media.archive.batch-size=2
veyq.media.ffmpeg-path=ffmpeg
veyq.media.preview-timeout-seconds=15
veyq.media.upload-session-ttl-hours=24
veyq.media.upload-session-cleanup-cron=0 0 * * * ?
veyq.journal.live.token-secret=test-journal-live-token-secret
veyq.journal.live.sidecar-secret=test-journal-live-sidecar-secret
veyq.mobile.ios.app-store-id=1234567890
