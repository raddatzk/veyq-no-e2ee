quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:lunva_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=0
quarkus.datasource.username=sa
quarkus.datasource.password=sa

quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.clean-at-start=true
quarkus.flyway.locations=db/migration

app.auth.cookie.access-token-name=LUNVA_ACCESS_TOKEN
app.auth.cookie.refresh-token-name=LUNVA_REFRESH_TOKEN
app.auth.cookie.secure=false

app.auth.token.access-token-ttl-minutes=15
app.auth.token.refresh-token-ttl-minutes=60
app.auth.token.cleanup-access-token-audit-days=30
app.auth.token.cleanup-refresh-token-audit-days=90
app.auth.token.cleanup-cron=0 0 0 * * ?

app.auth.bcrypt.target-ms=1
app.auth.bcrypt.min-cost=4
app.auth.bcrypt.max-cost=4
app.auth.bcrypt.benchmark-samples=1
