openapi: 3.1.0
info:
  title: veyq Media API
  version: 0.1.0
  description: >
    Encrypted media **blobs** attached to a Memory tree (en.memory.media, cr-0028). A blob is a fixed-size
    sequence of **chunked-AEAD** ciphertext objects, sealed client-side under a fresh random **`K_blob`**
    (wrapped under the target Memory's `K_mem`, [ADR 0012](../../docs/decisions/0012-content-key-hierarchy.md)),
    transferred **direct-to-store** via short-TTL presigned URLs
    ([ADR 0013](../../docs/decisions/0013-blob-storage-presigned-direct-to-store.md)) — bytes never flow through
    the backend. The control plane is **batch-shaped** (lists + per-item results) from the start; the first
    slice exercises **length-1 lists**.

    **Operator-blind:** the server + object store hold only ciphertext chunks + opaque metadata
    (`chunkCount`, `byteSize`, the per-chunk size `manifest`), the `K_blob` wrap, and the media→node link; never
    a plaintext byte, a content key, or a filename in clear. Guards (enforced by code, ADR 0008): the caller
    holds a grant for the scope; a media target must be a **MEMORY** or **CHAPTER** (a FOLDER owns no `K_mem`);
    declare-then-verify on `complete` enforces the byte budget against the stored objects. **No content dedup**
    ([ADR 0013 §5](../../docs/decisions/0013-blob-storage-presigned-direct-to-store.md#5-no-content-dedup)).
tags:
  - name: media
    description: >
      Encrypted media blobs under a scope: start uploads (presign PUT) → complete + attach to a node → list a
      node's media → presign GET for download. One tag = one resource interface owning the media subtree under
      `/api/scopes/{scopeId}` (distinct from the `content` nodes resource).

paths:
  /api/scopes/{scopeId}/blob-uploads-batch:
    post:
      tags: [media]
      operationId: startBlobUploads
      summary: Start N blob uploads — reserve sessions + presign one PUT per chunk.
      description: >
        For each requested blob the client declares its `chunkCount`, total `byteSize`, and the `wrappedBlobKey`
        (`K_blob` under `K_mem`). The server opens an upload session and returns, per item, an `uploadId` plus
        one short-TTL presigned **PUT** URL per chunk — or a per-item error. The caller then PUTs each
        ciphertext chunk **directly to the object store** and calls `media-batch` to complete + attach. The
        in-memory store cannot presign and answers `store_unavailable`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlobUploadsBatchRequest" }
            example:
              items:
                - chunkCount: 2
                  byteSize: 131072
                  wrappedBlobKey: d3JhcHBlZC1rLWJsb2I=
      responses:
        "200":
          description: Per-item upload results (success carries the presigned PUTs; failure carries a code).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlobUploadsBatchResponse" }
        "400":
          description: Malformed request (missing/invalid fields).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "404":
          description: No such scope, or the caller holds no grant for it.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } }
        "503":
          description: The configured object store cannot presign (e.g. the in-memory dev store).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: store_unavailable } }

  /api/scopes/{scopeId}/media-batch:
    post:
      tags: [media]
      operationId: completeMedia
      summary: Complete a media's uploads (original + derivatives) + attach to a node.
      description: >
        Each item is **one logical media**: an `originalUploadId` plus up to two role-tagged `derivatives`
        (THUMBNAIL, PREVIEW — generated client-side, [en.memory.derivatives](../../docs/features/memory/enablers/en.memory.derivatives.md)).
        The server verifies **every** upload session of the item, **stats the stored chunk objects** per blob
        (declare-then-verify: count + total bytes must match what was declared, else the objects are purged and
        the item fails `budget_exceeded`), records one `blob` per upload (each with its own per-chunk size
        `manifest` and `K_blob` wrap), and one `media` row linking the original blob to `nodeId` with a
        derivative row per derivative. Returns `{ blobId (the original), mediaId }` — or a per-item error. The
        target node must be a **MEMORY** or **CHAPTER** (`illegal_target` on a FOLDER).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaBatchRequest" }
            example:
              items:
                - nodeId: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d
                  originalUploadId: 1f2d3e4a-5b6c-7c3f-0e2a-9b1d4a6e8b2c
                  derivatives:
                    - kind: THUMBNAIL
                      uploadId: 2b3c4d5e-6f7a-8b9c-0d1e-2f3a4b5c6d7e
                    - kind: PREVIEW
                      uploadId: 3c4d5e6f-7a8b-9c0d-1e2f-3a4b5c6d7e8f
      responses:
        "200":
          description: Per-item completion results (success carries blob+media ids; failure carries a code).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaBatchResponse" }
        "400":
          description: Malformed request.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "404":
          description: No such scope, or the caller holds no grant for it.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } }

  /api/scopes/{scopeId}/nodes/{nodeId}/media:
    get:
      tags: [media]
      operationId: listNodeMedia
      summary: List a node's media (opaque metadata for read-back).
      description: >
        Returns each media attached to the node with its `mediaId`, the **original** blob ref (`blobId`,
        `chunkCount`, total `byteSize`, the per-chunk size `manifest`, `wrappedBlobKey`), **plus** its
        role-tagged `derivatives` (THUMBNAIL, PREVIEW — each its own blob ref with its own wrap). A gallery
        fetches the thumbnail tier for the grid, the preview for the lightbox, and the original only on
        download — never pulling the full original to render a grid. The client unwraps each `K_blob` under
        `K_mem`, presigns the downloads (`blob-downloads-batch`), and opens the chunks with `openFrame`. The
        operator sees only ciphertext sizes.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
        - $ref: "#/components/parameters/NodeId"
      responses:
        "200":
          description: The node's media.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MediaSummary" }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "404":
          description: No such scope/node, or the caller holds no grant for the scope.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: node_not_found } }

  /api/scopes/{scopeId}/media/{mediaId}/meta:
    get:
      tags: [media]
      operationId: getMediaMeta
      summary: A media's sealed EXIF bundle (lazy, opaque) — for the lightbox detail.
      description: >
        Returns the media's `wrappedExif`: the full EXIF bundle (camera, lens, aperture, ISO, GPS, capture
        time, …) sealed client-side under the Memory's `K_mem` (opaque base64), or null when none was sealed
        at upload. Deliberately **not** part of `listNodeMedia` (which stays constant-small): the lightbox
        fetches + unseals this only when an item opens. Operator-blind — the server stores + returns the
        ciphertext verbatim, never inspecting the fields inside.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
        - $ref: "#/components/parameters/MediaId"
      responses:
        "200":
          description: The media's sealed EXIF (opaque base64), or null when none was sealed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaMetaResponse" }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "404":
          description: No such scope/media, or the caller holds no grant for the scope.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: media_not_found } }
    put:
      tags: [media]
      operationId: updateMediaMeta
      summary: Overwrite a media's sealed EXIF bundle (e.g. a corrected capture time) — opaque.
      description: >
        Re-store the media's `wrappedExif` verbatim: the client unseals the current bundle under `K_mem`, adds
        or removes a correction (e.g. a `capturedAtOverride`), re-seals the **whole** bundle, and PUTs the new
        opaque base64 (or null to clear it). Operator-blind — the server overwrites the ciphertext it holds and
        never inspects the fields inside; it can't merge at field level (it can't read the bundle). Guards: the
        caller holds a grant for the scope; a media target must exist.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
        - $ref: "#/components/parameters/MediaId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaMetaUpdate" }
            example:
              wrappedExif: ZXhpZi1jaXBoZXJ0ZXh0
      responses:
        "200":
          description: The stored EXIF (echoed opaque base64, or null when cleared).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaMetaResponse" }
        "400":
          description: Malformed request.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "404":
          description: No such scope/media, or the caller holds no grant for the scope.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: media_not_found } }

  /api/scopes/{scopeId}/blob-downloads-batch:
    post:
      tags: [media]
      operationId: presignBlobDownloads
      summary: Presign GET for N blobs — one URL per chunk.
      description: >
        For each requested `blobId` the server returns one short-TTL presigned **GET** URL per chunk (in chunk
        order) — or a per-item error. The caller GETs each ciphertext chunk **directly from the object store**
        and opens it with `openFrame`. The in-memory store answers `store_unavailable`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ScopeId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlobDownloadsBatchRequest" }
            example:
              items:
                - blobId: 9b1d4a6e-8b2c-1f2d-3e4a-5b6c7c3f0e2a
      responses:
        "200":
          description: Per-item download results (success carries the presigned GETs; failure carries a code).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlobDownloadsBatchResponse" }
        "400":
          description: Malformed request.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } }
        "401":
          description: Generic authentication failure.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } }
        "404":
          description: No such scope, or the caller holds no grant for it.
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } }
        "503":
          description: The configured object store cannot presign (e.g. the in-memory dev store).
          content:
            application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: store_unavailable } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The opaque access token issued by login / refresh. Any authenticated caller holding a grant for the scope (enforced by code).

  parameters:
    ScopeId:
      name: scopeId
      in: path
      required: true
      description: Opaque id of the scope the media lives in.
      schema: { type: string, format: uuid, example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c }
    NodeId:
      name: nodeId
      in: path
      required: true
      description: Opaque id of the node (MEMORY/CHAPTER) the media is attached to.
      schema: { type: string, format: uuid, example: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d }
    MediaId:
      name: mediaId
      in: path
      required: true
      description: Opaque id of the media whose sealed EXIF is requested.
      schema: { type: string, format: uuid, example: 2a9b1d4a-6e8b-2c1f-2d3e-4a5b6c7c3f0e }

  schemas:
    # --- start uploads -------------------------------------------------------
    BlobUploadsBatchRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 256
          items: { $ref: "#/components/schemas/BlobUploadRequestItem" }

    BlobUploadRequestItem:
      type: object
      required: [chunkCount, byteSize, wrappedBlobKey]
      properties:
        chunkCount:
          type: integer
          format: int32
          description: Number of ciphertext chunks the blob is sealed into (≥ 1).
          minimum: 1
          maximum: 100000
          example: 2
        byteSize:
          type: integer
          format: int64
          description: Total ciphertext byte size declared up front (verified against the stored objects on complete).
          minimum: 0
          example: 131072
        wrappedBlobKey:
          type: string
          description: The blob's random `K_blob` wrapped under the Memory's `K_mem` (opaque base64).
          contentEncoding: base64
          maxLength: 256
          example: d3JhcHBlZC1rLWJsb2I=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 256) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    BlobUploadsBatchResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/BlobUploadResultItem" }

    BlobUploadResultItem:
      type: object
      description: One per request item, in order. Success carries `uploadId` + `presignedPuts`; failure carries `error`.
      properties:
        uploadId:
          type: [string, "null"]
          format: uuid
          description: The opaque upload session id, on success.
          example: 1f2d3e4a-5b6c-7c3f-0e2a-9b1d4a6e8b2c
        presignedPuts:
          type: [array, "null"]
          description: One presigned PUT URL per chunk, in chunk order.
          items: { $ref: "#/components/schemas/PresignedUrl" }
        error:
          type: [string, "null"]
          description: Per-item error code (`budget_exceeded` = declared bytes/chunks over the cap, `store_unavailable`); null on success.
          maxLength: 64
          example: null

    # --- complete + attach ---------------------------------------------------
    MediaBatchRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 256
          items: { $ref: "#/components/schemas/MediaRequestItem" }

    MediaRequestItem:
      type: object
      description: >
        One logical media: the original upload plus up to two role-tagged derivative uploads (THUMBNAIL,
        PREVIEW). Each `*UploadId` references a session opened by `startBlobUploads`.
      required: [originalUploadId, nodeId]
      properties:
        originalUploadId:
          type: string
          format: uuid
          description: The upload session for the **original** (pristine) blob, opened by `startBlobUploads`.
          example: 1f2d3e4a-5b6c-7c3f-0e2a-9b1d4a6e8b2c
        nodeId:
          type: string
          format: uuid
          description: The MEMORY/CHAPTER node to attach the media to.
          example: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d
        derivatives:
          type: [array, "null"]
          description: >
            Role-tagged derivative uploads (THUMBNAIL, PREVIEW), each its own blob. Empty/absent for a media
            type with no derivable frame (the gallery falls back to an icon). At most one of each kind.
          maxItems: 2
          items: { $ref: "#/components/schemas/MediaDerivativeUpload" }
        wrappedLayout:
          type: [string, "null"]
          description: >
            The original's **layout tier** `{v,w,h}` sealed under the Memory's `K_mem` (opaque base64) — pixel
            geometry only, kept minimal since it's returned with every list; the gallery unwraps it to lay out
            the justified grid. Absent for a media type whose frame the client couldn't decode (the grid falls
            back to a default aspect). Generalizes cr-0059's `wrappedDimensions` (versioned). Capture time lives
            in `wrappedExif`, not here.
          contentEncoding: base64
          maxLength: 256
          example: ZGltcy1jaXBoZXJ0ZXh0
        wrappedExif:
          type: [string, "null"]
          description: >
            The original's **full EXIF bundle** (camera, lens, aperture, ISO, GPS, capture time, …) sealed under
            the Memory's `K_mem` (opaque base64). Stored verbatim, **not** returned by `listNodeMedia` (kept
            constant-small) — the lightbox lazy-loads it via `getMediaMeta`. Absent when the source carried no
            readable EXIF. Larger than the layout tier, so a wider cap.
          contentEncoding: base64
          maxLength: 16384
          example: ZXhpZi1jaXBoZXJ0ZXh0

    MediaDerivativeUpload:
      type: object
      required: [kind, uploadId]
      properties:
        kind: { $ref: "#/components/schemas/MediaDerivativeKind" }
        uploadId:
          type: string
          format: uuid
          description: The upload session for this derivative blob, opened by `startBlobUploads`.
          example: 2b3c4d5e-6f7a-8b9c-0d1e-2f3a4b5c6d7e

    MediaDerivativeKind:
      type: string
      description: The role of a derivative blob — THUMBNAIL (grid) or PREVIEW (lightbox).
      enum: [THUMBNAIL, PREVIEW]
      example: THUMBNAIL

    MediaBatchResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/MediaResultItem" }

    MediaResultItem:
      type: object
      description: >
        One per request item, in order. Success carries the **original** `blobId` + `mediaId`; failure carries
        `error`. The whole item is atomic — if any of its uploads (original or a derivative) fails to verify,
        none are attached.
      properties:
        blobId:
          type: [string, "null"]
          format: uuid
          description: The **original** blob's id, on success (derivative blob ids surface via `listNodeMedia`).
          example: 9b1d4a6e-8b2c-1f2d-3e4a-5b6c7c3f0e2a
        mediaId:
          type: [string, "null"]
          format: uuid
          example: 2a9b1d4a-6e8b-2c1f-2d3e-4a5b6c7c3f0e
        error:
          type: [string, "null"]
          description: Per-item error code (`upload_not_found`, `node_not_found`, `illegal_target`, `budget_exceeded`); null on success.
          maxLength: 64
          example: null

    # --- read-back -----------------------------------------------------------
    MediaSummary:
      type: object
      description: >
        A media's read-back view: the **original** blob ref plus its role-tagged `derivatives`. A gallery
        fetches `derivatives[THUMBNAIL]` for the grid, `derivatives[PREVIEW]` for the lightbox, and the
        original blob only on download.
      required: [mediaId, blobId, chunkCount, byteSize, wrappedBlobKey]
      properties:
        mediaId: { type: string, format: uuid, example: 2a9b1d4a-6e8b-2c1f-2d3e-4a5b6c7c3f0e }
        blobId: { type: string, format: uuid, example: 9b1d4a6e-8b2c-1f2d-3e4a-5b6c7c3f0e2a }
        chunkCount:
          type: integer
          format: int32
          example: 2
        byteSize:
          type: integer
          format: int64
          example: 131072
        manifest:
          type: [array, "null"]
          description: Per-chunk ciphertext byte sizes in chunk order (server-recorded at complete; ciphertext sizes only).
          items: { type: integer, format: int64, example: 65536 }
        wrappedBlobKey:
          type: string
          description: The original blob's `K_blob` wrapped under `K_mem` (opaque base64).
          contentEncoding: base64
          maxLength: 256
          example: d3JhcHBlZC1rLWJsb2I=
        derivatives:
          type: [array, "null"]
          description: Role-tagged derivative tiers (THUMBNAIL, PREVIEW), each its own blob ref with its own wrap.
          items: { $ref: "#/components/schemas/MediaDerivativeSummary" }
        wrappedLayout:
          type: [string, "null"]
          description: >
            The original's layout tier `{v,w,h}` sealed under `K_mem` (opaque base64) — pixel geometry only; the
            gallery unwraps it to lay out the justified grid. Null when none was sealed at upload (the grid uses
            a default aspect). Capture time + the heavier EXIF tier are lazy via `getMediaMeta`.
          contentEncoding: base64
          maxLength: 256
          example: ZGltcy1jaXBoZXJ0ZXh0

    MediaDerivativeSummary:
      type: object
      description: A derivative tier's blob ref — same opaque metadata as the original, plus its role `kind`.
      required: [kind, blobId, chunkCount, byteSize, wrappedBlobKey]
      properties:
        kind: { $ref: "#/components/schemas/MediaDerivativeKind" }
        blobId: { type: string, format: uuid, example: 8b2c1f2d-3e4a-5b6c-7c3f-0e2a9b1d4a6e }
        chunkCount:
          type: integer
          format: int32
          example: 1
        byteSize:
          type: integer
          format: int64
          example: 65536
        manifest:
          type: [array, "null"]
          description: Per-chunk ciphertext byte sizes in chunk order (ciphertext sizes only).
          items: { type: integer, format: int64, example: 65536 }
        wrappedBlobKey:
          type: string
          description: The derivative blob's own `K_blob` wrapped under `K_mem` (opaque base64).
          contentEncoding: base64
          maxLength: 256
          example: d3JhcHBlZC1rLWJsb2I=

    MediaMetaResponse:
      type: object
      description: >
        A media's lazy metadata: the sealed EXIF bundle, opaque to the server. Fetched per-item when the
        lightbox opens (kept out of `listNodeMedia` so the list stays constant-small).
      properties:
        wrappedExif:
          type: [string, "null"]
          description: >
            The original's full EXIF bundle sealed under `K_mem` (opaque base64); the lightbox unwraps it to
            show camera/lens/exposure/coordinates. Null when none was sealed at upload.
          contentEncoding: base64
          maxLength: 16384
          example: ZXhpZi1jaXBoZXJ0ZXh0

    MediaMetaUpdate:
      type: object
      description: >
        Overwrite a media's sealed EXIF bundle (re-sealed client-side under `K_mem`), e.g. to persist a
        corrected capture time. Null clears it. Opaque to the server.
      properties:
        wrappedExif:
          type: [string, "null"]
          description: The re-sealed full EXIF bundle (opaque base64), or null to clear the media's EXIF tier.
          contentEncoding: base64
          maxLength: 16384
          example: ZXhpZi1jaXBoZXJ0ZXh0

    # --- presign downloads ---------------------------------------------------
    BlobDownloadsBatchRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 256
          items: { $ref: "#/components/schemas/BlobDownloadRequestItem" }

    BlobDownloadRequestItem:
      type: object
      required: [blobId]
      properties:
        blobId:
          type: string
          format: uuid
          example: 9b1d4a6e-8b2c-1f2d-3e4a-5b6c7c3f0e2a

    BlobDownloadsBatchResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/BlobDownloadResultItem" }

    BlobDownloadResultItem:
      type: object
      description: One per request item, in order. Success carries `presignedGets`; failure carries `error`.
      properties:
        presignedGets:
          type: [array, "null"]
          description: One presigned GET URL per chunk, in chunk order.
          items: { $ref: "#/components/schemas/PresignedUrl" }
        error:
          type: [string, "null"]
          description: Per-item error code (`upload_not_found` = unknown blob, `store_unavailable`); null on success.
          maxLength: 64
          example: null

    # --- shared --------------------------------------------------------------
    PresignedUrl:
      type: object
      required: [index, url]
      properties:
        index:
          type: integer
          format: int32
          description: Chunk index (0-based, in chunk order).
          example: 0
        url:
          type: string
          description: A short-TTL, single-object, single-method presigned URL (PUT or GET) against the object store.
          maxLength: 4096
          example: https://store.example.com/veyq/9b1d4a6e/0?X-Amz-Signature=...

    ErrorResponse:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: Stable, client-localizable error code.
          maxLength: 64
          example: invalid_request
        message:
          type: [string, "null"]
          description: Optional developer-facing detail; never contains secrets or content.
          maxLength: 512
          example: null
