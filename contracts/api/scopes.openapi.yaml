openapi: 3.1.0
info:
  title: veyq Scopes API
  version: 0.1.0
  description: >
    A member's scopes within the active tenant — the structural layer "where content lives and who may
    access it" (en.spaces.personal-scope, cr-0026). A **scope** is the unit content is keyed on, addressed by
    an opaque id and a `kind` (TENANT / GROUP / PERSONAL). The active tenant is resolved from the request
    `Host` (ADR 0002); every scope lives within exactly one tenant.

    **Operator-blind.** The server stores only the opaque scope row (id / kind / tenant), the **ciphertext
    grant** (the scope key sealed to a member's identity public key — `asymWrap`, the hybrid KEM, ADR 0017),
    and the membership. It never holds a scope key, so it **cannot** create a scope: birth is **client-driven**
    — the client generates the scope key, seals it to its own identity, and hands the server only the grant
    ciphertext. The server mints the scope id + the self-membership.

    `POST /api/scopes` creates the caller's **personal** scope in the active tenant (one per member per
    tenant); group creation is a later, separate operation. `GET /api/scopes` lists the caller's scopes in the
    active tenant together with their own grant ciphertext, so the client can open them locally. Both require
    an authenticated caller; authorization is enforced by code annotations, not this spec (ADR 0008). Field
    validation is declared here via `x-field-extra-annotation` (bean-validation + a trimming deserializer), so
    malformed input is rejected at the boundary (400) before any handler runs.
tags:
  - name: scopes
    description: >
      A member's scopes in the active tenant (create-personal / list-mine). One tag = one resource interface
      owning the whole `/api/scopes` subtree.

paths:
  /api/scopes:
    post:
      tags: [scopes]
      operationId: createPersonalScope
      summary: Birth the caller's personal scope in the active tenant.
      description: >
        Creates a `kind=PERSONAL` scope for the authenticated caller in the tenant resolved from the `Host`,
        plus the caller's self-membership. The client has generated the scope key and sealed it to its own
        identity public key; the server stores only the opaque `wrappedGrant` ciphertext and never sees the
        key. One personal scope per (member, tenant) — a second call is `409 personal_scope_exists`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePersonalScopeRequest" }
            example:
              wrappedGrant: AQ==
      responses:
        "201":
          description: The personal scope was created and the caller holds its grant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScopeCreated" }
              example:
                scopeId: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d
                kind: PERSONAL
        "400":
          description: The request was malformed (missing/invalid grant).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "404":
          description: No tenant resolves from the request Host.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: tenant_not_found }
        "409":
          description: The caller already has a personal scope in this tenant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: personal_scope_exists }
    get:
      tags: [scopes]
      operationId: listMyScopes
      summary: List the caller's scopes in the active tenant.
      description: >
        Returns every scope the authenticated caller holds in the tenant resolved from the `Host`, each with
        its opaque id, kind, tenant id, and the caller's **own** grant ciphertext (so the client can
        `asymUnwrap` it locally to open the scope). No other member's grant is ever returned; the operator
        stays blind to scope keys.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's scopes in the active tenant.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScopeSummary" }
              example:
                - id: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c
                  kind: TENANT
                  tenantId: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c
                  wrappedGrant: AQ==
                - id: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d
                  kind: PERSONAL
                  tenantId: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c
                  wrappedGrant: AQ==
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "404":
          description: No tenant resolves from the request Host.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: tenant_not_found }

  /api/scopes/groups:
    post:
      tags: [scopes]
      operationId: createGroup
      summary: Create a named group scope in the active tenant.
      description: >
        Creates a `kind=GROUP` scope for the authenticated caller in the tenant resolved from the `Host`, plus
        the caller's self-membership (`role=OWNER`). Like the personal scope, birth is **client-driven**: the
        client generated the scope key `K_SC`, sealed the group name under its derived name-key `K_name_0`
        (`encryptedName`, cr-0096/ADR 0027), and sealed `K_SC` to its own identity public key (`wrappedGrant`,
        born at name-epoch 0). The server stores both ciphertexts verbatim and
        never sees the key or the name — it only mints the scope id + the self-membership. Group names are **not**
        unique; a duplicate name is allowed (resolved client-side, ADR 0014). Adding other members is a later,
        separate operation.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGroupRequest" }
            example:
              encryptedName: c2VhbGVkLW5hbWU=
              wrappedGrant: AQ==
      responses:
        "201":
          description: The group scope was created and the caller holds its grant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScopeCreated" }
              example:
                scopeId: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d
                kind: GROUP
        "400":
          description: The request was malformed (missing/invalid name or grant).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure (missing, invalid, expired, or revoked access token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "404":
          description: No tenant resolves from the request Host.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: tenant_not_found }
        "422":
          description: >
            The `spaces.groups` capability is disabled instance-wide (ADR 0032): the operator runs a
            personal-only instance and group scopes are turned off. Enforced server-side even if a stale client
            still offers the affordance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: capability_disabled }

  /api/scopes/{scopeId}/members:
    get:
      tags: [scopes]
      operationId: listScopeMembers
      summary: List a scope's members with their identity public keys + grant status (the member directory).
      description: >
        Returns every membership in the scope — each member's `userId`, `role`, **identity public key**, and
        whether they already hold a grant (`hasGrant`: granted vs. *pending*). The directory a key-holder uses
        to add + track members (uc.spaces.add-member, ADR 0020): the pending members are the ones a
        `grant-delivery` job will wrap `K_SC` to. Operator-blind — the server returns only already-stored
        operational metadata (pubkeys/roles/grant-present), **never** a scope key; and it is scoped to *this
        scope's own members*, not a global user search. Any key-holder in the scope may read it (authorization
        is enforced by code, not this spec, ADR 0008). Membership is the **first** gate (ADR 0042): a caller who
        is not a member gets `404 scope_not_found` — the same answer as for a scope id that does not exist, so
        scope existence is not enumerable. A member who holds no grant yet gets `403 not_key_holder`.
      security:
        - bearerAuth: []
      parameters:
        - name: scopeId
          in: path
          required: true
          description: Opaque id of the scope whose members to list.
          schema: { type: string, format: uuid, example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c }
      responses:
        "200":
          description: The scope's members.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScopeMember" }
              example:
                - userId: 9b1d4a6e-8b2c-1f2d-3e4a-5b6c7c3f0e2a
                  role: OWNER
                  identityPublicKey: aWRlbnRpdHktcHVibGljLWtleQ==
                  hasGrant: true
                - userId: 5b6c7c3f-0e2a-9b1d-4a6e-8b2c1f2d3e4a
                  role: MEMBER
                  identityPublicKey: bWVtYmVyLXB1YmxpYy1rZXk=
                  hasGrant: false
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: >
            The caller is a member but holds no grant yet (only a key-holder may list the members).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_key_holder }
        "404":
          description: >
            No such scope — or the caller is not a member of it (deliberately indistinguishable, ADR 0042).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: scope_not_found }
    post:
      tags: [scopes]
      operationId: addGroupMember
      summary: Add an existing tenant member to a group by username (admission; the key is delivered later).
      description: >
        Admits an existing member of the scope's tenant to a **GROUP** scope, picked by their per-tenant
        `username` (en.spaces.add-group-member, cr-0086). The server resolves the username **within the scope's
        own tenant** (never a global user-search, ADR 0020) and records a **grant-less** GROUP membership
        (`role=MEMBER`, no grant) — admission only. **No key crosses the wire**: `K_SC` is delivered afterwards by
        any group key-holder's `grant-delivery` job (ADR 0020/0021, cr-0076), so the returned member starts with
        `hasGrant=false` (*awaiting access*). Only the group **OWNER** may add a member (the tenant owner has no
        say over groups, ADR 0014 §4) — authorization is enforced by code, not this spec (ADR 0008).


        **Consent (uc.spaces.consent-group-add, cr-0096/ADR 0027):** if the target turned on "ask before adding me
        to groups", the add must carry `sealedNameKey` (the group's derived name-key `K_name` sealed to their
        identity, which opens the canonical `encryptedName`) and is recorded as a **soft `pendingConsent`**
        membership — grant-delivery skips it, so `K_SC` is gated **before** the wrap — until the invitee accepts
        (`…/invitations/accept`). The owner learns consent is required from the prior member-resolve; a
        `requiresConsent` target added **without** `sealedNameKey` is rejected `400 consent_required`.
      security:
        - bearerAuth: []
      parameters:
        - name: scopeId
          in: path
          required: true
          description: Opaque id of the GROUP scope to add the member to.
          schema: { type: string, format: uuid, example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddGroupMemberRequest" }
            example:
              username: partner
      responses:
        "201":
          description: >
            The member was admitted. For a direct-add: grant-less, `hasGrant=false`, awaiting delivery. For a
            consent proposal (`sealedNameKey` sent to a `requiresConsent` target): a soft `pendingConsent=true`
            row, gated before any key wrap.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScopeMember" }
              example:
                userId: 5b6c7c3f-0e2a-9b1d-4a6e-8b2c1f2d3e4a
                username: partner
                sealedName: c2VhbGVkLW5hbWU=
                role: MEMBER
                identityPublicKey: bWVtYmVyLXB1YmxpYy1rZXk=
                hasGrant: false
                pendingConsent: false
        "400":
          description: >
            The request was malformed (missing/invalid username), or the target has consent on but no
            `sealedNameKey` was supplied (`consent_required` — resolve the member first, derive + seal the group
            name-key, then re-submit).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: consent_required }
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is a member of the group but not its OWNER (only an owner may add a member).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_scope_owner }
        "404":
          description: >
            No such GROUP scope, or the caller is not a member of it (`scope_not_found` — deliberately
            indistinguishable, ADR 0042); or the username resolves to no member of the scope's tenant
            (`member_not_found`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: member_not_found }
        "409":
          description: That user is already a member of the group (or already has an open proposal).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: already_member }

  /api/scopes/{scopeId}/members/resolve:
    post:
      tags: [scopes]
      operationId: resolveGroupMember
      summary: Resolve a per-tenant username to a group-add candidate (records nothing).
      description: >
        Resolves a per-tenant `username` to a candidate for a GROUP add (uc.spaces.consent-group-add, cr-0094)
        **without recording anything**. Returns the candidate's `userId`, `identityPublicKey` (so the owner's
        device can seal the group name), and `requiresConsent` (whether the target's account-global consent
        preference is on). The owner then either direct-adds (consent off) or seals the group name and submits a
        proposal (consent on). Resolved **within the scope's own tenant** (never a global user-search, ADR 0020).
        Only the group **OWNER** may resolve a candidate (the same gate as the add); enforced by code, not this
        spec (ADR 0008). This owner-gate is convenience, **not** a confidentiality barrier: any tenant member can
        create a group and become its owner, so a member's username → identity public key → consent flag are
        effectively enumerable tenant-wide. That is within the metadata model (per-tenant usernames + pubkeys are
        tenant-visible, ADR 0023) — not a leak, but the gate must not be read as one.
      security:
        - bearerAuth: []
      parameters:
        - name: scopeId
          in: path
          required: true
          description: Opaque id of the GROUP scope to resolve a candidate for.
          schema: { type: string, format: uuid, example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddGroupMemberRequest" }
            example:
              username: partner
      responses:
        "200":
          description: The resolved candidate (nothing was recorded).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolvedGroupCandidate" }
              example:
                userId: 5b6c7c3f-0e2a-9b1d-4a6e-8b2c1f2d3e4a
                username: partner
                identityPublicKey: bWVtYmVyLXB1YmxpYy1rZXk=
                requiresConsent: true
        "400":
          description: The request was malformed (missing/invalid username).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: invalid_request }
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "403":
          description: The caller is a member of the group but not its OWNER (only an owner may resolve a candidate).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: not_scope_owner }
        "404":
          description: >
            No such GROUP scope, or the caller is not a member of it (`scope_not_found` — deliberately
            indistinguishable, ADR 0042); or the username resolves to no member of the scope's tenant
            (`member_not_found`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: member_not_found }

  /api/scopes/{scopeId}/members/{userId}:
    patch:
      tags: [scopes]
      operationId: setMemberRole
      summary: Promote a member to co-owner or demote a co-owner (group roles).
      description: >
        Sets a group member's role (`OWNER` / `MEMBER`) — the GroupOwner's promote/demote (uc.spaces.manage-group-members,
        cr-0088, ADR 0014 §4). Membership-gated first (a non-member gets `404 scope_not_found`, ADR 0042), then
        owner-gated (`403 not_scope_owner`); the **last-owner guard** rejects demoting the last remaining OWNER
        (`409 last_owner`, ADR 0007). A pure role change — no key moves (the member already holds the scope key).
        Enforced by code, not this spec (ADR 0008).
      security:
        - bearerAuth: []
      parameters:
        - { name: scopeId, in: path, required: true, description: Opaque id of the GROUP scope., schema: { type: string, format: uuid } }
        - { name: userId, in: path, required: true, description: Opaque id of the member whose role to set., schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetMemberRoleRequest" }
            example: { role: OWNER }
      responses:
        "200":
          description: The member's role after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScopeMember" }
        "400": { description: Malformed (invalid role)., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } } } }
        "401": { description: Generic authentication failure., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } } } }
        "403": { description: The caller is a member of the group but not its OWNER., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: not_scope_owner } } } }
        "404": { description: "No such GROUP scope, or the caller is not a member of it (`scope_not_found`, indistinguishable per ADR 0042); or no such target member (`member_not_found`).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: member_not_found } } } }
        "409": { description: The last remaining OWNER cannot be demoted., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: last_owner } } } }
    delete:
      tags: [scopes]
      operationId: removeMember
      summary: Remove a member from a group (layer-1 access cut; the caller then rotates the key).
      description: >
        Deletes a member's GROUP membership — the instant **layer-1** access cut (a 404 on the scope afterwards:
        once the membership is gone the scope is indistinguishable from one that never existed, ADR 0042)
        of uc.spaces.manage-group-members (cr-0088). Membership-gated first (a non-member gets `404
        scope_not_found`, ADR 0042), then owner-gated (`403 not_scope_owner`); the **last-owner guard**
        rejects removing the last OWNER (`409 last_owner`). This is admission only — **layer-2** forward-secrecy is
        the caller's follow-up **rotation-commit** (`POST /api/scopes/{scopeId}/epochs`, ADR 0024): mint a new
        epoch, re-grant the remaining members. The server never holds a key.
      security:
        - bearerAuth: []
      parameters:
        - { name: scopeId, in: path, required: true, description: Opaque id of the GROUP scope., schema: { type: string, format: uuid } }
        - { name: userId, in: path, required: true, description: Opaque id of the member to remove., schema: { type: string, format: uuid } }
      responses:
        "204": { description: The member was removed (their grant is gone). }
        "401": { description: Generic authentication failure., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } } } }
        "403": { description: The caller is a member of the group but not its OWNER., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: not_scope_owner } } } }
        "404": { description: "No such GROUP scope, or the caller is not a member of it (`scope_not_found`, indistinguishable per ADR 0042); or no such target member (`member_not_found`).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: member_not_found } } } }
        "409": { description: The last remaining OWNER cannot be removed., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: last_owner } } } }

  /api/scopes/{scopeId}/epochs:
    get:
      tags: [scopes]
      operationId: listScopeEpochs
      summary: The scope's epoch-chain links, so a member peels down to read older epochs.
      description: >
        Returns the scope's **epoch-chain links** (ADR 0024): for each epoch `n ≥ 1`, `wrappedPrev` =
        `symWrap(E_n, E_{n-1})` (opaque base64) — so a member who holds the latest epoch (via their grant) derives
        every earlier one and reads content of any epoch. Epoch 0 has no predecessor. Operator-blind: opaque
        ciphertext only, never a key. Any key-holder may read it. Membership is the **first** gate (ADR 0042):
        a non-member gets `404 scope_not_found`, identical to the answer for a scope id that does not exist.
      security:
        - bearerAuth: []
      parameters:
        - { name: scopeId, in: path, required: true, description: Opaque id of the scope., schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The epoch-chain links (ascending by epoch).
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ScopeEpochLink" } }
              example:
                - { epoch: 1, wrappedPrev: AQ== }
        "401": { description: Generic authentication failure., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } } } }
        "403": { description: The caller is a member but holds no grant in this scope., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: not_key_holder } } } }
        "404": { description: "No such scope — or the caller is not a member of it (indistinguishable, ADR 0042).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } } } }
    post:
      tags: [scopes]
      operationId: rotateScope
      summary: Commit a scope-key rotation — a new epoch + re-grants to the remaining members.
      description: >
        Commits a forward rotation of the scope content key (ADR 0024): bumps the scope's **current epoch** to the
        next index, stores the chain-link `wrappedPrev` = `symWrap(E_new, E_{prev})`, and applies the `grants`
        (each remaining member's `wrappedGrant` re-wrapped to the **new** epoch, updating their granted-epoch). The
        client mints the new epoch on-device; the server stores only ciphertext. Owner-gated (`403`). Grants for
        members not listed here are delivered afterwards by grant-delivery (stale-epoch reconcile, ADR 0020/0021).
      security:
        - bearerAuth: []
      parameters:
        - { name: scopeId, in: path, required: true, description: Opaque id of the GROUP scope., schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RotateScopeRequest" }
            example:
              wrappedPrev: AQ==
              grants: [{ userId: 9b1d4a6e-8b2c-1f2d-3e4a-5b6c7c3f0e2a, wrappedGrant: AQ== }]
      responses:
        "201":
          description: The scope rotated; the new current epoch.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScopeRotated" }
              example: { epoch: 1 }
        "400": { description: Malformed (missing/invalid link or grant)., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } } } }
        "401": { description: Generic authentication failure., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } } } }
        "403": { description: The caller is a member of the group but not its OWNER., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: not_scope_owner } } } }
        "404": { description: "No such scope — or the caller is not a member of it (indistinguishable, ADR 0042).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } } } }

  /api/scopes/{scopeId}:
    delete:
      tags: [scopes]
      operationId: deleteGroup
      summary: Soft-delete a group — enter a grace period, then a scheduled hard-purge.
      description: >
        Soft-deletes a GROUP scope (uc.spaces.delete-group, cr-0090, ADR 0014 §6): sets the scope's `deletedAt`
        marker, so it enters a **grace period** (`purgeAfter = deletedAt + retention`, 30 days). During grace the
        group stays listed + readable but **read-only** and marked as deleting; a scheduled job hard-erases it
        (nodes + blob objects + memberships + epoch links + the scope) after `purgeAfter`. Grants/memberships are
        untouched, so **any owner** may {@link restoreGroup} in-window. Membership-gated first (a non-member gets `404 scope_not_found`, ADR 0042), then owner-gated (`403 not_scope_owner`);
        **GROUP-only** and idempotent (`409`). Enforced by code, not this spec (ADR 0008). Erasure only — the
        server needs no key.
      security:
        - bearerAuth: []
      parameters:
        - { name: scopeId, in: path, required: true, description: Opaque id of the GROUP scope to delete., schema: { type: string, format: uuid } }
      responses:
        "204": { description: The group entered pending-deletion (grace period started). }
        "401": { description: Generic authentication failure., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } } } }
        "403": { description: The caller is a member of the group but not its OWNER., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: not_scope_owner } } } }
        "404": { description: "No such scope — or the caller is not a member of it (indistinguishable, ADR 0042).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } } } }
        "409": { description: Not a GROUP or already pending-deletion., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_already_deleted } } } }

  /api/scopes/{scopeId}/restore:
    post:
      tags: [scopes]
      operationId: restoreGroup
      summary: Restore a group from pending-deletion (undo the soft-delete, in-window).
      description: >
        Restores a GROUP scope that is in **pending-deletion** and still within its grace window (uc.spaces.delete-group,
        cr-0090): clears `deletedAt`/`purgeAfter`, so the group is fully active again for everyone (grants/memberships
        were never touched). Membership-gated first (a non-member gets `404 scope_not_found`, ADR 0042), then owner-gated (`403 not_scope_owner`). `409` if the group is not pending-deletion; once the
        scheduled hard-purge has run the scope is gone (`404 scope_not_found`).
      security:
        - bearerAuth: []
      parameters:
        - { name: scopeId, in: path, required: true, description: Opaque id of the pending-deletion GROUP scope., schema: { type: string, format: uuid } }
      responses:
        "204": { description: The group was restored (active again). }
        "401": { description: Generic authentication failure., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } } } }
        "403": { description: The caller is a member of the group but not its OWNER., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: not_scope_owner } } } }
        "404": { description: "No such scope (or already hard-purged) — or the caller is not a member of it (indistinguishable, ADR 0042).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } } } }
        "409": { description: The group is not in pending-deletion., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: not_deleted } } } }

  /api/scopes/{scopeId}/name:
    post:
      tags: [scopes]
      operationId: renameGroup
      summary: Rename a group — re-seal the name under the current epoch (forward-secret).
      description: >
        Renames a GROUP scope (uc.spaces.rename-group, cr-0097, ADR 0027). The client re-seals the new name under
        `K_name` derived from the scope's **current** content-key epoch (`K_name = HKDF(E_currentEpoch,
        "group-name-key")`) and posts the opaque `encryptedName` + the `nameEpoch` it sealed under. The server
        overwrites the scope's `encrypted_name` + `name_epoch` — **only** when `nameEpoch == currentEpoch` (else
        `409 stale_epoch`: a concurrent rotation advanced the epoch under the caller, refetch + retry) and the group
        is active (else `409 scope_pending_deletion`: a name-write is blocked during the grace period). Sealing under
        the **current** epoch makes the rename **forward-secret** — a member removed at an earlier epoch cannot
        derive the new `K_name`. **Name-only**: no `K_SC` rotation, no re-grant. Membership-gated first (a
        non-member gets `404 scope_not_found`, ADR 0042), then owner-gated (`403 not_scope_owner`; ADR 0014 §4).
        Operator-blind — the server never sees a key or the plaintext name (enforced by code, ADR 0008).
      security:
        - bearerAuth: []
      parameters:
        - { name: scopeId, in: path, required: true, description: Opaque id of the GROUP scope to rename., schema: { type: string, format: uuid, example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenameGroupRequest" }
            example: { encryptedName: c2VhbGVkLW5hbWU=, nameEpoch: 0 }
      responses:
        "204": { description: The group was renamed (the row's encrypted_name + name_epoch were overwritten). }
        "400": { description: Malformed request (blank/oversized/invalid encryptedName)., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } } } }
        "401": { description: Generic authentication failure., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } } } }
        "403": { description: The caller is a member of the group but not its OWNER., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: not_scope_owner } } } }
        "404": { description: "No such GROUP scope — or the caller is not a member of it (indistinguishable, ADR 0042).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } } } }
        "409": { description: "The submitted `nameEpoch` is stale (a concurrent rotation moved the epoch — `stale_epoch`, refetch + retry), or the group is pending-deletion (`scope_pending_deletion`).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: stale_epoch } } } }

  /api/scopes/{scopeId}/icon:
    post:
      tags: [scopes]
      operationId: setScopeIcon
      summary: Set or replace a space icon — seal it under the current epoch (operator-blind, constant length).
      description: >
        Sets or replaces a space's icon (uc.spaces.set-space-icon). The client bakes the crop, re-encodes to a
        fixed square, **pads the plaintext to a constant length**, and seals it under `K_icon` derived from the
        scope's **current** content-key epoch (`K_icon = HKDF(E_currentEpoch, "veyq/v1/space-icon-key")`), then
        posts the opaque `sealedIcon` + the `iconEpoch` it sealed under. The server overwrites the scope's
        `sealed_icon` + `icon_epoch` — **only** when `iconEpoch == currentEpoch` (else `409 stale_epoch`: a
        concurrent rotation advanced the epoch under the caller, refetch + retry) and the scope is active (else
        `409 scope_pending_deletion`). Sealing under the current epoch makes a replaced icon forward-secret. The
        scope must be a **TENANT** or a **GROUP** — a **PERSONAL** scope has no icon (nothing to tell it apart
        from) and answers `404`. For a GROUP the `iconEpoch` may sit below `currentEpoch` (a group rotates its
        content-key on member-removal, ADR 0024, but a rotation never re-seals the icon), so a reader peels the
        epoch chain down to `iconEpoch` to derive `K_icon`. Membership-gated first (a
        non-member gets `404 scope_not_found`, ADR 0042), then owner-gated (`403 not_scope_owner`; ADR 0007 — the
        owner gate keys on the root scope; a GROUP co-owner is an OWNER too). Because every `sealedIcon` is padded to an identical length, the
        server cannot tell a logo from a photo. Operator-blind — the server never sees a key or the image
        (ADR 0008).
      security:
        - bearerAuth: []
      parameters:
        - { name: scopeId, in: path, required: true, description: Opaque id of the TENANT or GROUP scope to set the icon of., schema: { type: string, format: uuid, example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetScopeIconRequest" }
            example: { sealedIcon: c2VhbGVkLWljb24=, iconEpoch: 0 }
      responses:
        "204": { description: The icon was set (the row's sealed_icon + icon_epoch were overwritten). }
        "400": { description: Malformed request (blank/wrong-length/invalid sealedIcon)., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invalid_request } } } }
        "401": { description: Generic authentication failure., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } } } }
        "403": { description: The caller is a member of the scope but not its OWNER., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: not_scope_owner } } } }
        "404": { description: "No such scope (or already hard-purged) — or the caller is not a member of it (indistinguishable, ADR 0042) — or it is a PERSONAL scope (which carries no icon).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } } } }
        "409": { description: "The submitted `iconEpoch` is stale (a concurrent rotation moved the epoch — `stale_epoch`, refetch + retry), or the scope is pending-deletion (`scope_pending_deletion`).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: stale_epoch } } } }
    delete:
      tags: [scopes]
      operationId: clearScopeIcon
      summary: Remove a space icon — every member falls back to the initial.
      description: >
        Clears a space's icon (uc.spaces.set-space-icon A5): the row's `sealed_icon` + `icon_epoch` are reset and
        every member falls back to the initial. **No epoch check** — a removal carries no ciphertext that could be
        sealed under a stale epoch, so it is idempotent (clearing an already-iconless scope is still a `204`).
        Membership-gated first (a non-member gets `404 scope_not_found`, ADR 0042), then owner-gated
        (`403 not_scope_owner`). Operator-blind.
      security:
        - bearerAuth: []
      parameters:
        - { name: scopeId, in: path, required: true, description: Opaque id of the TENANT or GROUP scope to clear the icon of., schema: { type: string, format: uuid, example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c } }
      responses:
        "204": { description: The icon was removed (or was already absent — idempotent). }
        "401": { description: Generic authentication failure., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } } } }
        "403": { description: The caller is a member of the scope but not its OWNER., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: not_scope_owner } } } }
        "404": { description: "No such scope — or the caller is not a member of it (indistinguishable, ADR 0042).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: scope_not_found } } } }

  /api/scopes/my-tenants:
    get:
      tags: [scopes]
      operationId: listMyTenants
      summary: List the tenants the caller belongs to (the space switcher).
      description: >
        Returns every tenant the authenticated caller is a member of — its opaque id, display `name`, the
        `domain` it is reached at, the caller's `role`, and — so the switcher can render each tenant's avatar
        without a per-tenant call — the caller's own opaque `wrappedGrant` for that tenant plus its `sealedIcon`
        / `iconEpoch` (uc.spaces.set-space-icon; the widened cross-tenant read path is owned by
        en.spaces.tenant-scope). Independent of the request Host (it lists *all* the caller's tenants, so the
        client can render a switcher and link to each tenant's domain). Tenant name + domain are server-visible
        operational metadata (tenant identity = the domain, ADR 0002). The `wrappedGrant` and `sealedIcon` are
        **opaque ciphertext** the server never interprets — it derives no key and never sees the icon
        (operator-blind, ADR 0008).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The tenants the caller belongs to.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MyTenant" }
              example:
                - tenantId: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c
                  name: Familie Raddatz
                  domain: memories.raddatz.me
                  role: OWNER
                  wrappedGrant: AQ==
                  sealedIcon: c2VhbGVkLWljb24=
                  iconEpoch: 0
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }

  /api/scopes/invitations:
    get:
      tags: [scopes]
      operationId: listMyGroupInvitations
      summary: List the caller's pending group-consent proposals in the active tenant.
      description: >
        Returns the caller's **pending consent proposals** — groups a GroupOwner proposed to add them to, awaiting
        their Accept/Decline (uc.spaces.consent-group-add, cr-0096/ADR 0027) — in the tenant resolved from the
        `Host`. Each carries the `scopeId`, the `sealedNameKey` (the group's derived name-key `K_name` sealed to the
        caller's identity) + the canonical `encryptedName` it opens (both decrypted on-device to the group-consistent
        name), and `addedBy` (the owner's per-tenant username). The caller's own view of their invitations; no
        `K_SC` is ever returned (a soft member holds no scope key — only the name-key, which leaks the name and
        nothing else). Empty array when there are none.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's pending group invitations in the active tenant.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GroupInvitation" }
              example:
                - scopeId: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c
                  addedBy: kevin
                  sealedNameKey: Z3JvdXAtbmFtZS1rZXktc2VhbGVkLXRvLWludml0ZWU=
                  encryptedName: c2VhbGVkLW5hbWU=
        "401":
          description: Generic authentication failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: authentication_failed }
        "404":
          description: No tenant resolves from the request Host.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { code: tenant_not_found }

  /api/scopes/{scopeId}/invitations/accept:
    post:
      tags: [scopes]
      operationId: acceptGroupInvitation
      summary: Accept a pending group-consent proposal — become a grant-less member (key delivered next).
      description: >
        The invitee accepts the consent proposal for this GROUP scope (uc.spaces.consent-group-add, cr-0094):
        clears the `pendingConsent` flag on **their own** soft membership, so it becomes an ordinary grant-less
        membership and the usual `grant-delivery` wraps `K_SC` to them (first-online-wins, *awaiting access* →
        Active). Acts only on the caller's own proposal (invitee-gated); a scope where the caller has no open
        proposal is `404 invitation_not_found`. Idempotent-safe: a re-accept of an already-accepted membership
        is a no-op `204`. Enforced by code, not this spec (ADR 0008).
      security:
        - bearerAuth: []
      parameters:
        - { name: scopeId, in: path, required: true, description: Opaque id of the GROUP scope proposed., schema: { type: string, format: uuid } }
      responses:
        "204": { description: "The proposal was accepted (now a grant-less member; key delivered next)." }
        "401": { description: Generic authentication failure., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } } } }
        "404": { description: The caller has no pending proposal in this scope., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: invitation_not_found } } } }

  /api/scopes/{scopeId}/invitations/decline:
    post:
      tags: [scopes]
      operationId: declineGroupInvitation
      summary: Decline a pending group-consent proposal — silent drop, nothing was wrapped.
      description: >
        The invitee declines the consent proposal for this GROUP scope (uc.spaces.consent-group-add, cr-0094):
        **deletes** their soft `pendingConsent` membership. Nothing was ever wrapped, so no key is retracted and
        **no rotation** occurs; no `declined` state is kept (a silent drop — the owner may propose again later).
        Acts only on the caller's own proposal (invitee-gated); **idempotent** — a scope where the caller has no
        open proposal is still `204` (no enumeration). Enforced by code, not this spec (ADR 0008).
      security:
        - bearerAuth: []
      parameters:
        - { name: scopeId, in: path, required: true, description: Opaque id of the GROUP scope proposed., schema: { type: string, format: uuid } }
      responses:
        "204": { description: "The proposal is gone (declined, or there was no open proposal of yours)." }
        "401": { description: Generic authentication failure., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" }, example: { code: authentication_failed } } } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The opaque access token issued by login / refresh. Any authenticated caller (enforced by code, not this spec).

  schemas:
    ScopeKind:
      type: string
      description: The kind of a scope — the tenant root, a collaborative group, or a member's private space.
      enum: [TENANT, GROUP, PERSONAL]
      example: PERSONAL

    CreatePersonalScopeRequest:
      type: object
      required: [wrappedGrant]
      properties:
        wrappedGrant:
          type: string
          description: >
            The freshly generated personal scope key sealed to the caller's **own** identity public key
            (`asymWrap(ownIdentityPub, scopeKey, "scope-grant")`) — opaque base64 ciphertext the server stores
            verbatim and never interprets.
          contentEncoding: base64
          maxLength: 8192
          example: AQ==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 8192) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    CreateGroupRequest:
      type: object
      required: [encryptedName, wrappedGrant]
      properties:
        encryptedName:
          type: string
          description: >
            The group's name sealed under its **derived name-key `K_name_0`** at birth (cr-0096/ADR 0027):
            `K_name_0 = HKDF(E_0, "veyq/v1/group-name-key")` from the birth epoch key, then `symEncrypt(K_name_0,
            name)` (same node-name seal) — opaque base64 the server stores verbatim and never interprets, so the
            server sees an **unnamed** group (ADR 0014). Born at name-epoch 0 (forward-secret-ready).
          contentEncoding: base64
          maxLength: 8192
          example: c2VhbGVkLW5hbWU=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 8192) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        wrappedGrant:
          type: string
          description: >
            The freshly generated group scope key `K_SC` sealed to the caller's **own** identity public key
            (`asymWrap(ownIdentityPub, scopeKey, "scope-grant")`) — opaque base64 ciphertext the server stores
            verbatim and never interprets.
          contentEncoding: base64
          maxLength: 8192
          example: AQ==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 8192) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    RenameGroupRequest:
      type: object
      required: [encryptedName, nameEpoch]
      properties:
        encryptedName:
          type: string
          description: >
            The new group name sealed under `K_name` derived from the scope's **current** content-key epoch
            (cr-0097/ADR 0027): `K_name = HKDF(E_currentEpoch, "veyq/v1/group-name-key")`, then `symEncrypt(K_name,
            newName)` (same node-name seal) — opaque base64 the server stores verbatim and never interprets. Sealing
            under the current epoch is what makes the rename forward-secret.
          contentEncoding: base64
          maxLength: 8192
          example: c2VhbGVkLW5hbWU=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 8192) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        nameEpoch:
          x-veyq-visibility: structure
          type: integer
          description: >
            The content-key epoch the client sealed `encryptedName` under — must equal the scope's **current** epoch
            (the server rejects a stale value with `409 stale_epoch`). The server writes it to the scope's
            `name_epoch` so members peel to it and derive `K_name` (cr-0097/ADR 0027).
          minimum: 0
          example: 0

    SetScopeIconRequest:
      type: object
      required: [sealedIcon, iconEpoch]
      properties:
        sealedIcon:
          type: string
          description: >
            The space icon — the client bakes the crop, re-encodes to a fixed square, **pads the plaintext to a
            constant length**, then seals it under `K_icon` derived from the scope's **current** content-key epoch
            (uc.spaces.set-space-icon): `K_icon = HKDF(E_currentEpoch, "veyq/v1/space-icon-key")`, then
            `symWrap(K_icon, paddedIcon, "space-icon")` (`0x02 || nonce(12) || aead`, base64). Opaque base64 the
            server stores verbatim and never interprets. Its length is a **constant** — the exact base64 length of
            the sealed padded plaintext (a 16 KiB pad → 21884 chars) — so every stored icon is byte-identical in
            length (a logo is indistinguishable from a photo) and the value is provably inside the `TEXT` column
            (65 535). Sealing under the current epoch makes a replace forward-secret.
          contentEncoding: base64
          maxLength: 21884
          example: c2VhbGVkLWljb24=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 21884) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        iconEpoch:
          x-veyq-visibility: structure
          type: integer
          description: >
            The content-key epoch the client sealed `sealedIcon` under — must equal the scope's **current** epoch
            (the server rejects a stale value with `409 stale_epoch`). The server writes it to the scope's
            `icon_epoch` so members peel to it and derive `K_icon` (uc.spaces.set-space-icon).
          minimum: 0
          example: 0

    AddGroupMemberRequest:
      type: object
      required: [username]
      properties:
        username:
          x-veyq-visibility: pii
          x-veyq-rationale: >-
            The lookup key a group-add resolves to an identity (ADR 0023) — a sealed handle could not be resolved
            server-side.
          type: string
          description: >
            The **per-tenant username** of the member to admit (ADR 0023) — resolved within the scope's own
            tenant to their identity; trimmed + lowercased server-side. Not an email, not a global handle.
          minLength: 2
          maxLength: 32
          example: partner
          x-field-extra-annotation: '@field:com.fasterxml.jackson.databind.annotation.JsonDeserialize(using = com.veyq.app.shared.validation.TrimmingStringDeserializer::class) @field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(min = 2, max = 32) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9_.-]+")'
        sealedNameKey:
          type: string
          description: >
            **Required only when the target has consent on** (uc.spaces.consent-group-add, cr-0096, ADR 0027): the
            group's **derived name-key `K_name`** sealed to the target's identity public key
            (`asymWrap(inviteePub, K_name, "group-name-key")`, opaque base64), where `K_name =
            HKDF(E_e, "veyq/v1/group-name-key")` for the name's current epoch. Handing the invitee the key — not a
            name copy — lets them open the **same canonical `encryptedName`** the members read, so a modified owner
            cannot privately show a divergent name. When present, the add is recorded as a **soft, grant-less
            `pendingConsent`** membership — grant-delivery skips it, so `K_SC` is gated **before** the wrap — until
            the invitee accepts. Omit for the default direct-add (target consent off). The owner learns whether it
            is required from the prior member-resolve (`requiresConsent`); a `requiresConsent` target added
            **without** this field is rejected `400 consent_required`.
          contentEncoding: base64
          maxLength: 8192
          example: Z3JvdXAtbmFtZS1rZXktc2VhbGVkLXRvLWludml0ZWU=
          x-field-extra-annotation: '@field:jakarta.validation.constraints.Size(max = 8192) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'

    SetMemberRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          x-veyq-visibility: structure
          type: string
          description: The role to set — `OWNER` (co-owner) or `MEMBER`.
          enum: [OWNER, MEMBER]
          example: OWNER

    ScopeEpochLink:
      type: object
      required: [epoch, wrappedPrev]
      properties:
        epoch:
          x-veyq-visibility: structure
          type: integer
          description: The epoch index `n` (≥ 1) this link belongs to.
          minimum: 1
          example: 1
        wrappedPrev:
          type: string
          description: >
            `symWrap(E_n, E_{n-1})` — the previous epoch key sealed under this epoch's key (opaque base64). Lets a
            holder of `E_n` derive `E_{n-1}`, chaining down to `E_0` (ADR 0024).
          contentEncoding: base64
          maxLength: 8192
          example: AQ==

    ScopeGrantEntry:
      type: object
      required: [userId, wrappedGrant]
      properties:
        userId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The member being (re-)granted.
          example: 9b1d4a6e-8b2c-1f2d-3e4a-5b6c7c3f0e2a
        wrappedGrant:
          type: string
          description: The new epoch key sealed to that member's identity public key (`asymWrap`, opaque base64).
          contentEncoding: base64
          maxLength: 8192
          example: AQ==

    RotateScopeRequest:
      type: object
      required: [wrappedPrev, grants]
      properties:
        wrappedPrev:
          type: string
          description: >
            `symWrap(E_new, E_prev)` — the just-superseded epoch key sealed under the freshly-minted one (the new
            chain-link, opaque base64).
          contentEncoding: base64
          maxLength: 8192
          example: AQ==
          x-field-extra-annotation: '@field:jakarta.validation.constraints.NotBlank @field:jakarta.validation.constraints.Size(max = 8192) @field:jakarta.validation.constraints.Pattern(regexp = "[A-Za-z0-9+/]*={0,2}")'
        grants:
          type: array
          description: The remaining members re-granted the new epoch (any not listed are re-granted later by grant-delivery).
          items: { $ref: "#/components/schemas/ScopeGrantEntry" }

    ScopeRotated:
      type: object
      required: [epoch]
      properties:
        epoch:
          x-veyq-visibility: structure
          type: integer
          description: The scope's new current epoch after the rotation.
          minimum: 1
          example: 1

    MyTenant:
      type: object
      required: [tenantId, name, domain, role, iconEpoch]
      properties:
        tenantId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: Opaque id of the tenant.
          example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c
        name:
          x-veyq-visibility: public
          type: string
          description: The tenant's display name (server-visible operational metadata).
          maxLength: 100
          example: Familie Raddatz
        domain:
          x-veyq-visibility: public
          type: string
          description: The web address the tenant is reached at (tenant identity, ADR 0002).
          maxLength: 253
          example: memories.raddatz.me
        role:
          x-veyq-visibility: structure
          type: string
          description: The caller's role in this tenant.
          enum: [OWNER, MEMBER]
          example: OWNER
        wrappedGrant:
          type: [string, "null"]
          description: >
            The caller's **own** grant for this tenant — the tenant scope key sealed to their identity public key
            (opaque base64), so the switcher can open the tenant's `sealedIcon` without a per-tenant scopes call
            (en.spaces.tenant-scope). The client `asymUnwrap`s it locally; the server never interprets it. `null`
            while the caller is grant-less — the transient awaiting-access window, during which the icon renders
            as the initial.
          contentEncoding: base64
          maxLength: 8192
          example: AQ==
        sealedIcon:
          type: [string, "null"]
          description: >
            The tenant's icon (uc.spaces.set-space-icon): padded to a constant length and sealed under `K_icon =
            HKDF(E_iconEpoch, "veyq/v1/space-icon-key")` — opaque base64 the client opens + unpads on-device to
            render the tenant's avatar in the switcher. `null` when the tenant has no icon (render the initial).
          contentEncoding: base64
          maxLength: 21884
          example: c2VhbGVkLWljb24=
        iconEpoch:
          x-veyq-visibility: structure
          type: integer
          description: >
            The content-key epoch `sealedIcon` was sealed under — the client peels the tenant's epoch-chain to it
            and derives `K_icon`. 0 when no icon is set.
          minimum: 0
          example: 0

    ScopeCreated:
      type: object
      required: [scopeId, kind]
      properties:
        scopeId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: Opaque id of the created scope.
          example: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d
        kind:
          $ref: "#/components/schemas/ScopeKind"

    ScopeMember:
      type: object
      required: [userId, username, role, identityPublicKey, hasGrant]
      properties:
        userId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: Opaque id of the member.
          example: 9b1d4a6e-8b2c-1f2d-3e4a-5b6c7c3f0e2a
        username:
          x-veyq-visibility: pii
          x-veyq-rationale: >-
            The per-tenant handle members are known by (ADR 0023) — the directory's stable, human-readable label,
            visible to every fellow tenant member.
          type: string
          description: >
            The member's per-tenant handle (plaintext, unique within the tenant, ADR 0023) — every tenant member
            sees it. The directory's stable, human-readable label.
          maxLength: 32
          example: partner
        sealedName:
          type: [string, "null"]
          description: >
            The member's real name (first + last) **sealed under `K_tenant`** (opaque base64), decrypted locally
            by any tenant member. `null` when not yet sealed (a grant-less "awaiting access" member has no
            `K_tenant` yet). The server never sees the plaintext name.
          contentEncoding: base64
          maxLength: 8192
          example: c2VhbGVkLW5hbWU=
        email:
          x-veyq-visibility: pii
          x-veyq-rationale: >-
            Owner-only: the tenant OWNER needs it to correlate a pending member to the invite they were sent (ADR
            0007/0023); it is omitted (null) for every other caller.
          type: [string, "null"]
          description: >
            The member's email — **owner-only**: present only when the caller is the tenant `OWNER` (to correlate
            a pending member to their invite), omitted (`null`) for ordinary members (ADR 0007/0023).
          maxLength: 254
          example: partner@example.com
        role:
          x-veyq-visibility: structure
          type: string
          description: The member's role in the scope (OWNER / MEMBER).
          enum: [OWNER, MEMBER]
          example: MEMBER
        identityPublicKey:
          type: string
          description: >
            The member's identity public key bundle (opaque base64) — a key-holder wraps `K_SC` to it to
            deliver a grant. Operational metadata the server already stores; exposing it to a fellow member
            never yields a scope key.
          contentEncoding: base64
          maxLength: 8192
          example: bWVtYmVyLXB1YmxpYy1rZXk=
        hasGrant:
          x-veyq-visibility: flag
          type: boolean
          description: True if the member already holds a grant (a key-holder); false = pending, awaiting delivery.
          example: false
        pendingConsent:
          x-veyq-visibility: flag
          type: boolean
          description: >
            True if this is a **soft consent proposal** the target has not yet accepted (uc.spaces.consent-group-add,
            cr-0094): a grant-less membership that grant-delivery **skips** (no `K_SC` wrap) until the invitee
            accepts. **Owner-visible only** — the directory omits `pendingConsent` rows for non-owners, so ordinary
            members see a proposed person only once they accept. `false`/absent for an ordinary member.
          example: false

    ResolvedGroupCandidate:
      type: object
      description: >
        The result of resolving a per-tenant username to a candidate for a GROUP add (uc.spaces.consent-group-add,
        cr-0096) — records nothing; it only tells the owner who the username is, their identity public key (so the
        owner's device can seal the derived group name-key to it), and whether their consent is required.
      required: [userId, username, identityPublicKey, requiresConsent]
      properties:
        userId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: Opaque id of the resolved tenant member.
          example: 5b6c7c3f-0e2a-9b1d-4a6e-8b2c1f2d3e4a
        username:
          x-veyq-visibility: pii
          x-veyq-rationale: >-
            The per-tenant handle members are known by (ADR 0023) — the directory's stable, human-readable label,
            visible to every fellow tenant member.
          type: string
          description: The member's per-tenant handle (echoed back, normalized).
          maxLength: 32
          example: partner
        identityPublicKey:
          type: string
          description: >
            The member's identity public key bundle (opaque base64) — the owner's device wraps the group's derived
            name-key `K_name` and later `K_SC` to it. Operational metadata the server already stores.
          contentEncoding: base64
          maxLength: 8192
          example: bWVtYmVyLXB1YmxpYy1rZXk=
        requiresConsent:
          x-veyq-visibility: flag
          type: boolean
          description: >
            True if the target turned on the account-global "ask before adding me to groups" preference — so the
            add must be a consent **proposal** (send `sealedNameKey`), not a direct-add. Low-sensitivity
            operational metadata (ADR 0014 §5): the owner learns *that* the person wants to be asked, never a key.
          example: true

    GroupInvitation:
      type: object
      description: >
        A pending consent proposal to join a GROUP, from the **invitee's** point of view (uc.spaces.consent-group-add,
        cr-0096, ADR 0027). The client `asymUnwrap`s `sealedNameKey` locally with its identity private key to recover
        the derived name-key `K_name`, then `symUnwrap`s `encryptedName` (the scope's **canonical** sealed name) under
        it to show the group's name — the same blob the members hold, so a modified owner cannot show a divergent name.
        `addedBy` is the owner's per-tenant username (already visible to the invitee).
      required: [scopeId, addedBy, sealedNameKey, encryptedName]
      properties:
        scopeId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: Opaque id of the GROUP scope the caller is proposed to join (used to accept / decline).
          example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c
        addedBy:
          x-veyq-visibility: pii
          x-veyq-rationale: >-
            The per-tenant handle members are known by (ADR 0023) — the directory's stable, human-readable label,
            visible to every fellow tenant member.
          type: string
          description: The per-tenant username of the GroupOwner who proposed the add ("who added you").
          maxLength: 32
          example: kevin
        sealedNameKey:
          type: string
          description: >
            The group's **derived name-key `K_name`** sealed to the caller's identity public key
            (`asymWrap(..., "group-name-key")`, opaque base64) — unwrapped only on-device. It opens the canonical
            `encryptedName` (not a private name copy), so the invitee sees exactly what the members see.
          contentEncoding: base64
          maxLength: 8192
          example: Z3JvdXAtbmFtZS1rZXktc2VhbGVkLXRvLWludml0ZWU=
        encryptedName:
          type: string
          description: >
            The scope's **canonical** sealed group name (`symEncrypt(K_name, name)`, opaque base64) — the same
            ciphertext the members read, surfaced to the pending invitee so they open it with the `sealedNameKey`.
            The blind server only relays already-stored ciphertext; it holds no key and never sees the name.
          contentEncoding: base64
          maxLength: 8192
          example: c2VhbGVkLW5hbWU=

    ScopeSummary:
      type: object
      required: [id, kind, tenantId, role, currentEpoch, grantedEpoch, nameEpoch, iconEpoch, wrappedGrant]
      properties:
        id:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: Opaque id of the scope.
          example: 4a6e8b2c-1f2d-3e4a-5b6c-7c3f0e2a9b1d
        kind:
          $ref: "#/components/schemas/ScopeKind"
        role:
          x-veyq-visibility: structure
          type: string
          description: >
            The **caller's own** role in this scope (`OWNER` / `MEMBER`) — so the client can list the scopes it
            manages (e.g. groups it owns) without a per-scope directory call. Operational metadata the server
            already stores on the caller's membership (ADR 0007); exposing one's own role reveals no key.
          enum: [OWNER, MEMBER]
          example: OWNER
        tenantId:
          x-veyq-visibility: id
          type: string
          format: uuid
          description: The tenant this scope lives in (host-routing context).
          example: 7c3f0e2a-9b1d-4a6e-8b2c-1f2d3e4a5b6c
        encryptedName:
          type: [string, "null"]
          description: >
            For a `GROUP` scope: the group's name sealed under its **derived name-key `K_name`** (opaque base64,
            cr-0096/ADR 0027), decrypted locally so the client can label the group in the switcher. The client
            derives `K_name = HKDF(E_e, "veyq/v1/group-name-key")` from the key of the name's epoch (`nameEpoch`,
            peeled from the chain). `null` for `TENANT` / `PERSONAL` scopes, which carry no per-scope sealed name.
          contentEncoding: base64
          maxLength: 8192
          example: c2VhbGVkLW5hbWU=
        nameEpoch:
          x-veyq-visibility: structure
          type: integer
          description: >
            For a `GROUP` scope: the content-key epoch the `encryptedName` was sealed under (cr-0096/ADR 0027) — 0
            at birth, bumped only by a rename (a plain rotation leaves the name on its epoch). The client peels the
            epoch-chain to that epoch's key and derives `K_name` from it. 0 for `TENANT` / `PERSONAL` scopes.
          minimum: 0
          example: 0
        sealedIcon:
          type: [string, "null"]
          description: >
            The scope's icon (uc.spaces.set-space-icon): the padded, constant-length image sealed under `K_icon =
            HKDF(E_e, "veyq/v1/space-icon-key")` for the icon's epoch (`iconEpoch`, peeled from the chain) — opaque
            base64 the client opens + unpads on-device. `null` when the scope has no icon (the client renders the
            initial). `PERSONAL` scopes never carry one.
          contentEncoding: base64
          maxLength: 21884
          example: c2VhbGVkLWljb24=
        iconEpoch:
          x-veyq-visibility: structure
          type: integer
          description: >
            The content-key epoch `sealedIcon` was sealed under (uc.spaces.set-space-icon) — 0 until an icon is set,
            bumped only by an icon-set (a plain rotation leaves it). The client peels the epoch-chain to that
            epoch's key and derives `K_icon`. 0 when no icon is set.
          minimum: 0
          example: 0
        currentEpoch:
          x-veyq-visibility: structure
          type: integer
          description: >
            The scope's **current content-key epoch** (ADR 0024) — 0 until the first rotation. New content seals
            under this epoch; the client peels the epoch-chain (`GET …/epochs`) to read older ones.
          minimum: 0
          example: 0
        grantedEpoch:
          x-veyq-visibility: structure
          type: integer
          description: >
            The epoch the caller's own `wrappedGrant` wraps. `grantedEpoch < currentEpoch` means the grant is
            **stale** (a rotation hasn't re-granted this member yet) — grant-delivery re-grants them (ADR 0024).
          minimum: 0
          example: 0
        wrappedGrant:
          type: string
          description: >
            The caller's **own** grant — the scope key sealed to their identity public key (opaque base64).
            The client `asymUnwrap`s it locally to open the scope; the server never interprets it.
          contentEncoding: base64
          maxLength: 8192
          example: AQ==
        deletedAt:
          x-veyq-visibility: time
          type: [string, "null"]
          format: date-time
          description: >
            For a `GROUP` scope in **pending-deletion** (uc.spaces.delete-group, cr-0090): when the owner
            soft-deleted it. `null` = active. While set, the group stays listed + readable but is **read-only** and
            clearly marked as deleting; any owner may restore it until `purgeAfter`. Operational metadata (a
            lifecycle timestamp), no key.
          example: null
        purgeAfter:
          x-veyq-visibility: time
          type: [string, "null"]
          format: date-time
          description: >
            When the scheduled job will **hard-erase** a pending-deletion group (`deletedAt + retention`, derived).
            `null` when active. After this instant the group is gone (restore → 404).
          example: null

    ErrorResponse:
      $ref: '_common.openapi.yaml#/components/schemas/ErrorResponse'
