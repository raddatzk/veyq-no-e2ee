services:
  traefik:
    image: traefik:v3.3
    container_name: veyq-traefik
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL:?Set LETSENCRYPT_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt

  veyq-db:
    image: mariadb:10.11
    container_name: veyq-db
    environment:
      MARIADB_DATABASE: ${DB_NAME:-veyq}
      MARIADB_USER: ${DB_USER:-veyq}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
    volumes:
      - veyq-db:/var/lib/mysql

  veyq:
    image: ${VEYQ_IMAGE:?Set VEYQ_IMAGE}
    container_name: veyq
    environment:
      DB_URL: jdbc:mariadb://veyq-db:3306/${DB_NAME:-veyq}
      DB_USER: ${DB_USER:-veyq}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_ACCESS_TOKEN_NAME: ${COOKIE_ACCESS_TOKEN_NAME:-VEYQ_ACCESS_TOKEN}
      COOKIE_REFRESH_TOKEN_NAME: ${COOKIE_REFRESH_TOKEN_NAME:-VEYQ_REFRESH_TOKEN}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
      REFRESH_TOKEN_TTL_MINUTES: ${REFRESH_TOKEN_TTL_MINUTES:-43200}
      ACCESS_TOKEN_AUDIT_TTL_DAYS: ${ACCESS_TOKEN_AUDIT_TTL_DAYS:-30}
      REFRESH_TOKEN_AUDIT_TTL_DAYS: ${REFRESH_TOKEN_AUDIT_TTL_DAYS:-90}
      TOKEN_CLEANUP_CRON: "${TOKEN_CLEANUP_CRON:-0 0 0 * * ?}"
      INVITATION_TTL_DAYS: ${INVITATION_TTL_DAYS:-7}
      EMAIL_CHANGE_TTL_HOURS: ${EMAIL_CHANGE_TTL_HOURS:-24}
      RESET_PASSWORD_TTL_HOURS: ${RESET_PASSWORD_TTL_HOURS:-2}
      USER_CLEANUP_CRON: "${USER_CLEANUP_CRON:-0 0 0 * * ?}"
      USER_CLEANUP_RETENTION_DAYS: ${USER_CLEANUP_RETENTION_DAYS:-30}
      BCRYPT_TARGET_MS: ${BCRYPT_TARGET_MS:-500}
      BCRYPT_MIN_COST: ${BCRYPT_MIN_COST:-10}
      BCRYPT_MAX_COST: ${BCRYPT_MAX_COST:-18}
      BCRYPT_BENCHMARK_SAMPLES: ${BCRYPT_BENCHMARK_SAMPLES:-2}
      WEBAUTHN_ORIGINS: ${WEBAUTHN_ORIGINS:?Set WEBAUTHN_ORIGINS}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:?Set WEBAUTHN_RP_ID}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-veyq}
      MEDIA_STORAGE_DIR: ${MEDIA_STORAGE_DIR:-/data/veyq-media}
      MEDIA_CHUNK_SIZE: ${MEDIA_CHUNK_SIZE:-16M}
      MEDIA_UPLOAD_SESSION_TTL_HOURS: ${MEDIA_UPLOAD_SESSION_TTL_HOURS:-24}
      MEDIA_UPLOAD_SESSION_CLEANUP_CRON: "${MEDIA_UPLOAD_SESSION_CLEANUP_CRON:-0 0 * * * ?}"
      MEDIA_MAX_UPLOAD_SIZE: ${MEDIA_MAX_UPLOAD_SIZE:-32M}
      FFMPEG_PATH: ${FFMPEG_PATH:-ffmpeg}
      MEDIA_PREVIEW_TIMEOUT_SECONDS: ${MEDIA_PREVIEW_TIMEOUT_SECONDS:-15}
      VEYQ_SOURCE_URL: ${VEYQ_SOURCE_URL:-https://github.com/raddatzk/veyq}
      VEYQ_SUPPORT_URL: ${VEYQ_SUPPORT_URL:-}
      VEYQ_VERSION: ${VEYQ_VERSION:-}
      VEYQ_REVISION: ${VEYQ_REVISION:-}
      MAIL_FROM: ${MAIL_FROM:?Set MAIL_FROM}
      MAIL_HOST: ${MAIL_HOST:?Set MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:?Set MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME:?Set MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?Set MAIL_PASSWORD}
      MAIL_LOGIN: ${MAIL_LOGIN:-REQUIRED}
      MAIL_TLS: ${MAIL_TLS:-true}
    expose:
      - "8080"
    volumes:
      - veyq-media:${MEDIA_STORAGE_DIR:-/data/veyq-media}
    depends_on:
      - veyq-db
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/q/health/ready >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
    labels:
      - traefik.enable=true
      - traefik.http.routers.veyq.rule=${VEYQ_TRAEFIK_RULE:?Set VEYQ_TRAEFIK_RULE}
      - traefik.http.routers.veyq.entrypoints=websecure
      - traefik.http.routers.veyq.tls.certresolver=letsencrypt
      - traefik.http.services.veyq.loadbalancer.server.port=8080

  veyq-reset:
    profiles: ["reset"]
    build:
      context: ./reset
    container_name: veyq-reset
    environment:
      RESET_USERNAME: ${RESET_USERNAME:?Set RESET_USERNAME}
      RESET_PASSWORD: ${RESET_PASSWORD:?Set RESET_PASSWORD}
      RESET_RESTART_CONTAINER: ${RESET_RESTART_CONTAINER:-veyq}
      DB_HOST: veyq-db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-veyq}
      DB_USER: ${DB_USER:-veyq}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MEDIA_STORAGE_DIR: ${MEDIA_STORAGE_DIR:-/data/veyq-media}
    expose:
      - "8081"
    volumes:
      - veyq-media:${MEDIA_STORAGE_DIR:-/data/veyq-media}
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - veyq-db
    labels:
      - traefik.enable=true
      - traefik.http.routers.veyq-reset.rule=${RESET_TRAEFIK_RULE:?Set RESET_TRAEFIK_RULE}
      - traefik.http.routers.veyq-reset.entrypoints=websecure
      - traefik.http.routers.veyq-reset.tls.certresolver=letsencrypt
      - traefik.http.services.veyq-reset.loadbalancer.server.port=8081

volumes:
  veyq-db:
  veyq-media:
  traefik-letsencrypt:
