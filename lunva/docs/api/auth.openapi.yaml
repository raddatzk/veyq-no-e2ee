---
openapi: 3.1.0
info:
  title: Lunva Auth API
  version: 0.1.0
  description: >-
    API-first Zielvertrag fuer Lunva Auth API. Operationen enthalten Beispiele, Vorbedingungen und den aktuellen Implementierungsstatus.
servers:
- url: "/"
tags:
- name: Auth
paths:
  "/api/auth/login":
    post:
      tags:
      - Auth
      operationId: login
      requestBody:
        "$ref": "#/components/requestBodies/Login"
      responses:
        '200':
          "$ref": "./common.openapi.yaml#/components/responses/LoginSession"
        '400':
          "$ref": "./common.openapi.yaml#/components/responses/400"
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
      summary: Anmelden und Auth-Cookies setzen
      x-implementation-status: partial
      x-preconditions:
      - Der Endpunkt ist ohne Access-Token erreichbar.
      - Das initiale Setup muss abgeschlossen sein.
      description: |-
        Anmelden und Auth-Cookies setzen.

        Vorbedingungen:
        - Der Endpunkt ist ohne Access-Token erreichbar.
        - Das initiale Setup muss abgeschlossen sein.

        Implementierungsstatus: partial.
  "/api/auth/logout":
    post:
      tags:
      - Auth
      operationId: logout
      security:
      - accessTokenCookie: []
      responses:
        '204':
          description: Current auth cookies were cleared.
        '400':
          "$ref": "./common.openapi.yaml#/components/responses/400"
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
      summary: Aktuelle Sitzung abmelden
      x-implementation-status: partial
      x-preconditions:
      - Ein gueltiger LUNVA_ACCESS_TOKEN Cookie muss vorhanden sein.
      - Das initiale Setup muss abgeschlossen sein.
      description: |-
        Aktuelle Sitzung abmelden.

        Vorbedingungen:
        - Ein gueltiger LUNVA_ACCESS_TOKEN Cookie muss vorhanden sein.
        - Das initiale Setup muss abgeschlossen sein.

        Implementierungsstatus: partial.
  "/api/auth/refresh":
    post:
      tags:
      - Auth
      operationId: refresh
      security:
      - refreshTokenCookie: []
      responses:
        '200':
          "$ref": "./common.openapi.yaml#/components/responses/LoginSession"
        '400':
          "$ref": "./common.openapi.yaml#/components/responses/400"
        '401':
          "$ref": "./common.openapi.yaml#/components/responses/401"
      summary: Refresh-Token rotieren und neue Cookies setzen
      x-implementation-status: partial
      x-preconditions:
      - Ein gueltiger LUNVA_ACCESS_TOKEN Cookie muss vorhanden sein.
      - Das initiale Setup muss abgeschlossen sein.
      description: |-
        Refresh-Token rotieren und neue Cookies setzen.

        Vorbedingungen:
        - Ein gueltiger LUNVA_ACCESS_TOKEN Cookie muss vorhanden sein.
        - Das initiale Setup muss abgeschlossen sein.

        Implementierungsstatus: partial.
components:
  securitySchemes:
    accessTokenCookie:
      type: apiKey
      in: cookie
      name: LUNVA_ACCESS_TOKEN
    refreshTokenCookie:
      type: apiKey
      in: cookie
      name: LUNVA_REFRESH_TOKEN

  requestBodies:
    Login:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/LoginRequest"
          example:
            email: kevin@example.test
            password: correct horse battery staple

  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          "$ref": "./common.openapi.yaml#/components/schemas/EmailAddress"
        password:
          type: string
      example:
        email: kevin@example.test
        password: correct horse battery staple
